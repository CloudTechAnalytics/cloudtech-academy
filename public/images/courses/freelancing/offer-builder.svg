<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Turning a skill into a clear offer by answering four questions: what exactly they get, for whom, how fast, and what is included. The answers combine into one sentence, here: I clean messy spreadsheets for small shops, delivered in two days with one round of changes.">
<title>Four answers make one clear offer.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Four questions → one sentence</text>
<rect x="16.0" y="42.0" width="360.0" height="76.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<circle cx="40.0" cy="68.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="40.0" y="72.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="62.0" y="73.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">What do they get?</text>
<text xml:space="preserve" x="30.0" y="100.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">A cleaned spreadsheet, ready to use</text>
<rect x="384.0" y="42.0" width="360.0" height="76.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<circle cx="408.0" cy="68.0" r="12" fill="#B38A3E"/>
<text xml:space="preserve" x="408.0" y="72.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="430.0" y="73.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">For whom?</text>
<text xml:space="preserve" x="398.0" y="100.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Small shops</text>
<rect x="16.0" y="126.0" width="360.0" height="76.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<circle cx="40.0" cy="152.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="40.0" y="156.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="62.0" y="157.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">How fast?</text>
<text xml:space="preserve" x="30.0" y="184.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Delivered in 2 days</text>
<rect x="384.0" y="126.0" width="360.0" height="76.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<circle cx="408.0" cy="152.0" r="12" fill="#5C4F80"/>
<text xml:space="preserve" x="408.0" y="156.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="430.0" y="157.0" font-size="13.5" fill="#5C4F80" font-weight="700" text-anchor="start">What's included?</text>
<text xml:space="preserve" x="398.0" y="184.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">One round of changes</text>
<path d="M380,214 L380,236" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="16.0" y="244.0" width="728.0" height="72.0" rx="10" fill="#FFFFFF" stroke="#B38A3E" stroke-width="2"/>
<text xml:space="preserve" x="30.0" y="268.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">Your offer</text>
<text xml:space="preserve" x="30.0" y="290.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">"I clean messy spreadsheets for small shops, delivered in 2 days with one round of changes."</text>
<text xml:space="preserve" x="16.0" y="344.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Easier to sell than "I do design, writing, video and websites".</text>
<text xml:space="preserve" x="16.0" y="366.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Start with one skill you can already do well, or can learn in a few weeks.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" role="img" aria-label="Getting paid safely. Direct clients: ask for 50 percent upfront and 50 percent on delivery, or full payment upfront for small jobs. On platforms, keep all payments on the platform. Foreign payments can be withdrawn through the platform or a service like Payoneer to a Nigerian bank. Warning signs of scam clients: paying to unlock a job, asking for bank login or OTP, and overpayment cheques where you send money back.">
<title>Take part payment upfront, keep platform payments on the platform, and spot scam clients.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="404" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A direct job, step by step</text>
<rect x="16.0" y="42.0" width="166.0" height="70.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="68.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start">Agree scope and price</text>
<text xml:space="preserve" x="28.0" y="92.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">In writing</text>
<path d="M184.0,77.0 L200.0,77.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="202.0" y="42.0" width="166.0" height="70.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="214.0" y="68.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">50% upfront</text>
<text xml:space="preserve" x="214.0" y="92.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Before you start</text>
<path d="M370.0,77.0 L386.0,77.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="388.0" y="42.0" width="166.0" height="70.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="400.0" y="68.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">Deliver the work</text>
<text xml:space="preserve" x="400.0" y="92.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">As agreed</text>
<path d="M556.0,77.0 L572.0,77.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="574.0" y="42.0" width="166.0" height="70.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="586.0" y="68.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">50% on delivery</text>
<text xml:space="preserve" x="586.0" y="92.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Then hand over files</text>
<text xml:space="preserve" x="16.0" y="142.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Also</text>
<rect x="16.0" y="154.0" width="360.0" height="72.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="178.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">On platforms</text>
<text xml:space="preserve" x="30.0" y="198.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Keep every payment on the platform. It protects both</text>
<text xml:space="preserve" x="30.0" y="213.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">of you.</text>
<rect x="384.0" y="154.0" width="360.0" height="72.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="398.0" y="178.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Foreign money</text>
<text xml:space="preserve" x="398.0" y="198.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Withdraw through the platform or Payoneer; compare</text>
<text xml:space="preserve" x="398.0" y="213.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">fees and rates.</text>
<rect x="16.0" y="244.0" width="728.0" height="120.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="270.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">Scam clients: walk away if…</text>
<text xml:space="preserve" x="30.0" y="296.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">!  You're asked to pay to "unlock" a job</text>
<text xml:space="preserve" x="30.0" y="318.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">!  They want your bank login or an OTP</text>
<text xml:space="preserve" x="30.0" y="340.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">!  They send a cheque or "overpayment" and ask you to send money back</text>
<text xml:space="preserve" x="16.0" y="390.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Keep a record in a sheet: client, job, amount, date paid.</text>
</g></svg>
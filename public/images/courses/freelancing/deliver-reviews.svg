<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Delivering professionally and earning reviews. Communicate: reply within a day, ask questions early, give updates, warn early if late. Deliver: check against scope, use the right format, name files clearly, add a short delivery note. After: ask for a review or testimonial, offer a small discount on the next job, and check in a month later.">
<title>Communicate, deliver cleanly, then ask for the review.</title>

<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="20.0" width="232.0" height="226.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="46.0" font-size="15" fill="#2F5D8A" font-weight="700" text-anchor="start">While you work</text>
<text xml:space="preserve" x="30.0" y="76.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Reply within a day</text>
<text xml:space="preserve" x="30.0" y="116.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Ask questions early</text>
<text xml:space="preserve" x="30.0" y="156.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Update before they ask</text>
<text xml:space="preserve" x="30.0" y="196.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Warn early if late, with a</text>
<text xml:space="preserve" x="30.0" y="212.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">new date</text>
<rect x="264.0" y="20.0" width="232.0" height="226.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="278.0" y="46.0" font-size="15" fill="#2F6B3F" font-weight="700" text-anchor="start">When you deliver</text>
<text xml:space="preserve" x="278.0" y="76.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Check against the agreed</text>
<text xml:space="preserve" x="278.0" y="92.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">scope</text>
<text xml:space="preserve" x="278.0" y="116.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Right format (PNG, PDF,</text>
<text xml:space="preserve" x="278.0" y="132.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">.xlsx)</text>
<text xml:space="preserve" x="278.0" y="156.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Clear file names</text>
<text xml:space="preserve" x="278.0" y="196.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Short delivery note</text>
<rect x="512.0" y="20.0" width="232.0" height="226.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.6"/>
<text xml:space="preserve" x="526.0" y="46.0" font-size="15" fill="#5C4F80" font-weight="700" text-anchor="start">After the job</text>
<text xml:space="preserve" x="526.0" y="76.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Ask for a review or</text>
<text xml:space="preserve" x="526.0" y="92.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">testimonial</text>
<text xml:space="preserve" x="526.0" y="116.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Add the work to your</text>
<text xml:space="preserve" x="526.0" y="132.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">portfolio</text>
<text xml:space="preserve" x="526.0" y="156.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Offer a small discount next</text>
<text xml:space="preserve" x="526.0" y="172.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">time</text>
<text xml:space="preserve" x="526.0" y="196.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Check in a month later</text>
<rect x="16.0" y="266.0" width="728.0" height="56.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="290.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">A review request that works:</text>
<text xml:space="preserve" x="30.0" y="309.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">"I'm glad you like it! If you have a moment, a review would really help my business."</text>
<text xml:space="preserve" x="16.0" y="354.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Balance it with school: fixed hours, protect exam periods, and don't take on more than you can deliver well.</text>
</g></svg>
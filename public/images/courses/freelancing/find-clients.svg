<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" role="img" aria-label="Two ways to find clients. Platforms such as Fiverr and Upwork reach clients worldwide but take a fee of often 10 to 20 percent and have high competition, with the first review being the hardest. Direct clients come from your network, local businesses and social media, and are often easier at first.">
<title>Platforms reach far; direct clients are often easier to start with.</title>

<rect width="760" height="376" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="20.0" width="358.0" height="250.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="46.0" font-size="15" fill="#2F5D8A" font-weight="700" text-anchor="start">Freelance platforms</text>
<text xml:space="preserve" x="30.0" y="76.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Fiverr</text>
<text xml:space="preserve" x="170.0" y="76.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">you list fixed-price gigs</text>
<text xml:space="preserve" x="30.0" y="102.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Upwork</text>
<text xml:space="preserve" x="170.0" y="102.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">you send proposals to posted jobs</text>
<text xml:space="preserve" x="30.0" y="128.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Contra, Freelancer</text>
<text xml:space="preserve" x="170.0" y="128.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">similar, some with lower fees</text>
<text xml:space="preserve" x="30.0" y="176.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">+  Clients worldwide</text>
<text xml:space="preserve" x="30.0" y="198.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">−  Fee of about 10–20%</text>
<text xml:space="preserve" x="30.0" y="220.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">−  High competition; first review is hardest</text>
<rect x="386.0" y="20.0" width="358.0" height="250.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="400.0" y="46.0" font-size="15" fill="#2F6B3F" font-weight="700" text-anchor="start">Direct clients</text>
<text xml:space="preserve" x="400.0" y="76.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Your network</text>
<text xml:space="preserve" x="540.0" y="76.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">friends, family, groups</text>
<text xml:space="preserve" x="400.0" y="102.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Local businesses</text>
<text xml:space="preserve" x="540.0" y="102.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">shops, restaurants, salons</text>
<text xml:space="preserve" x="400.0" y="128.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Social media</text>
<text xml:space="preserve" x="540.0" y="128.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">samples + a clear call to action</text>
<text xml:space="preserve" x="400.0" y="176.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">+  No platform fee</text>
<text xml:space="preserve" x="400.0" y="198.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">+  Often easier at first</text>
<text xml:space="preserve" x="400.0" y="220.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">−  You handle payment safely yourself</text>
<text xml:space="preserve" x="16.0" y="300.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A profile that wins work</text>
<rect x="16.0" y="312.0" width="136.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="24.0" y="329.0" font-size="11" fill="#2A2926" font-weight="400" text-anchor="start">Clear friendly photo</text>
<rect x="164.0" y="312.0" width="136.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="172.0" y="329.0" font-size="11" fill="#2A2926" font-weight="400" text-anchor="start">Title = your offer</text>
<rect x="312.0" y="312.0" width="136.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="320.0" y="329.0" font-size="11" fill="#2A2926" font-weight="400" text-anchor="start">Who you help, what,</text>
<text xml:space="preserve" x="320.0" y="342.0" font-size="11" fill="#2A2926" font-weight="400" text-anchor="start">how fast</text>
<rect x="460.0" y="312.0" width="136.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="468.0" y="329.0" font-size="11" fill="#2A2926" font-weight="400" text-anchor="start">Your three best</text>
<text xml:space="preserve" x="468.0" y="342.0" font-size="11" fill="#2A2926" font-weight="400" text-anchor="start">samples</text>
<rect x="608.0" y="312.0" width="136.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="616.0" y="329.0" font-size="11" fill="#2A2926" font-weight="400" text-anchor="start">Start competitive;</text>
<text xml:space="preserve" x="616.0" y="342.0" font-size="11" fill="#2A2926" font-weight="400" text-anchor="start">raise later</text>
</g></svg>
<text xml:space="preserve" x="679.0" y="268.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="middle">Retrospective</text>
<text xml:space="preserve" x="679.0" y="288.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">improve how we work</text>
<rect x="600.0" y="108.0" width="160.0" height="26.0" rx="6" fill="#E5F0E8"/>
<text xml:space="preserve" x="610.0" y="125.5" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">BA: records feedback</text>
<path d="M679,316 C679,400 91,420 91,304" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)" stroke-dasharray="6 4"/>
<text xml:space="preserve" x="385.0" y="414.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="middle">feedback and new ideas go back into the backlog</text>
<text xml:space="preserve" x="16.0" y="456.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">Green labels: where a business analyst usually spends time in each sprint.</text>
</g></svg>
<text xml:space="preserve" x="390.0" y="346.5" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">BA: answers questions, checks work</text>
<path d="M564.0,225.0 L610.0,225.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>

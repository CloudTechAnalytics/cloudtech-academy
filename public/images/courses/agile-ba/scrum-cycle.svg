<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="The Scrum cycle. The product backlog feeds sprint planning, which produces a sprint backlog. During the two-week sprint the team holds a daily scrum. The sprint ends with a review, where stakeholders see the increment, and a retrospective, where the team improves how it works. Refinement keeps the top of the backlog ready. The business analyst's main touchpoints are marked.">
<title>The Scrum cycle, with the business analyst's main touchpoints.</title>

<text xml:space="preserve" x="91.0" y="176.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">Product</text>
<text xml:space="preserve" x="91.0" y="194.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">backlog</text>

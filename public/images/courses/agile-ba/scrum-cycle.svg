<text xml:space="preserve" x="40.0" y="129.5" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">BA: refinement</text>
<path d="M168.0,225.0 L206.0,225.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="210.0" y="180.0" width="120.0" height="90.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="270.0" y="214.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">Sprint</text>
<text xml:space="preserve" x="270.0" y="232.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">planning</text>
<rect x="206.0" y="282.0" width="160.0" height="26.0" rx="6" fill="#E5F0E8"/>
<text xml:space="preserve" x="216.0" y="299.5" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">BA: explains stories</text>
<path d="M332.0,225.0 L368.0,225.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<circle cx="470" cy="225" r="92" fill="#FFFFFF" stroke="#B38A3E" stroke-width="2.4"/>
<text xml:space="preserve" x="470.0" y="215.0" font-size="16" fill="#2A2926" font-weight="700" text-anchor="middle">Sprint</text>
<text xml:space="preserve" x="470.0" y="235.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="middle">2 weeks</text>
<path d="M500,129 C540,93 400,93 440,129" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="470.0" y="91.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="middle">Daily scrum, 15 minutes</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Part of the kiosk app's story map. The backbone runs left to right: sign up, find products, build an order, pay, track delivery, reorder. Under each step are its stories, most essential at the top. Two horizontal lines cut release slices: the walking skeleton, which gives a complete basic journey, and the pilot release.">
<title>The kiosk app's story map, with the walking skeleton and pilot slices.</title>


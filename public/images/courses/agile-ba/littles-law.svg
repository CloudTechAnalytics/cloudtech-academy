<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Little's law. Two teams finish one item a day. Team A keeps 3 items in progress, so each item takes about 3 days from start to finish. Team B starts more, keeping 6 in progress, and each item takes about 6 days. Same output; starting more work makes everything slower.">
<title>Little's law: the same throughput with more work in progress means longer cycle times.</title>

<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="16" fill="#2A2926" font-weight="700" text-anchor="start">Average cycle time = work in progress ÷ throughput</text>
<rect x="16.0" y="46.0" width="728.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="76.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">Team A</text>
<text xml:space="preserve" x="32.0" y="98.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">finishes 1 item a day · 3 in progress</text>
<rect x="32.0" y="116.0" width="46.0" height="40.0" rx="6" fill="#DCC594"/>
<text xml:space="preserve" x="55.0" y="142.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">#1</text>
<rect x="86.0" y="116.0" width="46.0" height="40.0" rx="6" fill="#DCC594"/>
<text xml:space="preserve" x="109.0" y="142.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">#2</text>
<rect x="140.0" y="116.0" width="46.0" height="40.0" rx="6" fill="#DCC594"/>
<text xml:space="preserve" x="163.0" y="142.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">#3</text>
<text xml:space="preserve" x="728.0" y="138.0" font-size="22" fill="#2A2926" font-weight="700" text-anchor="end">3 ÷ 1 = 3 days</text>
<text xml:space="preserve" x="728.0" y="164.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="end">each item: about 3 days</text>
<rect x="16.0" y="200.0" width="728.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="230.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">Team B</text>
<text xml:space="preserve" x="32.0" y="252.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">finishes 1 item a day · 6 in progress</text>
<rect x="32.0" y="270.0" width="46.0" height="40.0" rx="6" fill="#E8B9B0"/>
<text xml:space="preserve" x="55.0" y="296.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">#1</text>
<rect x="86.0" y="270.0" width="46.0" height="40.0" rx="6" fill="#E8B9B0"/>
<text xml:space="preserve" x="109.0" y="296.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">#2</text>
<rect x="140.0" y="270.0" width="46.0" height="40.0" rx="6" fill="#E8B9B0"/>
<text xml:space="preserve" x="163.0" y="296.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">#3</text>
<rect x="194.0" y="270.0" width="46.0" height="40.0" rx="6" fill="#E8B9B0"/>
<text xml:space="preserve" x="217.0" y="296.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">#4</text>
<rect x="248.0" y="270.0" width="46.0" height="40.0" rx="6" fill="#E8B9B0"/>
<text xml:space="preserve" x="271.0" y="296.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">#5</text>
<rect x="302.0" y="270.0" width="46.0" height="40.0" rx="6" fill="#E8B9B0"/>
<text xml:space="preserve" x="325.0" y="296.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">#6</text>
<text xml:space="preserve" x="728.0" y="292.0" font-size="22" fill="#2A2926" font-weight="700" text-anchor="end">6 ÷ 1 = 6 days</text>
<text xml:space="preserve" x="728.0" y="318.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="end">each item: about 6 days</text>
<text xml:space="preserve" x="16.0" y="372.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">Starting more doesn't finish more; it makes everything take longer. That's why teams set a WIP limit,</text>
<text xml:space="preserve" x="16.0" y="390.9" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">such as "no more than three stories in progress".</text>
</g></svg>
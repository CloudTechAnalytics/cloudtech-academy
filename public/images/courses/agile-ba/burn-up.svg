<path d="M131.2,146.7 L202.5,138.3 L273.8,116.7 L345.0,108.3 L416.2,98.3 L487.5,81.7 L630.0,81.7" fill="none" stroke="#9B2C1F" stroke-width="2.4"/>
<text xml:space="preserve" x="634.0" y="85.7" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">scope: 167</text>
<path d="M60.0,360.0 L131.2,333.3 L202.5,305.0 L273.8,271.7 L345.0,236.7 L416.2,206.7 L487.5,166.7" fill="none" stroke="#2F6B3F" stroke-width="2.8"/>

<text xml:space="preserve" x="497.5" y="184.7" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">done: 116</text>
<text xml:space="preserve" x="636.0" y="106.7" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">forecast:</text>
<text xml:space="preserve" x="636.0" y="122.7" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">148 to 164</text>
<line x1="487.5" y1="60.0" x2="487.5" y2="360.0" stroke="#CFC4B2" stroke-width="1" stroke-dasharray="2 4"/>
<text xml:space="preserve" x="491.5" y="64.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">today</text>
<text xml:space="preserve" x="16.0" y="404.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">The forecast range uses the team's slowest and fastest sprints. Both end below the scope line: the</text>
<text xml:space="preserve" x="16.0" y="422.9" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">original plan would be met, but not the grown scope.</text>
</g></svg>
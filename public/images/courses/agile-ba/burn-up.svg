<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="A burn-up chart for the kiosk app MVP over eight sprints. Work done rises to 116 points by sprint 6. Total scope rises from 128 to 167 points as stories are added. A forecast range from sprint 6 to sprint 8, using the team's slowest and fastest sprints, ends between 148 and 164 points: below the scope line either way. The original 128-point plan would have been met in sprint 7.">
<title>Burn-up: work done against total scope, with a forecast range to the pilot.</title>


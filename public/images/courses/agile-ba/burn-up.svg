<text xml:space="preserve" x="52.0" y="230.7" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">80</text>
<line x1="60.0" y1="160.0" x2="630.0" y2="160.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="164.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">120</text>
<line x1="60.0" y1="93.3" x2="630.0" y2="93.3" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="97.3" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">160</text>
<text xml:space="preserve" x="60.0" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">start</text>
<text xml:space="preserve" x="131.2" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">S1</text>
<text xml:space="preserve" x="202.5" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">S2</text>
<text xml:space="preserve" x="273.8" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">S3</text>
<text xml:space="preserve" x="345.0" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">S4</text>
<text xml:space="preserve" x="416.2" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">S5</text>
<text xml:space="preserve" x="487.5" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">S6</text>
<text xml:space="preserve" x="558.8" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">S7</text>
<text xml:space="preserve" x="630.0" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">S8</text>
<line x1="60.0" y1="146.7" x2="630.0" y2="146.7" stroke="#5E5A52" stroke-width="1.4" stroke-dasharray="3 4"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Timeline: 1950, Alan Turing asks whether machines can think; 1956, the term artificial intelligence is coined at the Dartmouth workshop; 1997, IBM&#x27;s Deep Blue beats chess champion Garry Kasparov; 2012, deep learning wins an image recognition contest by a large margin; 2017, the transformer design is published, the basis of modern language models; 2022, ChatGPT is released to the public and AI chat reaches millions of people.">
<title>A short timeline of artificial intelligence, from 1950 to 2022.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5A52"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text x="16" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">70 years in six steps</text>
<line x1="20" y1="200" x2="740" y2="200" stroke="#8A6A1F" stroke-width="3"/>
<circle cx="70" cy="200" r="9" fill="#C9A45C" stroke="#8A6A1F" stroke-width="2"/>
<rect x="12" y="44" width="116" height="134" rx="8" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="20" y="64.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">1950</text>
<text x="20" y="82.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">Alan Turing asks:</text>
<text x="20" y="95.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">can machines think?</text>
<text x="20" y="112.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">He proposes a test based</text>
<text x="20" y="123.5" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">on conversation alone.</text>
<line x1="70" y1="191" x2="70" y2="178" stroke="#8A6A1F" stroke-width="1.2"/>
<circle cx="194" cy="200" r="9" fill="#C9A45C" stroke="#8A6A1F" stroke-width="2"/>
<rect x="136" y="224" width="116" height="134" rx="8" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="144" y="244.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">1956</text>
<text x="144" y="262.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">The name is born</text>
<text x="144" y="279.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">Researchers at a</text>
<text x="144" y="290.5" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">Dartmouth College</text>
<text x="144" y="302.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">workshop coin</text>
<text x="144" y="313.5" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">“artificial</text>
<text x="144" y="325.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">intelligence”.</text>
<line x1="194" y1="209" x2="194" y2="224" stroke="#8A6A1F" stroke-width="1.2"/>
<circle cx="318" cy="200" r="9" fill="#C9A45C" stroke="#8A6A1F" stroke-width="2"/>
<rect x="260" y="44" width="116" height="134" rx="8" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="268" y="64.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">1997</text>
<text x="268" y="82.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">A computer beats</text>
<text x="268" y="95.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">the chess champion</text>
<text x="268" y="112.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">IBM&#x27;s Deep Blue defeats</text>
<text x="268" y="123.5" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">world champion Garry</text>
<text x="268" y="135.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">Kasparov.</text>
<line x1="318" y1="191" x2="318" y2="178" stroke="#8A6A1F" stroke-width="1.2"/>
<circle cx="442" cy="200" r="9" fill="#C9A45C" stroke="#8A6A1F" stroke-width="2"/>
<rect x="384" y="224" width="116" height="134" rx="8" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="392" y="244.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">2012</text>
<text x="392" y="262.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">Deep learning takes</text>
<text x="392" y="275.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">off</text>
<text x="392" y="292.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">A neural network wins an</text>
<text x="392" y="303.5" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">image contest by a wide</text>
<text x="392" y="315.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">margin.</text>
<line x1="442" y1="209" x2="442" y2="224" stroke="#8A6A1F" stroke-width="1.2"/>
<circle cx="566" cy="200" r="9" fill="#C9A45C" stroke="#8A6A1F" stroke-width="2"/>
<rect x="508" y="44" width="116" height="134" rx="8" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="516" y="64.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">2017</text>
<text x="516" y="82.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">The transformer</text>
<text x="516" y="99.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">A design that reads</text>
<text x="516" y="110.5" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">whole sentences at once.</text>
<text x="516" y="122.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">Modern chatbots use it.</text>
<line x1="566" y1="191" x2="566" y2="178" stroke="#8A6A1F" stroke-width="1.2"/>
<circle cx="690" cy="200" r="9" fill="#C9A45C" stroke="#8A6A1F" stroke-width="2"/>
<rect x="632" y="224" width="116" height="134" rx="8" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="640" y="244.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">2022</text>
<text x="640" y="262.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">AI chat reaches</text>
<text x="640" y="275.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">everyone</text>
<text x="640" y="292.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">ChatGPT launches.</text>
<text x="640" y="303.5" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">Millions try an AI</text>
<text x="640" y="315.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">assistant.</text>
<line x1="690" y1="209" x2="690" y2="224" stroke="#8A6A1F" stroke-width="1.2"/>
<text x="16" y="390.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Progress came in waves: more data, faster computers and better designs. It was not one invention.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="A sentence, &#x27;Lagos traffic is very&#x27;, and a bar chart of the model&#x27;s guesses for the next word: bad 38 percent, heavy 24 percent, slow 15 percent, unpredictable 9 percent, and many others sharing the rest. It picks one, adds it to the sentence, and repeats for the next word. The model does not look up facts; it follows patterns from the text it learned from.">
<title>How a language model writes: it predicts the next word, again and again.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5A52"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text x="16" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A language model plays one game, over and over: what word comes next?</text>
<rect x="16" y="48" width="728" height="52" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="34" y="82.0" font-size="20" fill="#2A2926" font-weight="700" text-anchor="start">“Lagos traffic is very ___”</text>
<text x="40" y="141.0" font-size="13" fill="#2A2926" font-weight="600" text-anchor="start">bad</text>
<rect x="210" y="124" width="418.0" height="26" rx="5" fill="#C9A45C" stroke="#8A6A1F" stroke-width="1"/>
<text x="634.0" y="142.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">38%</text>
<text x="40" y="181.0" font-size="13" fill="#2A2926" font-weight="600" text-anchor="start">heavy</text>
<rect x="210" y="164" width="264.0" height="26" rx="5" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1"/>
<text x="480.0" y="182.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">24%</text>
<text x="40" y="221.0" font-size="13" fill="#2A2926" font-weight="600" text-anchor="start">slow</text>
<rect x="210" y="204" width="165.0" height="26" rx="5" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1"/>
<text x="381.0" y="222.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">15%</text>
<text x="40" y="261.0" font-size="13" fill="#2A2926" font-weight="600" text-anchor="start">unpredictable</text>
<rect x="210" y="244" width="99.0" height="26" rx="5" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1"/>
<text x="315.0" y="262.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">9%</text>
<text x="40" y="301.0" font-size="13" fill="#2A2926" font-weight="600" text-anchor="start">…and thousands more</text>
<rect x="210" y="284" width="154.0" height="26" rx="5" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1"/>
<text x="370.0" y="302.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">14%</text>
<text x="16" y="340.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">It picks a likely word (not always the likeliest), adds it to the sentence, and starts again.</text>
<text x="16" y="362.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">It does not look the answer up or know what is true. It follows patterns from the huge amount of writing it learned from.</text>
<text x="16" y="384.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">That is why it writes fluently, and why it can sound sure while being wrong. The percentages here are illustrative.</text>
</g>
</svg>

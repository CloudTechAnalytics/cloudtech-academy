<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Eight steps in two rows: 1 Decide the goal yourself. 2 Brief the AI and let it ask questions. 3 Get options. 4 Choose and shape one. 5 Check the numbers by hand. 6 Ask the AI to criticise its own work. 7 Fix the facts only you know. 8 Decide, publish and learn what worked. A human makes the decisions at steps 1, 4, 5, 7 and 8.">
<title>A complete example: eight steps from a problem to finished work with an AI assistant.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5A52"/></marker></defs>
<rect width="760" height="330" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text x="16" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">The same pattern works for most jobs</text>
<rect x="16" y="50" width="168" height="104" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="40" cy="76" r="14" fill="#8A6A1F"/>
<text x="40" y="81.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="62" y="81.0" font-size="11" fill="#8A6A1F" font-weight="700" text-anchor="start">You</text>
<text x="30" y="112.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">Decide the goal</text>
<line x1="184" y1="102" x2="200" y2="102" stroke="#5E5A52" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="50" width="168" height="104" rx="10" fill="#FFFFFF" stroke="#1F6F43" stroke-width="1.5"/>
<circle cx="224" cy="76" r="14" fill="#1F6F43"/>
<text x="224" y="81.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="246" y="81.0" font-size="11" fill="#1F6F43" font-weight="700" text-anchor="start">You + AI</text>
<text x="214" y="112.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">Brief the AI, let it</text>
<text x="214" y="127.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">ask questions</text>
<line x1="368" y1="102" x2="384" y2="102" stroke="#5E5A52" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="384" y="50" width="168" height="104" rx="10" fill="#FFFFFF" stroke="#1F6F43" stroke-width="1.5"/>
<circle cx="408" cy="76" r="14" fill="#1F6F43"/>
<text x="408" y="81.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="430" y="81.0" font-size="11" fill="#1F6F43" font-weight="700" text-anchor="start">AI</text>
<text x="398" y="112.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">Get options</text>
<line x1="552" y1="102" x2="568" y2="102" stroke="#5E5A52" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="568" y="50" width="168" height="104" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="592" cy="76" r="14" fill="#8A6A1F"/>
<text x="592" y="81.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="614" y="81.0" font-size="11" fill="#8A6A1F" font-weight="700" text-anchor="start">You</text>
<text x="582" y="112.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">Choose and shape one</text>
<rect x="16" y="180" width="168" height="104" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="40" cy="206" r="14" fill="#8A6A1F"/>
<text x="40" y="211.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="62" y="211.0" font-size="11" fill="#8A6A1F" font-weight="700" text-anchor="start">You</text>
<text x="30" y="242.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">Check the numbers by</text>
<text x="30" y="257.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">hand</text>
<line x1="184" y1="232" x2="200" y2="232" stroke="#5E5A52" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200" y="180" width="168" height="104" rx="10" fill="#FFFFFF" stroke="#1F6F43" stroke-width="1.5"/>
<circle cx="224" cy="206" r="14" fill="#1F6F43"/>
<text x="224" y="211.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text x="246" y="211.0" font-size="11" fill="#1F6F43" font-weight="700" text-anchor="start">AI</text>
<text x="214" y="242.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">Ask the AI to</text>
<text x="214" y="257.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">criticise it</text>
<line x1="368" y1="232" x2="384" y2="232" stroke="#5E5A52" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="384" y="180" width="168" height="104" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="408" cy="206" r="14" fill="#8A6A1F"/>
<text x="408" y="211.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
<text x="430" y="211.0" font-size="11" fill="#8A6A1F" font-weight="700" text-anchor="start">You</text>
<text x="398" y="242.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">Fix what only you know</text>
<line x1="552" y1="232" x2="568" y2="232" stroke="#5E5A52" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="568" y="180" width="168" height="104" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="592" cy="206" r="14" fill="#8A6A1F"/>
<text x="592" y="211.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text>
<text x="614" y="211.0" font-size="11" fill="#8A6A1F" font-weight="700" text-anchor="start">You</text>
<text x="582" y="242.0" font-size="12.5" fill="#2A2926" font-weight="600" text-anchor="start">Decide, use it, learn</text>
<line x1="700" y1="154" x2="700" y2="180" stroke="#5E5A52" stroke-width="1.5"/>
<text x="16" y="318.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">You make the decisions (gold). The AI does the drafting, listing and criticising (green).</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="The four parts of a good prompt: context (who you are and what is going on), task (exactly what you want produced), details (facts the AI cannot know and any limits) and format (length, layout, tone). The example asks for a short reminder message for a laundry business.">
<title>Context, task, details, format.</title>

<rect width="760" height="420" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Four parts, one prompt</text>
<rect x="16.0" y="42.0" width="728.0" height="76.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<circle cx="40.0" cy="70.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="40.0" y="74.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="64.0" y="75.0" font-size="15" fill="#2F5D8A" font-weight="700" text-anchor="start">Context</text>
<text xml:space="preserve" x="64.0" y="98.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Who you are and what's going on</text>
<text xml:space="preserve" x="280.0" y="72.0" font-size="11.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="280.0" y="92.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">I run a laundry in Enugu. A customer's collection is overdue.</text>
<rect x="16.0" y="126.0" width="728.0" height="76.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<circle cx="40.0" cy="154.0" r="12" fill="#B38A3E"/>
<text xml:space="preserve" x="40.0" y="158.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="64.0" y="159.0" font-size="15" fill="#8A6A1F" font-weight="700" text-anchor="start">Task</text>
<text xml:space="preserve" x="64.0" y="182.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Exactly what you want made</text>
<text xml:space="preserve" x="280.0" y="156.0" font-size="11.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="280.0" y="176.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Write a polite WhatsApp reminder.</text>
<rect x="16.0" y="210.0" width="728.0" height="76.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<circle cx="40.0" cy="238.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="40.0" y="242.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="64.0" y="243.0" font-size="15" fill="#2F6B3F" font-weight="700" text-anchor="start">Details</text>
<text xml:space="preserve" x="64.0" y="266.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Facts it can't know; limits</text>
<text xml:space="preserve" x="280.0" y="240.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="280.0" y="260.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Order #418, 6 shirts, ₦7,200 due, we close at 6pm.</text>
<rect x="16.0" y="294.0" width="728.0" height="76.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<circle cx="40.0" cy="322.0" r="12" fill="#5C4F80"/>
<text xml:space="preserve" x="40.0" y="326.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="64.0" y="327.0" font-size="15" fill="#5C4F80" font-weight="700" text-anchor="start">Format</text>
<text xml:space="preserve" x="64.0" y="350.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Length, layout, tone</text>
<text xml:space="preserve" x="280.0" y="324.0" font-size="11.5" fill="#5C4F80" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="280.0" y="344.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Friendly, under 50 words, no "valued customer".</text>
<text xml:space="preserve" x="16.0" y="396.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Test: what would a new assistant on their first day need to know? Tell the AI the same.</text>
<text xml:space="preserve" x="16.0" y="414.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Not sure what to include? Ask: "Ask me up to 5 questions before you write it."</text>
</g></svg>
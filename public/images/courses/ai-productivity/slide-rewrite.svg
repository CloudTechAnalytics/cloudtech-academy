<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Rewriting a crowded slide into a readable one, with an example about clinic waiting times. Before: a topic title and long sentences. After: a headline that states the finding, three short bullets of eight words or fewer, and the detail moved to speaker notes.">
<title>A headline that states the point, short lines, detail in the notes.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="20.0" width="358.0" height="250.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="44.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Before: written like a document</text>
<rect x="30.0" y="56.0" width="330.0" height="202.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="42.0" y="80.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Waiting Times</text>
<text xml:space="preserve" x="42.0" y="104.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Over the past quarter we have seen that</text>
<text xml:space="preserve" x="42.0" y="122.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">the average patient waiting time at the clinic</text>
<text xml:space="preserve" x="42.0" y="140.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">has risen to nearly 75 minutes, which has</text>
<text xml:space="preserve" x="42.0" y="158.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">led to several formal complaints from patients</text>
<text xml:space="preserve" x="42.0" y="176.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">and a drop in satisfaction survey scores</text>
<text xml:space="preserve" x="42.0" y="208.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Staff are often unavailable at peak times</text>
<rect x="386.0" y="20.0" width="358.0" height="250.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="400.0" y="44.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">After: written for a screen</text>
<rect x="400.0" y="56.0" width="330.0" height="202.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="414.0" y="84.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Patients wait 75 minutes on average</text>
<text xml:space="preserve" x="414.0" y="118.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">•  12 formal complaints this quarter</text>
<text xml:space="preserve" x="414.0" y="148.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">•  Satisfaction scores are down</text>
<text xml:space="preserve" x="414.0" y="178.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">•  Peak hours are short-staffed</text>
<text xml:space="preserve" x="414.0" y="236.0" font-size="20" fill="#2F6B3F" font-weight="700" text-anchor="start">75</text>
<text xml:space="preserve" x="16.0" y="302.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">What changed</text>
<rect x="16.0" y="316.0" width="166.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="28.0" y="340.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Headline = the point</text>
<text xml:space="preserve" x="28.0" y="360.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">A finding, not a topic</text>
<rect x="202.0" y="316.0" width="166.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="214.0" y="340.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Short lines</text>
<text xml:space="preserve" x="214.0" y="360.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">3–5 lines, about 8</text>
<text xml:space="preserve" x="214.0" y="374.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">words each</text>
<rect x="388.0" y="316.0" width="166.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="400.0" y="340.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">One big number</text>
<text xml:space="preserve" x="400.0" y="360.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Something the room</text>
<text xml:space="preserve" x="400.0" y="374.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">remembers</text>
<rect x="574.0" y="316.0" width="166.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="586.0" y="340.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Detail in speaker notes</text>
<text xml:space="preserve" x="586.0" y="360.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">You say it out loud</text>
<text xml:space="preserve" x="16.0" y="414.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Say it out loud, time yourself (1–2 minutes a slide), and end with a clear ask.</text>
</g></svg>
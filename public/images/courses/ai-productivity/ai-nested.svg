<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Four nested circles. The biggest is artificial intelligence, software that does tasks that normally need human intelligence. Inside it is machine learning, software that learns patterns from examples. Inside that is deep learning, which uses many-layered neural networks. The smallest is generative AI, which creates new text, images, audio, video and code; ChatGPT and Claude belong here.">
<title>AI, machine learning, deep learning and generative AI, one inside the other.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5A52"/></marker></defs>
<rect width="760" height="470" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<circle cx="230" cy="218" r="200" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="230" cy="258" r="156" fill="#EFE4CC" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="230" cy="298" r="112" fill="#E6D5AE" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="230" cy="336" r="68" fill="#C9A45C" stroke="#8A6A1F" stroke-width="1.5"/>
<text x="230" y="48.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">Artificial intelligence (AI)</text>
<text x="230" y="118.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="middle">Machine learning</text>
<text x="230" y="184.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle">Deep learning</text>
<text x="230" y="326.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">Generative</text>
<text x="230" y="342.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">AI</text>
<rect x="470" y="28" width="276" height="84" rx="8" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="482" y="47.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Artificial intelligence</text>
<text x="482" y="64.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Software that does tasks that normally</text>
<text x="482" y="78.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">need human intelligence.</text>
<text x="482" y="100.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Spam filters, map routes, chess</text>
<rect x="470" y="118" width="276" height="84" rx="8" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="482" y="137.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Machine learning</text>
<text x="482" y="154.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Learns patterns from examples instead of</text>
<text x="482" y="168.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">following only fixed rules.</text>
<text x="482" y="190.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Bank fraud alerts, product recommendations</text>
<rect x="470" y="208" width="276" height="84" rx="8" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="482" y="227.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Deep learning</text>
<text x="482" y="244.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Machine learning with many-layered</text>
<text x="482" y="258.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">neural networks.</text>
<text x="482" y="280.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Face unlock, voice typing, translation</text>
<rect x="470" y="298" width="276" height="84" rx="8" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1"/>
<text x="482" y="317.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Generative AI</text>
<text x="482" y="334.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Creates new text, images, audio, video</text>
<text x="482" y="348.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">and code.</text>
<text x="482" y="370.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">ChatGPT, Claude, Gemini, image makers</text>
<text x="16" y="458.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Every circle is inside the one before it: all generative AI is deep learning, machine learning and AI, but not the other way round.</text>
</g>
</svg>

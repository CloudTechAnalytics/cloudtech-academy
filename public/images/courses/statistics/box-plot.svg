<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="A box plot of packs per order line. The box runs from the first quartile, 7, to the third quartile, 19, with the median, 13, inside. Whiskers reach the minimum, 1, and the maximum, 30. The box is the interquartile range: the middle half of the order lines.">
<title>Box plot of packs per order line, with quartiles and the interquartile range labelled.</title>
<rect width="760" height="280" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text x="30.0" y="32.0" font-size="16" fill="#2A2926" font-weight="700" text-anchor="start" >Packs per order line, all 4,266 lines</text>
<line x1="80.0" x2="200.0" y1="130" y2="130" stroke="#8A6A1F" stroke-width="2"/><line x1="440.0" x2="660.0" y1="130" y2="130" stroke="#8A6A1F" stroke-width="2"/>
<line x1="80.0" x2="80.0" y1="116" y2="144" stroke="#8A6A1F" stroke-width="2"/>
<line x1="660.0" x2="660.0" y1="116" y2="144" stroke="#8A6A1F" stroke-width="2"/>
<rect x="200.0" y="96" width="240.0" height="68" fill="#DCC594" stroke="#8A6A1F" stroke-width="2"/>
<line x1="320.0" x2="320.0" y1="96" y2="164" stroke="#2F5D8A" stroke-width="3"/>
<text x="80.0" y="164.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle" >Min 1</text>
<text x="200.0" y="84.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle" >Q1 7</text>
<text x="320.0" y="84.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="middle" >Median 13</text>
<text x="440.0" y="84.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle" >Q3 19</text>
<text x="660.0" y="164.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle" >Max 30</text>
<path d="M200.0,180 L200.0,188 L440.0,188 L440.0,180" stroke="#B38A3E" stroke-width="1.8" fill="none"/>
<text x="320.0" y="208.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="middle" >IQR = 19 − 7 = 12 packs: the middle half of the lines</text>
<line x1="60" x2="700" y1="250" y2="250" stroke="#CFC4B2"/>
<text x="60.0" y="268.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >0</text>
<text x="160.0" y="268.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >5</text>
<text x="260.0" y="268.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >10</text>
<text x="360.0" y="268.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >15</text>
<text x="460.0" y="268.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >20</text>
<text x="560.0" y="268.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >25</text>
<text x="660.0" y="268.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >30</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Each IT employee's monthly salary as a dot on a line. Most are bunched at the lower end, with a few high salaries to the right. The median sits in the middle of the bunch; the mean is pulled to the right by the high salaries.">
<title>IT salaries as dots: a few high salaries pull the mean above the median.</title>
<rect width="760" height="300" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text x="30.0" y="32.0" font-size="16" fill="#2A2926" font-weight="700" text-anchor="start" >Monthly salaries, IT department (12 people)</text>
<circle cx="122.1" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="155.8" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="200.0" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="227.4" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="278.0" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="290.6" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="311.6" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="383.2" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="444.3" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="450.6" cy="166.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="595.9" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<circle cx="669.6" cy="180.0" r="6" fill="#DCC594" stroke="#8A6A1F"/>
<line x1="40" x2="720" y1="190" y2="190" stroke="#CFC4B2"/>
<text x="40.0" y="208.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >₦0k</text>
<text x="250.6" y="208.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >₦500k</text>
<text x="461.2" y="208.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >₦1,000k</text>
<text x="671.7" y="208.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >₦1,500k</text>
<text x="882.3" y="208.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle" >₦2,000k</text>
<line x1="301.1" x2="301.1" y1="70" y2="190" stroke="#2F5D8A" stroke-width="2.2" />
<text x="309.1" y="76.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start" >Median ₦620,000</text>
<line x1="344.1" x2="344.1" y1="70" y2="190" stroke="#9B2C1F" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="352.1" y="98.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start" >Mean ₦722,083</text>
<text x="30.0" y="240.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start" >Half the department earns less than the median. A few senior and manager salaries on the right</text>
<text x="30.0" y="260.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start" >pull the mean up; no one's pay changed, only the summary did.</text>
</g></svg>
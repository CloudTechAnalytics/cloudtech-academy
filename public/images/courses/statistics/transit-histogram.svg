<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="A histogram of transit days for 247 delivered Shanghai to Lagos shipments. Most arrive in 35 to 38 days, with a long tail to the right out to 53.0 days. The mean is 39.0 days; a line at mean plus two standard deviations, 48.4 days, marks the shipments that are unusually slow.">
<title>Route 1 transit days: a tall block at 35–38 days and a long right tail; mean and mean + 2 SD marked.</title>

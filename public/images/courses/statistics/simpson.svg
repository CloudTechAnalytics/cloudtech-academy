<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Simpson's paradox, with made-up numbers. On easy deliveries, Depot B beats Depot A, 95% to 90%. On hard deliveries, B beats A again, 70% to 60%. Overall, B looks far better, 92% to 64%, because A handles mostly hard deliveries: 600 of its 700.">
<title>Simpson's paradox: Depot B wins in each group, and the overall gap is exaggerated by A's mix of hard deliveries.</title>
<rect width="760" height="330" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text x="30.0" y="32.0" font-size="16" fill="#2A2926" font-weight="700" text-anchor="start" >On-time rate, by type of delivery (illustration)</text>
<text x="178.0" y="92.0" font-size="14" fill="#2A2926" font-weight="400" text-anchor="end" >Easy local</text>
<rect x="190" y="66" width="342.0" height="22" fill="#C9C2B5"/><text x="540.0" y="82" font-size="12.5" fill="#5E5A52">A: 90% of 100</text>
<rect x="190" y="92" width="361.0" height="22" fill="#B38A3E"/><text x="559.0" y="108" font-size="12.5" fill="#8A6A1F" font-weight="700">B: 95% of 800</text>
<text x="178.0" y="174.0" font-size="14" fill="#2A2926" font-weight="400" text-anchor="end" >Hard long-distance</text>
<rect x="190" y="148" width="228.0" height="22" fill="#C9C2B5"/><text x="426.0" y="164" font-size="12.5" fill="#5E5A52">A: 60% of 600</text>
<rect x="190" y="174" width="266.0" height="22" fill="#B38A3E"/><text x="464.0" y="190" font-size="12.5" fill="#8A6A1F" font-weight="700">B: 70% of 100</text>
<text x="178.0" y="256.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="end" >All deliveries</text>
<rect x="190" y="230" width="243.2" height="22" fill="#C9C2B5"/><text x="441.2" y="246" font-size="12.5" fill="#5E5A52">A: 64% of 700</text>
<rect x="190" y="256" width="349.6" height="22" fill="#B38A3E"/><text x="547.6" y="272" font-size="12.5" fill="#8A6A1F" font-weight="700">B: 92% of 900</text>
<line x1="30" x2="730" y1="216" y2="216" stroke="#EDE6D8"/>
<text x="30.0" y="312.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start" >B wins in both groups. A's total is dragged down because 600 of its 700 deliveries are the hard kind.</text>
</g></svg>
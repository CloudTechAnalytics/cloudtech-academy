<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" role="img" aria-label="Turning your own lecture notes into study tools: flashcards with a question and short answer, multiple-choice questions with an explanation for each wrong option, a one-at-a-time quiz that waits for your answers, and a revision timetable. Working from your own notes keeps the AI close to what your lecturer taught.">
<title>One set of notes, four study tools.</title>

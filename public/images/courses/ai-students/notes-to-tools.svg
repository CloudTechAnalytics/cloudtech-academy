<text xml:space="preserve" x="280.0" y="176.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">One-by-one quiz</text>
<text xml:space="preserve" x="280.0" y="196.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">It waits for each answer, then shows what you missed</text>

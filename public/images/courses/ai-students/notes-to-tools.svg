<text xml:space="preserve" x="280.0" y="64.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Question one side, short answer the other</text>
<path d="M190,150 C230,150 230,115 262,115" fill="none" stroke="#8A6A1F" stroke-width="1.8" marker-end="url(#a8A6A1F)"/>
<rect x="266.0" y="86.0" width="478.0" height="58.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.4"/>
<text xml:space="preserve" x="280.0" y="110.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">Multiple choice</text>
<text xml:space="preserve" x="280.0" y="130.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">With a reason each wrong option is wrong</text>
<path d="M190,150 C230,150 230,181 262,181" fill="none" stroke="#2F6B3F" stroke-width="1.8" marker-end="url(#a2F6B3F)"/>

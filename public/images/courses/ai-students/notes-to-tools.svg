<text xml:space="preserve" x="101.0" y="172.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">actually taught</text>
<path d="M190,150 C230,150 230,49 262,49" fill="none" stroke="#2F5D8A" stroke-width="1.8" marker-end="url(#a2F5D8A)"/>
<rect x="266.0" y="20.0" width="478.0" height="58.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.4"/>

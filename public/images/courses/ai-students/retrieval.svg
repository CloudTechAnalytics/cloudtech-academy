<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Two ways to study. Re-reading feels easy and builds familiarity, so you feel you know it. Retrieval, where you close the notes and pull answers from memory, feels harder but makes knowledge stick. AI can write the questions and quiz you, then wait for your answer before checking it.">
<title>Re-reading builds familiarity; retrieval builds memory.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="340" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="20.0" width="358.0" height="150.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="46.0" font-size="15" fill="#9B2C1F" font-weight="700" text-anchor="start">Re-reading</text>
<text xml:space="preserve" x="30.0" y="72.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Feels easy and productive</text>
<text xml:space="preserve" x="30.0" y="94.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Page looks familiar → "I know this"</text>
<text xml:space="preserve" x="30.0" y="116.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">But you never tested your memory</text>
<text xml:space="preserve" x="30.0" y="148.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Memory built</text>
<rect x="130.0" y="138.0" width="18.0" height="12.0" rx="2" fill="#9B2C1F"/>
<rect x="152.0" y="138.0" width="18.0" height="12.0" rx="2" fill="#E8C7C2"/>
<rect x="174.0" y="138.0" width="18.0" height="12.0" rx="2" fill="#E8C7C2"/>
<rect x="196.0" y="138.0" width="18.0" height="12.0" rx="2" fill="#E8C7C2"/>
<rect x="218.0" y="138.0" width="18.0" height="12.0" rx="2" fill="#E8C7C2"/>
<rect x="386.0" y="20.0" width="358.0" height="150.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="400.0" y="46.0" font-size="15" fill="#2F6B3F" font-weight="700" text-anchor="start">Retrieval</text>
<text xml:space="preserve" x="400.0" y="72.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Close the notes, answer from memory</text>
<text xml:space="preserve" x="400.0" y="94.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Feels harder, and that effort helps</text>
<text xml:space="preserve" x="400.0" y="116.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Gaps show up while there's time to fix them</text>
<text xml:space="preserve" x="400.0" y="148.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Memory built</text>
<rect x="500.0" y="138.0" width="18.0" height="12.0" rx="2" fill="#2F6B3F"/>
<rect x="522.0" y="138.0" width="18.0" height="12.0" rx="2" fill="#2F6B3F"/>
<rect x="544.0" y="138.0" width="18.0" height="12.0" rx="2" fill="#2F6B3F"/>
<rect x="566.0" y="138.0" width="18.0" height="12.0" rx="2" fill="#2F6B3F"/>
<rect x="588.0" y="138.0" width="18.0" height="12.0" rx="2" fill="#C5DCCB"/>
<text xml:space="preserve" x="16.0" y="204.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A study loop with AI</text>
<rect x="16.0" y="218.0" width="166.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="38.0" cy="242.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="38.0" y="246.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="58.0" y="247.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Paste your notes</text>
<text xml:space="preserve" x="30.0" y="276.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">your own, not a guess</text>
<path d="M184.0,257.0 L200.0,257.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="202.0" y="218.0" width="166.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="224.0" cy="242.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="224.0" y="246.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="244.0" y="247.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">AI asks, then waits</text>
<text xml:space="preserve" x="216.0" y="276.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">one question at a time</text>
<path d="M370.0,257.0 L386.0,257.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="388.0" y="218.0" width="166.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#B38A3E" stroke-width="2"/>
<circle cx="410.0" cy="242.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="410.0" y="246.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="430.0" y="247.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">You answer</text>
<text xml:space="preserve" x="402.0" y="276.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">from memory</text>
<path d="M556.0,257.0 L572.0,257.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="574.0" y="218.0" width="166.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="596.0" cy="242.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="596.0" y="246.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="616.0" y="247.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">AI checks it</text>
<text xml:space="preserve" x="588.0" y="276.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">what did I miss?</text>
<text xml:space="preserve" x="16.0" y="322.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">The line that matters: "Wait for my answer before telling me if I'm right."</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Two ways to ask for writing help. Asking the AI to write your essay means it does the thinking, you learn nothing and it is usually not allowed. Asking it to list the problems in your draft without rewriting means you do the thinking, fix each problem and improve. A third step is to declare how you used it.">
<title>A coach lists the problems; a ghostwriter does your thinking.</title>
<defs><marker id="a9B2C1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B2C1F"/></marker><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker><marker id="a2F6B3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B3F"/></marker></defs>
<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="20.0" width="358.0" height="200.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="46.0" font-size="15" fill="#9B2C1F" font-weight="700" text-anchor="start">Ghostwriter</text>
<rect x="30.0" y="58.0" width="330.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#9B2C1F" stroke-width="1.2"/>
<text xml:space="preserve" x="42.0" y="86.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">"Write my essay on social media."</text>
<path d="M195.0,108.0 L195.0,128.0" fill="none" stroke="#9B2C1F" stroke-width="2" marker-end="url(#a9B2C1F)"/>
<text xml:space="preserve" x="30.0" y="150.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">The AI does the thinking</text>
<text xml:space="preserve" x="30.0" y="172.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">You learn nothing</text>
<text xml:space="preserve" x="30.0" y="194.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Sounds like everyone else; usually not allowed</text>
<rect x="386.0" y="20.0" width="358.0" height="200.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="400.0" y="46.0" font-size="15" fill="#2F6B3F" font-weight="700" text-anchor="start">Coach</text>
<rect x="400.0" y="58.0" width="330.0" height="46.0" rx="10" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="1.2"/>
<text xml:space="preserve" x="412.0" y="78.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">"List the 4 biggest problems.</text>
<text xml:space="preserve" x="412.0" y="95.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start"> Don't rewrite it."</text>
<path d="M565.0,108.0 L565.0,128.0" fill="none" stroke="#2F6B3F" stroke-width="2" marker-end="url(#a2F6B3F)"/>
<text xml:space="preserve" x="400.0" y="150.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">You do the thinking</text>
<text xml:space="preserve" x="400.0" y="172.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">You fix each problem yourself</text>
<text xml:space="preserve" x="400.0" y="194.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">You write better next time</text>
<text xml:space="preserve" x="16.0" y="256.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A writing routine that stays yours</text>
<rect x="16.0" y="270.0" width="166.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="38.0" cy="294.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="38.0" y="298.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="58.0" y="299.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Plan</text>
<text xml:space="preserve" x="30.0" y="322.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">your position and</text>
<text xml:space="preserve" x="30.0" y="337.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">points; AI suggests</text>
<text xml:space="preserve" x="30.0" y="352.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">structure</text>
<path d="M184.0,315.0 L200.0,315.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="202.0" y="270.0" width="166.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="224.0" cy="294.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="224.0" y="298.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="244.0" y="299.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Write</text>
<text xml:space="preserve" x="216.0" y="322.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">each section yourself,</text>
<text xml:space="preserve" x="216.0" y="337.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">from sources you read</text>
<path d="M370.0,315.0 L386.0,315.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="388.0" y="270.0" width="166.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="410.0" cy="294.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="410.0" y="298.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="430.0" y="299.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Ask for problems</text>
<text xml:space="preserve" x="402.0" y="322.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">a ranked list, no</text>
<text xml:space="preserve" x="402.0" y="337.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">rewrite</text>
<path d="M556.0,315.0 L572.0,315.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="574.0" y="270.0" width="166.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="596.0" cy="294.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="596.0" y="298.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="616.0" y="299.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Declare</text>
<text xml:space="preserve" x="588.0" y="322.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">say exactly what you</text>
<text xml:space="preserve" x="588.0" y="337.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">used it for</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-label="Before using AI for a piece of work: first check your course's AI rules. If AI is banned for that work, don't use it, and that includes feedback on drafts. If allowed, use it to understand and practise rather than to do the assessment, be able to explain everything you submit, and declare how you used it when asked.">
<title>Rules first; then use AI to learn, not to do the assessment.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="370" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Before you use AI on any piece of work</text>
<rect x="16.0" y="42.0" width="230.0" height="72.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.8"/>
<circle cx="38.0" cy="66.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="38.0" y="70.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="58.0" y="71.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start">Check the rules</text>
<text xml:space="preserve" x="30.0" y="98.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Course outline, handbook, lecturer</text>
<path d="M250.0,78.0 L296.0,52.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<path d="M250.0,78.0 L296.0,124.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="300.0" y="28.0" width="444.0" height="52.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.6"/>
<text xml:space="preserve" x="314.0" y="50.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">AI not allowed for this work</text>
<text xml:space="preserve" x="314.0" y="68.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Don't use it, not even for feedback on drafts.</text>
<rect x="300.0" y="100.0" width="444.0" height="52.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="314.0" y="122.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">AI allowed in some way</text>
<text xml:space="preserve" x="314.0" y="140.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Go to the three habits below.</text>
<text xml:space="preserve" x="16.0" y="192.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Three habits when AI is allowed</text>
<rect x="16.0" y="206.0" width="232.0" height="118.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<circle cx="40.0" cy="232.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="40.0" y="236.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="60.0" y="228.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Understand, don't</text>
<text xml:space="preserve" x="60.0" y="245.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">outsource</text>
<text xml:space="preserve" x="30.0" y="274.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Use it to learn and practise,</text>
<text xml:space="preserve" x="30.0" y="290.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">not to do the assessment for</text>
<text xml:space="preserve" x="30.0" y="306.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">you.</text>
<rect x="264.0" y="206.0" width="232.0" height="118.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="288.0" cy="232.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="288.0" y="236.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="308.0" y="228.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Be able to explain it</text>
<text xml:space="preserve" x="278.0" y="274.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">If you couldn't explain it in a</text>
<text xml:space="preserve" x="278.0" y="290.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">viva, it isn't yours.</text>
<rect x="512.0" y="206.0" width="232.0" height="118.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<circle cx="536.0" cy="232.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="536.0" y="236.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="556.0" y="228.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Declare how you used it</text>
<text xml:space="preserve" x="526.0" y="274.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Be specific: what you asked it</text>
<text xml:space="preserve" x="526.0" y="290.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">to do.</text>
<text xml:space="preserve" x="16.0" y="352.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Submitting AI-written work as your own can count as plagiarism or exam malpractice.</text>
</g></svg>
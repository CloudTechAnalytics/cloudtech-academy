<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Three kinds of telemetry for the same incident. Metrics show that errors jumped and when; logs show what happened to specific requests, such as the bulk send job starting; traces show where one request spent its time, mostly waiting for a database connection. Below, the four golden signals to watch for any service: latency, traffic, errors and saturation.">
<title>Metrics say when, logs say what, traces say where.</title>

<rect width="760" height="420" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="16.0" width="232.0" height="220.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="44.0" font-size="16" fill="#2F5D8A" font-weight="700" text-anchor="start">Metrics</text>
<text xml:space="preserve" x="32.0" y="66.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">numbers over time</text>
<text xml:space="preserve" x="32.0" y="222.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">When did it change?</text>
<rect x="264.0" y="16.0" width="232.0" height="220.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="280.0" y="44.0" font-size="16" fill="#8A6A1F" font-weight="700" text-anchor="start">Logs</text>
<text xml:space="preserve" x="280.0" y="66.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">records of events</text>
<text xml:space="preserve" x="280.0" y="222.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">What happened?</text>
<rect x="512.0" y="16.0" width="232.0" height="220.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="528.0" y="44.0" font-size="16" fill="#2F6B3F" font-weight="700" text-anchor="start">Traces</text>
<text xml:space="preserve" x="528.0" y="66.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">one request's path</text>
<text xml:space="preserve" x="528.0" y="222.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Where did the time go?</text>
<rect x="32.0" y="84.0" width="200.0" height="106.0" rx="6" fill="#FFFFFF"/>
<path d="M32.0,175.6 L43.5,174.3 L55.0,176.9 L66.5,175.6 L78.0,174.3 L89.5,175.6 L101.0,176.9 L112.5,174.3 L124.0,175.6 L135.5,108.0 L147.0,95.0 L158.5,100.2 L170.0,92.4 L181.5,97.6 L193.0,95.0 L204.5,170.4 L216.0,174.3 L227.5,175.6" fill="none" stroke="#2F5D8A" stroke-width="2"/>
<text xml:space="preserve" x="127.5" y="140.0" font-size="11" fill="#9B2C1F" font-weight="700" text-anchor="end">errors jump at 09:40</text>
<rect x="264.0" y="84.0" width="216.0" height="106.0" rx="6" fill="#2A2926"/>
<text xml:space="preserve" x="274.0" y="108.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">09:38 info request completed</text>
<text xml:space="preserve" x="274.0" y="130.0" font-size="10.5" fill="#E8D6A8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">09:40 info bulk send job started</text>
<text xml:space="preserve" x="274.0" y="152.0" font-size="10.5" fill="#F2A097" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">09:40 error db pool exhausted</text>
<text xml:space="preserve" x="274.0" y="174.0" font-size="10.5" fill="#F2A097" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">09:41 error upstream timed out</text>
<rect x="512.0" y="84.0" width="216.0" height="106.0" rx="6" fill="#FFFFFF"/>
<rect x="520.0" y="96.0" width="200.0" height="14.0" rx="3" fill="#DCC594"/>
<text xml:space="preserve" x="524.0" y="107.0" font-size="10.5" fill="#2A2926" font-weight="700" text-anchor="start">web</text>
<rect x="524.0" y="118.0" width="196.0" height="14.0" rx="3" fill="#DCC594"/>
<text xml:space="preserve" x="528.0" y="129.0" font-size="10.5" fill="#2A2926" font-weight="700" text-anchor="start">api</text>
<rect x="528.0" y="140.0" width="168.0" height="14.0" rx="3" fill="#9B2C1F"/>
<text xml:space="preserve" x="532.0" y="151.0" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="start">acquire conn.</text>
<rect x="698.0" y="162.0" width="6.0" height="14.0" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="694.0" y="173.0" font-size="10.5" fill="#2A2926" font-weight="700" text-anchor="end">query</text>
<text xml:space="preserve" x="16.0" y="268.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">The four golden signals, for any service</text>
<rect x="16.0" y="282.0" width="176.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="308.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">Latency</text>
<text xml:space="preserve" x="30.0" y="332.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">how long requests take</text>
<rect x="200.0" y="282.0" width="176.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="214.0" y="308.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">Traffic</text>
<text xml:space="preserve" x="214.0" y="332.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">how many requests</text>
<rect x="384.0" y="282.0" width="176.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="398.0" y="308.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">Errors</text>
<text xml:space="preserve" x="398.0" y="332.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">how many fail</text>
<rect x="568.0" y="282.0" width="176.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="582.0" y="308.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">Saturation</text>
<text xml:space="preserve" x="582.0" y="332.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">how full the tightest</text>
<text xml:space="preserve" x="582.0" y="350.1" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">resource is</text>
<text xml:space="preserve" x="16.0" y="396.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Monitoring answers questions you planned; observability lets you ask new ones of the same data.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="A trace drawn as a waterfall, on a time axis from 0 to 5,000 milliseconds. The web span lasts 5,015 ms and contains the API span, which contains two database spans: acquire connection, 4,900 ms, then the query, 98 ms. Self time, a span's duration minus its children's, is a few milliseconds for web and API, 4,900 for acquiring the connection and 98 for the query: almost all the time was waiting for a connection.">
<title>A trace waterfall: the parents wrap their children; self time shows where the time really went.</title>

<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="30.0" font-size="12" fill="#5E5A52" font-weight="700" text-anchor="start">service · operation</text>
<text xml:space="preserve" x="660.0" y="30.0" font-size="12" fill="#5E5A52" font-weight="700" text-anchor="start">self time</text>
<line x1="230.0" y1="40.0" x2="230.0" y2="230.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="230.0" y="250.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">0</text>
<line x1="310.4" y1="40.0" x2="310.4" y2="230.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="310.4" y="250.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">1,000</text>
<line x1="390.8" y1="40.0" x2="390.8" y2="230.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="390.8" y="250.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">2,000</text>
<line x1="471.2" y1="40.0" x2="471.2" y2="230.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="471.2" y="250.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">3,000</text>
<line x1="551.6" y1="40.0" x2="551.6" y2="230.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="551.6" y="250.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">4,000</text>
<line x1="632.0" y1="40.0" x2="632.0" y2="230.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="632.0" y="250.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">5,000</text>
<text xml:space="preserve" x="435.0" y="270.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">milliseconds since the request arrived</text>
<text xml:space="preserve" x="16.0" y="70.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">web</text>
<text xml:space="preserve" x="52.0" y="70.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">GET /api/invoices</text>
<rect x="230.0" y="56.0" width="403.2" height="22.0" rx="3" fill="#DCC594"/>
<text xml:space="preserve" x="660.0" y="72.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">8 ms</text>
<text xml:space="preserve" x="32.0" y="114.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">api</text>
<text xml:space="preserve" x="68.0" y="114.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">GET /invoices</text>
<rect x="230.3" y="100.0" width="402.5" height="22.0" rx="3" fill="#DCC594"/>
<text xml:space="preserve" x="660.0" y="116.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">9 ms</text>
<text xml:space="preserve" x="48.0" y="158.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">db</text>
<text xml:space="preserve" x="84.0" y="158.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">acquire connection</text>
<rect x="230.6" y="144.0" width="393.9" height="22.0" rx="3" fill="#9B2C1F"/>
<text xml:space="preserve" x="660.0" y="160.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">4,900 ms</text>
<text xml:space="preserve" x="48.0" y="202.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">db</text>
<text xml:space="preserve" x="84.0" y="202.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">SELECT invoices</text>
<rect x="624.7" y="188.0" width="7.9" height="22.0" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="660.0" y="204.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">98 ms</text>
<text xml:space="preserve" x="422.9" y="160.0" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">waiting for a connection: 4,900 ms</text>
<rect x="16.0" y="290.0" width="728.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="316.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">A parent's bar includes its children, so the web span looks slow without doing anything. Look at the leaf</text>
<text xml:space="preserve" x="32.0" y="334.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">spans, or each span's self time (its duration minus its children's): here the query took 98 ms; the wait</text>
<text xml:space="preserve" x="32.0" y="352.2" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">took 4,900.</text>
</g></svg>
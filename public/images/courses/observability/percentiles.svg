<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Twenty request times sorted from fastest to slowest, from 180 to 4,200 milliseconds. The median, p50, is 255 ms. The p95 is 900 ms: 19 of the 20 requests were that fast or faster. The average is 498 ms, pulled up by one 4,200 ms request; 17 of the 20 requests were faster than the average, so it matches nobody's experience. A side box shows that percentiles don't average: two servers with p95s of 100 and 1,000 ms average to 550, but if they serve equal traffic, the p95 of all requests is about 1,000 ms.">
<title>p50, p95 and the average for 20 requests; and why p95s can't be averaged.</title>

<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<line x1="70.0" y1="300.0" x2="474.0" y2="300.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="62.0" y="304.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="end">0</text>
<line x1="70.0" y1="240.0" x2="474.0" y2="240.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="62.0" y="244.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="end">250</text>
<line x1="70.0" y1="180.0" x2="474.0" y2="180.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="62.0" y="184.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="end">500</text>
<line x1="70.0" y1="120.0" x2="474.0" y2="120.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="62.0" y="124.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="end">750</text>
<line x1="70.0" y1="60.0" x2="474.0" y2="60.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="62.0" y="64.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="end">1,000</text>
<rect x="74.0" y="256.8" width="18.0" height="43.2" rx="2" fill="#DCC594"/>
<rect x="94.0" y="254.4" width="18.0" height="45.6" rx="2" fill="#DCC594"/>
<rect x="114.0" y="252.0" width="18.0" height="48.0" rx="2" fill="#DCC594"/>
<rect x="134.0" y="250.8" width="18.0" height="49.2" rx="2" fill="#DCC594"/>
<rect x="154.0" y="249.6" width="18.0" height="50.4" rx="2" fill="#DCC594"/>
<rect x="174.0" y="247.2" width="18.0" height="52.8" rx="2" fill="#DCC594"/>
<rect x="194.0" y="246.0" width="18.0" height="54.0" rx="2" fill="#DCC594"/>
<rect x="214.0" y="244.8" width="18.0" height="55.2" rx="2" fill="#DCC594"/>
<rect x="234.0" y="242.4" width="18.0" height="57.6" rx="2" fill="#DCC594"/>
<rect x="254.0" y="240.0" width="18.0" height="60.0" rx="2" fill="#2F5D8A"/>
<rect x="274.0" y="237.6" width="18.0" height="62.4" rx="2" fill="#2F5D8A"/>
<rect x="294.0" y="235.2" width="18.0" height="64.8" rx="2" fill="#DCC594"/>
<rect x="314.0" y="232.8" width="18.0" height="67.2" rx="2" fill="#DCC594"/>
<rect x="334.0" y="228.0" width="18.0" height="72.0" rx="2" fill="#DCC594"/>
<rect x="354.0" y="223.2" width="18.0" height="76.8" rx="2" fill="#DCC594"/>
<rect x="374.0" y="216.0" width="18.0" height="84.0" rx="2" fill="#DCC594"/>
<rect x="394.0" y="204.0" width="18.0" height="96.0" rx="2" fill="#DCC594"/>
<rect x="414.0" y="175.2" width="18.0" height="124.8" rx="2" fill="#DCC594"/>
<rect x="434.0" y="84.0" width="18.0" height="216.0" rx="2" fill="#9B2C1F"/>
<rect x="454.0" y="60.0" width="18.0" height="240.0" rx="2" fill="#DCC594"/>
<path d="M452,76.0 L474,70.0" fill="none" stroke="#FBF8F2" stroke-width="4"/>
<text xml:space="preserve" x="463.0" y="54.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="middle">4,200</text>
<line x1="70.0" y1="180.6" x2="474.0" y2="180.6" stroke="#8A6A1F" stroke-width="2" stroke-dasharray="6 4"/>
<text xml:space="preserve" x="76.0" y="174.6" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">average 498 ms</text>
<text xml:space="preserve" x="273.0" y="318.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="middle">p50 = 255 ms</text>
<text xml:space="preserve" x="443.0" y="318.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="middle">p95 = 900 ms</text>
<text xml:space="preserve" x="16.0" y="30.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">20 requests, fastest to slowest (ms)</text>
<text xml:space="preserve" x="16.0" y="350.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">17 of the 20 requests were faster than the average. The p50 is the</text>
<text xml:space="preserve" x="16.0" y="368.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">typical request; the p95 is what the slowest 1 in 20 users gets.</text>
<rect x="486.0" y="46.0" width="258.0" height="300.0" rx="10" fill="#FFFFFF" stroke="#B38A3E" stroke-width="1.6"/>
<text xml:space="preserve" x="502.0" y="74.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Percentiles don't average</text>
<text xml:space="preserve" x="502.0" y="104.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Server A p95:   100 ms</text>
<text xml:space="preserve" x="502.0" y="126.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Server B p95: 1,000 ms</text>
<text xml:space="preserve" x="502.0" y="160.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Average of the two:</text>
<text xml:space="preserve" x="502.0" y="182.0" font-size="15" fill="#9B2C1F" font-weight="700" text-anchor="start">550 ms  ✗</text>
<text xml:space="preserve" x="502.0" y="216.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">p95 of all requests,</text>
<text xml:space="preserve" x="502.0" y="234.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">if each serves half:</text>
<text xml:space="preserve" x="502.0" y="258.0" font-size="15" fill="#2F6B3F" font-weight="700" text-anchor="start">about 1,000 ms  ✓</text>
<text xml:space="preserve" x="502.0" y="290.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Compute from raw data, or from</text>
<text xml:space="preserve" x="502.0" y="307.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">histograms that can be combined.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="The same log event as free text and as structured JSON. Free text needs fragile text matching. The JSON version has named fields: you can filter by service, group by route, compare pool_in_use with pool_size, and follow trace_id to the full trace of that request.">
<title>Structured logs: every detail is a field you can filter, group or follow.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Free text: readable, but hard to query</text>
<rect x="16.0" y="38.0" width="728.0" height="42.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="62.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">09:58:12 ERROR db pool exhausted for /api/invoices after 5000ms (40/40)</text>
<text xml:space="preserve" x="16.0" y="104.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Structured (JSON): every detail is a named field</text>
<rect x="16.0" y="116.0" width="236.0" height="34.0" rx="5" fill="#FFFFFF"/>
<text xml:space="preserve" x="26.0" y="138.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">ts</text>
<text xml:space="preserve" x="242.0" y="138.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace">2026-08-31T09:58:12Z</text>
<rect x="264.0" y="116.0" width="236.0" height="34.0" rx="5" fill="#FFFFFF"/>
<text xml:space="preserve" x="274.0" y="138.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">level</text>
<text xml:space="preserve" x="490.0" y="138.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace">error</text>
<rect x="16.0" y="156.0" width="236.0" height="34.0" rx="5" fill="#FFFFFF"/>
<text xml:space="preserve" x="26.0" y="178.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">service</text>
<text xml:space="preserve" x="242.0" y="178.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace">api</text>
<rect x="264.0" y="156.0" width="236.0" height="34.0" rx="5" fill="#FFFFFF"/>
<text xml:space="preserve" x="274.0" y="178.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">message</text>
<text xml:space="preserve" x="490.0" y="178.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace">db pool exhausted</text>
<rect x="16.0" y="196.0" width="236.0" height="34.0" rx="5" fill="#FFFFFF"/>
<text xml:space="preserve" x="26.0" y="218.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">route</text>
<text xml:space="preserve" x="242.0" y="218.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace">GET /api/invoices</text>
<rect x="264.0" y="196.0" width="236.0" height="34.0" rx="5" fill="#FFFFFF"/>
<text xml:space="preserve" x="274.0" y="218.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">pool_in_use</text>
<text xml:space="preserve" x="490.0" y="218.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace">40</text>

<text xml:space="preserve" x="274.0" y="258.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">trace_id</text>
<text xml:space="preserve" x="490.0" y="258.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace">4f1c…</text>
<path d="M506.0,142.0 L528.0,142.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="536.0" y="138.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">filter</text>
<text xml:space="preserve" x="536.0" y="154.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">service = api, level = error</text>
<path d="M506.0,182.0 L528.0,182.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="536.0" y="178.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">group</text>
<text xml:space="preserve" x="536.0" y="194.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">errors per route, per 10 minutes</text>
<path d="M506.0,222.0 L528.0,222.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="536.0" y="218.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">compare</text>
<text xml:space="preserve" x="536.0" y="234.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">in use 40 of 40: the pool is full</text>
<path d="M506.0,262.0 L528.0,262.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="536.0" y="258.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">follow</text>
<text xml:space="preserve" x="536.0" y="274.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">trace_id opens the full trace</text>
<text xml:space="preserve" x="16.0" y="316.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Log levels</text>
<text xml:space="preserve" x="100.0" y="316.0" font-size="13" fill="#5E5A52" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">debug</text>
<text xml:space="preserve" x="150.0" y="316.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">developer detail</text>
<text xml:space="preserve" x="262.0" y="316.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">info</text>
<text xml:space="preserve" x="312.0" y="316.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">normal events</text>
<text xml:space="preserve" x="424.0" y="316.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">warn</text>
<text xml:space="preserve" x="474.0" y="316.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">odd, still working</text>
<text xml:space="preserve" x="586.0" y="316.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">error</text>
<text xml:space="preserve" x="636.0" y="316.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">a request failed</text>
<text xml:space="preserve" x="16.0" y="356.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Never log passwords, card numbers or full phone numbers. Alert on error rates, not single lines.</text>
</g></svg>
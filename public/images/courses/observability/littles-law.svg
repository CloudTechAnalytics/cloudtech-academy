<rect x="604.0" y="284.0" width="124.0" height="32.0" rx="10" fill="#FFFFFF" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="666.0" y="305.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">small job pool</text>
<text xml:space="preserve" x="404.0" y="344.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">The job can only slow itself down.</text>
<text xml:space="preserve" x="16.0" y="404.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">And remember the other end: every pool's connections count against the database's own limit.</text>
</g></svg>
<rect x="688.0" y="16.0" width="22.0" height="12.0" rx="2" fill="#2F5D8A"/>
<rect x="714.0" y="16.0" width="22.0" height="12.0" rx="2" fill="#2F5D8A"/>
<rect x="480.0" y="32.0" width="22.0" height="12.0" rx="2" fill="#2F5D8A"/>
<rect x="506.0" y="32.0" width="22.0" height="12.0" rx="2" fill="#2F5D8A"/>

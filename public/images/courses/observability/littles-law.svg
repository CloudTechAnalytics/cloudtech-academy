<text xml:space="preserve" x="32.0" y="344.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">The job takes connections users need.</text>
<rect x="388.0" y="176.0" width="356.0" height="196.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="404.0" y="204.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">✓ Isolated pools</text>
<rect x="404.0" y="222.0" width="140.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="474.0" y="249.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">API requests</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Little's law for a connection pool: connections in use equal requests per second times seconds each request holds a connection. 133 requests a second, each holding a connection for 0.3 seconds, need about 40 connections, a full pool of 40 with no headroom. Below: when a batch job shares the pool with user traffic, it can use up the connections users need; giving the job its own small pool means it can only slow itself down.">
<title>Little's law sizes the pool; isolation keeps batch work from starving users.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="420" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="30.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Little's law</text>
<text xml:space="preserve" x="16.0" y="66.0" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">133 / s</text>
<text xml:space="preserve" x="16.0" y="88.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">requests per second</text>
<text xml:space="preserve" x="166.0" y="66.0" font-size="20" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">× 0.3 s</text>
<text xml:space="preserve" x="166.0" y="88.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">each holds a connection</text>
<text xml:space="preserve" x="316.0" y="66.0" font-size="20" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">≈ 40</text>
<text xml:space="preserve" x="316.0" y="88.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">connections in use</text>
<rect x="480.0" y="16.0" width="22.0" height="12.0" rx="2" fill="#2F5D8A"/>
<rect x="506.0" y="16.0" width="22.0" height="12.0" rx="2" fill="#2F5D8A"/>

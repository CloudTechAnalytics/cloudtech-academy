<text xml:space="preserve" x="480.0" y="98.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">pool of 40: every slot in use, no headroom</text>
<text xml:space="preserve" x="16.0" y="130.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Past 100%, requests queue, and waiting grows without limit until something times out. Size for the peak, with</text>
<text xml:space="preserve" x="16.0" y="148.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">demand at most about 70% of capacity.</text>
<rect x="16.0" y="176.0" width="356.0" height="196.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="32.0" y="204.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ Shared pool</text>
<rect x="32.0" y="222.0" width="140.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="102.0" y="249.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">API requests</text>

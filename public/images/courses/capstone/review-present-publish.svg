<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456" role="img" aria-label="Review, present and publish. Review your work like a stranger: totals reconcile, definitions visible, every number explained, caveats honest, and someone else could rerun it. Prepare for the hardest board questions: how do you know, compared with what, what would you do, what could make this wrong. A ten-minute talk splits one minute on the question, six on the findings and three on the recommendations. Publish as a short case study.">
<title>Review, rehearse, then publish a short case study.</title>


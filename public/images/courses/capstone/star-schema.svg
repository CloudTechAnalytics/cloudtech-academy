<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="A star schema for sales analysis. A central fact table at the grain of one till line, linked to dimension tables for stores, products and dates. A second fact table, targets, sits at a coarser grain of one store per month and connects through the store and month-start date. Each table's grain and key are stated.">
<title>Facts at their own grain, dimensions around them.</title>

<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="280.0" y="130.0" width="200.0" height="98.0" rx="10" fill="#B38A3E" stroke="#8A6A1F" stroke-width="2"/>
<text xml:space="preserve" x="380.0" y="160.0" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">sales_clean (fact)</text>
<text xml:space="preserve" x="380.0" y="182.0" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle">grain: one till line</text>
<text xml:space="preserve" x="380.0" y="202.0" font-size="11.5" fill="#FFFFFF" font-weight="400" text-anchor="middle">key: txn_id + line_no</text>
<rect x="16.0" y="20.0" width="200.0" height="98.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="48.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">stores</text>
<text xml:space="preserve" x="30.0" y="72.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">grain: one store</text>
<text xml:space="preserve" x="30.0" y="94.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">key: store_code</text>
<line x1="216.0" y1="69.0" x2="280.0" y2="179.0" stroke="#8A6A1F" stroke-width="1.8"/>
<rect x="544.0" y="20.0" width="200.0" height="98.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="558.0" y="48.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">products</text>
<text xml:space="preserve" x="558.0" y="72.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">grain: one product</text>
<text xml:space="preserve" x="558.0" y="94.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">key: product_code</text>
<line x1="544.0" y1="69.0" x2="480.0" y2="179.0" stroke="#8A6A1F" stroke-width="1.8"/>
<rect x="16.0" y="240.0" width="200.0" height="98.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="268.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Date</text>
<text xml:space="preserve" x="30.0" y="292.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">grain: one day</text>
<text xml:space="preserve" x="30.0" y="314.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">key: Date</text>
<line x1="216.0" y1="289.0" x2="280.0" y2="179.0" stroke="#8A6A1F" stroke-width="1.8"/>
<rect x="544.0" y="240.0" width="200.0" height="98.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="558.0" y="268.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">targets (fact)</text>
<text xml:space="preserve" x="558.0" y="292.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">grain: one store per month</text>
<text xml:space="preserve" x="558.0" y="314.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">key: store + month</text>
<line x1="544.0" y1="289.0" x2="480.0" y2="179.0" stroke="#8A6A1F" stroke-width="1.8"/>
</g></svg>
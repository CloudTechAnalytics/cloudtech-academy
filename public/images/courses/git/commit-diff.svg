<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="What a commit looks like on GitHub. You edit a file, GitHub asks you to commit the change with a message, and the commit goes into the history. Opening a commit shows exactly what changed: removed lines in red with a minus sign, added lines in green with a plus sign. Messages should start with a verb and say what changed.">
<title>Edit, commit with a message, and the history shows exactly what changed.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="16.0" width="224.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="42.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">1  Edit a file</text>
<text xml:space="preserve" x="30.0" y="62.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">click the pencil, change the</text>
<text xml:space="preserve" x="30.0" y="78.7" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">text</text>
<path d="M242.0,51.0 L266.0,51.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="268.0" y="16.0" width="224.0" height="70.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="282.0" y="42.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">2  Commit changes</text>
<text xml:space="preserve" x="282.0" y="62.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">write a message: your save point</text>
<path d="M494.0,51.0 L518.0,51.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="520.0" y="16.0" width="224.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="534.0" y="42.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">3  History</text>
<text xml:space="preserve" x="534.0" y="62.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">every commit, who, and when</text>
<rect x="16.0" y="108.0" width="728.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="132.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Commit: Fix date format in orders data</text>
<text xml:space="preserve" x="728.0" y="132.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="end">Ada · 2 hours ago</text>
<line x1="32.0" y1="144.0" x2="728.0" y2="144.0" stroke="#CFC4B2" stroke-width="1"/>
<text xml:space="preserve" x="42.0" y="170.0" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  </text>
<text xml:space="preserve" x="66.0" y="170.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">order_id,date,amount</text>
<rect x="32.0" y="178.0" width="696.0" height="22.0" rx="3" fill="#F6E3E0"/>
<text xml:space="preserve" x="42.0" y="194.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">-</text>
<text xml:space="preserve" x="66.0" y="194.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">1041,03/09/2026,12500</text>
<rect x="32.0" y="202.0" width="696.0" height="22.0" rx="3" fill="#E5F0E8"/>
<text xml:space="preserve" x="42.0" y="218.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">+</text>
<text xml:space="preserve" x="66.0" y="218.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">1041,2026-09-03,12500</text>
<text xml:space="preserve" x="42.0" y="242.0" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  </text>
<text xml:space="preserve" x="66.0" y="242.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">1042,2026-09-04,8000</text>
<text xml:space="preserve" x="16.0" y="290.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Removed lines are red (−). Added lines are green (+).</text>
<text xml:space="preserve" x="16.0" y="316.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Good message: start with a verb (Add, Fix, Update, Remove), say what changed, stay under about 60 characters.</text>
<rect x="16.0" y="332.0" width="728.0" height="52.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="32.0" y="354.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">Never commit passwords or API keys.</text>
<text xml:space="preserve" x="32.0" y="374.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Deleting the file isn't enough: it stays in the history. Change the key straight away.</text>
</g></svg>
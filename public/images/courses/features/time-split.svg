<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Two ways to split monthly snapshot tables. A random split mixes rows from every month into both training and test, so the model is tested on the same periods it learned from. A time-based split trains on earlier snapshots and tests on a later one, and leaves out recent snapshots whose 60-day labels are not complete yet.">

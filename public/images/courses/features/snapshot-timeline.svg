<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="A timeline with the snapshot date in the middle. Features look back from the snapshot: activity in the last 30 and 90 days, recency, failures. The target looks ahead: did the customer make no transaction in the 60 days after the snapshot? Nothing after the snapshot may be used in a feature.">
<title>Features look back from the snapshot; the target looks ahead over a fixed horizon.</title>

<rect width="760" height="300" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="30.0" y="118.0" width="440.0" height="44.0" rx="6" fill="#E6EEF6"/>
<rect x="470.0" y="118.0" width="260.0" height="44.0" rx="6" fill="#E5F0E8"/>
<line x1="470.0" y1="80.0" x2="470.0" y2="200.0" stroke="#2A2926" stroke-width="2.6"/>
<text xml:space="preserve" x="470.0" y="70.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">snapshot date</text>
<text xml:space="preserve" x="44.0" y="146.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start">◄ features: look back</text>
<text xml:space="preserve" x="716.0" y="146.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="end">target: look ahead ►</text>
<line x1="380.0" y1="162.0" x2="380.0" y2="174.0" stroke="#5E5A52" stroke-width="1.4"/>
<text xml:space="preserve" x="380.0" y="190.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">−30 days</text>
<line x1="200.0" y1="162.0" x2="200.0" y2="174.0" stroke="#5E5A52" stroke-width="1.4"/>
<text xml:space="preserve" x="200.0" y="190.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">−90 days</text>
<line x1="670.0" y1="162.0" x2="670.0" y2="174.0" stroke="#5E5A52" stroke-width="1.4"/>
<text xml:space="preserve" x="670.0" y="190.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">+60 days</text>
<text xml:space="preserve" x="30.0" y="226.0" font-size="13" fill="#2F5D8A" font-weight="400" text-anchor="start">Transactions and value in the last 30 and 90 days,</text>
<text xml:space="preserve" x="30.0" y="244.8" font-size="13" fill="#2F5D8A" font-weight="400" text-anchor="start">days since last transaction, failures, tenure.</text>
<text xml:space="preserve" x="482.0" y="226.0" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="start">Churned = 1 if no transaction</text>
<text xml:space="preserve" x="482.0" y="244.8" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="start">in the 60 days after the snapshot.</text>
<text xml:space="preserve" x="16.0" y="290.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">The rule: a feature may only use data from on or before the snapshot date.</text>
</g></svg>
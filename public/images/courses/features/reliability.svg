<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="An illustration of a reliability diagram. Customers are grouped by predicted probability; each point compares the average prediction with the actual churn rate in that group. A calibrated model's points lie on the diagonal. An overconfident model's points fall away from it: it says 40 percent where only 25 percent churn.">
<title>Reliability diagram: calibrated points sit on the diagonal.</title>

<rect width="760" height="470" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<line x1="90.0" y1="380.0" x2="410.0" y2="380.0" stroke="#CFC4B2" stroke-width="1.5"/>
<line x1="90.0" y1="380.0" x2="90.0" y2="60.0" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="82.0" y="384.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">0%</text>
<text xml:space="preserve" x="90.0" y="398.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">0%</text>
<text xml:space="preserve" x="82.0" y="277.3" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">20%</text>
<text xml:space="preserve" x="196.7" y="398.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">20%</text>
<text xml:space="preserve" x="82.0" y="170.7" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">40%</text>
<text xml:space="preserve" x="303.3" y="398.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">40%</text>
<text xml:space="preserve" x="82.0" y="64.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">60%</text>
<text xml:space="preserve" x="410.0" y="398.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">60%</text>
<text xml:space="preserve" x="250.0" y="420.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">average predicted probability</text>
<text xml:space="preserve" x="30.0" y="46.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">actual churn rate</text>
<path d="M90.0,380.0 L410.0,60.0" fill="none" stroke="#5E5A52" stroke-width="1.4" stroke-dasharray="5 4"/>
<path d="M106.0,364.0 L122.0,342.7 L143.3,332.0 L170.0,294.7 L207.3,268.0 L260.7,204.0 L346.0,129.3" fill="none" stroke="#2F6B3F" stroke-width="2"/>
<circle cx="106.0" cy="364.0" r="4.5" fill="#2F6B3F"/>
<circle cx="122.0" cy="342.7" r="4.5" fill="#2F6B3F"/>
<circle cx="143.3" cy="332.0" r="4.5" fill="#2F6B3F"/>
<circle cx="170.0" cy="294.7" r="4.5" fill="#2F6B3F"/>
<circle cx="207.3" cy="268.0" r="4.5" fill="#2F6B3F"/>
<circle cx="260.7" cy="204.0" r="4.5" fill="#2F6B3F"/>
<circle cx="346.0" cy="129.3" r="4.5" fill="#2F6B3F"/>
<path d="M116.7,364.0 L143.3,348.0 L180.7,326.7 L228.7,294.7 L292.7,257.3 L367.3,214.7" fill="none" stroke="#9B2C1F" stroke-width="2"/>
<circle cx="116.7" cy="364.0" r="4.5" fill="#9B2C1F"/>
<circle cx="143.3" cy="348.0" r="4.5" fill="#9B2C1F"/>
<circle cx="180.7" cy="326.7" r="4.5" fill="#9B2C1F"/>
<circle cx="228.7" cy="294.7" r="4.5" fill="#9B2C1F"/>
<circle cx="292.7" cy="257.3" r="4.5" fill="#9B2C1F"/>
<circle cx="367.3" cy="214.7" r="4.5" fill="#9B2C1F"/>
<text xml:space="preserve" x="350.7" y="101.3" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">perfect calibration</text>
<rect x="450.0" y="60.0" width="294.0" height="260.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<circle cx="470.0" cy="92.0" r="5" fill="#2F6B3F"/>
<text xml:space="preserve" x="484.0" y="97.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">Calibrated</text>
<text xml:space="preserve" x="470.0" y="122.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">When it says 20%, about 20% churn.</text>
<text xml:space="preserve" x="470.0" y="140.8" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Safe to use the probabilities in</text>
<text xml:space="preserve" x="470.0" y="159.7" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">money calculations.</text>
<circle cx="470.0" cy="212.0" r="5" fill="#9B2C1F"/>
<text xml:space="preserve" x="484.0" y="217.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">Overconfident</text>
<text xml:space="preserve" x="470.0" y="242.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">It says 40% where only about 25%</text>
<text xml:space="preserve" x="470.0" y="260.9" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">churn. The order can still be right</text>
<text xml:space="preserve" x="470.0" y="279.7" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">(good AUC), but the values aren't.</text>
<text xml:space="preserve" x="16.0" y="460.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">An illustration of the idea, not this course's model.</text>
</g></svg>
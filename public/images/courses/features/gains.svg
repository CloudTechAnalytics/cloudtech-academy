<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="An illustration of a gains curve. Customers are sorted by predicted churn probability, highest first. The curve shows the share of all churners found as you move down the list. A random list follows the diagonal: 10 percent of the list finds 10 percent of churners. A useful model's curve rises steeply at the start, so the top of the list holds many times more churners than a random selection: that ratio is the lift.">
<title>Gains curve: a good model finds most churners near the top of the list.</title>

<rect width="760" height="450" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<line x1="90.0" y1="360.0" x2="450.0" y2="360.0" stroke="#CFC4B2" stroke-width="1.5"/>
<line x1="90.0" y1="360.0" x2="90.0" y2="60.0" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="82.0" y="364.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">0%</text>
<text xml:space="preserve" x="90.0" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">0%</text>
<text xml:space="preserve" x="82.0" y="304.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">20%</text>
<text xml:space="preserve" x="162.0" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">20%</text>
<text xml:space="preserve" x="82.0" y="244.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">40%</text>
<text xml:space="preserve" x="234.0" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">40%</text>
<text xml:space="preserve" x="82.0" y="184.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">60%</text>
<text xml:space="preserve" x="306.0" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">60%</text>
<text xml:space="preserve" x="82.0" y="124.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">80%</text>
<text xml:space="preserve" x="378.0" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">80%</text>
<text xml:space="preserve" x="82.0" y="64.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">100%</text>
<text xml:space="preserve" x="450.0" y="378.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">100%</text>
<text xml:space="preserve" x="270.0" y="400.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">share of the list called, highest predicted risk first</text>
<text xml:space="preserve" x="30.0" y="46.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">share of all churners found</text>
<path d="M90.0,360 L450.0,60" fill="none" stroke="#5E5A52" stroke-width="1.4" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="349.2" y="174.0" font-size="12" fill="#5E5A52" font-weight="700" text-anchor="start">random list</text>
<path d="M90.0,360.0 L108.0,314.6 L126.0,274.1 L144.0,238.3 L162.0,206.9 L180.0,179.5 L198.0,155.8 L216.0,135.6 L234.0,118.5 L252.0,104.3 L270.0,92.6 L288.0,83.3 L306.0,76.0 L324.0,70.4 L342.0,66.4 L360.0,63.6 L378.0,61.7 L396.0,60.7 L414.0,60.2 L432.0,60.0 L450.0,60.0" fill="none" stroke="#B38A3E" stroke-width="2.8"/>
<text xml:space="preserve" x="198.0" y="114.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">model</text>
<line x1="126.0" y1="360.0" x2="126.0" y2="274.1" stroke="#2F5D8A" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="470.0" y="60.0" width="274.0" height="230.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="486.0" y="88.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Reading it</text>
<text xml:space="preserve" x="486.0" y="114.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Follow the blue line: calling the</text>
<text xml:space="preserve" x="486.0" y="132.8" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">top 10% of the list finds a much</text>
<text xml:space="preserve" x="486.0" y="151.7" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">larger share of all churners than</text>
<text xml:space="preserve" x="486.0" y="170.6" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">10%. That multiple is the lift.</text>
<text xml:space="preserve" x="486.0" y="214.0" font-size="13" fill="#8A6A1F" font-weight="400" text-anchor="start">Call down the list only while each</text>
<text xml:space="preserve" x="486.0" y="232.8" font-size="13" fill="#8A6A1F" font-weight="400" text-anchor="start">extra call is worth more than it</text>
<text xml:space="preserve" x="486.0" y="251.7" font-size="13" fill="#8A6A1F" font-weight="400" text-anchor="start">costs.</text>
<text xml:space="preserve" x="16.0" y="440.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">An illustration of the shape. The lesson measures the real curve for Paystream.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="A now, next, later roadmap with a capacity check, using illustrative numbers. The team has 40 person-weeks this quarter; keeping 20 percent free for support and the unexpected leaves 32. The Now column commits 27 person-weeks across three outcome-based items, which fits. Next holds shaped items that may change, and Later holds rough ideas. Items name the outcome and how it is measured. A Won't do list records why things were left out.">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Retention curves and a cohort table, with illustrative numbers. A curve that keeps falling towards zero means people try the product and leave. A curve that flattens, here around 35 percent, means a core of users has made it a habit. Below, a cohort grid shows the share active in each week after starting for four monthly cohorts; the most recent cohort has not yet reached later weeks, so only weeks every cohort has reached can be compared: right-censoring.">

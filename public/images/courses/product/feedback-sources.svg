<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="The same feedback themes counted by source, with illustrative shares. In the app store, crashes dominate at about half of reviews. In support tickets, slow support is the biggest theme. In the sales team's notes, missing USSD dominates at about 60 percent. A theme that dominates one source reflects that channel's audience, not all users, so weigh feedback against who your users are.">
<title>Count themes by source: each channel speaks for its own audience.</title>

<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Share of each source's feedback, by theme (illustration)</text>
<text xml:space="preserve" x="16.0" y="76.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">App store</text>
<rect x="150.0" y="58.0" width="289.2" height="34.0" rx="3" fill="#2F5D8A"/>
<text xml:space="preserve" x="294.6" y="80.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">52%</text>
<rect x="441.2" y="58.0" width="54.0" height="34.0" rx="3" fill="#B38A3E"/>
<text xml:space="preserve" x="468.2" y="80.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">10%</text>
<rect x="497.2" y="58.0" width="42.8" height="34.0" rx="3" fill="#2F6B3F"/>
<rect x="542.0" y="58.0" width="166.0" height="34.0" rx="3" fill="#5C4F80"/>
<text xml:space="preserve" x="625.0" y="80.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">30%</text>
<text xml:space="preserve" x="16.0" y="160.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Support tickets</text>
<rect x="150.0" y="142.0" width="98.8" height="34.0" rx="3" fill="#2F5D8A"/>
<text xml:space="preserve" x="199.4" y="164.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">18%</text>
<rect x="250.8" y="142.0" width="121.2" height="34.0" rx="3" fill="#B38A3E"/>
<text xml:space="preserve" x="311.4" y="164.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">22%</text>
<rect x="374.0" y="142.0" width="65.2" height="34.0" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="406.6" y="164.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">12%</text>
<rect x="441.2" y="142.0" width="266.8" height="34.0" rx="3" fill="#5C4F80"/>
<text xml:space="preserve" x="574.6" y="164.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">48%</text>
<text xml:space="preserve" x="16.0" y="244.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Sales team</text>
<rect x="150.0" y="226.0" width="26.0" height="34.0" rx="3" fill="#2F5D8A"/>
<rect x="178.0" y="226.0" width="82.0" height="34.0" rx="3" fill="#B38A3E"/>
<text xml:space="preserve" x="219.0" y="248.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">15%</text>
<rect x="262.0" y="226.0" width="334.0" height="34.0" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="429.0" y="248.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">60%</text>
<rect x="598.0" y="226.0" width="110.0" height="34.0" rx="3" fill="#5C4F80"/>
<text xml:space="preserve" x="653.0" y="248.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">20%</text>
<rect x="150.0" y="300.0" width="14.0" height="14.0" rx="3" fill="#2F5D8A"/>
<text xml:space="preserve" x="172.0" y="312.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Crashes</text>
<rect x="300.0" y="300.0" width="14.0" height="14.0" rx="3" fill="#B38A3E"/>
<text xml:space="preserve" x="322.0" y="312.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">High fees</text>
<rect x="450.0" y="300.0" width="14.0" height="14.0" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="472.0" y="312.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Missing USSD</text>
<rect x="600.0" y="300.0" width="14.0" height="14.0" rx="3" fill="#5C4F80"/>
<text xml:space="preserve" x="622.0" y="312.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Slow support</text>
<text xml:space="preserve" x="16.0" y="346.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Sales hears about USSD; the app store hears about crashes. Neither is "what all users think".</text>
<text xml:space="preserve" x="16.0" y="370.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Check who gives feedback against who your users are, and keep problems apart from requested solutions.</text>
<text xml:space="preserve" x="16.0" y="392.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Percentages are illustrative.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="An illustration of underfitting and overfitting. As a tree grows deeper, training error keeps falling towards zero. Test error falls at first, reaches a minimum, then rises again as the model starts memorising noise. The gap between the two lines is the sign of overfitting.">
<title>Training error keeps falling; test error falls, then rises: the gap is overfitting.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">

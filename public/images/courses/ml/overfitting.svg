<text xml:space="preserve" x="411.2" y="44.0" font-size="12" fill="#5E5A52" font-weight="700" text-anchor="middle">best test error</text>
<text xml:space="preserve" x="716.0" y="294.7" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="end">training error</text>
<text xml:space="preserve" x="716.0" y="132.9" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="end">test error</text>
<text xml:space="preserve" x="148.0" y="60.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="middle">← underfitting</text>
<text xml:space="preserve" x="629.0" y="60.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="middle">overfitting →</text>
<path d="M655.0,301.0 L655.0,166.6" fill="none" stroke="#8A6A1F" stroke-width="1.6" marker-end="url(#a8A6A1F)"/>

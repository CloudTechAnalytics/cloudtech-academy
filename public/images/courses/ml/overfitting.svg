<line x1="70.0" y1="50.0" x2="70.0" y2="320.0" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="60.0" y="185.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="end">error</text>
<text xml:space="preserve" x="395.0" y="344.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">model complexity (for a tree: max_depth) →</text>

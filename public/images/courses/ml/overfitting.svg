<path d="M70.0,28.4 L86.2,47.1 L102.5,64.3 L118.8,80.2 L135.0,94.9 L151.2,108.5 L167.5,121.0 L183.8,132.6 L200.0,143.3 L216.2,153.1 L232.5,162.2 L248.8,170.6 L265.0,178.4 L281.2,185.5 L297.5,192.1 L313.8,198.2 L330.0,203.1 L346.2,206.7 L362.5,209.3 L378.8,211.1 L395.0,212.2 L411.2,212.7 L427.5,212.6 L443.7,211.9 L460.0,210.7 L476.2,209.0 L492.5,207.0 L508.8,204.4 L525.0,201.5 L541.2,198.3 L557.5,194.7 L573.8,190.7 L590.0,186.5 L606.2,181.9 L622.5,177.1 L638.8,172.0 L655.0,166.6 L671.2,161.0 L687.5,155.2 L703.8,149.1 L720.0,142.9" fill="none" stroke="#9B2C1F" stroke-width="2.6"/>

<text xml:space="preserve" x="16.0" y="366.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Lower the threshold to catch more defaults, at the cost of turning away more good borrowers (lesson 8).</text>
</g></svg>
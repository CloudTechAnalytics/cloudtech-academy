<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="The logistic curve. Logistic regression adds up the features into a score, then squashes it into a probability between 0 and 1 with an S-shaped curve. A threshold, here 0.5, turns the probability into a decision: above it, flag the loan as likely to default; below it, approve.">
<title>Logistic regression turns a score into a probability; a threshold turns it into a decision.</title>

<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<line x1="80.0" y1="320.0" x2="720.0" y2="320.0" stroke="#CFC4B2" stroke-width="1.5"/>
<line x1="80.0" y1="50.0" x2="80.0" y2="320.0" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="72.0" y="324.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="end">0</text>
<text xml:space="preserve" x="72.0" y="189.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="end">0.5</text>
<text xml:space="preserve" x="72.0" y="54.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="end">1</text>
<text xml:space="preserve" x="40.0" y="36.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">probability of default</text>
<text xml:space="preserve" x="400.0" y="346.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">risk score from the features (low → high)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Five-fold cross-validation. The training data is split into five folds. In each of five rounds, the model is trained on four folds and scored on the remaining one, so each fold is used once for scoring. The five scores are averaged. The test set stays aside throughout.">

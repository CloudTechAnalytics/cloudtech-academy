<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="One idea feeding several platforms in each one's style: an Instagram caption, a 20-second reel script, a short WhatsApp status, and a LinkedIn post about what you learned. Reels and TikTok are won in the first two seconds, so start with the result or problem, not your logo.">
<title>One idea, four formats.</title>

<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="284.0" y="138.0" width="192.0" height="82.0" rx="14" fill="#8A6A1F" stroke="#8A6A1F" stroke-width="1"/>
<text xml:space="preserve" x="380.0" y="172.0" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">One idea</text>
<text xml:space="preserve" x="380.0" y="196.0" font-size="11" fill="#F3EBD8" font-weight="400" text-anchor="middle">"Cover your plants in the dry season"</text>
<rect x="16.0" y="20.0" width="200.0" height="90.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="48.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Instagram caption</text>
<text xml:space="preserve" x="28.0" y="70.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Hook, one idea, action, 3–5</text>
<text xml:space="preserve" x="28.0" y="85.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">hashtags</text>
<line x1="216.0" y1="65.0" x2="284.0" y2="179.0" stroke="#CFC4B2" stroke-width="1.6"/>
<rect x="544.0" y="20.0" width="200.0" height="90.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="556.0" y="48.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Reel or TikTok</text>
<text xml:space="preserve" x="556.0" y="70.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Start with the result or</text>
<text xml:space="preserve" x="556.0" y="85.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">problem, not the logo</text>
<line x1="544.0" y1="65.0" x2="476.0" y2="179.0" stroke="#CFC4B2" stroke-width="1.6"/>
<rect x="16.0" y="258.0" width="200.0" height="90.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="286.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">WhatsApp status</text>
<text xml:space="preserve" x="28.0" y="308.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Short and personal, under 20</text>
<text xml:space="preserve" x="28.0" y="323.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">words</text>
<line x1="216.0" y1="303.0" x2="284.0" y2="179.0" stroke="#CFC4B2" stroke-width="1.6"/>
<rect x="544.0" y="258.0" width="200.0" height="90.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<text xml:space="preserve" x="556.0" y="286.0" font-size="13.5" fill="#5C4F80" font-weight="700" text-anchor="start">LinkedIn post</text>
<text xml:space="preserve" x="556.0" y="308.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">What running the business</text>
<text xml:space="preserve" x="556.0" y="323.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">has taught you</text>
<line x1="544.0" y1="303.0" x2="476.0" y2="179.0" stroke="#CFC4B2" stroke-width="1.6"/>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Canvas sizes and export formats. A square post is 1080 by 1080 pixels; a story, reel cover or WhatsApp status is 1080 by 1920 pixels, tall; a printed flyer is A4 or A5. Export PNG for posts and text, JPG for photo-heavy images where file size matters, and PDF Print for flyers you will print.">
<title>Pick the size first; export in the right format.</title>

<rect width="760" height="340" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Choose the size before you design</text>
<rect x="30.0" y="50.0" width="110.0" height="110.0" rx="6" fill="#F3EBD8"/>
<rect x="30.0" y="50.0" width="110.0" height="110.0" rx="10" fill="none" stroke="#8A6A1F" stroke-width="1.6"/>
<text xml:space="preserve" x="85.0" y="112.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="middle">1080 × 1080</text>
<text xml:space="preserve" x="85.0" y="182.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">Square post</text>
<text xml:space="preserve" x="85.0" y="198.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">Instagram, Facebook</text>
<rect x="180.0" y="40.0" width="70.0" height="124.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.6"/>
<text xml:space="preserve" x="215.0" y="106.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="middle">1080</text>
<text xml:space="preserve" x="215.0" y="120.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="middle">× 1920</text>
<text xml:space="preserve" x="215.0" y="182.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">Story / Reel</text>
<text xml:space="preserve" x="215.0" y="198.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">Status, cover</text>
<rect x="300.0" y="44.0" width="88.0" height="124.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.6"/>
<text xml:space="preserve" x="344.0" y="110.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="middle">A4 / A5</text>
<text xml:space="preserve" x="344.0" y="182.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">Printed flyer</text>
<text xml:space="preserve" x="344.0" y="198.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">Posters, handouts</text>
<text xml:space="preserve" x="440.0" y="66.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Export</text>
<rect x="440.0" y="78.0" width="304.0" height="42.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.4"/>
<text xml:space="preserve" x="454.0" y="104.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">PNG</text>
<text xml:space="preserve" x="534.0" y="104.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Posts and text. Sharpest.</text>
<rect x="440.0" y="128.0" width="304.0" height="42.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="454.0" y="154.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">JPG</text>
<text xml:space="preserve" x="534.0" y="154.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Photo-heavy images; smaller files.</text>
<rect x="440.0" y="178.0" width="304.0" height="42.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.4"/>
<text xml:space="preserve" x="454.0" y="204.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">PDF Print</text>
<text xml:space="preserve" x="534.0" y="204.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Flyers you'll print.</text>
<rect x="16.0" y="244.0" width="728.0" height="70.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="270.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Share a link</text>
<text xml:space="preserve" x="30.0" y="292.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Share → Copy link gives a view link anyone can open. Good for feedback.</text>
</g></svg>
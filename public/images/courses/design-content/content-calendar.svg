<text xml:space="preserve" x="526.0" y="312.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Permission for customers' photos</text>
<text xml:space="preserve" x="526.0" y="328.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">and reviews.</text>
<text xml:space="preserve" x="16.0" y="392.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Keep the final plan where you'll see it: a sheet, notebook or phone calendar.</text>

<text xml:space="preserve" x="278.0" y="312.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Promotions, holidays, paydays.</text>
<rect x="512.0" y="264.0" width="232.0" height="100.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>

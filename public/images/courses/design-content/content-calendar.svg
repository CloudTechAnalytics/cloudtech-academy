<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="A two-week content plan: three posts a week in the three themes, each with a format. After the AI drafts it, edit like the owner: remove what you cannot make, add real dates such as promotions and paydays, and check you have permission to post customers' photos and reviews.">

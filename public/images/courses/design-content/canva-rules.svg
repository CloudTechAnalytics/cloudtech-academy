<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Four design rules shown on a tutoring flyer. Before: a busy photo with thin text on top, five fonts, text mixed left, centre and right, and a logo as big as the headline. After: a plain panel behind the text for contrast, everything aligned left, a margin and empty space, two fonts, and the headline biggest.">
<title>Contrast, alignment, space, few fonts.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>

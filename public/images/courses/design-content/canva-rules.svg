<rect x="272.0" y="20.0" width="230.0" height="296.0" rx="10" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="1.6"/>
<rect x="282.0" y="30.0" width="210.0" height="96.0" rx="4" fill="#C8BBA6"/>

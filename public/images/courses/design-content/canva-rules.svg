<text xml:space="preserve" x="298.0" y="160.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">Pass maths in</text>
<text xml:space="preserve" x="298.0" y="182.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="start">one term</text>

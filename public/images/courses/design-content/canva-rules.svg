<rect x="530.0" y="112.0" width="5.0" height="40.0" rx="2" fill="#2F6B3F"/>
<text xml:space="preserve" x="546.0" y="128.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">Alignment</text>
<text xml:space="preserve" x="546.0" y="146.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Everything left-aligned</text>
<rect x="530.0" y="162.0" width="5.0" height="40.0" rx="2" fill="#8A6A1F"/>
<text xml:space="preserve" x="546.0" y="178.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Space</text>
<text xml:space="preserve" x="546.0" y="196.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Few words; a margin all round</text>
<rect x="530.0" y="212.0" width="5.0" height="40.0" rx="2" fill="#5C4F80"/>

<text xml:space="preserve" x="40.0" y="190.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">Small groups, experienced teacher, past questions,</text>
<text xml:space="preserve" x="62.0" y="206.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">WAEC and JAMB, free first class</text>
<text xml:space="preserve" x="30.0" y="226.0" font-size="11" fill="#9B2C1F" font-weight="700" text-anchor="start" font-style="italic">CALL 0803 555 0100 NOW</text>
<text xml:space="preserve" x="150.0" y="252.0" font-size="9.5" fill="#5E5A52" font-weight="400" text-anchor="start">Ikeja, Lagos</text>
<text xml:space="preserve" x="24.0" y="290.0" font-size="11.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Hard to read. Nothing stands out.</text>

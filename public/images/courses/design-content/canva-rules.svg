<text xml:space="preserve" x="546.0" y="246.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">One bold, one plain</text>
<rect x="530.0" y="262.0" width="5.0" height="40.0" rx="2" fill="#9B2C1F"/>
<text xml:space="preserve" x="546.0" y="278.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">First look</text>
<text xml:space="preserve" x="546.0" y="296.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">The headline is biggest</text>
<text xml:space="preserve" x="16.0" y="350.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Same information, far fewer words, readable in three seconds.</text>
<text xml:space="preserve" x="16.0" y="374.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Check it small: zoom out to phone-feed size. Can you read the headline?</text>
</g></svg>
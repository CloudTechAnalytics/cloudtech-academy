<text xml:space="preserve" x="60.0" y="124.0" font-size="10" fill="#F7F1E3" font-weight="700" text-anchor="start">Sat 9am Ikeja</text>
<text xml:space="preserve" x="170.0" y="146.0" font-size="14" fill="#F7F1E3" font-weight="400" text-anchor="start" font-style="italic">₦6,000</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="What a good caption has: a hook in the first line, one idea, a clear call to action with how to act, and three to five specific hashtags. A generic caption full of buzzwords and fifteen hashtags is compared with one written in the brand's own voice, using a bakery example.">
<title>Hook, one idea, call to action, a few specific hashtags.</title>

<rect width="760" height="420" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="14.0" width="360.0" height="360.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.6"/>
<rect x="30.0" y="30.0" width="332.0" height="112.0" rx="8" fill="#EFE4CC"/>
<text xml:space="preserve" x="196.0" y="92.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">photo of the product</text>
<rect x="30.0" y="156.0" width="332.0" height="36.0" rx="6" fill="#E5F0E8"/>
<text xml:space="preserve" x="40.0" y="179.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Warm bread by 6am. Gone by 9.</text>
<rect x="30.0" y="200.0" width="332.0" height="36.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="40.0" y="223.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Our sourdough rests 18 hours for that crust.</text>
<rect x="30.0" y="244.0" width="332.0" height="36.0" rx="6" fill="#E6EEF6"/>
<text xml:space="preserve" x="40.0" y="267.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">Pre-order for Saturday: link in bio.</text>
<rect x="30.0" y="288.0" width="332.0" height="34.0" rx="6" fill="#EEEAF5"/>
<text xml:space="preserve" x="40.0" y="310.0" font-size="11.5" fill="#5C4F80" font-weight="400" text-anchor="start">#sourdough #ibadanbakery #freshbread</text>
<text xml:space="preserve" x="30.0" y="350.0" font-size="11" fill="#9B2C1F" font-weight="400" text-anchor="start">Generic: "Elevate your taste! ✨ #food #love #yum #best…"</text>
<line x1="376.0" y1="174.0" x2="400.0" y2="174.0" stroke="#2F6B3F" stroke-width="1.5"/>
<circle cx="414.0" cy="174.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="414.0" y="178.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="434.0" y="179.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">Hook</text>
<text xml:space="preserve" x="434.0" y="196.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">The first line is all people see before "more".</text>
<line x1="376.0" y1="218.0" x2="400.0" y2="218.0" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="414.0" cy="218.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="414.0" y="222.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="434.0" y="223.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">One idea</text>
<text xml:space="preserve" x="434.0" y="240.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Not five.</text>
<line x1="376.0" y1="262.0" x2="400.0" y2="262.0" stroke="#2F5D8A" stroke-width="1.5"/>
<circle cx="414.0" cy="262.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="414.0" y="266.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="434.0" y="267.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start">Call to action</text>
<text xml:space="preserve" x="434.0" y="284.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Book, reply, save, share, visit: and how.</text>
<line x1="376.0" y1="305.0" x2="400.0" y2="305.0" stroke="#5C4F80" stroke-width="1.5"/>
<circle cx="414.0" cy="305.0" r="12" fill="#5C4F80"/>
<text xml:space="preserve" x="414.0" y="309.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="434.0" y="310.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="start">3–5 hashtags</text>
<text xml:space="preserve" x="434.0" y="327.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Ones your customers really search.</text>
<rect x="400.0" y="346.0" width="344.0" height="56.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="414.0" y="368.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Before you post</text>
<text xml:space="preserve" x="414.0" y="388.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Read it. Check every price and promise.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="The CapCut workflow: plan the message and shot list, create a project and set the aspect ratio, cut to the point by trimming, splitting and reordering, add text and corrected captions, add licensed sound, then export at 1080p and 30 fps after watching it twice, once with sound and once muted.">
<title>Plan, set up, cut, caption, sound, export.</title>

<rect width="760" height="420" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Six steps from idea to export</text>
<rect x="16.0" y="42.0" width="232.0" height="108.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<circle cx="40.0" cy="70.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="40.0" y="74.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="62.0" y="75.0" font-size="14.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Plan</text>
<text xml:space="preserve" x="30.0" y="104.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">One-sentence message and a shot</text>
<text xml:space="preserve" x="30.0" y="120.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">list</text>
<rect x="264.0" y="42.0" width="232.0" height="108.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<circle cx="288.0" cy="70.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="288.0" y="74.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="310.0" y="75.0" font-size="14.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Set up</text>
<text xml:space="preserve" x="278.0" y="104.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">New project, add clips, choose</text>
<text xml:space="preserve" x="278.0" y="120.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">9:16 or 16:9</text>
<rect x="512.0" y="42.0" width="232.0" height="108.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<circle cx="536.0" cy="70.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="536.0" y="74.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="558.0" y="75.0" font-size="14.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Cut</text>
<text xml:space="preserve" x="526.0" y="104.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Trim, split, reorder. Be</text>
<text xml:space="preserve" x="526.0" y="120.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">ruthless.</text>
<rect x="16.0" y="160.0" width="232.0" height="108.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<circle cx="40.0" cy="188.0" r="12" fill="#5C4F80"/>
<text xml:space="preserve" x="40.0" y="192.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="62.0" y="193.0" font-size="14.5" fill="#5C4F80" font-weight="700" text-anchor="start">Words</text>
<text xml:space="preserve" x="30.0" y="222.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Headline text; auto-captions,</text>
<text xml:space="preserve" x="30.0" y="238.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">then fix them</text>
<rect x="264.0" y="160.0" width="232.0" height="108.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<circle cx="288.0" cy="188.0" r="12" fill="#9B2C1F"/>
<text xml:space="preserve" x="288.0" y="192.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text xml:space="preserve" x="310.0" y="193.0" font-size="14.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Sound</text>
<text xml:space="preserve" x="278.0" y="222.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Licensed music; lower it under</text>
<text xml:space="preserve" x="278.0" y="238.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">speech</text>
<rect x="512.0" y="160.0" width="232.0" height="108.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="536.0" cy="188.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="536.0" y="192.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text xml:space="preserve" x="558.0" y="193.0" font-size="14.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Export</text>
<text xml:space="preserve" x="526.0" y="222.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">1080p, 30 fps, after two checks</text>
<text xml:space="preserve" x="16.0" y="296.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Two checks before you export</text>
<rect x="16.0" y="310.0" width="358.0" height="56.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="334.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">Watch it with the sound on</text>
<text xml:space="preserve" x="30.0" y="354.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Does the voice come through clearly?</text>
<rect x="386.0" y="310.0" width="358.0" height="56.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.4"/>
<text xml:space="preserve" x="400.0" y="334.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start">Watch it muted</text>
<text xml:space="preserve" x="400.0" y="354.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Does it still make sense from the text alone?</text>
<text xml:space="preserve" x="16.0" y="396.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Popular songs are usually copyrighted. Use music licensed for commercial use.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Three content themes keep posting focused: show the work, help the customer and build trust. Only one of the three is selling; bookings come from trust. The example is a phone repair shop in Kano.">
<title>Three themes, and only one of them is selling.</title>

<rect width="760" height="360" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Choose three themes your audience would follow you for</text>
<rect x="16.0" y="42.0" width="232.0" height="208.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="70.0" font-size="15" fill="#2F5D8A" font-weight="700" text-anchor="start">Show the work</text>
<text xml:space="preserve" x="30.0" y="94.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Before and after, new jobs,</text>
<text xml:space="preserve" x="30.0" y="110.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">results</text>
<line x1="30.0" y1="140.0" x2="234.0" y2="140.0" stroke="#2F5D8A" stroke-width="1"/>
<text xml:space="preserve" x="30.0" y="162.0" font-size="11.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Example post</text>
<text xml:space="preserve" x="30.0" y="182.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Cracked screen replaced in 30</text>
<text xml:space="preserve" x="30.0" y="198.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">minutes</text>
<rect x="30.0" y="214.0" width="116.6" height="24.0" rx="6" fill="#2F5D8A"/>
<text xml:space="preserve" x="40.0" y="230.1" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Selling, gently</text>
<rect x="264.0" y="42.0" width="232.0" height="208.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="278.0" y="70.0" font-size="15" fill="#2F6B3F" font-weight="700" text-anchor="start">Help the customer</text>
<text xml:space="preserve" x="278.0" y="94.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Tips, how-tos, what to ask</text>
<line x1="278.0" y1="140.0" x2="482.0" y2="140.0" stroke="#2F6B3F" stroke-width="1"/>
<text xml:space="preserve" x="278.0" y="162.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Example post</text>
<text xml:space="preserve" x="278.0" y="182.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">5 habits that make a battery</text>
<text xml:space="preserve" x="278.0" y="198.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">last longer</text>
<rect x="278.0" y="214.0" width="58.6" height="24.0" rx="6" fill="#2F6B3F"/>
<text xml:space="preserve" x="288.0" y="230.1" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Useful</text>
<rect x="512.0" y="42.0" width="232.0" height="208.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.6"/>
<text xml:space="preserve" x="526.0" y="70.0" font-size="15" fill="#5C4F80" font-weight="700" text-anchor="start">Build trust</text>
<text xml:space="preserve" x="526.0" y="94.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Reviews, the team, behind the</text>
<text xml:space="preserve" x="526.0" y="110.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">scenes</text>
<line x1="526.0" y1="140.0" x2="730.0" y2="140.0" stroke="#5C4F80" stroke-width="1"/>
<text xml:space="preserve" x="526.0" y="162.0" font-size="11.5" fill="#5C4F80" font-weight="700" text-anchor="start">Example post</text>
<text xml:space="preserve" x="526.0" y="182.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Meet Musa, who fixes your phone</text>
<rect x="526.0" y="214.0" width="52.2" height="24.0" rx="6" fill="#5C4F80"/>
<text xml:space="preserve" x="536.0" y="230.1" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="start">Trust</text>
<text xml:space="preserve" x="16.0" y="282.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">People follow accounts that are useful or interesting. Bookings come from trust.</text>
<text xml:space="preserve" x="16.0" y="306.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Stuck? Ask an AI, but give it your real business and your real customers.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="A 15-second vertical video shot list as a timeline: result first in the opening seconds, then how it is made, then proof, then the action. The example is a 15-second video for a barbershop. Most people decide within two seconds whether to keep watching.">
<title>Result first, then how, then proof, then the action.</title>

<rect width="760" height="340" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">One sentence for the message, then a shot list (invented example: a barbershop)</text>
<rect x="16.0" y="40.0" width="728.0" height="34.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.2"/>
<text xml:space="preserve" x="30.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Message: A fresh fade for ₦2,500, walk-ins welcome in Garki.</text>
<rect x="16.0" y="108.0" width="93.1" height="40.0" rx="6" fill="#9B2C1F"/>
<text xml:space="preserve" x="62.5" y="133.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Result</text>
<rect x="113.1" y="108.0" width="238.7" height="40.0" rx="6" fill="#2F5D8A"/>
<text xml:space="preserve" x="232.4" y="133.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">How</text>
<rect x="355.7" y="108.0" width="238.7" height="40.0" rx="6" fill="#2F6B3F"/>
<text xml:space="preserve" x="475.1" y="133.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Proof</text>
<rect x="598.4" y="108.0" width="141.6" height="40.0" rx="6" fill="#8A6A1F"/>
<text xml:space="preserve" x="669.2" y="133.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Action</text>
<rect x="16.0" y="168.0" width="170.0" height="92.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="28.0" y="192.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">0–2s</text>
<text xml:space="preserve" x="28.0" y="212.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Result</text>
<text xml:space="preserve" x="28.0" y="232.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Finished fade, text:</text>
<text xml:space="preserve" x="28.0" y="246.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">"Fade ₦2,500"</text>
<rect x="202.0" y="168.0" width="170.0" height="92.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.4"/>
<text xml:space="preserve" x="214.0" y="192.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start">2–7s</text>
<text xml:space="preserve" x="214.0" y="212.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">How</text>
<text xml:space="preserve" x="214.0" y="232.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Clippers, close-up of</text>
<text xml:space="preserve" x="214.0" y="246.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">the line-up</text>
<rect x="388.0" y="168.0" width="170.0" height="92.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="400.0" y="192.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">7–12s</text>
<text xml:space="preserve" x="400.0" y="212.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Proof</text>
<text xml:space="preserve" x="400.0" y="232.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Happy customer checks</text>
<text xml:space="preserve" x="400.0" y="246.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">the mirror</text>
<rect x="574.0" y="168.0" width="170.0" height="92.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.4"/>
<text xml:space="preserve" x="586.0" y="192.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">12–15s</text>
<text xml:space="preserve" x="586.0" y="212.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Action</text>
<text xml:space="preserve" x="586.0" y="232.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Address and WhatsApp</text>
<text xml:space="preserve" x="586.0" y="246.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">number</text>
<text xml:space="preserve" x="16.0" y="98.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">0s</text>
<text xml:space="preserve" x="258.7" y="98.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">5s</text>
<text xml:space="preserve" x="501.3" y="98.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">10s</text>
<text xml:space="preserve" x="744.0" y="98.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">15s</text>
<text xml:space="preserve" x="16.0" y="300.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">A logo or "Hi guys" first loses people. Start with the result.</text>
<text xml:space="preserve" x="16.0" y="324.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Cut anything that doesn't help the one message. Tight 15 seconds beats loose 45.</text>
</g></svg>
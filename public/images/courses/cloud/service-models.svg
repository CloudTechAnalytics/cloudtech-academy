<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="Who manages what under each service model. Seven layers run from the buildings at the bottom to your data and users at the top. On your own servers, you manage all seven. With IaaS, the provider manages the physical servers and below; you manage the operating system upwards. With PaaS, the provider also manages the operating system and runtime; you manage the application and data. With SaaS, you manage only your data and users. In every model, your data, access and settings stay your responsibility.">
<title>Service models: the provider takes on more layers as you move from IaaS to SaaS.</title>


<rect x="594.0" y="74.0" width="14.0" height="14.0" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="616.0" y="86.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Committed use</text>
<text xml:space="preserve" x="594.0" y="108.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">steady baseline;</text>
<text xml:space="preserve" x="594.0" y="125.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">~30–40% off</text>
<rect x="594.0" y="144.0" width="14.0" height="14.0" rx="3" fill="#2F5D8A"/>
<text xml:space="preserve" x="616.0" y="156.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">On-demand</text>
<text xml:space="preserve" x="594.0" y="178.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">peaks; no commitment</text>
<rect x="594.0" y="214.0" width="14.0" height="14.0" rx="3" fill="#B38A3E"/>
<text xml:space="preserve" x="616.0" y="226.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Spot</text>
<text xml:space="preserve" x="594.0" y="248.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">batch jobs that can be</text>
<text xml:space="preserve" x="594.0" y="265.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">retried; ~60–70% off</text>
<text xml:space="preserve" x="16.0" y="356.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Commit only to what runs every hour of the year, after rightsizing and clean-up. Discounts are illustrative.</text>

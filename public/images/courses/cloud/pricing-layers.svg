<text xml:space="preserve" x="315.0" y="268.3" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">baseline: always running</text>
<text xml:space="preserve" x="335.4" y="175.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle">daytime rise</text>

<text x="648" y="318.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1F1F1F" text-anchor="start" xml:space="preserve">Customer ID</text>
<text x="648" y="344.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1F1F1F" text-anchor="start" xml:space="preserve">Order date</text>
<path d="M600,157.0 L700,157.0 L700,230" fill="none" stroke="#1F1F1F" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M608,165.0 L608,149.0" fill="none" stroke="#1F1F1F" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M614,165.0 L614,149.0" fill="none" stroke="#1F1F1F" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M709,230 L700,214 L691,230" fill="none" stroke="#1F1F1F" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M700,230 L700,214" fill="none" stroke="#1F1F1F" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M708,208 L692,208" fill="none" stroke="#1F1F1F" stroke-width="1.8" stroke-linejoin="round"/>
<text x="435" y="400" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B665C" text-anchor="start" xml:space="preserve">Attributes and keys, but not tied</text>
<text x="435" y="422" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B665C" text-anchor="start" xml:space="preserve">to any database product.</text>
<rect x="820" y="110" width="335" height="200" rx="10" fill="#1E1E1E" stroke="#1E1E1E" stroke-width="1.5"/>
<text x="836" y="140" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" xml:space="preserve">CREATE TABLE orders (</text>
<text x="836" y="164" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" xml:space="preserve">  order_id    INT PRIMARY KEY,</text>
<text x="836" y="188" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" xml:space="preserve">  customer_id INT NOT NULL</text>
<text x="836" y="212" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" xml:space="preserve">    REFERENCES customers(customer_id),</text>
<text x="836" y="236" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" xml:space="preserve">  order_date  DATE NOT NULL,</text>
<text x="836" y="260" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" xml:space="preserve">  quantity    INT CHECK (quantity &gt; 0)</text>
<text x="836" y="284" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#F2EEE6" text-anchor="start" xml:space="preserve">);</text>
<text x="820" y="400" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B665C" text-anchor="start" xml:space="preserve">Exact names, data types and</text>
<text x="820" y="422" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B665C" text-anchor="start" xml:space="preserve">rules for one database (SQL Server…)</text>
</svg>

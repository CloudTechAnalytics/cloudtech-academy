<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-label="Three levels of a data model: conceptual (things and how they relate), logical (attributes and keys), physical (tables, data types and constraints in a real database).">
<title>Three levels of a data model: conceptual (things and how they relate), logical (attributes and keys), physical (tables, data types and constraints in a real database).</title>
<rect width="1180" height="470" fill="#FBF8F2"/>
<rect x="30" y="20" width="360" height="430" rx="14" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1.5"/>
<text x="50" y="56" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#1F1F1F" text-anchor="start" xml:space="preserve">Conceptual</text>
<text x="50" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B665C" text-anchor="start" xml:space="preserve">What the business talks about</text>
<rect x="415" y="20" width="360" height="430" rx="14" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1.5"/>
<text x="435" y="56" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#1F1F1F" text-anchor="start" xml:space="preserve">Logical</text>
<text x="435" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B665C" text-anchor="start" xml:space="preserve">Attributes, keys and relationships</text>
<rect x="800" y="20" width="360" height="430" rx="14" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1.5"/>
<text x="820" y="56" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#1F1F1F" text-anchor="start" xml:space="preserve">Physical</text>
<text x="820" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B665C" text-anchor="start" xml:space="preserve">Tables in a specific database</text>
<rect x="50" y="162" width="140" height="56" rx="28" fill="#F3E9D2" stroke="#B38A3E" stroke-width="1.8"/>
<text x="120" y="196" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="middle" xml:space="preserve">Customer</text>

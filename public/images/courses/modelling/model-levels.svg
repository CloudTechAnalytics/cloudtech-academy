<text xml:space="preserve" x="578.0" y="507.7" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">rules for one</text>
<text xml:space="preserve" x="578.0" y="526.5" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">database (SQL</text>
<text xml:space="preserve" x="578.0" y="545.4" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">Server, MySQL,</text>
<text xml:space="preserve" x="578.0" y="564.2" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">PostgreSQL…)</text>

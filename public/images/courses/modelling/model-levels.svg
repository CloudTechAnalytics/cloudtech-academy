<text x="498" y="214.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1F1F1F" text-anchor="start" xml:space="preserve">Region</text>
<rect x="590" y="230" width="160" height="126" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M590,240 a10,10 0 0 1 10,-10 h140 a10,10 0 0 1 10,10 v28 h-160 z" fill="#2B2A28"/>
<text x="604" y="255" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve">Order</text>
<rect x="600" y="278.0" width="18" height="18" rx="4" fill="#B38A3E"/>
<text x="609.0" y="291.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" xml:space="preserve">PK</text>
<text x="648" y="292.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1F1F1F" text-anchor="start" xml:space="preserve">Order ID</text>

<text xml:space="preserve" x="62.0" y="439.0" font-size="16" fill="#2A2926" font-weight="700" text-anchor="start">Physical</text>
<text xml:space="preserve" x="152.0" y="439.0" font-size="13.5" fill="#5E5A52" font-weight="400" text-anchor="start">Tables in a specific database</text>
<rect x="40.0" y="448.0" width="520.0" height="169.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="472.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">CREATE TABLE orders (</text>
<text xml:space="preserve" x="52.0" y="493.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  order_id    INT PRIMARY KEY,</text>
<text xml:space="preserve" x="52.0" y="514.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  customer_id INT NOT NULL</text>
<text xml:space="preserve" x="52.0" y="535.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">              REFERENCES customers(customer_id),</text>
<text xml:space="preserve" x="52.0" y="556.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  order_date  DATE NOT NULL,</text>
<text xml:space="preserve" x="52.0" y="577.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  quantity    INT CHECK (quantity &gt; 0)</text>
<text xml:space="preserve" x="52.0" y="598.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">);</text>
<text xml:space="preserve" x="578.0" y="470.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">Exact names,</text>

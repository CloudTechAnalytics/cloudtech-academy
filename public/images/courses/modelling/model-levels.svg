<text x="300" y="196" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="middle" xml:space="preserve">Order</text>
<path d="M190,190 L230,190" fill="none" stroke="#1F1F1F" stroke-width="1.8" stroke-linejoin="round"/>
<text x="210" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B665C" text-anchor="middle" xml:space="preserve" font-style="italic">places</text>
<rect x="80" y="280" width="140" height="56" rx="28" fill="#F3E9D2" stroke="#B38A3E" stroke-width="1.8"/>
<text x="150" y="314" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="middle" xml:space="preserve">Product</text>
<path d="M300,218 L300,308 L220,308" fill="none" stroke="#1F1F1F" stroke-width="1.8" stroke-linejoin="round"/>
<text x="306" y="270" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B665C" text-anchor="start" xml:space="preserve" font-style="italic">contains</text>
<text x="50" y="400" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B665C" text-anchor="start" xml:space="preserve">No columns, no data types.</text>
<text x="50" y="422" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B665C" text-anchor="start" xml:space="preserve">Agreed with managers.</text>
<rect x="440" y="100" width="160" height="126" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M440,110 a10,10 0 0 1 10,-10 h140 a10,10 0 0 1 10,10 v28 h-160 z" fill="#2B2A28"/>
<text x="454" y="125" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve">Customer</text>

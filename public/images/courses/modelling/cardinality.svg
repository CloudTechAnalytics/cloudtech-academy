<text xml:space="preserve" x="560.0" y="86.8" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">one ID card; each card</text>
<text xml:space="preserve" x="560.0" y="105.7" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">belongs to one employee.</text>

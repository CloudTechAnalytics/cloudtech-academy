<text xml:space="preserve" x="16.0" y="528.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">A student takes many courses and a course has many students. The</text>
<text xml:space="preserve" x="16.0" y="546.9" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">bridge table holds one row per student per course.</text>

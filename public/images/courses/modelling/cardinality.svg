<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="760" height="700" role="img" aria-label="Relationship types: one-to-one (employee and staff ID card), one-to-many (customer and orders), and many-to-many (students and courses) resolved with a bridge table of enrolments.">
<title>The three kinds of relationship, and how crow's-foot lines draw them.</title>


<text xml:space="preserve" x="560.0" y="248.8" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">foreign key always sits on</text>
<text xml:space="preserve" x="560.0" y="267.7" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">the many side.</text>
<text xml:space="preserve" x="16.0" y="360.0" font-size="16" fill="#2A2926" font-weight="700" text-anchor="start">Many-to-many, resolved with a bridge table</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Difference in differences. Before and after alone mixes a pilot's effect with anything else that changed, like the season. A comparison group that did not get the changes shows what would probably have happened. The effect is the pilot group's change minus the comparison group's change. Invented numbers: pilot depot falls from 4.0 to 3.0 days; other depots rise from 4.1 to 4.3.">
<title>Subtract the comparison group's change to remove the season.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Invented example: days to deliver, before and during a pilot</text>
<line x1="40.0" y1="264.0" x2="440.0" y2="264.0" stroke="#CFC4B2" stroke-width="1.6"/>
<line x1="40.0" y1="44.0" x2="40.0" y2="264.0" stroke="#CFC4B2" stroke-width="1.6"/>
<line x1="40.0" y1="214.0" x2="440.0" y2="214.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="34.0" y="218.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="end">3</text>
<line x1="40.0" y1="114.0" x2="440.0" y2="114.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="34.0" y="118.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="end">4</text>
<path d="M130,114.00000000000003 L350,214.0" fill="none" stroke="#2F6B3F" stroke-width="3"/>
<circle cx="130.0" cy="114.0" r="5" fill="#2F6B3F"/>
<circle cx="350.0" cy="214.0" r="5" fill="#2F6B3F"/>
<path d="M130,104.00000000000006 L350,84.00000000000006" fill="none" stroke="#5E5A52" stroke-width="3"/>
<circle cx="130.0" cy="104.0" r="5" fill="#5E5A52"/>
<circle cx="350.0" cy="84.0" r="5" fill="#5E5A52"/>
<path d="M130,114.00000000000003 L350,94.0" fill="none" stroke="#2F6B3F" stroke-width="2" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="130.0" y="286.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">Before</text>
<text xml:space="preserve" x="350.0" y="286.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">Pilot period</text>
<text xml:space="preserve" x="362.0" y="218.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">Pilot depot</text>
<text xml:space="preserve" x="362.0" y="88.0" font-size="12" fill="#5E5A52" font-weight="700" text-anchor="start">Other depots</text>
<rect x="470.0" y="44.0" width="274.0" height="220.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="484.0" y="70.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">The arithmetic</text>
<text xml:space="preserve" x="484.0" y="98.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Pilot depot:   3.0 − 4.0 = −1.0</text>
<text xml:space="preserve" x="484.0" y="124.0" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Other depots:  4.3 − 4.1 = +0.2</text>
<line x1="484.0" y1="138.0" x2="730.0" y2="138.0" stroke="#CFC4B2" stroke-width="1"/>
<text xml:space="preserve" x="484.0" y="162.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Effect: −1.0 − 0.2 = −1.2 days</text>
<text xml:space="preserve" x="484.0" y="192.0" font-size="11.5" fill="#9B2C1F" font-weight="700" text-anchor="start">A naive before-and-after</text>
<text xml:space="preserve" x="484.0" y="210.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">says −1.0: it ignores the</text>
<text xml:space="preserve" x="484.0" y="226.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">season that slowed others.</text>
<rect x="16.0" y="306.0" width="728.0" height="40.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="331.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Assumes the groups would otherwise have moved together: check they matched before the pilot.</text>
<rect x="16.0" y="360.0" width="728.0" height="46.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="380.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">Check what it mustn't harm</text>
<text xml:space="preserve" x="30.0" y="398.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">A faster process that rejects good claims or approves bad ones isn't a success.</text>
</g></svg>
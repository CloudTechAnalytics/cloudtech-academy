<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="An event log has one row per step with a case, an activity, a timestamp and a team. Ordering by case and time gives each case's path. A variant is one distinct path; the most common is the happy path, and loops such as requesting documents again are rework. Most of a slow process is waiting between steps, not working.">
<title>Event log, variants, rework and waiting time.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="24.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Event log (invented): one row per step</text>
<rect x="16.0" y="34.0" width="590.0" height="130.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,60 L17,42 Q17,35 24,35 L598,35 Q605,35 605,42 L605,60 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="26.0" y="51.5" font-size="11.5" fill="#5E5A52" font-weight="700" text-anchor="start">Case</text>
<text xml:space="preserve" x="116.0" y="51.5" font-size="11.5" fill="#5E5A52" font-weight="700" text-anchor="start">Activity</text>
<text xml:space="preserve" x="306.0" y="51.5" font-size="11.5" fill="#5E5A52" font-weight="700" text-anchor="start">Timestamp</text>
<text xml:space="preserve" x="496.0" y="51.5" font-size="11.5" fill="#5E5A52" font-weight="700" text-anchor="start">Team</text>
<line x1="16.0" y1="60.0" x2="606.0" y2="60.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="77.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">P-101</text>
<text xml:space="preserve" x="116.0" y="77.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Parcel booked</text>
<text xml:space="preserve" x="306.0" y="77.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">03 Jun 09:10</text>
<text xml:space="preserve" x="496.0" y="77.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Depot</text>
<line x1="16.0" y1="86.0" x2="606.0" y2="86.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="103.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">P-101</text>
<text xml:space="preserve" x="116.0" y="103.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Parcel sorted</text>
<text xml:space="preserve" x="306.0" y="103.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">03 Jun 18:40</text>
<text xml:space="preserve" x="496.0" y="103.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Hub</text>
<line x1="16.0" y1="112.0" x2="606.0" y2="112.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="129.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">P-101</text>
<text xml:space="preserve" x="116.0" y="129.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Out for delivery</text>
<text xml:space="preserve" x="306.0" y="129.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">05 Jun 08:00</text>
<text xml:space="preserve" x="496.0" y="129.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Rider</text>
<line x1="16.0" y1="138.0" x2="606.0" y2="138.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="155.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">P-101</text>
<text xml:space="preserve" x="116.0" y="155.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Delivered</text>
<text xml:space="preserve" x="306.0" y="155.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">05 Jun 14:25</text>
<text xml:space="preserve" x="496.0" y="155.5" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Rider</text>
<text xml:space="preserve" x="16.0" y="196.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Variants: distinct paths, counted</text>
<text xml:space="preserve" x="16.0" y="226.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Happy path</text>
<rect x="180.0" y="214.0" width="240.0" height="18.0" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="428.0" y="228.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">60%</text>
<text xml:space="preserve" x="450.0" y="228.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Booked → Sorted → Out → Delivered</text>
<text xml:space="preserve" x="16.0" y="266.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">One redelivery loop</text>
<rect x="180.0" y="254.0" width="100.0" height="18.0" rx="3" fill="#8A6A1F"/>
<text xml:space="preserve" x="288.0" y="268.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">25%</text>
<text xml:space="preserve" x="450.0" y="268.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">… Out → Failed → Out → Delivered</text>
<text xml:space="preserve" x="16.0" y="306.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Gave up</text>
<rect x="180.0" y="294.0" width="60.0" height="18.0" rx="3" fill="#9B2C1F"/>
<text xml:space="preserve" x="248.0" y="308.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">15%</text>
<text xml:space="preserve" x="450.0" y="308.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">… Out → Failed → Returned</text>
<text xml:space="preserve" x="16.0" y="346.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Waiting versus working</text>
<rect x="16.0" y="360.0" width="70.0" height="26.0" rx="4" fill="#2F6B3F"/>
<rect x="90.0" y="360.0" width="300.0" height="26.0" rx="4" fill="#D8CFBF"/>
<rect x="394.0" y="360.0" width="60.0" height="26.0" rx="4" fill="#2F6B3F"/>
<rect x="458.0" y="360.0" width="150.0" height="26.0" rx="4" fill="#D8CFBF"/>
<rect x="612.0" y="360.0" width="80.0" height="26.0" rx="4" fill="#2F6B3F"/>
<text xml:space="preserve" x="51.0" y="378.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">work</text>
<text xml:space="preserve" x="240.0" y="378.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="middle">waiting in a queue</text>
<text xml:space="preserve" x="424.0" y="378.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">work</text>
<text xml:space="preserve" x="533.0" y="378.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="middle">waiting</text>
<text xml:space="preserve" x="652.0" y="378.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle">work</text>
<text xml:space="preserve" x="16.0" y="414.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Find the longest gaps first: that is where the days are.</text>
</g></svg>
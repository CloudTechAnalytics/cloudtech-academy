<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Finding root causes. A Pareto view ranks the stages of the delay by their share of waiting so the biggest is tackled first. The five whys keep asking why until you reach something the business controls. Every cause needs a number from the data and ideally an interview quote that explains it.">
<title>Rank the delay by stage, then ask why five times.</title>

<rect width="760" height="440" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Pareto of delay by stage (invented numbers)</text>
<text xml:space="preserve" x="16.0" y="56.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Sorting backlog</text>
<rect x="200.0" y="43.0" width="342.0" height="20.0" rx="3" fill="#9B2C1F"/>
<text xml:space="preserve" x="548.0" y="58.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">38%</text>
<text xml:space="preserve" x="16.0" y="86.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Failed delivery attempts</text>
<rect x="200.0" y="73.0" width="216.0" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="422.0" y="88.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">24%</text>
<text xml:space="preserve" x="16.0" y="116.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Address queries</text>
<rect x="200.0" y="103.0" width="144.0" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="350.0" y="118.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">16%</text>
<text xml:space="preserve" x="16.0" y="146.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Dispatch approval</text>
<rect x="200.0" y="133.0" width="117.0" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="323.0" y="148.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">13%</text>
<text xml:space="preserve" x="16.0" y="176.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Booking</text>
<rect x="200.0" y="163.0" width="81.0" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="287.0" y="178.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">9%</text>
<text xml:space="preserve" x="16.0" y="208.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Five whys (invented): why are parcels slow?</text>
<rect x="16.0" y="222.0" width="560.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<circle cx="36.0" cy="237.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="36.0" y="241.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="58.0" y="242.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Many parcels wait for a delivery address check.</text>
<rect x="16.0" y="260.0" width="560.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<circle cx="36.0" cy="275.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="36.0" y="279.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="58.0" y="280.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Addresses arrive incomplete.</text>
<rect x="16.0" y="298.0" width="560.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<circle cx="36.0" cy="313.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="36.0" y="317.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="58.0" y="318.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">They mostly come from phone bookings.</text>
<rect x="16.0" y="336.0" width="560.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<circle cx="36.0" cy="351.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="36.0" y="355.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="58.0" y="356.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Phone staff type them with no checklist.</text>
<rect x="16.0" y="374.0" width="560.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="2"/>
<circle cx="36.0" cy="389.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="36.0" y="393.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text xml:space="preserve" x="58.0" y="394.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">No one owns address quality for phone bookings.</text>
<rect x="592.0" y="222.0" width="152.0" height="180.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="604.0" y="246.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">A cause you can</text>
<text xml:space="preserve" x="604.0" y="262.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">act on: something</text>
<text xml:space="preserve" x="604.0" y="278.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">the business</text>
<text xml:space="preserve" x="604.0" y="294.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">controls.</text>
<text xml:space="preserve" x="604.0" y="330.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">Evidence for each:</text>
<text xml:space="preserve" x="604.0" y="348.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">a number (that it</text>
<text xml:space="preserve" x="604.0" y="364.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">happens) and a quote</text>
<text xml:space="preserve" x="604.0" y="380.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">(why it happens).</text>
</g></svg>
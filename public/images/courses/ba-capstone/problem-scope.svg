<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 458" width="760" height="458" role="img" aria-label="A problem statement says who is affected, what happens, how much with a number, and why it matters, without naming a solution. Scope says what is in and out. Definitions are written before any numbers. Stakeholders are placed on an influence and interest grid to decide how to engage each.">
<title>Problem statement, scope, definitions and stakeholders.</title>

<rect width="760" height="458" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A good problem statement has four parts and no solution</text>
<rect x="16.0" y="40.0" width="172.0" height="56.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="64.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Who</text>
<text xml:space="preserve" x="28.0" y="84.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">is affected</text>
<rect x="202.0" y="40.0" width="172.0" height="56.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="214.0" y="64.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">What</text>
<text xml:space="preserve" x="214.0" y="84.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">happens</text>
<rect x="388.0" y="40.0" width="172.0" height="56.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="400.0" y="64.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">How much</text>
<text xml:space="preserve" x="400.0" y="84.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">with a number</text>
<rect x="574.0" y="40.0" width="172.0" height="56.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<text xml:space="preserve" x="586.0" y="64.0" font-size="13.5" fill="#5C4F80" font-weight="700" text-anchor="start">Why it matters</text>
<text xml:space="preserve" x="586.0" y="84.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">to the business</text>
<text xml:space="preserve" x="16.0" y="120.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Scope and definitions</text>
<rect x="16.0" y="132.0" width="358.0" height="100.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="156.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">In scope</text>
<text xml:space="preserve" x="30.0" y="178.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• parcels from booking to delivery</text>
<text xml:space="preserve" x="30.0" y="198.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• four depots, one year of data</text>
<rect x="386.0" y="132.0" width="358.0" height="100.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="400.0" y="156.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">Out of scope</text>
<text xml:space="preserve" x="400.0" y="178.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• pricing and sales</text>
<text xml:space="preserve" x="400.0" y="198.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• choosing a supplier</text>
<rect x="16.0" y="244.0" width="728.0" height="40.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="269.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Write definitions first: "days to deliver", the baseline period, the pilot, the comparison group.</text>
<text xml:space="preserve" x="16.0" y="310.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Stakeholders: influence and interest</text>
<rect x="40.0" y="322.0" width="220.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<line x1="150.0" y1="322.0" x2="150.0" y2="422.0" stroke="#CFC4B2" stroke-width="1"/>
<line x1="40.0" y1="372.0" x2="260.0" y2="372.0" stroke="#CFC4B2" stroke-width="1"/>
<text xml:space="preserve" x="95.0" y="350.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">Keep satisfied</text>
<text xml:space="preserve" x="205.0" y="350.0" font-size="11" fill="#2F6B3F" font-weight="700" text-anchor="middle">Manage closely</text>
<text xml:space="preserve" x="95.0" y="400.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">Monitor</text>
<text xml:space="preserve" x="205.0" y="400.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">Keep informed</text>
<text xml:space="preserve" x="150.0" y="438.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">Interest →</text>
<text xml:space="preserve" x="300.0" y="342.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Manage closely: high influence and interest.</text>
<text xml:space="preserve" x="300.0" y="366.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Keep satisfied: high influence, less interest.</text>
<text xml:space="preserve" x="300.0" y="390.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Keep informed: high interest, less influence.</text>
<text xml:space="preserve" x="300.0" y="414.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Monitor: low on both.</text>
</g></svg>
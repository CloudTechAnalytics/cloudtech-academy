<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" role="img" aria-label="A decision paper answers first: the decision you ask for, then the problem, why it happens, the evidence it works, options, conditions and risks, and measures. One chart carries the argument, such as two lines that run together and then separate when the pilot starts. Prepare an answer for each stakeholder's hardest question.">
<title>Answer first; one chart; answers ready for each stakeholder.</title>

<rect width="760" height="446" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Shape of a two-page paper</text>
<rect x="16.0" y="40.0" width="172.0" height="62.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="2"/>
<text xml:space="preserve" x="26.0" y="62.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">1  The decision</text>
<text xml:space="preserve" x="26.0" y="80.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">What you're asking the</text>
<text xml:space="preserve" x="26.0" y="92.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">board to approve</text>
<rect x="202.0" y="40.0" width="172.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<text xml:space="preserve" x="212.0" y="62.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">2  The problem</text>
<text xml:space="preserve" x="212.0" y="80.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">In numbers</text>
<rect x="388.0" y="40.0" width="172.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<text xml:space="preserve" x="398.0" y="62.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">3  Why it happens</text>
<text xml:space="preserve" x="398.0" y="80.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Root causes with evidence</text>
<rect x="574.0" y="40.0" width="172.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<text xml:space="preserve" x="584.0" y="62.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">4  The evidence it works</text>
<text xml:space="preserve" x="584.0" y="80.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Pilot vs comparison group</text>
<rect x="16.0" y="110.0" width="172.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<text xml:space="preserve" x="26.0" y="132.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">5  Options</text>
<text xml:space="preserve" x="26.0" y="150.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Costs, benefits, NPV,</text>
<text xml:space="preserve" x="26.0" y="162.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">payback</text>
<rect x="202.0" y="110.0" width="172.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<text xml:space="preserve" x="212.0" y="132.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">6  Conditions and risks</text>
<text xml:space="preserve" x="212.0" y="150.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Fixes, controls, capacity</text>
<rect x="388.0" y="110.0" width="172.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<text xml:space="preserve" x="398.0" y="132.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">7  Measures</text>
<text xml:space="preserve" x="398.0" y="150.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">KPIs, baselines, targets</text>
<text xml:space="preserve" x="16.0" y="196.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">One chart that carries the argument</text>
<rect x="16.0" y="208.0" width="358.0" height="130.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<path d="M34,276 L90,274 L150,278 L200,274 L260,276 L300,272" fill="none" stroke="#5E5A52" stroke-width="2.5"/>
<path d="M34,278 L90,276 L150,280 L200,276 L240,276 L260,312 L300,314 L350,318" fill="none" stroke="#2F6B3F" stroke-width="2.5"/>
<line x1="240.0" y1="222.0" x2="240.0" y2="322.0" stroke="#2F6B3F" stroke-width="1.2" stroke-dasharray="4 3"/>
<text xml:space="preserve" x="246.0" y="236.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="start">pilot starts</text>
<text xml:space="preserve" x="34.0" y="332.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Months</text>
<text xml:space="preserve" x="300.0" y="266.0" font-size="10.5" fill="#5E5A52" font-weight="700" text-anchor="start">others</text>
<text xml:space="preserve" x="300.0" y="306.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="start">pilot</text>
<text xml:space="preserve" x="390.0" y="230.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Lines run together, then separate.</text>
<text xml:space="preserve" x="390.0" y="252.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Title the chart with the finding, not the metric.</text>
<text xml:space="preserve" x="16.0" y="366.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Hard questions, answered in advance</text>
<rect x="16.0" y="380.0" width="232.0" height="54.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.2"/>
<text xml:space="preserve" x="26.0" y="400.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">IT: "Why not the new system?"</text>
<text xml:space="preserve" x="26.0" y="416.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Cost and time against what the pilot</text>
<text xml:space="preserve" x="26.0" y="428.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">already proved.</text>
<rect x="264.0" y="380.0" width="232.0" height="54.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.2"/>
<text xml:space="preserve" x="274.0" y="400.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">Finance: "Who checks approvals?"</text>
<text xml:space="preserve" x="274.0" y="416.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Limits, separation of duties, audit.</text>
<rect x="512.0" y="380.0" width="232.0" height="54.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.2"/>
<text xml:space="preserve" x="522.0" y="400.0" font-size="11" fill="#2A2926" font-weight="700" text-anchor="start">Operations: "Won't it slow us?"</text>
<text xml:space="preserve" x="522.0" y="416.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Minutes now, days saved later.</text>
</g></svg>
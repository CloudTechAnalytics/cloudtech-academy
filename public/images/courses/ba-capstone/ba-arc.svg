<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="The eight stages of a business analysis project: brief and plan, current state, process, root causes, the pilot, options and business case, requirements and readiness, and the decision paper. A typical brief mixes a symptom, consequences, an experiment and a solution already proposed; the analyst's job is to separate them and test each.">
<title>Eight stages, and what a typical brief is made of.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">The arc of a business analysis project</text>
<rect x="16.0" y="40.0" width="172.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<circle cx="38.0" cy="64.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="38.0" y="68.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="58.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Brief and plan</text>
<text xml:space="preserve" x="28.0" y="96.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Problem, scope,</text>
<text xml:space="preserve" x="28.0" y="109.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">definitions, stakeholders</text>
<rect x="202.0" y="40.0" width="172.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<circle cx="224.0" cy="64.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="224.0" y="68.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="244.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Current state</text>
<text xml:space="preserve" x="214.0" y="96.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">The problem in numbers</text>
<rect x="388.0" y="40.0" width="172.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="1.6"/>
<circle cx="410.0" cy="64.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="410.0" y="68.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="430.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Process</text>
<text xml:space="preserve" x="400.0" y="96.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">The real process, from</text>
<text xml:space="preserve" x="400.0" y="109.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">the event log</text>
<rect x="574.0" y="40.0" width="172.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="1.6"/>
<circle cx="596.0" cy="64.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="596.0" y="68.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="616.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Root causes</text>
<text xml:space="preserve" x="586.0" y="96.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Why, with evidence</text>
<rect x="16.0" y="132.0" width="172.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#5C4F80" stroke-width="1.6"/>
<circle cx="38.0" cy="156.0" r="12" fill="#5C4F80"/>
<text xml:space="preserve" x="38.0" y="160.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text xml:space="preserve" x="58.0" y="154.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">The pilot</text>
<text xml:space="preserve" x="28.0" y="188.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Did the experiment work?</text>
<rect x="202.0" y="132.0" width="172.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<circle cx="224.0" cy="156.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="224.0" y="160.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text xml:space="preserve" x="244.0" y="154.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Options and case</text>
<text xml:space="preserve" x="214.0" y="188.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Costs, benefits,</text>
<text xml:space="preserve" x="214.0" y="201.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">recommendation</text>
<rect x="388.0" y="132.0" width="172.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#9B2C1F" stroke-width="1.6"/>
<circle cx="410.0" cy="156.0" r="12" fill="#9B2C1F"/>
<text xml:space="preserve" x="410.0" y="160.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
<text xml:space="preserve" x="430.0" y="154.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Requirements</text>
<text xml:space="preserve" x="400.0" y="188.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Stories, criteria,</text>
<text xml:space="preserve" x="400.0" y="201.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">readiness, go/no-go</text>
<rect x="574.0" y="132.0" width="172.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#9B2C1F" stroke-width="1.6"/>
<circle cx="596.0" cy="156.0" r="12" fill="#9B2C1F"/>
<text xml:space="preserve" x="596.0" y="160.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text>
<text xml:space="preserve" x="616.0" y="154.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Decision paper</text>
<text xml:space="preserve" x="586.0" y="188.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">One short paper the board</text>
<text xml:space="preserve" x="586.0" y="201.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">can approve</text>
<text xml:space="preserve" x="16.0" y="250.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A typical brief, taken apart (invented example: a courier company)</text>
<rect x="16.0" y="262.0" width="728.0" height="44.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="282.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">"Deliveries take far too long. Customers are leaving, complaints are piling up. In May, one depot tried</text>
<text xml:space="preserve" x="30.0" y="298.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">some changes. We think we need a new tracking system."</text>
<rect x="16.0" y="322.0" width="172.0" height="66.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="346.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">Symptom</text>
<text xml:space="preserve" x="28.0" y="366.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">"far too long"</text>
<rect x="202.0" y="322.0" width="172.0" height="66.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="214.0" y="346.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Consequences</text>
<text xml:space="preserve" x="214.0" y="366.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">customers leaving,</text>
<text xml:space="preserve" x="214.0" y="381.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">complaints</text>
<rect x="388.0" y="322.0" width="172.0" height="66.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="400.0" y="346.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">Experiment</text>
<text xml:space="preserve" x="400.0" y="366.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">one depot's changes</text>
<rect x="574.0" y="322.0" width="172.0" height="66.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<text xml:space="preserve" x="586.0" y="346.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="start">Proposed solution</text>
<text xml:space="preserve" x="586.0" y="366.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">a new tracking system</text>
<text xml:space="preserve" x="16.0" y="414.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Measure the problem, test the experiment fairly, and don't start from the solution.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Requirements trace back to root causes so nobody builds something that does not solve a real problem. Each requirement gets business rules and controls, a user story with Given, When, Then acceptance criteria including cases that must fail, defined measures, and go or no-go exit criteria agreed before testing.">
<title>Root cause → requirement → rule → test → go/no-go.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="440" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Every requirement traces to a root cause (invented example)</text>
<rect x="16.0" y="40.0" width="300.0" height="36.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.2"/>
<text xml:space="preserve" x="28.0" y="63.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Incomplete addresses</text>
<path d="M320.0,58.0 L342.0,58.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="346.0" y="40.0" width="398.0" height="36.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.2"/>
<text xml:space="preserve" x="358.0" y="63.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Checklist blocks booking until the address is complete</text>
<rect x="16.0" y="84.0" width="300.0" height="36.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.2"/>
<text xml:space="preserve" x="28.0" y="107.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Weekly dispatch sign-off</text>
<path d="M320.0,102.0 L342.0,102.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="346.0" y="84.0" width="398.0" height="36.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.2"/>
<text xml:space="preserve" x="358.0" y="107.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Depot supervisors approve routine dispatches</text>
<rect x="16.0" y="128.0" width="300.0" height="36.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.2"/>
<text xml:space="preserve" x="28.0" y="151.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Customers not told what's happening</text>
<path d="M320.0,146.0 L342.0,146.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="346.0" y="128.0" width="398.0" height="36.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.2"/>
<text xml:space="preserve" x="358.0" y="151.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">SMS update at each stage</text>
<text xml:space="preserve" x="16.0" y="186.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Controls as rules, and a story with a test that must fail</text>
<rect x="16.0" y="200.0" width="358.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="224.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Business rules</text>
<text xml:space="preserve" x="30.0" y="246.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">• Approve only routine parcels under a limit</text>
<text xml:space="preserve" x="30.0" y="264.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">• Approver ≠ the person who prepared it</text>
<text xml:space="preserve" x="30.0" y="282.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">• Changing the value cancels the approval</text>
<text xml:space="preserve" x="30.0" y="300.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">• Finance audits a weekly sample</text>
<rect x="386.0" y="200.0" width="358.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="400.0" y="224.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">User story + acceptance criteria</text>
<text xml:space="preserve" x="400.0" y="246.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">As a supervisor, I want to approve</text>
<text xml:space="preserve" x="400.0" y="262.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">routine dispatches, so parcels leave sooner.</text>
<text xml:space="preserve" x="400.0" y="284.0" font-size="11.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Given a parcel over the limit</text>
<text xml:space="preserve" x="400.0" y="300.0" font-size="11.5" fill="#9B2C1F" font-weight="700" text-anchor="start">When I try to approve → Then it is refused</text>
<text xml:space="preserve" x="16.0" y="350.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Decide go / no-go before you test</text>
<rect x="16.0" y="364.0" width="232.0" height="62.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="388.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Go</text>
<text xml:space="preserve" x="30.0" y="408.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">No open critical or major defects</text>
<rect x="264.0" y="364.0" width="232.0" height="62.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="278.0" y="388.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Go with conditions</text>
<text xml:space="preserve" x="278.0" y="408.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Minor defects only, with</text>
<text xml:space="preserve" x="278.0" y="422.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">workaround and fix date</text>
<rect x="512.0" y="364.0" width="232.0" height="62.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="526.0" y="388.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">No-go</text>
<text xml:space="preserve" x="526.0" y="408.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Any open critical or major defect</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Cutting a headline number by every dimension. An invented average delivery time is broken down by channel, region and parcel type to find groups that stand out; also look at every outcome, not just successes, and read customers' own words.">
<title>Cut the headline by every dimension, and look at every outcome.</title>

<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Headline: parcels take 4.0 days on average (invented example)</text>
<rect x="16.0" y="38.0" width="360.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="62.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">By channel</text>
<text xml:space="preserve" x="30.0" y="90.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">App</text>
<rect x="136.0" y="76.0" width="117.8" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="259.8" y="91.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">3.1</text>
<text xml:space="preserve" x="30.0" y="122.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Depot drop-off</text>
<rect x="136.0" y="108.0" width="136.8" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="278.8" y="123.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">3.6</text>
<text xml:space="preserve" x="30.0" y="154.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Phone</text>
<rect x="136.0" y="140.0" width="159.6" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="301.6" y="155.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">4.2</text>
<text xml:space="preserve" x="30.0" y="186.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Agent</text>
<rect x="136.0" y="172.0" width="209.0" height="20.0" rx="3" fill="#9B2C1F"/>
<text xml:space="preserve" x="351.0" y="187.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">5.5</text>
<rect x="384.0" y="38.0" width="360.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="398.0" y="62.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">By depot</text>
<text xml:space="preserve" x="398.0" y="90.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Kano</text>
<rect x="504.0" y="76.0" width="148.2" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="658.2" y="91.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">3.9</text>
<text xml:space="preserve" x="398.0" y="122.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Enugu</text>
<rect x="504.0" y="108.0" width="152.0" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="662.0" y="123.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">4.0</text>
<text xml:space="preserve" x="398.0" y="154.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Lagos</text>
<rect x="504.0" y="140.0" width="148.2" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="658.2" y="155.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">3.9</text>
<text xml:space="preserve" x="398.0" y="186.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Jos</text>
<rect x="504.0" y="172.0" width="167.2" height="20.0" rx="3" fill="#C5B38A"/>
<text xml:space="preserve" x="677.2" y="187.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">4.4</text>
<text xml:space="preserve" x="16.0" y="238.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Look at every outcome, not just the happy one</text>
<rect x="16.0" y="252.0" width="232.0" height="66.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="278.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">Delivered</text>
<text xml:space="preserve" x="30.0" y="298.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">the average only covers these</text>
<rect x="264.0" y="252.0" width="232.0" height="66.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="278.0" y="278.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">Returned to sender</text>
<text xml:space="preserve" x="278.0" y="298.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">customer gave up or was never</text>
<text xml:space="preserve" x="278.0" y="312.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">home</text>
<rect x="512.0" y="252.0" width="232.0" height="66.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="526.0" y="278.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">Lost or damaged</text>
<text xml:space="preserve" x="526.0" y="298.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">a failure the average hides</text>
<rect x="16.0" y="336.0" width="728.0" height="46.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="356.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Customers' own words</text>
<text xml:space="preserve" x="30.0" y="374.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">A parcel "in transit" in the system can feel like silence to the customer.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img" aria-label="Ashgrove's billing process as is, drawn as a swimlane diagram with lanes for Lawyer, Accounts, Partner and Client. Problems are marked: no trigger when lawyers send their time and when accounts chase payment; a rework loop when the partner finds a wrong rate; no due date on the invoice.">
<title>Ashgrove's as-is billing process, with its problems marked.</title>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="How option B's annual net benefit is built up: 3.3 million naira from releasing cash sooner (16.4 million released, valued at 20 percent), plus 3.0 million from fewer write-offs, minus 0.6 million running cost, gives 5.7 million a year. Against a one-off cost of 1.5 million, payback is about 3 months.">
<title>Option B's annual net benefit, built up step by step.</title>

<rect width="760" height="420" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="16" fill="#2A2926" font-weight="700" text-anchor="start">Option B, fix the process: annual net benefit (₦ million)</text>
<line x1="60.0" y1="320.0" x2="744.0" y2="320.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="324.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">0</text>
<line x1="60.0" y1="284.3" x2="744.0" y2="284.3" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="288.3" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">1</text>
<line x1="60.0" y1="248.6" x2="744.0" y2="248.6" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="252.6" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">2</text>
<line x1="60.0" y1="212.9" x2="744.0" y2="212.9" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="216.9" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">3</text>
<line x1="60.0" y1="177.1" x2="744.0" y2="177.1" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="181.1" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">4</text>
<line x1="60.0" y1="141.4" x2="744.0" y2="141.4" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="145.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">5</text>
<line x1="60.0" y1="105.7" x2="744.0" y2="105.7" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="109.7" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">6</text>
<line x1="60.0" y1="70.0" x2="744.0" y2="70.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="52.0" y="74.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">7</text>
<rect x="90.0" y="202.1" width="110.0" height="117.9" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="145.0" y="194.1" font-size="15" fill="#2A2926" font-weight="700" text-anchor="middle">+3.3</text>
<text xml:space="preserve" x="145.0" y="340.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle">Released cash</text>
<text xml:space="preserve" x="145.0" y="358.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">₦16.4m × 20%</text>
<line x1="200.0" y1="202.1" x2="258.0" y2="202.1" stroke="#5E5A52" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="258.0" y="95.0" width="110.0" height="107.1" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="313.0" y="87.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="middle">+3.0</text>
<text xml:space="preserve" x="313.0" y="340.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle">Fewer write-offs</text>
<text xml:space="preserve" x="313.0" y="358.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">0.5% of ₦600m</text>
<line x1="368.0" y1="95.0" x2="426.0" y2="95.0" stroke="#5E5A52" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="426.0" y="95.0" width="110.0" height="21.4" rx="3" fill="#9B2C1F"/>
<text xml:space="preserve" x="481.0" y="87.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="middle">−0.6</text>
<text xml:space="preserve" x="481.0" y="340.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle">Running cost</text>
<text xml:space="preserve" x="481.0" y="358.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">extra accounts time</text>
<rect x="594.0" y="116.4" width="110.0" height="203.6" rx="3" fill="#B38A3E"/>
<text xml:space="preserve" x="649.0" y="108.4" font-size="15" fill="#2A2926" font-weight="700" text-anchor="middle">5.7</text>
<text xml:space="preserve" x="649.0" y="340.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle">Net benefit</text>
<text xml:space="preserve" x="649.0" y="358.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">per year</text>
<line x1="60.0" y1="320.0" x2="744.0" y2="320.0" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="16.0" y="400.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">One-off cost ₦1.5m ÷ ₦5.7m a year = payback in about 3 months. Over three years: about ₦15.6m.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Average days from invoice to payment at Ashgrove, by the year the invoice was issued: 42.4 days in 2024 (59 paid invoices), 45.5 in 2025 (169) and 47.1 in 2026 to August (99). It is getting slowly worse.">
<title>Average days to pay, by year issued: getting slowly worse.</title>

<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="16" fill="#2A2926" font-weight="700" text-anchor="start">Average days to pay, by year the invoice was issued</text>
<line x1="70.0" y1="235.0" x2="744.0" y2="235.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="62.0" y="239.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">15</text>
<line x1="70.0" y1="180.0" x2="744.0" y2="180.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="62.0" y="184.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">30</text>
<line x1="70.0" y1="125.0" x2="744.0" y2="125.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="62.0" y="129.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">45</text>
<line x1="70.0" y1="70.0" x2="744.0" y2="70.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="62.0" y="74.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">60</text>
<line x1="70.0" y1="180.0" x2="744.0" y2="180.0" stroke="#2F6B3F" stroke-width="1.6" stroke-dasharray="6 4"/>
<text xml:space="preserve" x="16.0" y="52.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">Dashed line: 30 days, a typical payment term.</text>
<rect x="110.0" y="134.5" width="130.0" height="155.5" rx="3" fill="#DCC594"/>
<text xml:space="preserve" x="175.0" y="126.5" font-size="15" fill="#2A2926" font-weight="700" text-anchor="middle">42.4 days</text>
<text xml:space="preserve" x="175.0" y="310.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="middle">2024</text>
<text xml:space="preserve" x="175.0" y="328.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">59 paid invoices</text>
<rect x="330.0" y="123.2" width="130.0" height="166.8" rx="3" fill="#DCC594"/>
<text xml:space="preserve" x="395.0" y="115.2" font-size="15" fill="#2A2926" font-weight="700" text-anchor="middle">45.5 days</text>
<text xml:space="preserve" x="395.0" y="310.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="middle">2025</text>
<text xml:space="preserve" x="395.0" y="328.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">169 paid invoices</text>
<rect x="550.0" y="117.3" width="130.0" height="172.7" rx="3" fill="#B38A3E"/>
<text xml:space="preserve" x="615.0" y="109.3" font-size="15" fill="#2A2926" font-weight="700" text-anchor="middle">47.1 days</text>
<text xml:space="preserve" x="615.0" y="310.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="middle">2026 (to Aug)</text>
<text xml:space="preserve" x="615.0" y="328.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">99 paid invoices</text>
<line x1="70.0" y1="290.0" x2="744.0" y2="290.0" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="16.0" y="368.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">About 2 to 3 days worse each year, and well above 30 days throughout.</text>
</g></svg>
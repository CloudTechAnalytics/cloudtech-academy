<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Retrieval-augmented generation in four steps. Retrieve the top few help articles for the question. Augment the prompt with them, delimited and labelled with their IDs. Generate an answer from those articles only, citing the ID. Check the output: a citation present, and from the articles supplied; otherwise refuse and hand over to a person.">
<title>RAG: retrieve, augment, generate, check.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="50.0" width="165.5" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="76.0" font-size="14.5" fill="#2A2926" font-weight="700" text-anchor="start">1 Retrieve</text>
<text xml:space="preserve" x="30.0" y="100.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">top 3 articles for</text>
<text xml:space="preserve" x="30.0" y="118.1" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">the question</text>
<path d="M184.5,110.0 L200.5,110.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="203.5" y="50.0" width="165.5" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="217.5" y="76.0" font-size="14.5" fill="#2A2926" font-weight="700" text-anchor="start">2 Augment</text>
<text xml:space="preserve" x="217.5" y="100.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">put them in the</text>
<text xml:space="preserve" x="217.5" y="118.1" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">prompt, delimited,</text>
<text xml:space="preserve" x="217.5" y="136.2" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">with IDs</text>
<path d="M372.0,110.0 L388.0,110.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="391.0" y="50.0" width="165.5" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="405.0" y="76.0" font-size="14.5" fill="#2A2926" font-weight="700" text-anchor="start">3 Generate</text>
<text xml:space="preserve" x="405.0" y="100.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">answer only from</text>
<text xml:space="preserve" x="405.0" y="118.1" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">them; cite the ID</text>
<path d="M559.5,110.0 L575.5,110.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="578.5" y="50.0" width="165.5" height="120.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="592.5" y="76.0" font-size="14.5" fill="#2A2926" font-weight="700" text-anchor="start">4 Check</text>
<text xml:space="preserve" x="592.5" y="100.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">citation present and</text>
<text xml:space="preserve" x="592.5" y="118.1" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">from the supplied</text>
<text xml:space="preserve" x="592.5" y="136.2" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">articles?</text>
<text xml:space="preserve" x="16.0" y="30.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Question: "Why was my transfer reversed?"</text>
<rect x="16.0" y="200.0" width="358.0" height="150.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="32.0" y="228.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">✓ Pass</text>
<text xml:space="preserve" x="32.0" y="254.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">"Transfers are reversed when the recipient's</text>
<text xml:space="preserve" x="32.0" y="272.9" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">account can't receive them [HA-07]." Shown to</text>
<text xml:space="preserve" x="32.0" y="291.7" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">the customer.</text>
<rect x="386.0" y="200.0" width="358.0" height="150.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="402.0" y="228.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ Fail, or nothing relevant retrieved</text>
<text xml:space="preserve" x="402.0" y="254.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">"I can't find that in our help articles. I'll</text>
<text xml:space="preserve" x="402.0" y="272.9" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">pass you to a support agent." Never an answer</text>
<text xml:space="preserve" x="402.0" y="291.7" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">from memory.</text>
<text xml:space="preserve" x="16.0" y="372.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Example wording is illustrative.</text>
</g></svg>
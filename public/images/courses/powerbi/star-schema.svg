<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Kolanut's star schema. The fact table, orders, sits in the middle with 4,266 rows of events and numbers. Three dimension tables surround it: customers (90 rows), products (16 rows) and Date (one row per day). Each dimension links to orders with a one-to-many relationship, and arrows show filters flowing from each dimension into orders.">
<title>Star schema: the orders fact table in the middle, customers, products and Date around it; filters flow into orders.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="500" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="250.0" y="16.0" width="260.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="380.0" y="40.0" font-size="11.5" fill="#2F5D8A" font-weight="700" text-anchor="middle">DIMENSION</text>
<text xml:space="preserve" x="380.0" y="64.0" font-size="17" fill="#2A2926" font-weight="700" text-anchor="middle">customers</text>
<text xml:space="preserve" x="380.0" y="86.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">90 rows · region, channel, rep</text>
<rect x="16.0" y="190.0" width="200.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="116.0" y="214.0" font-size="11.5" fill="#2F5D8A" font-weight="700" text-anchor="middle">DIMENSION</text>
<text xml:space="preserve" x="116.0" y="238.0" font-size="17" fill="#2A2926" font-weight="700" text-anchor="middle">products</text>
<text xml:space="preserve" x="116.0" y="260.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">16 rows · name, category</text>
<rect x="544.0" y="190.0" width="200.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="644.0" y="214.0" font-size="11.5" fill="#2F5D8A" font-weight="700" text-anchor="middle">DIMENSION</text>
<text xml:space="preserve" x="644.0" y="238.0" font-size="17" fill="#2A2926" font-weight="700" text-anchor="middle">Date</text>
<text xml:space="preserve" x="644.0" y="260.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">one row per day</text>
<rect x="256.0" y="150.0" width="248.0" height="176.0" rx="10" fill="#C9A867" stroke="#8A6A1F" stroke-width="1.8"/>
<text xml:space="preserve" x="380.0" y="176.0" font-size="11.5" fill="#4A3A12" font-weight="700" text-anchor="middle">FACT TABLE</text>
<text xml:space="preserve" x="380.0" y="202.0" font-size="20" fill="#2A2926" font-weight="700" text-anchor="middle">orders</text>
<text xml:space="preserve" x="380.0" y="226.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="middle">4,266 rows: one per order line</text>
<text xml:space="preserve" x="380.0" y="254.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">customer_id · product_id</text>
<text xml:space="preserve" x="380.0" y="274.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">order_date · quantity</text>
<text xml:space="preserve" x="380.0" y="294.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">unit_price · revenue</text>
<path d="M380.0,102.0 L380.0,146.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<path d="M218.0,238.0 L252.0,238.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<path d="M542.0,238.0 L508.0,238.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>

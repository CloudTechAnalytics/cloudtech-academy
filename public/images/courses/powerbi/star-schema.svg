<text xml:space="preserve" x="508.0" y="228.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">* ← 1</text>
<rect x="16.0" y="350.0" width="358.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<rect x="386.0" y="350.0" width="358.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="378.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Dimensions: what you filter and group by.</text>
<text xml:space="preserve" x="32.0" y="402.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">Put their fields on axes, rows and slicers.</text>
<text xml:space="preserve" x="402.0" y="378.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Fact: what you measure.</text>
<text xml:space="preserve" x="402.0" y="402.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">Its numbers go in Values, through measures.</text>
<text xml:space="preserve" x="16.0" y="492.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">Pick Lagos in customers, and only Lagos orders are counted.</text>
</g></svg>
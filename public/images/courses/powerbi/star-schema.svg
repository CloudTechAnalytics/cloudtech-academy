<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" role="img" aria-label="Kolanut's star schema. The fact table, orders, sits in the middle with 4,266 rows of events and numbers. Three dimension tables surround it: customers (90 rows), products (16 rows) and Date (one row per day). Each dimension links to orders with a one-to-many relationship, and arrows show filters flowing from each dimension into orders.">
<title>Star schema: the orders fact table in the middle, with customers, products and Date dimensions around it; filters flow from each dimension into orders.</title>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="1160" height="470" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect x="440" y="160" width="280" height="170" rx="12" fill="#C9A867" stroke="#8A6A1F" stroke-width="1.8"/>
  <text x="580" y="192" font-size="12" font-weight="700" fill="#4A3A12" text-anchor="middle">FACT TABLE</text>
  <text x="580" y="220" font-size="20" font-weight="700" fill="#2A2926" text-anchor="middle">orders</text>
  <text x="580" y="244" font-size="13" fill="#2A2926" text-anchor="middle">4,266 rows: one per order line</text>
  <text x="580" y="272" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#2A2926" text-anchor="middle">customer_id · product_id · order_date</text>
  <text x="580" y="292" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#2A2926" text-anchor="middle">quantity · unit_price · revenue</text>
  <text x="580" y="316" font-size="12" fill="#4A3A12" text-anchor="middle">Events and the numbers you add up</text>

  <g font-size="13" fill="#2A2926">
    <rect x="460" y="20" width="240" height="96" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
    <text x="580" y="46" font-size="11.5" font-weight="700" fill="#2F5D8A" text-anchor="middle">DIMENSION</text>
    <text x="580" y="70" font-size="17" font-weight="700" text-anchor="middle">customers</text>
    <text x="580" y="94" text-anchor="middle" fill="#5E5A52">90 rows · region, channel, rep</text>

    <rect x="60" y="197" width="250" height="96" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
    <text x="185" y="223" font-size="11.5" font-weight="700" fill="#2F5D8A" text-anchor="middle">DIMENSION</text>
    <text x="185" y="247" font-size="17" font-weight="700" text-anchor="middle">products</text>
    <text x="185" y="271" text-anchor="middle" fill="#5E5A52">16 rows · name, category</text>

    <rect x="850" y="197" width="250" height="96" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
    <text x="975" y="223" font-size="11.5" font-weight="700" fill="#2F5D8A" text-anchor="middle">DIMENSION</text>
    <text x="975" y="247" font-size="17" font-weight="700" text-anchor="middle">Date</text>
    <text x="975" y="271" text-anchor="middle" fill="#5E5A52">one row per day · year, quarter, month</text>
  </g>
  <g stroke="#8A6A1F" stroke-width="2.2" fill="none" marker-end="url(#f)">
    <path d="M580,118 L580,154"/><path d="M312,245 L434,245"/><path d="M848,245 L726,245"/>
  </g>
  <g font-size="13" font-weight="700" fill="#8A6A1F">
    <text x="592" y="132">1</text><text x="592" y="152">*</text>
    <text x="318" y="236">1</text><text x="420" y="236">*</text>
    <text x="836" y="236">1</text><text x="730" y="236">*</text>
  </g>
  <g font-size="13.5" fill="#2A2926">
    <text x="60" y="380" font-weight="700">Dimensions: what you filter and group by.</text>
    <text x="60" y="402">Put their fields on axes, rows and slicers.</text>
    <text x="620" y="380" font-weight="700">Fact: what you measure.</text>
    <text x="620" y="402">Its numbers go in Values, through measures.</text>
    <text x="60" y="446" fill="#8A6A1F">Arrows show filters flowing from the "1" side into the "*" side: pick Lagos in customers, and only Lagos orders are counted.</text>
  </g>
</g>
</svg>

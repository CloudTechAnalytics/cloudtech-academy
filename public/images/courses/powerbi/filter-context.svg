<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="How filter context works. In a matrix with region in rows and year in columns, the highlighted cell is Lagos in 2026. Its filter context is region = Lagos and Year = 2026. Power BI keeps only the 715 orders matching both, then evaluates Revenue = SUM(orders[revenue]) over them: 152,768,595 naira.">
<title>Filter context: each cell evaluates the measure over only the rows that match its filters.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="560" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">1 · A matrix visual</text>
<rect x="16.0" y="38.0" width="330.0" height="196.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,66 L17,46 Q17,39 24,39 L338,39 Q345,39 345,46 L345,66 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="26.0" y="56.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">Region</text>
<text xml:space="preserve" x="246.0" y="56.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">2025</text>
<text xml:space="preserve" x="336.0" y="56.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">2026</text>
<line x1="16.0" y1="66.0" x2="346.0" y2="66.0" stroke="#EDE6D8" stroke-width="1"/>
<rect x="257.0" y="67.0" width="88.0" height="26.0" rx="2" fill="#C9A867"/>
<text xml:space="preserve" x="26.0" y="84.5" font-size="13" fill="#2F5D8A" font-weight="400" text-anchor="start">Lagos</text>
<text xml:space="preserve" x="246.0" y="84.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">258.4m</text>
<text xml:space="preserve" x="336.0" y="84.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">152.8m</text>
<line x1="16.0" y1="94.0" x2="346.0" y2="94.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="112.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">North Central</text>
<text xml:space="preserve" x="246.0" y="112.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">50.4m</text>
<text xml:space="preserve" x="336.0" y="112.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">27.2m</text>
<line x1="16.0" y1="122.0" x2="346.0" y2="122.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="140.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">North West</text>
<text xml:space="preserve" x="246.0" y="140.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">64.9m</text>
<text xml:space="preserve" x="336.0" y="140.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">16.6m</text>
<line x1="16.0" y1="150.0" x2="346.0" y2="150.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="168.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">South East</text>
<text xml:space="preserve" x="246.0" y="168.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">40.9m</text>
<text xml:space="preserve" x="336.0" y="168.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">19.4m</text>
<line x1="16.0" y1="178.0" x2="346.0" y2="178.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="196.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">South South</text>
<text xml:space="preserve" x="246.0" y="196.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">45.3m</text>
<text xml:space="preserve" x="336.0" y="196.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">23.1m</text>
<line x1="16.0" y1="206.0" x2="346.0" y2="206.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="224.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">South West</text>
<text xml:space="preserve" x="246.0" y="224.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">79.8m</text>
<text xml:space="preserve" x="336.0" y="224.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">51.7m</text>
<text xml:space="preserve" x="16.0" y="252.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">Every cell runs the same measure:</text>
<text xml:space="preserve" x="16.0" y="274.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Revenue = SUM ( orders[revenue] )</text>
<text xml:space="preserve" x="380.0" y="28.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">2 · The highlighted cell's filters</text>
<rect x="380.0" y="42.0" width="250.0" height="36.0" rx="6" fill="#E6EEF6"/>
<text xml:space="preserve" x="392.0" y="65.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">customers[region] = Lagos</text>
<text xml:space="preserve" x="640.0" y="65.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">from the row</text>
<rect x="380.0" y="86.0" width="250.0" height="36.0" rx="6" fill="#E5F0E8"/>
<text xml:space="preserve" x="392.0" y="109.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Date[Year] = 2026</text>
<text xml:space="preserve" x="640.0" y="109.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">from the column</text>
<rect x="380.0" y="130.0" width="250.0" height="36.0" rx="6" fill="#EEEAF5"/>
<text xml:space="preserve" x="392.0" y="153.0" font-size="13.5" fill="#5C4F80" font-weight="700" text-anchor="start">Slicers, page filters: none</text>
<text xml:space="preserve" x="640.0" y="153.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">from the page</text>
<path d="M346.0,80.0 L374.0,60.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<path d="M346.0,84.0 L374.0,104.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="16.0" y="330.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">3 · Only matching orders are kept</text>
<rect x="16.0" y="340.0" width="360.0" height="135.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,367 L17,348 Q17,341 24,341 L368,341 Q375,341 375,348 L375,367 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="26.0" y="358.0" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">region</text>
<text xml:space="preserve" x="156.0" y="358.0" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">year</text>
<text xml:space="preserve" x="306.0" y="358.0" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">revenue</text>
<text xml:space="preserve" x="346.0" y="358.0" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="middle">kept?</text>
<rect x="18.0" y="368.0" width="356.0" height="25.0" rx="3" fill="#F3EBD8"/>
<text xml:space="preserve" x="26.0" y="385.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Lagos</text>
<text xml:space="preserve" x="156.0" y="385.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">2026</text>
<text xml:space="preserve" x="306.0" y="385.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">196,840</text>
<text xml:space="preserve" x="346.0" y="385.0" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="middle">✓</text>
<line x1="16.0" y1="394.0" x2="376.0" y2="394.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="412.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">North West</text>
<text xml:space="preserve" x="156.0" y="412.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">2025</text>
<text xml:space="preserve" x="306.0" y="412.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="end">86,400</text>
<text xml:space="preserve" x="346.0" y="412.0" font-size="13" fill="#9B2C1F" font-weight="400" text-anchor="middle">✗</text>
<rect x="18.0" y="422.0" width="356.0" height="25.0" rx="3" fill="#F3EBD8"/>
<text xml:space="preserve" x="26.0" y="439.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Lagos</text>
<text xml:space="preserve" x="156.0" y="439.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">2026</text>
<text xml:space="preserve" x="306.0" y="439.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">139,200</text>
<text xml:space="preserve" x="346.0" y="439.0" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="middle">✓</text>
<line x1="16.0" y1="448.0" x2="376.0" y2="448.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="466.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">Lagos</text>
<text xml:space="preserve" x="156.0" y="466.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">2025</text>
<text xml:space="preserve" x="306.0" y="466.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="end">260,400</text>
<text xml:space="preserve" x="346.0" y="466.0" font-size="13" fill="#9B2C1F" font-weight="400" text-anchor="middle">✗</text>
<text xml:space="preserve" x="16.0" y="492.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">… all 4,266 order lines are checked.</text>
<text xml:space="preserve" x="420.0" y="330.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">4 · The measure runs on them</text>
<rect x="420.0" y="340.0" width="324.0" height="136.0" rx="10" fill="#C9A867" stroke="#8A6A1F" stroke-width="1.6"/>
<text xml:space="preserve" x="440.0" y="370.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">SUM of revenue over 715 lines</text>
<text xml:space="preserve" x="440.0" y="414.0" font-size="28" fill="#2A2926" font-weight="700" text-anchor="start">₦152,768,595</text>
<text xml:space="preserve" x="440.0" y="452.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">shown as 152.8m in the cell</text>
<path d="M386.0,410.0 L414.0,410.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="16.0" y="530.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">A measure has no fixed answer: each cell brings its own filters. That set of filters is the filter</text>
<text xml:space="preserve" x="16.0" y="549.6" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">context.</text>
</g></svg>
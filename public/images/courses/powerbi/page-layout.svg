<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" role="img" aria-label="A wireframe of a well-laid-out report page, numbered in reading order. 1: a title stating the finding across the top left. 2: slicers together along the top right. 3: four KPI cards in a row, each with a comparison. 4: the main chart, a line of monthly revenue against last year, large on the left. 5: a sorted bar chart of revenue by region on the right, with North West highlighted. 6: an action table of customers whose orders fell most, across the bottom.">
<title>Report page layout in reading order: finding title, slicers, KPI cards, main trend chart, comparison bar chart, action table.</title>
<rect width="1160" height="520" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect x="40" y="20" width="1080" height="480" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <g font-size="12" font-weight="700" fill="#FFFFFF">
  </g>
  <!-- 1 title -->
  <text x="76" y="58" font-size="18" font-weight="700" fill="#2A2926">H1 2026: revenue up 19.1%; North West nearly halved</text>
  <!-- 2 slicers -->
  <rect x="800" y="38" width="96" height="28" rx="6" fill="#F3EBD8"/><text x="812" y="57" font-size="12" fill="#5E5A52">Year ▾</text>
  <rect x="906" y="38" width="96" height="28" rx="6" fill="#F3EBD8"/><text x="918" y="57" font-size="12" fill="#5E5A52">Channel ▾</text>
  <rect x="1012" y="38" width="90" height="28" rx="6" fill="#F3EBD8"/><text x="1024" y="57" font-size="12" fill="#5E5A52">Category ▾</text>
  <!-- 3 cards -->
  <g font-size="12" fill="#5E5A52">
    <rect x="64" y="86" width="240" height="72" rx="8" fill="#FBF8F2" stroke="#E3DACB"/><text x="80" y="108">Revenue</text><text x="80" y="136" font-size="20" font-weight="700" fill="#2A2926">₦290.7m</text><text x="80" y="152" fill="#2F6B3F">+19.1% vs H1 2025</text>
    <rect x="320" y="86" width="240" height="72" rx="8" fill="#FBF8F2" stroke="#E3DACB"/><text x="336" y="108">Active customers</text><text x="336" y="136" font-size="20" font-weight="700" fill="#2A2926">90</text><text x="336" y="152" fill="#2F6B3F">+17 vs H1 2025</text>
    <rect x="576" y="86" width="240" height="72" rx="8" fill="#FBF8F2" stroke="#E3DACB"/><text x="592" y="108">Order lines</text><text x="592" y="136" font-size="20" font-weight="700" fill="#2A2926">1,434</text><text x="592" y="152" fill="#2F6B3F">+8.4% vs H1 2025</text>
    <rect x="832" y="86" width="270" height="72" rx="8" fill="#FBF8F2" stroke="#E3DACB"/><text x="848" y="108">Lines per customer</text><text x="848" y="136" font-size="20" font-weight="700" fill="#2A2926">15.9</text><text x="848" y="152" fill="#9B2C1F">−12.1% vs H1 2025</text>
  </g>
  <!-- 4 line chart -->
  <rect x="64" y="176" width="600" height="190" rx="8" fill="#FBF8F2" stroke="#E3DACB"/>
  <text x="80" y="198" font-size="12.5" font-weight="700" fill="#2A2926">Every month of 2026 so far beat the same month of 2025</text>
  <polyline points="90,328 180,334 270,275 360,285 450,310 540,313" fill="none" stroke="#C9C2B5" stroke-width="2.4"/>
  <polyline points="90,260 180,294 270,247 360,228 450,273 540,276" fill="none" stroke="#B38A3E" stroke-width="2.8"/>
  <text x="552" y="280" font-size="11.5" fill="#8A6A1F" font-weight="700">2026</text><text x="552" y="318" font-size="11.5" fill="#8A847A">2025</text>
  <text x="90" y="354" font-size="11" fill="#5E5A52">Jan</text><text x="530" y="354" font-size="11" fill="#5E5A52">Jun</text>
  <!-- 5 bars -->
  <rect x="680" y="176" width="422" height="190" rx="8" fill="#FBF8F2" stroke="#E3DACB"/>
  <text x="696" y="198" font-size="12.5" font-weight="700" fill="#2A2926">Revenue by region, H1 2026</text>
  <g font-size="11" fill="#2A2926">
    <text x="790" y="226" text-anchor="end">Lagos</text><rect x="798" y="216" width="260" height="13" fill="#DCC594"/>
    <text x="790" y="250" text-anchor="end">South West</text><rect x="798" y="240" width="88" height="13" fill="#DCC594"/>
    <text x="790" y="274" text-anchor="end">North Central</text><rect x="798" y="264" width="46" height="13" fill="#DCC594"/>
    <text x="790" y="298" text-anchor="end">South South</text><rect x="798" y="288" width="39" height="13" fill="#DCC594"/>
    <text x="790" y="322" text-anchor="end">South East</text><rect x="798" y="312" width="33" height="13" fill="#DCC594"/>
    <text x="790" y="346" text-anchor="end" font-weight="700" fill="#9B2C1F">North West</text><rect x="798" y="336" width="28" height="13" fill="#9B2C1F"/>
  </g>
  <!-- 6 table -->
  <rect x="64" y="382" width="1038" height="100" rx="8" fill="#FBF8F2" stroke="#E3DACB"/>
  <text x="80" y="404" font-size="12.5" font-weight="700" fill="#2A2926">Customers to call: biggest fall in order lines vs H1 2025</text>
  <g font-size="11.5" fill="#5E5A52"><text x="80" y="428">Customer</text><text x="380" y="428">Region</text><text x="560" y="428">Rep</text><text x="760" y="428">Lines H1 2025</text><text x="900" y="428">Lines H1 2026</text></g>
  <rect x="80" y="438" width="1000" height="10" rx="3" fill="#EFE8DA"/><rect x="80" y="456" width="1000" height="10" rx="3" fill="#EFE8DA"/>
  <!-- numbers -->
  <g font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="52" cy="52" r="12" fill="#2F5D8A"/><text x="52" y="57">1</text>
    <circle cx="788" cy="52" r="12" fill="#2F5D8A"/><text x="788" y="57">2</text>
    <circle cx="52" cy="122" r="12" fill="#2F5D8A"/><text x="52" y="127">3</text>
    <circle cx="52" cy="270" r="12" fill="#2F5D8A"/><text x="52" y="275">4</text>
    <circle cx="668" cy="270" r="12" fill="#2F5D8A"/><text x="668" y="275">5</text>
    <circle cx="52" cy="432" r="12" fill="#2F5D8A"/><text x="52" y="437">6</text>
  </g>
</g>
</svg>

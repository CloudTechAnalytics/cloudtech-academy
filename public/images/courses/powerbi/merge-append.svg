<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="Merge versus append. Merge adds columns: each order row gets the matching product's category, looked up by product_id, like XLOOKUP or a SQL join. Append adds rows: the January and February order files have the same columns and are stacked into one longer table, like SQL UNION ALL.">

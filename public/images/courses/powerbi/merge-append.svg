<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400" role="img" aria-label="Merge versus append. Merge adds columns: each order row gets the matching product's category, looked up by product_id, like XLOOKUP or a SQL join. Append adds rows: the January and February order files have the same columns and are stacked into one longer table, like SQL UNION ALL.">
<title>Merge adds columns by matching a key; append stacks tables with the same columns.</title>
<rect width="1160" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#2A2926">
  <text x="40" y="36" font-size="16" font-weight="700">Merge: adds columns</text>
  <text x="40" y="56" fill="#5E5A52">Match rows on a key, like XLOOKUP or a SQL JOIN</text>
  <rect x="40" y="72" width="200" height="118" rx="8" fill="#FFFFFF" stroke="#CFC4B2"/>
  <text x="54" y="94" font-weight="700">orders</text>
  <text x="54" y="118" font-family="Consolas, monospace">10001 · product 3</text>
  <text x="54" y="140" font-family="Consolas, monospace">10002 · product 1</text>
  <text x="54" y="162" font-family="Consolas, monospace">10003 · product 2</text>
  <rect x="260" y="72" width="170" height="118" rx="8" fill="#FFFFFF" stroke="#CFC4B2"/>
  <text x="274" y="94" font-weight="700">products</text>
  <text x="274" y="118" font-family="Consolas, monospace">1 · Beverages</text>
  <text x="274" y="140" font-family="Consolas, monospace">2 · Beverages</text>
  <text x="274" y="162" font-family="Consolas, monospace">3 · Beverages</text>
  <text x="235" y="215" font-size="24" fill="#8A6A1F" text-anchor="middle">↓</text>
  <rect x="40" y="232" width="390" height="118" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
  <text x="54" y="254" font-weight="700">orders, merged</text>
  <text x="54" y="278" font-family="Consolas, monospace">10001 · product 3 · <tspan fill="#2F5D8A" font-weight="700">Beverages</tspan></text>
  <text x="54" y="300" font-family="Consolas, monospace">10002 · product 1 · <tspan fill="#2F5D8A" font-weight="700">Beverages</tspan></text>
  <text x="54" y="322" font-family="Consolas, monospace">10003 · product 2 · <tspan fill="#2F5D8A" font-weight="700">Beverages</tspan></text>
  <text x="40" y="378" fill="#5E5A52">Same number of rows; one new column. (First three products shown.)</text>

  <line x1="560" x2="560" y1="30" y2="370" stroke="#E3DACB"/>

  <text x="620" y="36" font-size="16" font-weight="700">Append: adds rows</text>
  <text x="620" y="56" fill="#5E5A52">Stack tables with the same columns, like SQL UNION ALL</text>
  <rect x="620" y="72" width="230" height="96" rx="8" fill="#FFFFFF" stroke="#CFC4B2"/>
  <text x="634" y="94" font-weight="700">orders_jan</text>
  <text x="634" y="118" font-family="Consolas, monospace">order_id · date · qty</text>
  <text x="634" y="140" font-family="Consolas, monospace">… 213 rows</text>
  <rect x="870" y="72" width="230" height="96" rx="8" fill="#FFFFFF" stroke="#CFC4B2"/>
  <text x="884" y="94" font-weight="700">orders_feb</text>
  <text x="884" y="118" font-family="Consolas, monospace">order_id · date · qty</text>
  <text x="884" y="140" font-family="Consolas, monospace">… 187 rows</text>
  <text x="860" y="205" font-size="24" fill="#8A6A1F" text-anchor="middle">↓</text>
  <rect x="740" y="222" width="240" height="128" rx="8" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="1.6"/>
  <text x="754" y="244" font-weight="700">orders, appended</text>
  <text x="754" y="268" font-family="Consolas, monospace">order_id · date · qty</text>
  <text x="754" y="290" font-family="Consolas, monospace" fill="#2F6B3F">… 213 January rows</text>
  <text x="754" y="312" font-family="Consolas, monospace" fill="#2F6B3F">… 187 February rows</text>
  <text x="754" y="334" font-family="Consolas, monospace" font-weight="700">= 400 rows</text>
  <text x="620" y="378" fill="#5E5A52">Same columns; more rows. Columns are matched by name.</text>
</g>
</svg>

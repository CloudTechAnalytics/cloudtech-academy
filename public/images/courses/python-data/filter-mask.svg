<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" role="img" aria-label="Filtering rows with a condition. The condition quantity greater than or equal to 8 gives True or False for each row; pandas keeps only the rows where it is True. For five illustrative rows with quantities 12, 5, 8, 3 and 20, the mask is True, False, True, False, True, so three rows are kept. To combine conditions use &amp; for and, and the pipe for or, with brackets around each condition.">
<title>A condition makes a True/False mask; only the True rows are kept.</title>

<rect width="760" height="436" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">orders["quantity"] &gt;= 8</text>
<text xml:space="preserve" x="70.0" y="54.0" font-size="11" fill="#5E5A52" font-weight="700" text-anchor="start">row</text>
<text xml:space="preserve" x="150.0" y="54.0" font-size="11" fill="#5E5A52" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">quantity</text>
<text xml:space="preserve" x="290.0" y="54.0" font-size="11" fill="#5E5A52" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">mask</text>
<text xml:space="preserve" x="430.0" y="54.0" font-size="11" fill="#5E5A52" font-weight="700" text-anchor="start">kept?</text>
<rect x="16.0" y="62.0" width="560.0" height="30.0" rx="4" fill="#E5F0E8"/>
<text xml:space="preserve" x="70.0" y="82.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">0</text>
<text xml:space="preserve" x="150.0" y="82.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">12</text>
<text xml:space="preserve" x="290.0" y="82.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">True</text>
<text xml:space="preserve" x="430.0" y="82.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">✓ kept</text>
<rect x="16.0" y="96.0" width="560.0" height="30.0" rx="4" fill="#F2EFE8"/>
<text xml:space="preserve" x="70.0" y="116.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">1</text>
<text xml:space="preserve" x="150.0" y="116.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">5</text>
<text xml:space="preserve" x="290.0" y="116.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">False</text>
<text xml:space="preserve" x="430.0" y="116.0" font-size="12" fill="#5E5A52" font-weight="700" text-anchor="start">✗ dropped</text>
<rect x="16.0" y="130.0" width="560.0" height="30.0" rx="4" fill="#E5F0E8"/>
<text xml:space="preserve" x="70.0" y="150.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">2</text>
<text xml:space="preserve" x="150.0" y="150.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">8</text>
<text xml:space="preserve" x="290.0" y="150.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">True</text>
<text xml:space="preserve" x="430.0" y="150.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">✓ kept</text>
<rect x="16.0" y="164.0" width="560.0" height="30.0" rx="4" fill="#F2EFE8"/>
<text xml:space="preserve" x="70.0" y="184.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">3</text>
<text xml:space="preserve" x="150.0" y="184.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">3</text>
<text xml:space="preserve" x="290.0" y="184.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">False</text>
<text xml:space="preserve" x="430.0" y="184.0" font-size="12" fill="#5E5A52" font-weight="700" text-anchor="start">✗ dropped</text>
<rect x="16.0" y="198.0" width="560.0" height="30.0" rx="4" fill="#E5F0E8"/>
<text xml:space="preserve" x="70.0" y="218.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">4</text>
<text xml:space="preserve" x="150.0" y="218.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">20</text>
<text xml:space="preserve" x="290.0" y="218.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">True</text>
<text xml:space="preserve" x="430.0" y="218.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">✓ kept</text>
<rect x="600.0" y="62.0" width="144.0" height="164.0" rx="10" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="614.0" y="86.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Result</text>
<text xml:space="preserve" x="614.0" y="112.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">3 rows:</text>
<text xml:space="preserve" x="614.0" y="136.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">qty 12</text>
<text xml:space="preserve" x="614.0" y="160.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">qty 8</text>
<text xml:space="preserve" x="614.0" y="184.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">qty 20</text>
<text xml:space="preserve" x="16.0" y="260.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Combining conditions</text>
<rect x="16.0" y="272.0" width="728.0" height="70.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="296.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">big_2026 = orders[(orders["quantity"] &gt;= 8) &amp; (orders["year"] == 2026)]</text>
<text xml:space="preserve" x="28.0" y="320.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">either   = orders[(orders["quantity"] &gt;= 8) | (orders["discount_pct"] &gt; 0)]</text>
<rect x="16.0" y="356.0" width="232.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="380.0" font-size="15" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&amp;</text>
<text xml:space="preserve" x="76.0" y="380.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">and: both must be True</text>
<rect x="264.0" y="356.0" width="232.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="278.0" y="380.0" font-size="15" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">|</text>
<text xml:space="preserve" x="324.0" y="380.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">or: either one is enough</text>
<rect x="512.0" y="356.0" width="232.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="526.0" y="380.0" font-size="15" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">( )</text>
<text xml:space="preserve" x="572.0" y="380.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">brackets around each condition</text>
</g></svg>
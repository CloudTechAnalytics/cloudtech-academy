<text xml:space="preserve" x="28.0" y="177.0" font-size="12.5" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">North</text>
<text xml:space="preserve" x="180.0" y="177.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace">150</text>

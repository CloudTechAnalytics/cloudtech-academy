<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="groupby splits a table into groups, applies a calculation to each, and combines the results. For six illustrative rows with a region and revenue, grouping by region puts the three North rows together, 100, 250 and 150, and the three South rows together, 300, 50 and 100. Summing each group gives North 500 and South 450. This is the pandas version of a pivot table.">
<title>groupby: split into groups, calculate for each, combine the results.</title>

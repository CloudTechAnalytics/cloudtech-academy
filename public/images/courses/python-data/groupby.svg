<text xml:space="preserve" x="558.0" y="156.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">South    450</text>
<rect x="16.0" y="262.0" width="728.0" height="46.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="286.0" font-size="13" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">sales.groupby("region")["revenue"].sum()</text>
<text xml:space="preserve" x="16.0" y="336.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Same idea, other summaries: .mean(), .count(), .max(), .min().</text>
<text xml:space="preserve" x="16.0" y="360.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Add .sort_values(ascending=False) to rank the groups, and .idxmax() to name the biggest one.</text>
<text xml:space="preserve" x="16.0" y="388.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">It's the pandas version of an Excel pivot table, in one line.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="What a DataFrame is. A table with named columns, an index of row numbers starting at 0, and one type per column. A small illustrative tea-orders table has columns order_id, product_id, quantity and unit_price. Below, the first-look commands: head shows the first rows, info lists columns, types and missing values, describe gives summary statistics for numbers, value_counts counts each value of a column, and nunique counts the different values.">
<title>A DataFrame is a table: named columns, a row index, one type per column.</title>


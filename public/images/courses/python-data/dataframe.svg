<rect x="388.0" y="272.0" width="356.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="400.0" y="292.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">orders.shape</text>
<text xml:space="preserve" x="400.0" y="309.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">(rows, columns)</text>
<rect x="16.0" y="324.0" width="356.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="344.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">orders.info()</text>
<text xml:space="preserve" x="28.0" y="361.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">columns, types, missing values</text>
<rect x="388.0" y="324.0" width="356.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="400.0" y="344.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">orders.describe()</text>
<text xml:space="preserve" x="400.0" y="361.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">min, mean, max of number columns</text>
<rect x="16.0" y="376.0" width="356.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="396.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">orders["product_id"].value_counts()</text>
<text xml:space="preserve" x="28.0" y="413.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">how often each value appears</text>

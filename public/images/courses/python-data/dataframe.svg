<text xml:space="preserve" x="400.0" y="396.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">orders["product_id"].nunique()</text>
<text xml:space="preserve" x="400.0" y="413.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">how many different values</text>
</g></svg>
<text xml:space="preserve" x="16.0" y="268.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Revenue (₦m), illustrative</text>
<rect x="16.0" y="284.0" width="728.0" height="88.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="308.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">by_group = sales.groupby("group")["revenue"].sum()</text>
<text xml:space="preserve" x="28.0" y="330.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">by_group.plot(kind="bar", title="Revenue by group")</text>
<text xml:space="preserve" x="28.0" y="352.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">monthly.plot(kind="line", title="Monthly revenue")</text>
<text xml:space="preserve" x="16.0" y="396.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Always add a title and label the axes: a chart should make sense without anyone explaining it.</text>
<text xml:space="preserve" x="16.0" y="420.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Bars for categories, lines for time, and write one sentence with a number under each chart.</text>
</g></svg>
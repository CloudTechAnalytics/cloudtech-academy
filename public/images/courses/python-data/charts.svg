<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Two kinds of chart for two kinds of question, drawn with illustrative numbers. A bar chart compares categories: revenue by product group, here Tea 46, Coffee 31, Juice 24 and Water 12 million naira. A line chart shows change over time: monthly revenue from January to June, rising from 20 to a peak of 38 in May. In pandas, call plot with kind bar or kind line on a summary, and add a title and axis labels.">
<title>Bars compare categories; lines show change over time.</title>


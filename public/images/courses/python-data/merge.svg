<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Joining two tables with merge. The orders table has product_id but not names. The products table has product_id and a product name. merge matches rows where product_id has the same value, like a lookup in Excel, and adds the name columns to each order. An order for P2 gets the name Black Tea, because P2 matches P2 in the products table.">
<title>merge matches rows on a key column, like a lookup in Excel.</title>

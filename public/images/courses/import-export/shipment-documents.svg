<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Five parties in order: the supplier, the freight forwarder, the shipping line or airline, customs and the clearing agent, and the importer. Under each is the document it handles, such as the commercial invoice, packing list, bill of lading or air waybill, Form M and the duty receipt.">
<title>The path of a shipment and the documents that travel with it.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5A52"/></marker></defs>
<rect width="760" height="330" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text x="16" y="26.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">Documents follow the goods, and they must all agree</text>
<rect x="16" y="52" width="134" height="92" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<text x="28" y="80.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Supplier</text>
<text x="28" y="124.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Packs and sells</text>
<line x1="83" y1="144" x2="83" y2="176" stroke="#8A6A1F" stroke-width="1.4"/>
<rect x="16" y="176" width="134" height="98" rx="10" fill="#F3EBD8"/>
<text x="28" y="198.0" font-size="10" fill="#8A6A1F" font-weight="700" text-anchor="start">Documents</text>
<text x="28" y="216.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">Commercial</text>
<text x="28" y="230.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">invoice, packing</text>
<text x="28" y="244.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">list</text>
<line x1="150" y1="98" x2="162" y2="98" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="162" y="52" width="134" height="92" rx="10" fill="#FFFFFF" stroke="#1F6F43" stroke-width="1.6"/>
<text x="174" y="80.0" font-size="12.5" fill="#1F6F43" font-weight="700" text-anchor="start">Freight</text>
<text x="174" y="95.0" font-size="12.5" fill="#1F6F43" font-weight="700" text-anchor="start">forwarder</text>
<text x="174" y="124.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Books the transport</text>
<line x1="229" y1="144" x2="229" y2="176" stroke="#1F6F43" stroke-width="1.4"/>
<rect x="162" y="176" width="134" height="98" rx="10" fill="#E1F0E7"/>
<text x="174" y="198.0" font-size="10" fill="#1F6F43" font-weight="700" text-anchor="start">Documents</text>
<text x="174" y="216.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">Booking, bill of</text>
<text x="174" y="230.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">lading or air</text>
<text x="174" y="244.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">waybill</text>
<line x1="296" y1="98" x2="308" y2="98" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="308" y="52" width="134" height="92" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<text x="320" y="80.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Ship or airline</text>
<text x="320" y="124.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Carries the goods</text>
<line x1="375" y1="144" x2="375" y2="176" stroke="#8A6A1F" stroke-width="1.4"/>
<rect x="308" y="176" width="134" height="98" rx="10" fill="#F3EBD8"/>
<text x="320" y="198.0" font-size="10" fill="#8A6A1F" font-weight="700" text-anchor="start">Documents</text>
<text x="320" y="216.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">Bill of lading or</text>
<text x="320" y="230.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">air waybill</text>
<line x1="442" y1="98" x2="454" y2="98" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="454" y="52" width="134" height="92" rx="10" fill="#FFFFFF" stroke="#1F6F43" stroke-width="1.6"/>
<text x="466" y="80.0" font-size="12.5" fill="#1F6F43" font-weight="700" text-anchor="start">Customs and</text>
<text x="466" y="95.0" font-size="12.5" fill="#1F6F43" font-weight="700" text-anchor="start">agent</text>
<text x="466" y="124.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Checks, values, taxes</text>
<line x1="521" y1="144" x2="521" y2="176" stroke="#1F6F43" stroke-width="1.4"/>
<rect x="454" y="176" width="134" height="98" rx="10" fill="#E1F0E7"/>
<text x="466" y="198.0" font-size="10" fill="#1F6F43" font-weight="700" text-anchor="start">Documents</text>
<text x="466" y="216.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">Form M, PAAR, duty</text>
<text x="466" y="230.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">receipt</text>
<line x1="588" y1="98" x2="600" y2="98" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="600" y="52" width="134" height="92" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<text x="612" y="80.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">You, the</text>
<text x="612" y="95.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">importer</text>
<text x="612" y="124.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Receives and sells</text>
<line x1="667" y1="144" x2="667" y2="176" stroke="#8A6A1F" stroke-width="1.4"/>
<rect x="600" y="176" width="134" height="98" rx="10" fill="#F3EBD8"/>
<text x="612" y="198.0" font-size="10" fill="#8A6A1F" font-weight="700" text-anchor="start">Documents</text>
<text x="612" y="216.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">Release order,</text>
<text x="612" y="230.0" font-size="11.5" fill="#2A2926" font-weight="500" text-anchor="start">delivery note</text>
<text x="16" y="304.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">A name, quantity, weight or value that differs between documents is the most common cause of delay.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Ten steps in two rows: choose a product, check the market, find suppliers, verify the supplier, negotiate and order samples, ship it, documents and customs, count the real cost, price it, then sell and reorder.">
<title>The ten steps of a mini importation, from choosing a product to selling it.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5A52"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text x="16" y="26.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">The journey of one mini importation, in ten steps</text>
<rect x="16" y="46" width="134" height="138" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<circle cx="40" cy="72" r="15" fill="#8A6A1F"/>
<text x="40" y="77.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="28" y="108.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Choose a product</text>
<text x="28" y="144.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Find an item people</text>
<text x="28" y="156.5" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">already buy</text>
<text x="28" y="176.0" font-size="10" fill="#8A6A1F" font-weight="700" text-anchor="start">Lesson 2</text>
<line x1="150" y1="115" x2="162" y2="115" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="162" y="46" width="134" height="138" rx="10" fill="#FFFFFF" stroke="#1F6F43" stroke-width="1.6"/>
<circle cx="186" cy="72" r="15" fill="#1F6F43"/>
<text x="186" y="77.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="174" y="108.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Check the market</text>
<text x="174" y="144.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Demand, competition,</text>
<text x="174" y="156.5" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">margin</text>
<text x="174" y="176.0" font-size="10" fill="#1F6F43" font-weight="700" text-anchor="start">Lesson 2</text>
<line x1="296" y1="115" x2="308" y2="115" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="308" y="46" width="134" height="138" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<circle cx="332" cy="72" r="15" fill="#8A6A1F"/>
<text x="332" y="77.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="320" y="108.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Find suppliers</text>
<text x="320" y="144.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Platforms, markets,</text>
<text x="320" y="156.5" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">agents</text>
<text x="320" y="176.0" font-size="10" fill="#8A6A1F" font-weight="700" text-anchor="start">Lesson 3</text>
<line x1="442" y1="115" x2="454" y2="115" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="454" y="46" width="134" height="138" rx="10" fill="#FFFFFF" stroke="#1F6F43" stroke-width="1.6"/>
<circle cx="478" cy="72" r="15" fill="#1F6F43"/>
<text x="478" y="77.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="466" y="108.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Verify the</text>
<text x="466" y="123.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">supplier</text>
<text x="466" y="144.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Scam checks, safe</text>
<text x="466" y="156.5" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">payment</text>
<text x="466" y="176.0" font-size="10" fill="#1F6F43" font-weight="700" text-anchor="start">Lesson 4</text>
<line x1="588" y1="115" x2="600" y2="115" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="600" y="46" width="134" height="138" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<circle cx="624" cy="72" r="15" fill="#8A6A1F"/>
<text x="624" y="77.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="612" y="108.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Negotiate and</text>
<text x="612" y="123.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">sample</text>
<text x="612" y="144.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Price, MOQ, a sample</text>
<text x="612" y="156.5" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">first</text>
<text x="612" y="176.0" font-size="10" fill="#8A6A1F" font-weight="700" text-anchor="start">Lesson 5</text>
<rect x="16" y="214" width="134" height="138" rx="10" fill="#FFFFFF" stroke="#1F6F43" stroke-width="1.6"/>
<circle cx="40" cy="240" r="15" fill="#1F6F43"/>
<text x="40" y="245.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text x="28" y="276.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Ship it</text>
<text x="28" y="312.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Air or sea,</text>
<text x="28" y="324.5" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">forwarder, insurance</text>
<text x="28" y="344.0" font-size="10" fill="#1F6F43" font-weight="700" text-anchor="start">Lesson 6</text>
<line x1="150" y1="283" x2="162" y2="283" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="162" y="214" width="134" height="138" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<circle cx="186" cy="240" r="15" fill="#8A6A1F"/>
<text x="186" y="245.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
<text x="174" y="276.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Documents and</text>
<text x="174" y="291.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">customs</text>
<text x="174" y="312.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Invoice, B/L or AWB,</text>
<text x="174" y="324.5" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">HS code</text>
<text x="174" y="344.0" font-size="10" fill="#8A6A1F" font-weight="700" text-anchor="start">Lessons 7-8</text>
<line x1="296" y1="283" x2="308" y2="283" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="308" y="214" width="134" height="138" rx="10" fill="#FFFFFF" stroke="#1F6F43" stroke-width="1.6"/>
<circle cx="332" cy="240" r="15" fill="#1F6F43"/>
<text x="332" y="245.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">8</text>
<text x="320" y="276.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Count the real</text>
<text x="320" y="291.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">cost</text>
<text x="320" y="312.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Landed cost per unit</text>
<text x="320" y="344.0" font-size="10" fill="#1F6F43" font-weight="700" text-anchor="start">Lesson 9</text>
<line x1="442" y1="283" x2="454" y2="283" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="454" y="214" width="134" height="138" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<circle cx="478" cy="240" r="15" fill="#8A6A1F"/>
<text x="478" y="245.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">9</text>
<text x="466" y="276.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Price it</text>
<text x="466" y="312.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Set price for your</text>
<text x="466" y="324.5" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">margin</text>
<text x="466" y="344.0" font-size="10" fill="#8A6A1F" font-weight="700" text-anchor="start">Lesson 9</text>
<line x1="588" y1="283" x2="600" y2="283" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="600" y="214" width="134" height="138" rx="10" fill="#FFFFFF" stroke="#1F6F43" stroke-width="1.6"/>
<circle cx="624" cy="240" r="15" fill="#1F6F43"/>
<text x="624" y="245.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">10</text>
<text x="612" y="276.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Sell and reorder</text>
<text x="612" y="312.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">Channels, stock,</text>
<text x="612" y="324.5" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">cash flow</text>
<text x="612" y="344.0" font-size="10" fill="#1F6F43" font-weight="700" text-anchor="start">Lesson 10</text>
<text x="16" y="388.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Do the numbers (steps 2 and 8) before you spend money, and test with a small order before a big one.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="A bar chart of the landed cost items in naira: product 1,350,000, freight and insurance 240,000, duty 318,000, VAT 143,100, clearing and port charges 120,000, local transport 30,000 and bank charges 25,000. The total is 2,226,100 naira, which is 7,420 naira a unit.">
<title>Where the money goes: the landed cost of 300 power banks, item by item.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5E5A52"/></marker></defs>
<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text x="16" y="26.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">Landed cost of 300 power banks: ₦2,226,100, or ₦7,420 each</text>
<text x="16" y="71.0" font-size="12.5" fill="#2A2926" font-weight="500" text-anchor="start">Product (300 x $3)</text>
<rect x="190" y="50" width="400.0" height="30" rx="6" fill="#C9A45C"/>
<text x="598.0" y="71.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">₦1,350,000</text>
<text x="16" y="115.0" font-size="12.5" fill="#2A2926" font-weight="500" text-anchor="start">Freight and insurance</text>
<rect x="190" y="94" width="71.11111111111111" height="30" rx="6" fill="#C9A45C"/>
<text x="269.1111111111111" y="115.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">₦240,000</text>
<text x="16" y="159.0" font-size="12.5" fill="#2A2926" font-weight="500" text-anchor="start">Duty (20%)</text>
<rect x="190" y="138" width="94.22222222222221" height="30" rx="6" fill="#9B2C1F"/>
<text x="292.22222222222223" y="159.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">₦318,000</text>
<text x="16" y="203.0" font-size="12.5" fill="#2A2926" font-weight="500" text-anchor="start">VAT (7.5%)</text>
<rect x="190" y="182" width="42.4" height="30" rx="6" fill="#9B2C1F"/>
<text x="240.4" y="203.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">₦143,100</text>
<text x="16" y="247.0" font-size="12.5" fill="#2A2926" font-weight="500" text-anchor="start">Clearing and port</text>
<rect x="190" y="226" width="35.55555555555556" height="30" rx="6" fill="#2F4F7F"/>
<text x="233.55555555555554" y="247.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">₦120,000</text>
<text x="16" y="291.0" font-size="12.5" fill="#2A2926" font-weight="500" text-anchor="start">Local transport</text>
<rect x="190" y="270" width="8.88888888888889" height="30" rx="6" fill="#2F4F7F"/>
<text x="206.88888888888889" y="291.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">₦30,000</text>
<text x="16" y="335.0" font-size="12.5" fill="#2A2926" font-weight="500" text-anchor="start">Bank charges</text>
<rect x="190" y="314" width="7.4074074074074066" height="30" rx="6" fill="#2F4F7F"/>
<text x="205.40740740740742" y="335.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">₦25,000</text>
<rect x="16" y="366" width="12" height="12" rx="10" fill="#C9A45C"/>
<text x="34" y="377.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Goods and freight</text>
<rect x="166" y="366" width="12" height="12" rx="10" fill="#9B2C1F"/>
<text x="184" y="377.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Government duty and tax</text>
<rect x="340" y="366" width="12" height="12" rx="10" fill="#2F4F7F"/>
<text x="358" y="377.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">Local costs</text>
<text x="16" y="410.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">The supplier price looked like ₦4,500 a unit. Everything else adds up to about 65% more.</text>
</g>
</svg>

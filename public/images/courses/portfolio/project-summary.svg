<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="The four-part project summary: the problem, what I did, the result, and a link to see it. The example is a stock tracker for a campus shop: the problem was missed reorders, the work was a tracker with a low-stock warning, the result was no stock-outs in a month, and a link to the file.">
<title>Problem, what I did, result, see it.</title>

<rect width="760" height="420" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Four short parts for every project</text>
<rect x="16.0" y="42.0" width="728.0" height="80.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.4"/>
<circle cx="40.0" cy="66.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="40.0" y="70.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="62.0" y="71.0" font-size="14.5" fill="#2F5D8A" font-weight="700" text-anchor="start">The problem</text>
<text xml:space="preserve" x="62.0" y="94.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">What needed doing, and why.</text>
<text xml:space="preserve" x="320.0" y="71.0" font-size="11.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="320.0" y="91.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">The campus shop kept running out of airtime cards without</text>
<text xml:space="preserve" x="320.0" y="109.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">noticing.</text>
<rect x="16.0" y="130.0" width="728.0" height="80.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.4"/>
<circle cx="40.0" cy="154.0" r="12" fill="#B38A3E"/>
<text xml:space="preserve" x="40.0" y="158.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="62.0" y="159.0" font-size="14.5" fill="#B38A3E" font-weight="700" text-anchor="start">What I did</text>
<text xml:space="preserve" x="62.0" y="182.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">The tools and the steps.</text>
<text xml:space="preserve" x="320.0" y="159.0" font-size="11.5" fill="#B38A3E" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="320.0" y="179.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Built an Excel stock tracker with a formula that flags items</text>
<text xml:space="preserve" x="320.0" y="197.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">below 10.</text>
<rect x="16.0" y="218.0" width="728.0" height="80.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<circle cx="40.0" cy="242.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="40.0" y="246.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="62.0" y="247.0" font-size="14.5" fill="#2F6B3F" font-weight="700" text-anchor="start">The result</text>
<text xml:space="preserve" x="62.0" y="270.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">A number, an outcome or feedback.</text>
<text xml:space="preserve" x="320.0" y="247.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="320.0" y="267.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">No stock-outs for a full month; the owner kept using it.</text>
<rect x="16.0" y="306.0" width="728.0" height="80.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.4"/>
<circle cx="40.0" cy="330.0" r="12" fill="#5C4F80"/>
<text xml:space="preserve" x="40.0" y="334.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="62.0" y="335.0" font-size="14.5" fill="#5C4F80" font-weight="700" text-anchor="start">See it</text>
<text xml:space="preserve" x="62.0" y="358.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">A link, image or file.</text>
<text xml:space="preserve" x="320.0" y="335.0" font-size="11.5" fill="#5C4F80" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="320.0" y="355.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Screenshot and a view-only link to the file.</text>
<text xml:space="preserve" x="16.0" y="410.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Same structure on a portfolio page, on LinkedIn and in an interview.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="A one-page portfolio layout with five sections in order: header with name, one line and photo; about; three projects each with picture, summary and link; skills and credentials with verification links; contact with email and LinkedIn.">
<title>One page, five sections, in this order.</title>

<rect width="760" height="470" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">The page, top to bottom</text>
<rect x="16.0" y="40.0" width="440.0" height="416.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.6"/>
<rect x="17.0" y="41.0" width="438.0" height="26.0" rx="0" fill="#EFE4CC"/>
<circle cx="32.0" cy="54.0" r="4" fill="#DCC594"/>
<circle cx="46.0" cy="54.0" r="4" fill="#DCC594"/>
<circle cx="60.0" cy="54.0" r="4" fill="#DCC594"/>
<rect x="28.0" y="74.0" width="416.0" height="56.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.2"/>
<text xml:space="preserve" x="40.0" y="94.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start">1  Header</text>
<text xml:space="preserve" x="40.0" y="112.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Name, one line on what you do, photo</text>
<rect x="28.0" y="136.0" width="416.0" height="46.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.2"/>
<text xml:space="preserve" x="40.0" y="156.0" font-size="13" fill="#B38A3E" font-weight="700" text-anchor="start">2  About</text>
<text xml:space="preserve" x="40.0" y="174.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Two or three sentences</text>
<rect x="28.0" y="188.0" width="416.0" height="118.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.2"/>
<text xml:space="preserve" x="40.0" y="208.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">3  Projects</text>
<rect x="28.0" y="312.0" width="416.0" height="60.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.2"/>
<text xml:space="preserve" x="40.0" y="332.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="start">4  Skills and credentials</text>
<text xml:space="preserve" x="40.0" y="350.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Tools, badges, verify links</text>
<rect x="28.0" y="378.0" width="416.0" height="66.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.2"/>
<text xml:space="preserve" x="40.0" y="398.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">5  Contact</text>
<text xml:space="preserve" x="40.0" y="416.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Email and LinkedIn</text>
<rect x="40.0" y="232.0" width="120.0" height="36.0" rx="4" fill="#FFFFFF"/>
<text xml:space="preserve" x="100.0" y="254.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">picture</text>
<rect x="40.0" y="274.0" width="120.0" height="8.0" rx="3" fill="#C5DCCB"/>
<rect x="40.0" y="288.0" width="90.0" height="8.0" rx="3" fill="#C5DCCB"/>
<rect x="172.0" y="232.0" width="120.0" height="36.0" rx="4" fill="#FFFFFF"/>
<text xml:space="preserve" x="232.0" y="254.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">picture</text>
<rect x="172.0" y="274.0" width="120.0" height="8.0" rx="3" fill="#C5DCCB"/>
<rect x="172.0" y="288.0" width="90.0" height="8.0" rx="3" fill="#C5DCCB"/>
<rect x="304.0" y="232.0" width="120.0" height="36.0" rx="4" fill="#FFFFFF"/>
<text xml:space="preserve" x="364.0" y="254.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">picture</text>
<rect x="304.0" y="274.0" width="120.0" height="8.0" rx="3" fill="#C5DCCB"/>
<rect x="304.0" y="288.0" width="90.0" height="8.0" rx="3" fill="#C5DCCB"/>
<text xml:space="preserve" x="480.0" y="62.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Tips</text>
<text xml:space="preserve" x="480.0" y="88.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• One link for everything: CV,</text>
<text xml:space="preserve" x="480.0" y="105.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">LinkedIn, email signature.</text>
<text xml:space="preserve" x="480.0" y="154.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Google Sites is free and quick if</text>
<text xml:space="preserve" x="480.0" y="171.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">you're not sure which tool to use.</text>
<text xml:space="preserve" x="480.0" y="220.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Photo and headline answer: who are</text>
<text xml:space="preserve" x="480.0" y="237.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">you and what do you do?</text>
<text xml:space="preserve" x="480.0" y="286.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• No phone number or home address</text>
<text xml:space="preserve" x="480.0" y="303.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">needed.</text>
<text xml:space="preserve" x="480.0" y="352.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Test on your phone in a private</text>
<text xml:space="preserve" x="480.0" y="369.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">window.</text>
</g></svg>
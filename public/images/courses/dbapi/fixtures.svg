<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="How API tests get a fresh setup. Each test names the client fixture as a parameter. pytest runs the fixture first: it builds a new in-memory database with a few known rows, passes it to create_app, and hands the test client to the test. Every test gets its own fresh database, so tests can't affect each other. The same create_app runs in production with the real database.">
<title>A fixture builds a fresh database and app for every test.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="40.0" width="200.0" height="126.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="66.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start">Test</text>
<rect x="30.0" y="78.0" width="172.0" height="76.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="42.0" y="102.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">def test_404(client):</text>
<text xml:space="preserve" x="42.0" y="120.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">    r = client.get(…)</text>
<text xml:space="preserve" x="42.0" y="138.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">    assert …</text>
<path d="M218.0,95.0 L262.0,95.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="240.0" y="86.0" font-size="11" fill="#8A6A1F" font-weight="700" text-anchor="middle">asks for</text>
<rect x="266.0" y="40.0" width="478.0" height="110.0" rx="10" fill="#FFFFFF" stroke="#B38A3E" stroke-width="1.6"/>
<text xml:space="preserve" x="282.0" y="66.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">client fixture: runs before each test</text>
<rect x="282.0" y="82.0" width="142.0" height="54.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="292.0" y="104.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">fresh :memory: db</text>
<text xml:space="preserve" x="292.0" y="124.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">a few known rows</text>
<rect x="434.0" y="82.0" width="142.0" height="54.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="444.0" y="104.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">create_app(db)</text>
<text xml:space="preserve" x="444.0" y="124.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">app around that db</text>
<rect x="586.0" y="82.0" width="142.0" height="54.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="596.0" y="104.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">test_client()</text>
<text xml:space="preserve" x="596.0" y="124.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">handed to the test</text>
<rect x="16.0" y="186.0" width="356.0" height="100.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="32.0" y="210.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">In tests</text>
<text xml:space="preserve" x="32.0" y="234.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">create_app(test database): a fresh in-memory</text>
<text xml:space="preserve" x="32.0" y="252.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">copy for every test; nothing leaks between</text>
<text xml:space="preserve" x="32.0" y="270.2" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">tests.</text>
<rect x="388.0" y="186.0" width="356.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.4"/>
<text xml:space="preserve" x="404.0" y="210.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start">In production</text>
<text xml:space="preserve" x="404.0" y="234.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">create_app(real database): the same code, the</text>
<text xml:space="preserve" x="404.0" y="252.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">real data.</text>
<text xml:space="preserve" x="16.0" y="318.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Test each endpoint's success, each error status, and that a refused request changed nothing.</text>
<text xml:space="preserve" x="16.0" y="344.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Small, known rows make the expected answers easy to work out by hand.</text>
</g></svg>
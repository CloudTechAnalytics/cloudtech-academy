<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Constraints refusing bad rows at the door. A second customer with an existing ID is refused by the primary key. A customer with no business name is refused by NOT NULL. An invoice for customer C9999, which doesn't exist, is refused by the foreign key. An invoice with a 35 percent discount is refused by the CHECK that discounts are between 0 and 20. A valid row is accepted.">
<title>Each constraint refuses a different kind of bad row.</title>
<defs><marker id="a2F6B3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B3F"/></marker><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker><marker id="a9B2C1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B2C1F"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="13" fill="#5E5A52" font-weight="700" text-anchor="start">Incoming row (example)</text>
<text xml:space="preserve" x="476.0" y="28.0" font-size="13" fill="#5E5A52" font-weight="700" text-anchor="start">Database</text>
<rect x="16.0" y="40.0" width="300.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="66.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">customer C0001 again</text>
<path d="M318.0,61.0 L340.0,61.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="344.0" y="40.0" width="120.0" height="42.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="404.0" y="66.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">PRIMARY KEY</text>
<path d="M466.0,61.0 L488.0,61.0" fill="none" stroke="#9B2C1F" stroke-width="2" marker-end="url(#a9B2C1F)"/>
<rect x="492.0" y="40.0" width="252.0" height="42.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="506.0" y="66.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ refused: duplicate key</text>
<rect x="16.0" y="92.0" width="300.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="118.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">customer with no business_name</text>
<path d="M318.0,113.0 L340.0,113.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="344.0" y="92.0" width="120.0" height="42.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="404.0" y="118.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">NOT NULL</text>
<path d="M466.0,113.0 L488.0,113.0" fill="none" stroke="#9B2C1F" stroke-width="2" marker-end="url(#a9B2C1F)"/>
<rect x="492.0" y="92.0" width="252.0" height="42.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="506.0" y="118.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ refused: missing value</text>
<rect x="16.0" y="144.0" width="300.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="170.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">invoice for customer C9999</text>
<path d="M318.0,165.0 L340.0,165.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="344.0" y="144.0" width="120.0" height="42.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="404.0" y="170.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">REFERENCES</text>
<path d="M466.0,165.0 L488.0,165.0" fill="none" stroke="#9B2C1F" stroke-width="2" marker-end="url(#a9B2C1F)"/>
<rect x="492.0" y="144.0" width="252.0" height="42.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="506.0" y="170.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ refused: no such customer</text>
<rect x="16.0" y="196.0" width="300.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="222.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">invoice with discount_pct 35</text>
<path d="M318.0,217.0 L340.0,217.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="344.0" y="196.0" width="120.0" height="42.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="404.0" y="222.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">CHECK (0–20)</text>
<path d="M466.0,217.0 L488.0,217.0" fill="none" stroke="#9B2C1F" stroke-width="2" marker-end="url(#a9B2C1F)"/>
<rect x="492.0" y="196.0" width="252.0" height="42.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="506.0" y="222.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ refused: condition false</text>
<rect x="16.0" y="248.0" width="300.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="274.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">invoice for C0001, discount 10</text>
<path d="M318.0,269.0 L340.0,269.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="344.0" y="248.0" width="120.0" height="42.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="404.0" y="274.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="middle">all pass</text>
<path d="M466.0,269.0 L488.0,269.0" fill="none" stroke="#2F6B3F" stroke-width="2" marker-end="url(#a2F6B3F)"/>
<rect x="492.0" y="248.0" width="252.0" height="42.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.3"/>
<text xml:space="preserve" x="506.0" y="274.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">✓ inserted</text>
<rect x="16.0" y="312.0" width="728.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="336.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">SQLite only checks foreign keys after PRAGMA foreign_keys = ON, on every connection. An empty string ''</text>
<text xml:space="preserve" x="32.0" y="354.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">isn't NULL: NOT NULL lets it through, the foreign key doesn't.</text>
</g></svg>
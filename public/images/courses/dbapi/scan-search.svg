<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Scan versus index search for WHERE customer_id = 'C0007'. Without an index, the database reads every row of invoices, checking each one: a SCAN. With an index on customer_id, a sorted list of customer IDs with pointers to the rows, it jumps straight to C0007's entries and reads only those rows: a SEARCH. EXPLAIN QUERY PLAN shows which will happen.">

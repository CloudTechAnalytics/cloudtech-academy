<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="REST routes name things, and methods say what to do. A customer, at /customers/C0001, has invoices at /customers/C0001/invoices. An invoice, at /invoices/INV-100001, has payments; POST to its payments creates one and returns 201 Created. Lists are paginated: with 23 invoices, limit 10 and offset 10 return items 11 to 20, and the response includes the total so clients can page through.">
<title>Routes for things, methods for actions, status codes that mean something, and pagination.</title>

<rect width="760" height="420" fill="#FBF8F2"/>

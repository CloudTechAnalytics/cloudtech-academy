<text xml:space="preserve" x="32.0" y="262.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">PK: primary key, identifies each row</text>
<text xml:space="preserve" x="32.0" y="286.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">FK: foreign key, points to a row in another table</text>
<text xml:space="preserve" x="32.0" y="310.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">PK FK + PK: a composite key: invoice and line number</text>
<text xml:space="preserve" x="32.0" y="334.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">One customer → many invoices → many lines, many payments</text>
<text xml:space="preserve" x="32.0" y="362.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">No stored totals: calculate them from the lines.</text>
<text xml:space="preserve" x="16.0" y="410.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Money as integer kobo; dates as YYYY-MM-DD text, which sorts correctly.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Tallybook's schema as an entity-relationship diagram. customers has the primary key customer_id. invoices has the primary key invoice_id and a foreign key customer_id: one customer has zero or more invoices. invoice_lines has a composite primary key of invoice_id and line_no: one invoice has one or more lines. payments has its own payment_id and a foreign key invoice_id: one invoice has zero or more payments. Totals are not stored; they're calculated from the lines.">
<title>Tallybook's schema: four tables linked by keys.</title>


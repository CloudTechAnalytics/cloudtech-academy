<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="Rules that span requests need the database. An idempotency key sent with each request and enforced by a unique index makes a retried request create only one record. Rules such as one fee per order and never refunding more than was paid must be checked and written as one transaction, otherwise two requests can both read the old total and both write. A migration adds the new columns and index to the live table.">
<title>Idempotency keys, one transaction for check and write, and a migration.</title>

<rect width="760" height="450" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A frozen app and a second tap (invented example)</text>
<rect x="16.0" y="40.0" width="358.0" height="96.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="64.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Without a key</text>
<text xml:space="preserve" x="30.0" y="88.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Tap, tap → two requests → two records.</text>
<text xml:space="preserve" x="30.0" y="112.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">Two refunds for one return.</text>
<rect x="386.0" y="40.0" width="358.0" height="96.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="400.0" y="64.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">With a request_id and a unique index</text>
<text xml:space="preserve" x="400.0" y="88.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Tap, tap → same request_id.</text>
<text xml:space="preserve" x="400.0" y="112.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">The second insert is refused: one record.</text>
<text xml:space="preserve" x="16.0" y="168.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Check and write must be one unit</text>
<rect x="16.0" y="182.0" width="358.0" height="120.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="206.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Separate steps: a race</text>
<text xml:space="preserve" x="30.0" y="230.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">A reads total = 0   B reads total = 0</text>
<text xml:space="preserve" x="30.0" y="252.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">A writes 50         B writes 50</text>
<text xml:space="preserve" x="30.0" y="280.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">Total refunded 100: more than was paid.</text>
<rect x="386.0" y="182.0" width="358.0" height="120.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="400.0" y="206.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">One transaction: BEGIN IMMEDIATE</text>
<text xml:space="preserve" x="400.0" y="230.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">A locks, reads 0, writes 50, commits.</text>
<text xml:space="preserve" x="400.0" y="252.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">B waits, reads 50, checks, refuses.</text>
<text xml:space="preserve" x="400.0" y="280.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">Total never exceeds what was paid.</text>
<text xml:space="preserve" x="16.0" y="334.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Rules that span requests</text>
<rect x="16.0" y="348.0" width="360.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="371.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">✓  A fee refunded once per order</text>
<rect x="384.0" y="348.0" width="360.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<text xml:space="preserve" x="398.0" y="371.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">✓  Total refunded ≤ what was paid</text>
<rect x="16.0" y="396.0" width="728.0" height="44.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="414.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">A migration, not an edit: the live table already exists.</text>
<text xml:space="preserve" x="30.0" y="432.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Add the new column and unique index with a script that can run on it.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="SQL injection. Building a query by pasting the user's text into SQL lets a quote end the string early so the rest becomes SQL, turning a condition into one that is always true. Passing values separately through placeholders makes the database treat input as a value, never as SQL. Extra layers such as validation, least-privilege database users and logging help but do not replace parameters.">
<title>Never paste input into SQL: pass it as a parameter.</title>

<rect width="760" height="440" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">The same search, two ways (invented example)</text>
<rect x="16.0" y="40.0" width="358.0" height="172.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="64.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">✗  Pasted into the SQL</text>
<rect x="30.0" y="76.0" width="330.0" height="60.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="42.0" y="100.0" font-size="11" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">sql = f"SELECT * FROM bookings</text>
<text xml:space="preserve" x="42.0" y="119.0" font-size="11" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">       WHERE guest = '{name}'"</text>
<text xml:space="preserve" x="30.0" y="156.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Input:  x' OR 'a'='a</text>
<text xml:space="preserve" x="30.0" y="184.0" font-size="11.5" fill="#9B2C1F" font-weight="700" text-anchor="start">→ the WHERE clause is always true: all rows.</text>
<rect x="386.0" y="40.0" width="358.0" height="172.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="400.0" y="64.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">✓  Passed as a parameter</text>
<rect x="400.0" y="76.0" width="330.0" height="79.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="412.0" y="100.0" font-size="11" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">db.execute(</text>
<text xml:space="preserve" x="412.0" y="119.0" font-size="11" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  "SELECT * FROM bookings WHERE guest = ?",</text>
<text xml:space="preserve" x="412.0" y="138.0" font-size="11" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  (name,))</text>
<text xml:space="preserve" x="400.0" y="178.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">The input is a value, never SQL,</text>
<text xml:space="preserve" x="400.0" y="196.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">whatever characters it contains.</text>
<text xml:space="preserve" x="16.0" y="246.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Defence in depth: extra layers, none a replacement</text>
<rect x="16.0" y="260.0" width="170.0" height="82.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="2"/>
<text xml:space="preserve" x="28.0" y="286.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Parameters</text>
<text xml:space="preserve" x="28.0" y="306.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">The only reliable fix</text>
<rect x="202.0" y="260.0" width="170.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="214.0" y="286.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Validate the input</text>
<text xml:space="preserve" x="214.0" y="306.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Does it look like what</text>
<text xml:space="preserve" x="214.0" y="320.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">it should?</text>
<rect x="388.0" y="260.0" width="170.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="400.0" y="286.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Least privilege</text>
<text xml:space="preserve" x="400.0" y="306.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">A database user with</text>
<text xml:space="preserve" x="400.0" y="320.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">only the permissions</text>
<text xml:space="preserve" x="400.0" y="334.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">needed</text>
<rect x="574.0" y="260.0" width="170.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="586.0" y="286.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Log odd searches</text>
<text xml:space="preserve" x="586.0" y="306.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">So you notice attempts</text>
<rect x="16.0" y="364.0" width="728.0" height="58.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="388.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Why it matters</text>
<text xml:space="preserve" x="30.0" y="410.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">The same hole lets someone read, change or delete data, not just look at it.</text>
</g></svg>
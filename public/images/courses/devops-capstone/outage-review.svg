<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Reviewing an outage: define impact first, for example a minute is bad if more than five percent of requests failed. Plot metrics around the start to see what crossed a line, read the errors to see what failed, and separate the trigger, such as traffic rising, from the cause, why the system could not cope. The example is invented: a ticket drop where connections ran out.">
<title>Impact first; then what crossed a line; then trigger versus cause.</title>

<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Invented incident: a ticket drop at 12:00</text>
<rect x="40.0" y="40.0" width="440.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<rect x="50.0" y="160.0" width="26.0" height="20.0" rx="2" fill="#C5B38A"/>
<rect x="83.0" y="156.0" width="26.0" height="24.0" rx="2" fill="#C5B38A"/>
<rect x="116.0" y="140.0" width="26.0" height="40.0" rx="2" fill="#C5B38A"/>
<rect x="116.0" y="179.0" width="26.0" height="1.0" rx="2" fill="#9B2C1F"/>
<rect x="149.0" y="110.0" width="26.0" height="70.0" rx="2" fill="#C5B38A"/>
<rect x="149.0" y="178.0" width="26.0" height="2.0" rx="2" fill="#9B2C1F"/>
<rect x="182.0" y="90.0" width="26.0" height="90.0" rx="2" fill="#C5B38A"/>
<rect x="182.0" y="162.0" width="26.0" height="18.0" rx="2" fill="#9B2C1F"/>
<rect x="215.0" y="85.0" width="26.0" height="95.0" rx="2" fill="#C5B38A"/>
<rect x="215.0" y="140.0" width="26.0" height="40.0" rx="2" fill="#9B2C1F"/>
<rect x="248.0" y="84.0" width="26.0" height="96.0" rx="2" fill="#C5B38A"/>
<rect x="248.0" y="128.0" width="26.0" height="52.0" rx="2" fill="#9B2C1F"/>
<rect x="281.0" y="85.0" width="26.0" height="95.0" rx="2" fill="#C5B38A"/>
<rect x="281.0" y="130.0" width="26.0" height="50.0" rx="2" fill="#9B2C1F"/>
<rect x="314.0" y="88.0" width="26.0" height="92.0" rx="2" fill="#C5B38A"/>
<rect x="314.0" y="139.0" width="26.0" height="41.0" rx="2" fill="#9B2C1F"/>
<rect x="347.0" y="92.0" width="26.0" height="88.0" rx="2" fill="#C5B38A"/>
<rect x="347.0" y="168.0" width="26.0" height="12.0" rx="2" fill="#9B2C1F"/>
<rect x="380.0" y="120.0" width="26.0" height="60.0" rx="2" fill="#C5B38A"/>
<rect x="380.0" y="178.0" width="26.0" height="2.0" rx="2" fill="#9B2C1F"/>
<rect x="413.0" y="140.0" width="26.0" height="40.0" rx="2" fill="#C5B38A"/>
<rect x="413.0" y="179.0" width="26.0" height="1.0" rx="2" fill="#9B2C1F"/>
<rect x="446.0" y="150.0" width="26.0" height="30.0" rx="2" fill="#C5B38A"/>
<line x1="179.0" y1="48.0" x2="179.0" y2="184.0" stroke="#8A6A1F" stroke-width="1.4" stroke-dasharray="4 3"/>
<text xml:space="preserve" x="182.0" y="60.0" font-size="11" fill="#8A6A1F" font-weight="700" text-anchor="start">bad minutes begin</text>
<text xml:space="preserve" x="48.0" y="208.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">12:00 →  minute by minute</text>
<rect x="149.0" y="46.0" width="3.0" height="0.0" rx="0" fill="#9B2C1F"/>
<rect x="500.0" y="40.0" width="244.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="514.0" y="64.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Define "bad" first</text>
<text xml:space="preserve" x="514.0" y="86.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">A minute is bad if more than 5% of</text>
<text xml:space="preserve" x="514.0" y="102.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">requests failed.</text>
<text xml:space="preserve" x="514.0" y="128.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Start and end, and how many</text>
<text xml:space="preserve" x="514.0" y="144.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">requests failed.</text>
<text xml:space="preserve" x="16.0" y="238.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Trigger is not cause</text>
<rect x="16.0" y="252.0" width="358.0" height="82.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="276.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Trigger</text>
<text xml:space="preserve" x="30.0" y="298.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Traffic rose at 12:00. It was always going to.</text>
<text xml:space="preserve" x="30.0" y="318.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Stopping here leads to "buy more servers".</text>
<rect x="386.0" y="252.0" width="358.0" height="82.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="400.0" y="276.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Cause</text>
<text xml:space="preserve" x="400.0" y="298.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Why the system couldn't cope: database</text>
<text xml:space="preserve" x="400.0" y="318.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">connections ran out while servers sat idle.</text>
<text xml:space="preserve" x="16.0" y="364.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Read the errors: if one message dominates the bad minutes, it points at the cause.</text>
<text xml:space="preserve" x="16.0" y="386.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Postmortems should end with a fix aimed at the cause.</text>
</g></svg>
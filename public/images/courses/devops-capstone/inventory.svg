<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="Start with an inventory: every resource with its environment, owner, how it is managed and what it costs. Flag anything created by hand, anything with no owner, and anything public or unencrypted without a reason. The invented example is a festival ticketing site preparing for a big ticket drop.">

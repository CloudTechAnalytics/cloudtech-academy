<rect x="16.0" y="248.0" width="232.0" height="88.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="274.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Is it in Terraform?</text>
<text xml:space="preserve" x="30.0" y="296.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">By hand = not reviewed, not</text>
<text xml:space="preserve" x="30.0" y="310.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">reproducible, drifts silently.</text>
<rect x="264.0" y="248.0" width="232.0" height="88.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="278.0" y="274.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Who owns it?</text>
<text xml:space="preserve" x="278.0" y="296.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">A team answerable for it. No</text>
<text xml:space="preserve" x="278.0" y="310.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">owner = nobody fixes it.</text>
<rect x="512.0" y="248.0" width="232.0" height="88.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="526.0" y="274.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Is it exposed?</text>
<text xml:space="preserve" x="526.0" y="296.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Public or unencrypted needs a</text>
<text xml:space="preserve" x="526.0" y="310.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">reason.</text>

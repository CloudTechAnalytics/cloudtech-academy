<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Source strength and five checks. Usually strong: peer-reviewed articles and official statistics. Use with care: reputable newspapers and organisation reports, and Wikipedia for an overview. Usually avoid in assignments: anonymous blogs, social posts, and sites selling something. Five checks for any source: who wrote it, where it is published, when, why it exists, and what evidence it gives.">
<title>How strong is this source? Five checks decide.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Not all sources are equal</text>
<rect x="16.0" y="40.0" width="232.0" height="130.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="64.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">Usually strong</text>
<text xml:space="preserve" x="30.0" y="92.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Peer-reviewed articles</text>
<text xml:space="preserve" x="30.0" y="118.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Academic books</text>
<text xml:space="preserve" x="30.0" y="144.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Official statistics</text>
<rect x="264.0" y="40.0" width="232.0" height="130.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="278.0" y="64.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">Use with care</text>
<text xml:space="preserve" x="278.0" y="92.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Reputable newspapers</text>
<text xml:space="preserve" x="278.0" y="118.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Organisation reports</text>
<text xml:space="preserve" x="278.0" y="144.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Wikipedia (for its references)</text>
<rect x="512.0" y="40.0" width="232.0" height="130.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="526.0" y="64.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">Usually avoid</text>
<text xml:space="preserve" x="526.0" y="92.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Anonymous blogs</text>
<text xml:space="preserve" x="526.0" y="118.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Social media posts</text>
<text xml:space="preserve" x="526.0" y="144.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">• Clickbait, sales pages</text>
<text xml:space="preserve" x="16.0" y="206.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Five checks for any source</text>
<rect x="16.0" y="220.0" width="136.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="84.0" cy="248.0" r="18" fill="#8A6A1F"/>
<text xml:space="preserve" x="84.0" y="254.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="84.0" y="282.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">Who</text>
<text xml:space="preserve" x="84.0" y="302.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">Named expert or</text>
<text xml:space="preserve" x="84.0" y="317.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">organisation?</text>
<rect x="164.0" y="220.0" width="136.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="232.0" cy="248.0" r="18" fill="#8A6A1F"/>
<text xml:space="preserve" x="232.0" y="254.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="232.0" y="282.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">Where</text>
<text xml:space="preserve" x="232.0" y="302.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">Journal,</text>
<text xml:space="preserve" x="232.0" y="317.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">university,</text>
<text xml:space="preserve" x="232.0" y="332.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">government?</text>
<rect x="312.0" y="220.0" width="136.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="380.0" cy="248.0" r="18" fill="#8A6A1F"/>
<text xml:space="preserve" x="380.0" y="254.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="380.0" y="282.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">When</text>
<text xml:space="preserve" x="380.0" y="302.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">Recent enough for</text>
<text xml:space="preserve" x="380.0" y="317.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">the topic?</text>
<rect x="460.0" y="220.0" width="136.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="528.0" cy="248.0" r="18" fill="#8A6A1F"/>
<text xml:space="preserve" x="528.0" y="254.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="528.0" y="282.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">Why</text>
<text xml:space="preserve" x="528.0" y="302.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">To inform, sell or</text>
<text xml:space="preserve" x="528.0" y="317.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">get clicks?</text>
<rect x="608.0" y="220.0" width="136.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="676.0" cy="248.0" r="18" fill="#8A6A1F"/>
<text xml:space="preserve" x="676.0" y="254.0" font-size="17" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text xml:space="preserve" x="676.0" y="282.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">What</text>
<text xml:space="preserve" x="676.0" y="302.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">Data and</text>
<text xml:space="preserve" x="676.0" y="317.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">references, or</text>
<text xml:space="preserve" x="676.0" y="332.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">claims?</text>
<text xml:space="preserve" x="16.0" y="372.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">A page with no author, no date and no sources fails most of these.</text>
<text xml:space="preserve" x="16.0" y="396.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">'Use with care' still works: for a statistic, cite the original source the newspaper used.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" role="img" aria-label="Three honest ways to use a source, and one dishonest one. Quote: exact words in quotation marks with the page. Paraphrase: the idea in your own words and structure, with a citation. Summarise: the main point briefly, with a citation. Patchwriting: the original sentence with a few words swapped, which is still plagiarism even with a citation.">
<title>Quote, paraphrase, summarise; and the trap of patchwriting.</title>

<rect width="760" height="448" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="20.0" width="728.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="42.0" font-size="12" fill="#5E5A52" font-weight="700" text-anchor="start">Original (made-up example)</text>
<text xml:space="preserve" x="30.0" y="64.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-style="italic">"Bakeries that switched to gas ovens cut their monthly fuel costs by a quarter,</text>
<text xml:space="preserve" x="30.0" y="84.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-style="italic"> mainly because gas burns more evenly."  (Eze, 2021, p. 8)</text>
<rect x="16.0" y="108.0" width="728.0" height="68.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="134.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">Quote</text>
<text xml:space="preserve" x="30.0" y="154.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Exact words, in quotation marks,</text>
<text xml:space="preserve" x="30.0" y="168.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">with the page.</text>
<text xml:space="preserve" x="270.0" y="134.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Eze (2021) found costs fell "mainly because gas burns more evenly"</text>
<text xml:space="preserve" x="270.0" y="151.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">(p. 8).</text>
<rect x="16.0" y="184.0" width="728.0" height="68.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="210.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">Paraphrase</text>
<text xml:space="preserve" x="30.0" y="230.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">The idea in your own words and</text>
<text xml:space="preserve" x="30.0" y="244.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">structure.</text>
<text xml:space="preserve" x="270.0" y="210.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Moving to gas ovens lowered bakers' fuel bills by about 25% because</text>
<text xml:space="preserve" x="270.0" y="227.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">the heat is steadier (Eze, 2021).</text>
<rect x="16.0" y="260.0" width="728.0" height="68.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="286.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">Summarise</text>
<text xml:space="preserve" x="30.0" y="306.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">The main point, briefly.</text>
<text xml:space="preserve" x="270.0" y="286.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Gas ovens cut bakeries' fuel costs (Eze, 2021).</text>
<rect x="16.0" y="336.0" width="728.0" height="68.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="362.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">Patchwriting ✗</text>
<text xml:space="preserve" x="30.0" y="382.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Same sentence, a few words swapped.</text>
<text xml:space="preserve" x="270.0" y="362.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Bakeries that moved to gas ovens reduced monthly fuel costs by a</text>
<text xml:space="preserve" x="270.0" y="379.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">quarter, mainly as gas burns evenly (Eze, 2021).</text>
<text xml:space="preserve" x="16.0" y="436.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Even with a citation, a lightly reworded sentence is still copying.</text>
</g></svg>
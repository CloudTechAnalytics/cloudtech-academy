<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="An illustrative control chart of the daily refusal rate over six weeks. The baseline average and an upper limit at the average plus three standard deviations are drawn from the first 28 days. Daily values wander within the limit until day 36, when the rate jumps above it and stays high: an alert to investigate.">
<title>A control chart: a day outside the limit is unusual enough to investigate.</title>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Flexbox laying out cards. With display flex, flex-wrap wrap and a gap of 16 pixels, cards sit in a row on a wide screen, here four across, and wrap onto new lines on a phone, here one per row. Each card is set with flex: 1 1 200px, meaning it grows to share space but won't shrink below about 200 pixels.">
<title>Flexbox: a row of cards on wide screens that wraps on phones.</title>

<rect width="760" height="340" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Wide screen</text>
<rect x="16.0" y="38.0" width="468.0" height="96.0" rx="8" fill="#FFFFFF" stroke="#2A2926" stroke-width="1.8"/>
<rect x="28.0" y="52.0" width="100.0" height="68.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="78.0" y="92.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">card 1</text>
<rect x="140.0" y="52.0" width="100.0" height="68.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="190.0" y="92.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">card 2</text>
<rect x="252.0" y="52.0" width="100.0" height="68.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="302.0" y="92.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">card 3</text>
<rect x="364.0" y="52.0" width="100.0" height="68.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="414.0" y="92.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">card 4</text>
<text xml:space="preserve" x="512.0" y="28.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Phone</text>
<rect x="512.0" y="38.0" width="150.0" height="270.0" rx="14" fill="#FFFFFF" stroke="#2A2926" stroke-width="1.8"/>
<rect x="524.0" y="52.0" width="126.0" height="50.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="587.0" y="82.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">card 1</text>
<rect x="524.0" y="114.0" width="126.0" height="50.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="587.0" y="144.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">card 2</text>
<rect x="524.0" y="176.0" width="126.0" height="50.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="587.0" y="206.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">card 3</text>
<rect x="524.0" y="238.0" width="126.0" height="50.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="587.0" y="268.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">card 4</text>
<rect x="16.0" y="156.0" width="468.0" height="142.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="180.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">.projects {</text>
<text xml:space="preserve" x="28.0" y="200.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  display: flex;</text>
<text xml:space="preserve" x="28.0" y="220.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  flex-wrap: wrap;</text>
<text xml:space="preserve" x="28.0" y="240.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  gap: 16px;</text>
<text xml:space="preserve" x="28.0" y="260.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">}</text>
<text xml:space="preserve" x="28.0" y="280.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">.projects .box { flex: 1 1 200px; }</text>
<text xml:space="preserve" x="16.0" y="318.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Same CSS, different screens: the cards wrap when there isn't room.</text>
</g></svg>
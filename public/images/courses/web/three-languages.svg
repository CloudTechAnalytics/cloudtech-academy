<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" width="760" height="476" role="img" aria-label="How a web page is built. Your browser asks for index.html. The HTML file lists the other files it needs: style.css and script.js. The browser fetches them and draws the page. The three languages have different jobs: HTML is the structure, like the walls and rooms of a house; CSS is the style, like paint and furniture; JavaScript is the behaviour, like lights and switches. A minimal HTML file has a head, which holds the title shown in the browser tab, and a body, which holds everything visible.">
<title>HTML, CSS and JavaScript files come together in the browser to draw the page.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="476" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="20.0" width="250.0" height="64.0" rx="8" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="46.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">index.html</text>
<text xml:space="preserve" x="30.0" y="66.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">structure and content: the walls and rooms</text>
<path d="M268.0,52.0 L330.0,122.0" fill="none" stroke="#8A6A1F" stroke-width="1.8" marker-end="url(#a8A6A1F)"/>

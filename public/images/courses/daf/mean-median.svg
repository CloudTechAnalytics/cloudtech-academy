<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="A histogram of the value of Kolanut's 4,266 order lines, in bands of 50,000 naira. Most lines are worth under 250,000 naira, with a long tail of large lines up to 713,400 naira. The median, 166,680 naira, sits to the left of the mean, 194,689 naira, because the large lines pull the mean up.">
<title>Order line values: a long right tail pulls the mean (₦194,689) above the median (₦166,680).</title>


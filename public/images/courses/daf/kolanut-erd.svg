<text xml:space="preserve" x="308.0" y="74.5" font-size="11" fill="#8A6A1F" font-weight="700" text-anchor="start">PK</text>
<text xml:space="preserve" x="334.0" y="74.5" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">order_id</text>
<text xml:space="preserve" x="308.0" y="98.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">order_date</text>
<rect x="302.0" y="108.0" width="218.0" height="20.0" rx="4" fill="#E6EEF6"/>

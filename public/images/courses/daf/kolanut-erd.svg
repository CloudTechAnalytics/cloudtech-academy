<text xml:space="preserve" x="588.0" y="122.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">category</text>
<text xml:space="preserve" x="588.0" y="146.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">list_price</text>
<path d="M246,70.0 C272,70.0 270,118.0 296,118.0" fill="none" stroke="#8A6A1F" stroke-width="1.8"/>
<path d="M254.0,77.0 L254.0,63.0 M259.0,77.0 L259.0,63.0" fill="none" stroke="#8A6A1F" stroke-width="1.8"/>
<path d="M296.0,110.0 L284.0,118.0 L296.0,126.0" fill="none" stroke="#8A6A1F" stroke-width="1.8"/>
<circle cx="274.0" cy="118.0" r="5" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<path d="M576,70.0 C550,70.0 552,142.0 526,142.0" fill="none" stroke="#8A6A1F" stroke-width="1.8"/>
<path d="M568.0,63.0 L568.0,77.0 M563.0,63.0 L563.0,77.0" fill="none" stroke="#8A6A1F" stroke-width="1.8"/>
<path d="M526.0,150.0 L538.0,142.0 L526.0,134.0" fill="none" stroke="#8A6A1F" stroke-width="1.8"/>
<circle cx="548.0" cy="142.0" r="5" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<rect x="16.0" y="300.0" width="728.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="328.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">How to read it</text>
<text xml:space="preserve" x="32.0" y="354.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">PK, primary key: unique for every row of its table.</text>
<text xml:space="preserve" x="32.0" y="376.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">FK, foreign key: points to a primary key in another table.</text>
<text xml:space="preserve" x="32.0" y="398.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">The bar end means "one"; the fork (crow's foot) means "many".</text>
<text xml:space="preserve" x="32.0" y="420.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">Each customer has many order lines; each order line has one customer.</text>
</g></svg>
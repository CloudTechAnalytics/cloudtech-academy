<text xml:space="preserve" x="28.0" y="242.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">credit_limit</text>
<rect x="296.0" y="16.0" width="230.0" height="214.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M297.0,54.0 L297.0,26.0 Q297.0,17.0 306.0,17.0 L516.0,17.0 Q525.0,17.0 525.0,26.0 L525.0,54.0 Z" fill="#F3EBD8"/>
<text xml:space="preserve" x="308.0" y="41.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">orders</text>
<text xml:space="preserve" x="514.0" y="41.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">4,266 rows</text>

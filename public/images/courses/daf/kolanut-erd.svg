<text xml:space="preserve" x="308.0" y="146.5" font-size="11" fill="#2F5D8A" font-weight="700" text-anchor="start">FK</text>
<text xml:space="preserve" x="334.0" y="146.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">product_id</text>
<text xml:space="preserve" x="308.0" y="170.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">quantity</text>
<text xml:space="preserve" x="308.0" y="194.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">unit_price</text>
<text xml:space="preserve" x="308.0" y="218.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">discount_pct</text>
<rect x="576.0" y="16.0" width="168.0" height="142.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M577.0,54.0 L577.0,26.0 Q577.0,17.0 586.0,17.0 L734.0,17.0 Q743.0,17.0 743.0,26.0 L743.0,54.0 Z" fill="#F3EBD8"/>
<text xml:space="preserve" x="588.0" y="41.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">products</text>
<text xml:space="preserve" x="732.0" y="41.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="end">16 rows</text>
<rect x="582.0" y="60.0" width="156.0" height="20.0" rx="4" fill="#FBF3E2"/>
<text xml:space="preserve" x="588.0" y="74.5" font-size="11" fill="#8A6A1F" font-weight="700" text-anchor="start">PK</text>
<text xml:space="preserve" x="614.0" y="74.5" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">product_id</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Kolanut's three tables and how they connect. customers has the primary key customer_id; products has the primary key product_id; orders has its own primary key order_id plus two foreign keys, customer_id and product_id. One customer has many order lines; one product appears on many order lines.">
<title>Kolanut's tables: customers and products each link one-to-many to orders.</title>


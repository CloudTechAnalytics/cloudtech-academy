<text xml:space="preserve" x="28.0" y="98.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">customer_name</text>
<text xml:space="preserve" x="28.0" y="122.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">channel</text>
<text xml:space="preserve" x="28.0" y="146.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">region</text>
<text xml:space="preserve" x="28.0" y="170.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">city</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" width="1160" height="420" role="img" aria-label="Kolanut's three tables and how they connect. customers has the primary key customer_id; products has the primary key product_id; orders has its own primary key order_id plus two foreign keys, customer_id and product_id. One customer has many order lines; one product appears on many order lines.">
<title>Kolanut's tables: customers and products each link one-to-many to orders through the foreign keys customer_id and product_id.</title>
<rect width="1160" height="420" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- customers -->
  <rect x="40" y="60" width="270" height="290" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <rect x="41" y="61" width="268" height="40" rx="9" fill="#F3EBD8"/>
  <text x="60" y="87" font-size="16" font-weight="700" fill="#2A2926">customers</text><text x="290" y="87" font-size="12" fill="#5E5A52" text-anchor="end">90 rows</text>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#2A2926">
    <rect x="50" y="110" width="250" height="28" rx="5" fill="#FBF3E2"/>
    <text x="62" y="129" font-weight="700">customer_id</text><text x="290" y="129" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#8A6A1F" text-anchor="end">PK</text>
    <text x="62" y="162">customer_name</text><text x="62" y="190">channel</text><text x="62" y="218">region</text><text x="62" y="246">city</text><text x="62" y="274">sales_rep</text><text x="62" y="302">joined_date</text><text x="62" y="330">credit_limit</text>
  </g>
  <!-- orders -->
  <rect x="445" y="60" width="270" height="262" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <rect x="446" y="61" width="268" height="40" rx="9" fill="#F3EBD8"/>
  <text x="465" y="87" font-size="16" font-weight="700" fill="#2A2926">orders</text><text x="695" y="87" font-size="12" fill="#5E5A52" text-anchor="end">4,266 rows</text>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#2A2926">
    <rect x="455" y="110" width="250" height="28" rx="5" fill="#FBF3E2"/>
    <text x="467" y="129" font-weight="700">order_id</text><text x="695" y="129" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#8A6A1F" text-anchor="end">PK</text>
    <text x="467" y="162">order_date</text>
    <rect x="455" y="168" width="250" height="28" rx="5" fill="#E6EEF6"/>
    <text x="467" y="187" font-weight="700">customer_id</text><text x="695" y="187" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#2F5D8A" text-anchor="end">FK</text>
    <rect x="455" y="196" width="250" height="28" rx="5" fill="#E5F0E8"/>
    <text x="467" y="215" font-weight="700">product_id</text><text x="695" y="215" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#2F6B3F" text-anchor="end">FK</text>
    <text x="467" y="246">quantity</text><text x="467" y="274">unit_price</text><text x="467" y="302">discount_pct</text>
  </g>
  <!-- products -->
  <rect x="850" y="60" width="270" height="178" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <rect x="851" y="61" width="268" height="40" rx="9" fill="#F3EBD8"/>
  <text x="870" y="87" font-size="16" font-weight="700" fill="#2A2926">products</text><text x="1100" y="87" font-size="12" fill="#5E5A52" text-anchor="end">16 rows</text>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" fill="#2A2926">
    <rect x="860" y="110" width="250" height="28" rx="5" fill="#FBF3E2"/>
    <text x="872" y="129" font-weight="700">product_id</text><text x="1100" y="129" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#8A6A1F" text-anchor="end">PK</text>
    <text x="872" y="162">product_name</text><text x="872" y="190">category</text><text x="872" y="218">list_price</text>
  </g>
  <!-- links -->
  <g stroke="#2F5D8A" stroke-width="2" fill="none">
    <path d="M310,124 C380,124 380,182 445,182"/>
    <path d="M318,116 L318,132"/>
    <path d="M431,182 L445,172 M431,182 L445,192"/>
  </g>
  <g stroke="#2F6B3F" stroke-width="2" fill="none">
    <path d="M850,124 C780,124 780,210 715,210"/>
    <path d="M842,116 L842,132"/>
    <path d="M729,210 L715,200 M729,210 L715,220"/>
  </g>
  <g font-size="12.5" font-weight="700">
    <text x="330" y="112" fill="#2F5D8A">1</text><text x="420" y="205" fill="#2F5D8A">many</text>
    <text x="822" y="112" fill="#2F6B3F">1</text><text x="728" y="236" fill="#2F6B3F">many</text>
  </g>
  <text x="40" y="36" font-size="15" font-weight="700" fill="#2A2926">Kolanut's sales data: three tables, two relationships</text>
  <g font-size="13" fill="#2A2926">
    <text x="445" y="350"><tspan font-weight="700" fill="#8A6A1F">PK</tspan> primary key: unique for every row of its table.</text>
    <text x="445" y="372"><tspan font-weight="700" fill="#2F5D8A">FK</tspan> foreign key: points to a primary key in another table.</text>
    <text x="445" y="394">The fork (crow's foot) marks the "many" side of each relationship.</text>
  </g>
</g>
</svg>

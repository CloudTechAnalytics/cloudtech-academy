<text xml:space="preserve" x="690.0" y="382.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">+8.8%</text>
<text xml:space="preserve" x="628.0" y="356.0" font-size="16" fill="#8A6A1F" font-weight="700" text-anchor="middle">×</text>
<rect x="16.0" y="300.0" width="404.0" height="98.0" rx="10" fill="#EFE4CC" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="326.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Reading the tree</text>
<text xml:space="preserve" x="32.0" y="350.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Growth came from more customers and higher prices.</text>
<text xml:space="preserve" x="32.0" y="369.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Each customer ordered less often: the branch</text>
<text xml:space="preserve" x="32.0" y="388.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">to investigate.</text>
<text xml:space="preserve" x="16.0" y="430.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">First half of 2026 against the first half of 2025. Kolanut's real figures.</text>

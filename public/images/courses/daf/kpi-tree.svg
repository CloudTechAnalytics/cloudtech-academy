<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="A KPI tree for Kolanut's first-half revenue. Revenue of 290.7 million naira, up 19.1 percent, equals active customers (90, up 23.3 percent) times order lines per customer (15.9, down 12.1 percent) times revenue per line (202,741 naira, up 9.9 percent). Revenue per line splits into packs per line (13.7, up 1.0 percent) times naira per pack (14,811, up 8.8 percent).">
<title>A KPI tree: revenue = active customers × lines per customer × revenue per line.</title>

<rect width="760" height="450" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">

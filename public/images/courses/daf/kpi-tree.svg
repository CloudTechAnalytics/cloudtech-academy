<text xml:space="preserve" x="380.0" y="72.0" font-size="21" fill="#2A2926" font-weight="700" text-anchor="middle">₦290.7m</text>
<text xml:space="preserve" x="380.0" y="98.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">₦244.2m in 2025 · +19.1%</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" role="img" aria-label="A KPI tree for Kolanut's first-half revenue. Revenue of 290.7 million naira, up 19.1 percent, equals active customers (90, up 23.3 percent) times order lines per customer (15.9, down 12.1 percent) times revenue per line (202,741 naira, up 9.9 percent). Revenue per line splits further into packs per line (13.7, up 1.0 percent) times naira per pack (14,811, up 8.8 percent).">
<title>A KPI tree: revenue = active customers × lines per customer × revenue per line; revenue per line = packs per line × naira per pack. First half of 2026 against the first half of 2025.</title>
<rect width="1160" height="470" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <g stroke="#B38A3E" stroke-width="1.8" fill="none">
    <path d="M580,118 L580,150 M200,150 L960,150 M200,150 L200,180 M580,150 L580,180 M960,150 L960,180"/>
    <path d="M960,282 L960,310 M760,310 L1040,310 M760,310 L760,338 M1040,310 L1040,338"/>
  </g>
  <rect x="440" y="28" width="280" height="90" rx="10" fill="#C9A867" stroke="#8A6A1F" stroke-width="1.5"/>
  <text x="580" y="56" font-size="14" text-anchor="middle" fill="#2A2926">Revenue, Jan–Jun</text>
  <text x="580" y="84" font-size="22" font-weight="700" text-anchor="middle" fill="#2A2926">₦290.7m</text>
  <text x="580" y="106" font-size="13" text-anchor="middle" fill="#2A2926">₦244.2m in 2025 · <tspan font-weight="700">+19.1%</tspan></text>

  <g font-size="22" fill="#8A6A1F" font-weight="700" text-anchor="middle"><text x="390" y="238">×</text><text x="770" y="238">×</text><text x="900" y="402">×</text></g>

  <rect x="80" y="180" width="240" height="102" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <text x="200" y="208" font-size="14" text-anchor="middle" fill="#2A2926">Active customers</text>
  <text x="200" y="238" font-size="21" font-weight="700" text-anchor="middle" fill="#2A2926">90</text>
  <text x="200" y="262" font-size="13" text-anchor="middle" fill="#2F6B3F">73 in 2025 · <tspan font-weight="700">+23.3%</tspan></text>

  <rect x="460" y="180" width="240" height="102" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <text x="580" y="208" font-size="14" text-anchor="middle" fill="#2A2926">Order lines per customer</text>
  <text x="580" y="238" font-size="21" font-weight="700" text-anchor="middle" fill="#2A2926">15.9</text>
  <text x="580" y="262" font-size="13" text-anchor="middle" fill="#9B2C1F">18.1 in 2025 · <tspan font-weight="700">−12.1%</tspan></text>

  <rect x="840" y="180" width="240" height="102" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <text x="960" y="208" font-size="14" text-anchor="middle" fill="#2A2926">Revenue per line</text>
  <text x="960" y="238" font-size="21" font-weight="700" text-anchor="middle" fill="#2A2926">₦202,741</text>
  <text x="960" y="262" font-size="13" text-anchor="middle" fill="#2F6B3F">₦184,553 in 2025 · <tspan font-weight="700">+9.9%</tspan></text>

  <rect x="660" y="338" width="200" height="96" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <text x="760" y="364" font-size="13.5" text-anchor="middle" fill="#2A2926">Packs per line</text>
  <text x="760" y="392" font-size="19" font-weight="700" text-anchor="middle" fill="#2A2926">13.7</text>
  <text x="760" y="416" font-size="12.5" text-anchor="middle" fill="#5E5A52">13.6 in 2025 · +1.0%</text>

  <rect x="940" y="338" width="200" height="96" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <text x="1040" y="364" font-size="13.5" text-anchor="middle" fill="#2A2926">Naira per pack</text>
  <text x="1040" y="392" font-size="19" font-weight="700" text-anchor="middle" fill="#2A2926">₦14,811</text>
  <text x="1040" y="416" font-size="12.5" text-anchor="middle" fill="#2F6B3F">₦13,613 in 2025 · <tspan font-weight="700">+8.8%</tspan></text>

  <g font-size="13.5" fill="#2A2926">
    <text x="40" y="340" font-weight="700">Reading the tree</text>
    <text x="40" y="364">Growth came from more customers</text>
    <text x="40" y="384">and higher prices. Each customer</text>
    <text x="40" y="404">ordered less often: the branch</text>
    <text x="40" y="424">to investigate.</text>
  </g>
  <text x="300" y="455" font-size="12" fill="#5E5A52">First half of 2026 against the first half of 2025. Kolanut's real figures.</text>
</g>
</svg>

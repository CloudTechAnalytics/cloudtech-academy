<text xml:space="preserve" x="131.0" y="242.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">73 in 2025 · +23.3%</text>
<rect x="266.0" y="160.0" width="228.0" height="98.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>

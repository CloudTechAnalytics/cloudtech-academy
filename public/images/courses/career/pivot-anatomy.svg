<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="How a PivotTable summarises a sales list. On the left, a list of barbershop sales with a service and an amount per row. In the middle, the field list: Service in Rows and Amount in Values. On the right, the PivotTable shows the total per service.">
<title>A PivotTable turns a long list into a total for each group.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="24.0" font-size="13" fill="#5E5A52" font-weight="700" text-anchor="start">Your data</text>
<rect x="16.0" y="32.0" width="206.0" height="224.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,60 L17,40 Q17,33 24,33 L214,33 Q221,33 221,40 L221,60 Z" fill="#EFE4CC"/>

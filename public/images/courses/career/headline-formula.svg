<text xml:space="preserve" x="198.0" y="86.0" font-size="18" fill="#5E5A52" font-weight="700" text-anchor="middle">|</text>
<rect x="204.0" y="42.0" width="190.0" height="76.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.6"/>
<text xml:space="preserve" x="214.0" y="66.0" font-size="12" fill="#B38A3E" font-weight="700" text-anchor="start">Key tools</text>
<text xml:space="preserve" x="214.0" y="98.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Excel &amp; QuickBooks</text>
<text xml:space="preserve" x="400.0" y="86.0" font-size="18" fill="#5E5A52" font-weight="700" text-anchor="middle">|</text>
<rect x="406.0" y="42.0" width="186.0" height="76.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="416.0" y="66.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">What you do</text>
<text xml:space="preserve" x="416.0" y="98.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Month-end reports</text>
<text xml:space="preserve" x="598.0" y="86.0" font-size="18" fill="#5E5A52" font-weight="700" text-anchor="middle">|</text>
<rect x="604.0" y="42.0" width="120.0" height="76.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.6"/>
<text xml:space="preserve" x="614.0" y="66.0" font-size="12" fill="#5C4F80" font-weight="700" text-anchor="start">City</text>
<text xml:space="preserve" x="614.0" y="98.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Abuja</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The LinkedIn headline formula: target role, then key tools, then what you do, then your city, separated by vertical bars. The example reads 'Junior Accountant | Excel &amp; QuickBooks | Month-end reports | Abuja'. Recruiters search by these words.">
<title>A headline is built from the words a recruiter would search for.</title>

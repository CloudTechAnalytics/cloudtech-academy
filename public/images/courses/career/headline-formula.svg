<path d="M270.0,193.0 L292.0,193.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="296.0" y="168.0" width="448.0" height="50.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.2"/>
<text xml:space="preserve" x="308.0" y="190.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Accounting Student | Excel &amp; QuickBooks | Graduate roles | Abuja</text>
<rect x="16.0" y="228.0" width="250.0" height="50.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.2"/>

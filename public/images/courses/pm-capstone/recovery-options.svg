<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" role="img" aria-label="Recovery options only help on the critical chain, and each trades money, risk or quality. Test each option by applying it to the remaining schedule rather than reading the claim, combine the ones that work, and agree a trigger for any option held back, such as a reduced scope that needs a stakeholder's consent in advance.">
<title>Test each option; combine; hold one back behind a trigger.</title>

<rect width="760" height="448" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Three ways to recover time</text>
<rect x="16.0" y="40.0" width="232.0" height="84.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="66.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">Crash</text>
<text xml:space="preserve" x="30.0" y="88.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Pay more to shorten a task, e.g.</text>
<text xml:space="preserve" x="30.0" y="102.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">air freight.</text>
<rect x="264.0" y="40.0" width="232.0" height="84.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="278.0" y="66.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start">Fast-track</text>
<text xml:space="preserve" x="278.0" y="88.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Do things in parallel that were</text>
<text xml:space="preserve" x="278.0" y="102.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">planned in sequence.</text>
<rect x="512.0" y="40.0" width="232.0" height="84.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="526.0" y="66.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">Reduce scope</text>
<text xml:space="preserve" x="526.0" y="88.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Do less before opening; finish</text>
<text xml:space="preserve" x="526.0" y="102.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">the rest after.</text>
<text xml:space="preserve" x="16.0" y="160.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Claimed versus measured (invented options)</text>
<rect x="16.0" y="174.0" width="728.0" height="140.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,202 L17,182 Q17,175 24,175 L736,175 Q743,175 743,182 L743,202 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="26.0" y="192.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">Option</text>
<text xml:space="preserve" x="326.0" y="192.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="end">Claims</text>
<text xml:space="preserve" x="486.0" y="192.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="end">Really saves</text>
<text xml:space="preserve" x="506.0" y="192.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">Why</text>
<line x1="16.0" y1="202.0" x2="744.0" y2="202.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="220.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Air freight</text>
<text xml:space="preserve" x="326.0" y="220.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">7</text>
<text xml:space="preserve" x="486.0" y="220.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">7</text>
<text xml:space="preserve" x="506.0" y="220.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">On the critical chain</text>
<line x1="16.0" y1="230.0" x2="744.0" y2="230.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="248.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Weekend working</text>
<text xml:space="preserve" x="326.0" y="248.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">4</text>
<text xml:space="preserve" x="486.0" y="248.5" font-size="12.5" fill="#9B2C1F" font-weight="400" text-anchor="end">0</text>
<text xml:space="preserve" x="506.0" y="248.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Task has float: no effect</text>
<line x1="16.0" y1="258.0" x2="744.0" y2="258.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="276.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Overtime on a side task</text>
<text xml:space="preserve" x="326.0" y="276.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">3</text>
<text xml:space="preserve" x="486.0" y="276.5" font-size="12.5" fill="#9B2C1F" font-weight="400" text-anchor="end">0</text>
<text xml:space="preserve" x="506.0" y="276.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Task has float: no effect</text>
<line x1="16.0" y1="286.0" x2="744.0" y2="286.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="304.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Reduced menu</text>
<text xml:space="preserve" x="326.0" y="304.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">5</text>
<text xml:space="preserve" x="486.0" y="304.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">5</text>
<text xml:space="preserve" x="506.0" y="304.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Needs consent in advance</text>
<text xml:space="preserve" x="16.0" y="342.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A trigger turns a worry into a plan</text>
<rect x="16.0" y="356.0" width="728.0" height="76.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="382.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">"If the equipment hasn't cleared customs by the agreed date,</text>
<text xml:space="preserve" x="30.0" y="402.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">we open with the reduced menu", agreed with the people it affects before it's needed.</text>
<text xml:space="preserve" x="30.0" y="422.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">No one has to improvise under pressure.</text>
</g></svg>
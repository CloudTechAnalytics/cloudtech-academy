<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="The one-page decision paper for a sponsor, in order: the answer and recommendation, the decisions needed and by when, the evidence of three numbers, the options considered and why the others were rejected, the risks and the trigger, and what will be reported next.">
<title>Recommendation first; decisions with dates; three numbers; options; trigger.</title>

<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">One page, in this order</text>
<rect x="16.0" y="42.0" width="360.0" height="76.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<circle cx="40.0" cy="68.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="40.0" y="72.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="62.0" y="73.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Answer and recommendation</text>
<text xml:space="preserve" x="30.0" y="96.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Status, forecast and recommendation.</text>
<rect x="384.0" y="42.0" width="360.0" height="76.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<circle cx="408.0" cy="68.0" r="12" fill="#9B2C1F"/>
<text xml:space="preserve" x="408.0" y="72.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="430.0" y="73.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Decisions needed, and by when</text>
<text xml:space="preserve" x="398.0" y="96.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Make the asks impossible to miss.</text>
<rect x="16.0" y="126.0" width="360.0" height="76.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<circle cx="40.0" cy="152.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="40.0" y="156.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="62.0" y="157.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Evidence: three numbers</text>
<text xml:space="preserve" x="30.0" y="180.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Forecast date, cost range, key risk.</text>
<rect x="384.0" y="126.0" width="360.0" height="76.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="408.0" cy="152.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="408.0" y="156.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="430.0" y="157.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Options considered</text>
<text xml:space="preserve" x="398.0" y="180.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Cost and days saved, and why the others were rejected.</text>
<rect x="16.0" y="210.0" width="360.0" height="76.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<circle cx="40.0" cy="236.0" r="12" fill="#5C4F80"/>
<text xml:space="preserve" x="40.0" y="240.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text xml:space="preserve" x="62.0" y="241.0" font-size="13.5" fill="#5C4F80" font-weight="700" text-anchor="start">Risks and a trigger</text>
<text xml:space="preserve" x="30.0" y="264.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">What could go wrong and what you'll do.</text>
<rect x="384.0" y="210.0" width="360.0" height="76.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<circle cx="408.0" cy="236.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="408.0" y="240.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text xml:space="preserve" x="430.0" y="241.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Next report</text>
<text xml:space="preserve" x="398.0" y="264.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">What you'll report, and when.</text>
<text xml:space="preserve" x="16.0" y="312.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Make the unwelcome facts impossible to miss: the date moves, the budget is higher, and one of the sponsor's</text>
<text xml:space="preserve" x="16.0" y="330.1" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">requests should wait.</text>
</g></svg>
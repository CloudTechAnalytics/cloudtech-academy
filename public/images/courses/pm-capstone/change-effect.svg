<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="A change request's effect depends on where it lands. On the critical chain the days it adds or saves are the days the project finishes earlier or later. On a task with float, a delay up to the size of the float changes nothing to the finish, and a saving changes nothing either. The invented example shows two requests each claiming five days.">
<title>Days on the form are not days added: float decides.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Two requests, each claiming 5 days (invented example)</text>
<rect x="16.0" y="40.0" width="358.0" height="164.0" rx="10" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="1.8"/>
<text xml:space="preserve" x="30.0" y="64.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">On the critical chain</text>
<rect x="30.0" y="82.0" width="120.0" height="24.0" rx="4" fill="#2F6B3F"/>
<rect x="154.0" y="82.0" width="120.0" height="24.0" rx="4" fill="#2F6B3F"/>
<rect x="278.0" y="82.0" width="70.0" height="24.0" rx="4" fill="#9B2C1F"/>
<text xml:space="preserve" x="338.0" y="78.0" font-size="11" fill="#9B2C1F" font-weight="700" text-anchor="end">+5 days</text>
<text xml:space="preserve" x="30.0" y="128.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Path A:  tasks with no float.</text>
<text xml:space="preserve" x="30.0" y="150.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">Every day added is a day the project finishes later.</text>
<text xml:space="preserve" x="30.0" y="176.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">Every day saved is a day earlier.</text>
<rect x="386.0" y="40.0" width="358.0" height="164.0" rx="10" fill="#FFFFFF" stroke="#5E5A52" stroke-width="1.8"/>
<text xml:space="preserve" x="400.0" y="64.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">On a task with float</text>
<rect x="400.0" y="82.0" width="120.0" height="24.0" rx="4" fill="#C5B38A"/>
<rect x="524.0" y="82.0" width="70.0" height="24.0" rx="4" fill="#C5B38A"/>
<rect x="598.0" y="82.0" width="60.0" height="24.0" rx="4" fill="#9B2C1F" fill-opacity="0.4"/>
<text xml:space="preserve" x="740.0" y="78.0" font-size="11" fill="#9B2C1F" font-weight="700" text-anchor="end">+5 days</text>
<rect x="400.0" y="112.0" width="258.0" height="6.0" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="400.0" y="134.0" font-size="11" fill="#2F6B3F" font-weight="700" text-anchor="start">10 days of float</text>
<text xml:space="preserve" x="400.0" y="160.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">A 5-day delay uses half the float.</text>
<text xml:space="preserve" x="400.0" y="180.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">The finish date doesn't move.</text>
<text xml:space="preserve" x="16.0" y="240.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">What to do with a request</text>
<rect x="16.0" y="254.0" width="170.0" height="76.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="278.0" font-size="12.5" fill="#2F5D8A" font-weight="700" text-anchor="start">1  Charter</text>
<text xml:space="preserve" x="28.0" y="298.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Does it serve the</text>
<text xml:space="preserve" x="28.0" y="312.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">objective?</text>
<rect x="202.0" y="254.0" width="170.0" height="76.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="214.0" y="278.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">2  Re-run the schedule</text>
<text xml:space="preserve" x="214.0" y="298.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Apply it to the</text>
<text xml:space="preserve" x="214.0" y="312.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">remaining work.</text>
<rect x="388.0" y="254.0" width="170.0" height="76.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="400.0" y="278.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">3  Price it</text>
<text xml:space="preserve" x="400.0" y="298.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Cost, and who pays.</text>
<rect x="574.0" y="254.0" width="170.0" height="76.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<text xml:space="preserve" x="586.0" y="278.0" font-size="12.5" fill="#5C4F80" font-weight="700" text-anchor="start">4  Decide, and log it</text>
<text xml:space="preserve" x="586.0" y="298.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Approve, reject or</text>
<text xml:space="preserve" x="586.0" y="312.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">defer.</text>
<rect x="16.0" y="350.0" width="728.0" height="60.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="374.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Paying to speed up a task with float saves nothing.</text>
<text xml:space="preserve" x="30.0" y="396.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Test every "saves days" claim against the critical chain before you pay.</text>
</g></svg>
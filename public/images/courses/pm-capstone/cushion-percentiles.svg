<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="How a single baseline date compares with a simulated range. An invented project has a baseline finish at day 60 and a promised date at day 61. Simulating all the three-point estimates gives a spread of finish days: the chance of meeting the promise is small, the median is later, and the 80 percent date is later still. The gap between baseline and P80 is the reserve the plan lacks.">

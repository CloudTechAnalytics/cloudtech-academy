<text xml:space="preserve" x="30.0" y="280.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">The share of runs to the left of the promise line: small.</text>
<text xml:space="preserve" x="30.0" y="300.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">A plan with one day of cushion was never safe.</text>
<rect x="386.0" y="230.0" width="358.0" height="86.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>

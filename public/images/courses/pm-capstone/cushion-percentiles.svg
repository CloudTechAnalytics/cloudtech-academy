<text xml:space="preserve" x="400.0" y="300.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">the plan needs and doesn't contain.</text>
<text xml:space="preserve" x="16.0" y="346.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Quote a range with its basis, never one date.</text>

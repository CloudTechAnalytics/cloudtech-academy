<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="What employers look for in students and how to show it: willingness to learn through courses and badges, reliability through roles and part-time work, communication through a clear CV and polite email, basic tools such as Excel, and evidence through projects. Keep five documents ready in one folder: CV, cover letter template, LinkedIn profile, portfolio link and the documents schools ask for.">
<title>What employers look for, and the five documents to have ready.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="420" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">They don't expect experience. They look for:</text>
<rect x="16.0" y="40.0" width="200.0" height="34.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.2"/>
<text xml:space="preserve" x="28.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Willingness to learn</text>
<path d="M220.0,57.0 L242.0,57.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="246.0" y="40.0" width="498.0" height="34.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="258.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Courses and badges you finished on your own</text>
<rect x="16.0" y="80.0" width="200.0" height="34.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.2"/>
<text xml:space="preserve" x="28.0" y="102.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Reliability</text>
<path d="M220.0,97.0 L242.0,97.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="246.0" y="80.0" width="498.0" height="34.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="258.0" y="102.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Class rep, club role, volunteering, part-time job</text>
<rect x="16.0" y="120.0" width="200.0" height="34.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.2"/>
<text xml:space="preserve" x="28.0" y="142.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Communication</text>
<path d="M220.0,137.0 L242.0,137.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="246.0" y="120.0" width="498.0" height="34.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="258.0" y="142.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">A clear CV and a polite, well-written email</text>
<rect x="16.0" y="160.0" width="200.0" height="34.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.2"/>
<text xml:space="preserve" x="28.0" y="182.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Basic tools</text>
<path d="M220.0,177.0 L242.0,177.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="246.0" y="160.0" width="498.0" height="34.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="258.0" y="182.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Excel, Google Workspace, Canva, or your field's tools</text>
<rect x="16.0" y="200.0" width="200.0" height="34.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.2"/>
<text xml:space="preserve" x="28.0" y="222.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Evidence</text>
<path d="M220.0,217.0 L242.0,217.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="246.0" y="200.0" width="498.0" height="34.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.2"/>
<text xml:space="preserve" x="258.0" y="222.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Projects in a portfolio or on GitHub</text>
<text xml:space="preserve" x="16.0" y="262.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">One folder, five things, ready before you apply</text>
<rect x="16.0" y="276.0" width="136.0" height="94.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="302.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start">CV</text>
<text xml:space="preserve" x="28.0" y="324.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">one page, PDF</text>
<rect x="164.0" y="276.0" width="136.0" height="94.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="176.0" y="302.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Cover letter</text>
<text xml:space="preserve" x="176.0" y="324.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">template to adapt</text>
<rect x="312.0" y="276.0" width="136.0" height="94.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="324.0" y="302.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">LinkedIn</text>
<text xml:space="preserve" x="324.0" y="324.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">photo and</text>
<text xml:space="preserve" x="324.0" y="339.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">headline</text>
<rect x="460.0" y="276.0" width="136.0" height="94.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<text xml:space="preserve" x="472.0" y="302.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="start">Portfolio link</text>
<text xml:space="preserve" x="472.0" y="324.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">even one or two</text>
<text xml:space="preserve" x="472.0" y="339.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">projects</text>
<rect x="608.0" y="276.0" width="136.0" height="94.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="620.0" y="302.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">School papers</text>
<text xml:space="preserve" x="620.0" y="324.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">ID, letter,</text>
<text xml:space="preserve" x="620.0" y="339.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">results, photo</text>
<text xml:space="preserve" x="16.0" y="400.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Name it CV-Firstname-Lastname.pdf. Recruiters see hundreds of files called CV.pdf.</text>
</g></svg>
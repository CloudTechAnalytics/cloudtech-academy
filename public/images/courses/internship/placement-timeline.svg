<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="A SIWES or internship placement timeline: two to three months before, start looking and ask your coordinator for the placement letter and logbook; during the placement, do real work in your field and fill the logbook every day or week; afterwards, collect a reference and update your CV.">
<title>Start two to three months early, keep the logbook weekly.</title>

<rect width="760" height="330" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A placement from start to finish</text>
<line x1="40.0" y1="118.0" x2="720.0" y2="118.0" stroke="#CFC4B2" stroke-width="3"/>
<circle cx="110.0" cy="118.0" r="10" fill="#2F5D8A" stroke="#FFFFFF" stroke-width="3"/>
<text xml:space="preserve" x="110.0" y="94.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="middle">2–3 months before</text>
<rect x="22.0" y="142.0" width="176.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="34.0" y="168.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Start looking</text>
<text xml:space="preserve" x="34.0" y="190.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Ask your SIWES</text>
<text xml:space="preserve" x="34.0" y="206.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">coordinator for the</text>
<text xml:space="preserve" x="34.0" y="222.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">placement letter and</text>
<text xml:space="preserve" x="34.0" y="238.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">logbook.</text>
<circle cx="290.0" cy="118.0" r="10" fill="#B38A3E" stroke="#FFFFFF" stroke-width="3"/>
<text xml:space="preserve" x="290.0" y="94.0" font-size="12" fill="#B38A3E" font-weight="700" text-anchor="middle">Before day one</text>
<rect x="202.0" y="142.0" width="176.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="214.0" y="168.0" font-size="13.5" fill="#B38A3E" font-weight="700" text-anchor="start">Get documents ready</text>
<text xml:space="preserve" x="214.0" y="190.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">CV, ID, school letter,</text>
<text xml:space="preserve" x="214.0" y="206.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">passport photo.</text>
<circle cx="470.0" cy="118.0" r="10" fill="#2F6B3F" stroke="#FFFFFF" stroke-width="3"/>
<text xml:space="preserve" x="470.0" y="94.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="middle">During</text>
<rect x="382.0" y="142.0" width="176.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="394.0" y="168.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Do real work</text>
<text xml:space="preserve" x="394.0" y="190.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Fill the logbook every</text>
<text xml:space="preserve" x="394.0" y="206.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">day or week. It is</text>
<text xml:space="preserve" x="394.0" y="222.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">assessed.</text>
<circle cx="650.0" cy="118.0" r="10" fill="#5C4F80" stroke="#FFFFFF" stroke-width="3"/>
<text xml:space="preserve" x="650.0" y="94.0" font-size="12" fill="#5C4F80" font-weight="700" text-anchor="middle">After</text>
<rect x="562.0" y="142.0" width="176.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#5C4F80" stroke-width="1.5"/>
<text xml:space="preserve" x="574.0" y="168.0" font-size="13.5" fill="#5C4F80" font-weight="700" text-anchor="start">Keep the gains</text>
<text xml:space="preserve" x="574.0" y="190.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Ask for a reference; add</text>
<text xml:space="preserve" x="574.0" y="206.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">it to your CV and</text>
<text xml:space="preserve" x="574.0" y="222.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">LinkedIn.</text>
<text xml:space="preserve" x="16.0" y="312.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Choose a placement where you'll do real work in your field, not just run errands.</text>
</g></svg>
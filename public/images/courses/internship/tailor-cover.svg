<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Tailoring an application in five minutes: read the advert and highlight the skills and tools, make sure those words are in your CV where true, move your most relevant project to the top, and update your one-line summary. A short cover letter has three paragraphs: why this role and when you are available, one or two matching examples, and thanks with a clear close, under 200 words.">
<title>Tailor the CV in four steps; keep the cover letter to three paragraphs.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Tailor your CV in five minutes</text>
<rect x="16.0" y="40.0" width="166.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="38.0" cy="64.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="38.0" y="68.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="58.0" y="69.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Read the advert</text>
<text xml:space="preserve" x="30.0" y="96.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Highlight skills and</text>
<text xml:space="preserve" x="30.0" y="110.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">tools it names</text>
<path d="M184.0,82.0 L200.0,82.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="202.0" y="40.0" width="166.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="224.0" cy="64.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="224.0" y="68.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="244.0" y="69.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Use its words</text>
<text xml:space="preserve" x="216.0" y="96.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">In your CV, where</text>
<text xml:space="preserve" x="216.0" y="110.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">they're true</text>
<path d="M370.0,82.0 L386.0,82.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="388.0" y="40.0" width="166.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="410.0" cy="64.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="410.0" y="68.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="430.0" y="69.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Lead with the best</text>
<text xml:space="preserve" x="402.0" y="96.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Move your most relevant</text>
<text xml:space="preserve" x="402.0" y="110.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">project up</text>
<path d="M556.0,82.0 L572.0,82.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="574.0" y="40.0" width="166.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<circle cx="596.0" cy="64.0" r="12" fill="#8A6A1F"/>
<text xml:space="preserve" x="596.0" y="68.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text xml:space="preserve" x="616.0" y="69.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Update summary</text>
<text xml:space="preserve" x="588.0" y="96.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">One line that matches</text>
<text xml:space="preserve" x="588.0" y="110.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">the role</text>
<text xml:space="preserve" x="16.0" y="160.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A cover letter in three paragraphs (under 200 words)</text>
<rect x="16.0" y="176.0" width="728.0" height="60.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.4"/>
<circle cx="40.0" cy="206.0" r="12" fill="#2F5D8A"/>
<text xml:space="preserve" x="40.0" y="210.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text xml:space="preserve" x="64.0" y="202.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start">Why this role</text>
<text xml:space="preserve" x="64.0" y="222.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Who you are, the role, when you're available.</text>
<rect x="16.0" y="244.0" width="728.0" height="60.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.4"/>
<circle cx="40.0" cy="274.0" r="12" fill="#B38A3E"/>
<text xml:space="preserve" x="40.0" y="278.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text xml:space="preserve" x="64.0" y="270.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">Proof</text>
<text xml:space="preserve" x="64.0" y="290.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">One or two examples that match what they need.</text>
<rect x="16.0" y="312.0" width="728.0" height="60.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<circle cx="40.0" cy="342.0" r="12" fill="#2F6B3F"/>
<text xml:space="preserve" x="40.0" y="346.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text xml:space="preserve" x="64.0" y="338.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">Thanks and close</text>
<text xml:space="preserve" x="64.0" y="358.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">A clear, polite ending.</text>
<text xml:space="preserve" x="16.0" y="400.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Ten tailored applications beat a hundred generic ones.</text>
<text xml:space="preserve" x="16.0" y="420.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">AI can help you draft; rewrite it in your voice and check every claim is true.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Tracking internship applications with a status column: Saved, Applied, Interview, then Offer or Rejected. About two weeks after applying with no reply, send one polite follow-up, then move on. Silence is normal.">
<title>A status for every application, and a follow-up date.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="330" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Give every application a status</text>
<rect x="16.0" y="42.0" width="150.0" height="78.0" rx="10" fill="#FFFFFF" stroke="#5E5A52" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="70.0" font-size="14.5" fill="#5E5A52" font-weight="700" text-anchor="start">Saved</text>
<text xml:space="preserve" x="30.0" y="92.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Found it, not yet</text>
<text xml:space="preserve" x="30.0" y="106.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">applied</text>
<path d="M168.0,81.0 L200.0,81.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="202.0" y="42.0" width="150.0" height="78.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="216.0" y="70.0" font-size="14.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Applied</text>
<text xml:space="preserve" x="216.0" y="92.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Sent; note the date</text>
<path d="M354.0,81.0 L386.0,81.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="388.0" y="42.0" width="150.0" height="78.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.6"/>
<text xml:space="preserve" x="402.0" y="70.0" font-size="14.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Interview</text>
<text xml:space="preserve" x="402.0" y="92.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Prepare with STAR</text>
<path d="M540.0,81.0 L572.0,81.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="574.0" y="42.0" width="150.0" height="78.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="588.0" y="70.0" font-size="14.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Offer</text>
<text xml:space="preserve" x="588.0" y="92.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Check it's genuine</text>
<rect x="576.0" y="132.0" width="168.0" height="44.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="660.0" y="160.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="middle">Rejected: move on</text>
<text xml:space="preserve" x="16.0" y="214.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A row in your sheet</text>
<rect x="16.0" y="222.0" width="728.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,252 L17,230 Q17,223 24,223 L736,223 Q743,223 743,230 L743,252 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="26.0" y="241.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">Company</text>
<text xml:space="preserve" x="196.0" y="241.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">Role</text>
<text xml:space="preserve" x="366.0" y="241.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">Applied</text>
<text xml:space="preserve" x="496.0" y="241.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">Status</text>
<text xml:space="preserve" x="616.0" y="241.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">Follow up</text>
<line x1="16.0" y1="252.0" x2="744.0" y2="252.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="271.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Kolanut Foods</text>
<text xml:space="preserve" x="196.0" y="271.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Data intern</text>
<text xml:space="preserve" x="366.0" y="271.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">2026-10-02</text>
<text xml:space="preserve" x="496.0" y="271.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Applied</text>
<text xml:space="preserve" x="616.0" y="271.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">2026-10-16</text>
<rect x="16.0" y="290.0" width="728.0" height="28.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.2"/>
<text xml:space="preserve" x="30.0" y="309.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">No reply after about two weeks? Send one short, polite follow-up, then move on.</text>
</g></svg>
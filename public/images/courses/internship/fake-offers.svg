<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Warning signs of a fake internship offer: they ask you to pay, the offer arrives without an interview, a big company is writing from a free email address, they ask for your BVN, PIN or OTP, or the pay is far too high for a student role. Genuine employers pay you. Check the company's official website and LinkedIn.">
<title>Six signs an internship offer is fake.</title>

<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Walk away if you see any of these</text>
<rect x="16.0" y="40.0" width="360.0" height="76.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="66.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">!  They ask you to pay</text>
<text xml:space="preserve" x="30.0" y="88.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">'Training', 'registration', 'equipment',</text>
<text xml:space="preserve" x="30.0" y="103.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">'processing'. Employers pay you.</text>
<rect x="384.0" y="40.0" width="360.0" height="76.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="398.0" y="66.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">!  No interview</text>
<text xml:space="preserve" x="398.0" y="88.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">An offer that arrives without anyone speaking to</text>
<text xml:space="preserve" x="398.0" y="103.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">you.</text>
<rect x="16.0" y="124.0" width="360.0" height="76.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="150.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">!  Free email address</text>
<text xml:space="preserve" x="30.0" y="172.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">hr.bigbank.jobs@gmail.com claiming to be a big</text>
<text xml:space="preserve" x="30.0" y="187.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">company.</text>
<rect x="384.0" y="124.0" width="360.0" height="76.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="398.0" y="150.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">!  Asks for BVN, PIN or OTP</text>
<text xml:space="preserve" x="398.0" y="172.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">No genuine employer needs them to hire you.</text>
<rect x="16.0" y="208.0" width="360.0" height="76.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="234.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">!  Pay far too high</text>
<text xml:space="preserve" x="30.0" y="256.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">'Data entry, ₦300,000 weekly' for a student.</text>
<rect x="384.0" y="208.0" width="360.0" height="76.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="398.0" y="234.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">!  Vague job</text>
<text xml:space="preserve" x="398.0" y="256.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">You can't tell what you'd actually do.</text>
<rect x="16.0" y="300.0" width="728.0" height="70.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="326.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Check before you reply</text>
<text xml:space="preserve" x="30.0" y="350.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Official website  ·  LinkedIn page  ·  Search the company name + "scam"</text>
<text xml:space="preserve" x="16.0" y="392.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Never pay money to get an internship or job.</text>
</g></svg>
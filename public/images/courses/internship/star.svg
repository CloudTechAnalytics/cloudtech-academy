<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="The STAR method for tell-me-about-a-time questions: Situation, the background in one sentence; Task, what you needed to do; Action, what you did, saying I not we; Result, what happened, with a number. The example is a student who raised attendance at a club's first meeting.">
<title>STAR: Situation, Task, Action, Result.</title>

<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Question: "Tell me about a time you solved a problem."</text>
<rect x="16.0" y="42.0" width="728.0" height="72.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<circle cx="52.0" cy="78.0" r="22" fill="#2F5D8A"/>
<text xml:space="preserve" x="52.0" y="86.0" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">S</text>
<text xml:space="preserve" x="88.0" y="70.0" font-size="14.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Situation</text>
<text xml:space="preserve" x="88.0" y="92.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">The background, in one sentence.</text>
<text xml:space="preserve" x="300.0" y="70.0" font-size="11.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="300.0" y="90.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Our club's first meeting was a week away with only 6 sign-ups.</text>
<rect x="16.0" y="122.0" width="728.0" height="72.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<circle cx="52.0" cy="158.0" r="22" fill="#B38A3E"/>
<text xml:space="preserve" x="52.0" y="166.0" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">T</text>
<text xml:space="preserve" x="88.0" y="150.0" font-size="14.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Task</text>
<text xml:space="preserve" x="88.0" y="172.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">What you needed to do.</text>
<text xml:space="preserve" x="300.0" y="150.0" font-size="11.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="300.0" y="170.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">As publicity lead, I had to fill the hall.</text>
<rect x="16.0" y="202.0" width="728.0" height="72.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<circle cx="52.0" cy="238.0" r="22" fill="#2F6B3F"/>
<text xml:space="preserve" x="52.0" y="246.0" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text>
<text xml:space="preserve" x="88.0" y="230.0" font-size="14.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Action</text>
<text xml:space="preserve" x="88.0" y="252.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">What YOU did. Say "I".</text>
<text xml:space="preserve" x="300.0" y="230.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="300.0" y="250.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">I made a poster, messaged 8 class groups and asked lecturers to</text>
<text xml:space="preserve" x="300.0" y="266.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">share it.</text>
<rect x="16.0" y="282.0" width="728.0" height="72.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<circle cx="52.0" cy="318.0" r="22" fill="#5C4F80"/>
<text xml:space="preserve" x="52.0" y="326.0" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">R</text>
<text xml:space="preserve" x="88.0" y="310.0" font-size="14.5" fill="#5C4F80" font-weight="700" text-anchor="start">Result</text>
<text xml:space="preserve" x="88.0" y="332.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">What happened, with a number.</text>
<text xml:space="preserve" x="300.0" y="310.0" font-size="11.5" fill="#5C4F80" font-weight="700" text-anchor="start">Example</text>
<text xml:space="preserve" x="300.0" y="330.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">52 people came, and 20 joined the club.</text>
<text xml:space="preserve" x="16.0" y="376.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Prepare three stories like this from school, projects, volunteering or work.</text>
</g></svg>
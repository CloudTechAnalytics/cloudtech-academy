<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" width="1160" height="440" role="img" aria-label="How XLOOKUP works. Order 10001 has customer_id 27. XLOOKUP searches the customer_id column of the Customers table, finds 27 in its fourth row shown, and returns the region from the same row: Lagos.">
<title>How XLOOKUP works: it finds customer 27 in the Customers table's customer_id column and returns the region from the same row, Lagos.</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="1160" height="440" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect x="40" y="24" width="1080" height="54" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <text x="62" y="58" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" fill="#2A2926">=XLOOKUP(<tspan fill="#8A6A1F" font-weight="700">[@customer_id]</tspan>, <tspan fill="#2F5D8A" font-weight="700">Customers[customer_id]</tspan>, <tspan fill="#2F6B3F" font-weight="700">Customers[region]</tspan>, "Not found")</text>

  <!-- Orders -->
  <text x="40" y="118" font-size="15" font-weight="700" fill="#2A2926">Orders</text>
  <rect x="40" y="130" width="300" height="88" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <g font-size="13" fill="#5E5A52"><text x="58" y="156">order_id</text><text x="150" y="156">customer_id</text><text x="250" y="156">region</text></g>
  <line x1="40" x2="340" y1="168" y2="168" stroke="#EDE6D8"/>
  <rect x="140" y="176" width="92" height="32" rx="6" fill="#F3EBD8" stroke="#B38A3E"/>
  <g font-size="14" fill="#2A2926"><text x="58" y="198">10001</text><text x="178" y="198" font-weight="700" fill="#8A6A1F">27</text><text x="250" y="198" font-weight="700" fill="#2F6B3F">Lagos</text></g>
  <text x="40" y="306" font-size="13.5" fill="#2A2926">① Take this row's customer_id: 27.</text>

  <!-- Customers -->
  <text x="560" y="118" font-size="15" font-weight="700" fill="#2A2926">Customers</text>
  <rect x="560" y="130" width="560" height="236" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <g font-size="13" fill="#5E5A52"><text x="580" y="156">customer_id</text><text x="690" y="156">customer_name</text><text x="900" y="156">channel</text><text x="1010" y="156">region</text></g>
  <line x1="560" x2="1120" y1="168" y2="168" stroke="#EDE6D8"/>
  <g font-size="14" fill="#2A2926">
    <text x="600" y="196">25</text><text x="690" y="196">…</text><text x="900" y="196">…</text><text x="1010" y="196">…</text>
    <text x="600" y="236">26</text><text x="690" y="236">Chuks Trading Co.</text><text x="900" y="236">Wholesale</text><text x="1010" y="236">South West</text>
    <rect x="561" y="252" width="558" height="36" fill="#F3EBD8"/>
    <text x="600" y="276" font-weight="700" fill="#2F5D8A">27</text><text x="690" y="276">Alhaji Musa Wholesale</text><text x="900" y="276">Wholesale</text><text x="1010" y="276" font-weight="700" fill="#2F6B3F">Lagos</text>
    <text x="600" y="316">28</text><text x="690" y="316">…</text><text x="900" y="316">…</text><text x="1010" y="316">…</text>
    <text x="600" y="352" fill="#5E5A52">…</text>
  </g>
  <rect x="574" y="170" width="82" height="192" rx="6" fill="none" stroke="#2F5D8A" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="998" y="170" width="112" height="192" rx="6" fill="none" stroke="#2F6B3F" stroke-width="2" stroke-dasharray="5 4"/>

  <path d="M186,208 C186,262 420,272 588,272" fill="none" stroke="#8A6A1F" stroke-width="2.2" marker-end="url(#ar)"/>
  <path d="M1096,168 C1096,58 304,58 304,178" fill="none" stroke="#2F6B3F" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ar)"/>

  <g font-size="13.5" fill="#2A2926">
    <text x="580" y="396">② Search the <tspan fill="#2F5D8A" font-weight="700">lookup_array</tspan> (customer_id) from the top until 27 is found.</text>
    <text x="580" y="420">③ Return the <tspan fill="#2F6B3F" font-weight="700">return_array</tspan> value (region) from that same row: Lagos.</text>
  </g>
  <text x="40" y="340" font-size="13.5" fill="#2A2926">If 27 were not in the list, the</text>
  <text x="40" y="362" font-size="13.5" fill="#2A2926">cell would show "Not found"</text>
  <text x="40" y="384" font-size="13.5" fill="#2A2926">instead of #N/A.</text>
</g>
</svg>

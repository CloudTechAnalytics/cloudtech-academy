<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-label="How XLOOKUP works. Order 10001 has customer_id 27. XLOOKUP searches the customer_id column of the Customers table, finds 27, and returns the region from the same row: Lagos.">

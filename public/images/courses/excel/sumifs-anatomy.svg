<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" role="img" aria-label="How SUMIFS reads its arguments: the range to add comes first, then pairs of a range to test and a condition. Of six example order lines, only those that pass both tests (product 1 and a discount above zero) are added.">
<title>How SUMIFS reads its arguments: the range to add comes first, then pairs of a range to test and a condition. Of six example order lines, only those that pass both tests are added.</title>
<rect width="1160" height="470" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect x="40" y="28" width="1080" height="64" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <text x="64" y="68" font-family="'JetBrains Mono', Consolas, monospace" font-size="19" fill="#2A2926">=SUMIFS(<tspan fill="#8A6A1F" font-weight="700">Orders[revenue]</tspan>, <tspan fill="#2F5D8A" font-weight="700">Orders[product_id]</tspan>, <tspan fill="#2F5D8A">1</tspan>, <tspan fill="#2F6B3F" font-weight="700">Orders[discount_pct]</tspan>, <tspan fill="#2F6B3F">"&gt;0"</tspan>)</text>
  <g font-size="13.5">
    <text x="150" y="120" fill="#8A6A1F" font-weight="700">① what to add up</text>
    <text x="440" y="120" fill="#2F5D8A" font-weight="700">② test 1: range, condition</text>
    <text x="770" y="120" fill="#2F6B3F" font-weight="700">③ test 2: range, condition</text>
  </g>

  <g font-size="13" fill="#5E5A52"><text x="70" y="160">product_id</text><text x="210" y="160">discount_pct</text><text x="360" y="160">revenue</text><text x="500" y="160">test 1</text><text x="600" y="160">test 2</text><text x="700" y="160">added?</text></g>
  <rect x="40" y="172" width="760" height="246" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <g font-size="14" fill="#2A2926">
    <text x="90" y="202">1</text><text x="240" y="202">0</text><text x="360" y="202">92,400</text><text x="510" y="202" fill="#2F6B3F">✓</text><text x="612" y="202" fill="#9B2C1F">✗</text><text x="700" y="202" fill="#9B2C1F">no</text>
    <line x1="40" x2="800" y1="213" y2="213" stroke="#EDE6D8"/>
    <text x="90" y="242">3</text><text x="240" y="242">5</text><text x="360" y="242">212,040</text><text x="510" y="242" fill="#9B2C1F">✗</text><text x="612" y="242" fill="#2F6B3F">✓</text><text x="700" y="242" fill="#9B2C1F">no</text>
    <line x1="40" x2="800" y1="253" y2="253" stroke="#EDE6D8"/>
    <rect x="41" y="254" width="758" height="39" fill="#F3EBD8"/>
    <text x="90" y="282">1</text><text x="240" y="282">5</text><text x="360" y="282" font-weight="700">250,800</text><text x="510" y="282" fill="#2F6B3F">✓</text><text x="612" y="282" fill="#2F6B3F">✓</text><text x="700" y="282" fill="#2F6B3F" font-weight="700">yes</text>
    <line x1="40" x2="800" y1="293" y2="293" stroke="#EDE6D8"/>
    <text x="90" y="322">7</text><text x="240" y="322">0</text><text x="360" y="322">159,600</text><text x="510" y="322" fill="#9B2C1F">✗</text><text x="612" y="322" fill="#9B2C1F">✗</text><text x="700" y="322" fill="#9B2C1F">no</text>
    <line x1="40" x2="800" y1="333" y2="333" stroke="#EDE6D8"/>
    <rect x="41" y="334" width="758" height="39" fill="#F3EBD8"/>
    <text x="90" y="362">1</text><text x="240" y="362">10</text><text x="360" y="362" font-weight="700">166,320</text><text x="510" y="362" fill="#2F6B3F">✓</text><text x="612" y="362" fill="#2F6B3F">✓</text><text x="700" y="362" fill="#2F6B3F" font-weight="700">yes</text>
    <line x1="40" x2="800" y1="373" y2="373" stroke="#EDE6D8"/>
    <text x="90" y="402">2</text><text x="240" y="402">10</text><text x="360" y="402">32,400</text><text x="510" y="402" fill="#9B2C1F">✗</text><text x="612" y="402" fill="#2F6B3F">✓</text><text x="700" y="402" fill="#9B2C1F">no</text>
  </g>

  <rect x="830" y="172" width="290" height="246" rx="10" fill="#EFE4CC" stroke="#B38A3E" stroke-width="1.5"/>
  <g font-size="14.5" fill="#2A2926">
    <text x="852" y="208" font-weight="700">Result</text>
    <text x="852" y="240">250,800 + 166,320</text>
    <text x="852" y="270" font-size="22" font-weight="700">= 417,120</text>
    <text x="852" y="314">A row is added only when</text>
    <text x="852" y="336">every test is true (AND).</text>
    <text x="852" y="374">COUNTIFS works the same way</text>
    <text x="852" y="396">but counts the rows: 2.</text>
  </g>
  <text x="40" y="448" font-size="13" fill="#5E5A52">Six example rows, for illustration. On the full Orders table the same formula adds 121 lines and gives ₦27,877,340.</text>
</g>
</svg>

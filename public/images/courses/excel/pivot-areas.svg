<text xml:space="preserve" x="382.0" y="481.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">79,844,085</text>
<text xml:space="preserve" x="558.0" y="481.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">51,692,900</text>
<text xml:space="preserve" x="734.0" y="481.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">131,536,985</text>
<rect x="18.0" y="493.0" width="724.0" height="28.0" rx="3" fill="#F3EBD8"/>

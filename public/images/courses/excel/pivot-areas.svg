<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="The four areas of a pivot table and the table they produce. region in Rows gives one row per region; year in Columns gives one column per year; Sum of revenue in Values fills the cells; channel in Filters limits the whole table.">
<title>The four areas of a pivot table and the summary they produce.</title>

<rect width="760" height="600" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">You drag fields into four areas…</text>
<rect x="16.0" y="42.0" width="358.0" height="68.0" rx="10" fill="#FFFFFF" stroke="#5C4F80" stroke-width="1.6"/>
<text xml:space="preserve" x="32.0" y="68.0" font-size="14" fill="#5C4F80" font-weight="700" text-anchor="start">Filters</text>
<rect x="32.0" y="76.0" width="326.0" height="26.0" rx="6" fill="#EEEAF5"/>
<text xml:space="preserve" x="44.0" y="94.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">channel</text>
<rect x="386.0" y="42.0" width="358.0" height="68.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="402.0" y="68.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start">Columns</text>
<rect x="402.0" y="76.0" width="326.0" height="26.0" rx="6" fill="#E6EEF6"/>
<text xml:space="preserve" x="414.0" y="94.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">year (order_date)</text>
<rect x="16.0" y="122.0" width="358.0" height="68.0" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.6"/>
<text xml:space="preserve" x="32.0" y="148.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">Rows</text>
<rect x="32.0" y="156.0" width="326.0" height="26.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="44.0" y="174.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">region</text>
<rect x="386.0" y="122.0" width="358.0" height="68.0" rx="10" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="402.0" y="148.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">Values</text>
<rect x="402.0" y="156.0" width="326.0" height="26.0" rx="6" fill="#E5F0E8"/>
<text xml:space="preserve" x="414.0" y="174.0" font-size="13.5" fill="#2A2926" font-weight="400" text-anchor="start">Sum of revenue</text>
<text xml:space="preserve" x="16.0" y="228.0" font-size="15" fill="#2A2926" font-weight="700" text-anchor="start">…and Excel builds the summary</text>
<rect x="16.0" y="240.0" width="728.0" height="34.0" rx="6" fill="#EEEAF5"/>
<text xml:space="preserve" x="30.0" y="262.0" font-size="13.5" fill="#5C4F80" font-weight="700" text-anchor="start">channel   (All) ▾</text>
<rect x="16.0" y="282.0" width="728.0" height="240.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,312 L17,290 Q17,283 24,283 L736,283 Q743,283 743,290 L743,312 Z" fill="#EFE4CC"/>

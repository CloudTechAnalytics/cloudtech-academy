<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Expected monetary value for four illustrative risks, in millions of naira. Customs delay: 40 percent times 3.0 is 1.2. Generator failure: 20 percent times 1.5 is 0.3. Supervisor resigns: 15 percent times 2.0 is 0.3. Landlord layout change: 10 percent times 4.0 is 0.4. Total EMV is 2.2, which sets the contingency reserve. Each risk gets one of four responses: avoid, reduce, transfer, accept.">
<title>EMV = probability × impact ranks risks and sizes the contingency; four possible responses.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="30.0" width="728.0" height="192.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,62 L17,38 Q17,31 24,31 L736,31 Q743,31 743,38 L743,62 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="26.0" y="50.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">Risk</text>
<text xml:space="preserve" x="286.0" y="50.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">Probability</text>
<text xml:space="preserve" x="396.0" y="50.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">Impact (₦m)</text>
<text xml:space="preserve" x="516.0" y="50.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">EMV (₦m)</text>
<text xml:space="preserve" x="616.0" y="50.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">Response</text>
<line x1="16.0" y1="62.0" x2="744.0" y2="62.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="82.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Customs delay on racking</text>
<text xml:space="preserve" x="286.0" y="82.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">40%</text>
<text xml:space="preserve" x="396.0" y="82.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">3.0</text>
<text xml:space="preserve" x="516.0" y="82.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">1.2</text>
<text xml:space="preserve" x="616.0" y="82.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Reduce</text>
<line x1="16.0" y1="94.0" x2="744.0" y2="94.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="114.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Landlord changes layout</text>
<text xml:space="preserve" x="286.0" y="114.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">10%</text>
<text xml:space="preserve" x="396.0" y="114.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">4.0</text>
<text xml:space="preserve" x="516.0" y="114.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">0.4</text>
<text xml:space="preserve" x="616.0" y="114.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Avoid</text>
<line x1="16.0" y1="126.0" x2="744.0" y2="126.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="146.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Generator fails in trial</text>
<text xml:space="preserve" x="286.0" y="146.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">20%</text>
<text xml:space="preserve" x="396.0" y="146.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">1.5</text>
<text xml:space="preserve" x="516.0" y="146.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">0.3</text>
<text xml:space="preserve" x="616.0" y="146.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Transfer</text>
<line x1="16.0" y1="158.0" x2="744.0" y2="158.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="178.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Key supervisor resigns</text>
<text xml:space="preserve" x="286.0" y="178.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">15%</text>
<text xml:space="preserve" x="396.0" y="178.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">2.0</text>
<text xml:space="preserve" x="516.0" y="178.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">0.3</text>
<text xml:space="preserve" x="616.0" y="178.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Accept</text>
<rect x="18.0" y="191.0" width="724.0" height="30.0" rx="3" fill="#F3EBD8"/>
<text xml:space="preserve" x="26.0" y="210.5" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Total EMV: the contingency</text>
<text xml:space="preserve" x="286.0" y="210.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start"></text>
<text xml:space="preserve" x="396.0" y="210.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start"></text>
<text xml:space="preserve" x="516.0" y="210.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">2.2</text>
<text xml:space="preserve" x="616.0" y="210.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start"></text>
<rect x="16.0" y="262.0" width="176.0" height="80.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="290.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start">Avoid</text>
<text xml:space="preserve" x="30.0" y="312.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">change the plan so it</text>
<text xml:space="preserve" x="30.0" y="328.7" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">can't happen</text>
<rect x="200.0" y="262.0" width="176.0" height="80.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="214.0" y="290.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">Reduce</text>
<text xml:space="preserve" x="214.0" y="312.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">lower the chance or the</text>
<text xml:space="preserve" x="214.0" y="328.7" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">impact</text>
<rect x="384.0" y="262.0" width="176.0" height="80.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.4"/>
<text xml:space="preserve" x="398.0" y="290.0" font-size="14" fill="#5C4F80" font-weight="700" text-anchor="start">Transfer</text>
<text xml:space="preserve" x="398.0" y="312.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">insurance, fixed price,</text>
<text xml:space="preserve" x="398.0" y="328.7" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">hedge</text>
<rect x="568.0" y="262.0" width="176.0" height="80.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.4"/>
<text xml:space="preserve" x="582.0" y="290.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">Accept</text>
<text xml:space="preserve" x="582.0" y="312.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">hold money and time in</text>
<text xml:space="preserve" x="582.0" y="328.7" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">reserve</text>
<text xml:space="preserve" x="16.0" y="380.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">A risk might happen; an issue has. When a risk happens, its response becomes urgent.</text>
<text xml:space="preserve" x="16.0" y="404.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Contingency covers identified risks, roughly their total EMV, and is released only when one happens.</text>
</g></svg>
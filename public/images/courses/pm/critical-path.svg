<text xml:space="preserve" x="275.0" y="132.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">EF 17</text>
<text xml:space="preserve" x="342.0" y="132.0" font-size="10.5" fill="#9B2C1F" font-weight="700" text-anchor="end">float 0</text>
<text xml:space="preserve" x="208.0" y="64.0" font-size="10.5" fill="#2F5D8A" font-weight="700" text-anchor="start">LS 5</text>
<text xml:space="preserve" x="342.0" y="64.0" font-size="10.5" fill="#2F5D8A" font-weight="700" text-anchor="end">LF 17</text>
<rect x="200.0" y="190.0" width="150.0" height="70.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>

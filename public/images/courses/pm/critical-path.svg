<text xml:space="preserve" x="24.0" y="212.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="start">ES 0</text>
<text xml:space="preserve" x="91.0" y="212.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">EF 5</text>
<text xml:space="preserve" x="158.0" y="212.0" font-size="10.5" fill="#9B2C1F" font-weight="700" text-anchor="end">float 0</text>
<text xml:space="preserve" x="24.0" y="144.0" font-size="10.5" fill="#2F5D8A" font-weight="700" text-anchor="start">LS 0</text>
<text xml:space="preserve" x="158.0" y="144.0" font-size="10.5" fill="#2F5D8A" font-weight="700" text-anchor="end">LF 5</text>
<rect x="200.0" y="70.0" width="150.0" height="70.0" rx="8" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.8"/>

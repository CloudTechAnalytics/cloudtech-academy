<text xml:space="preserve" x="542.0" y="294.0" font-size="10.5" fill="#2F5D8A" font-weight="700" text-anchor="end">LF 27</text>
<rect x="590.0" y="150.0" width="150.0" height="70.0" rx="8" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.8"/>
<text xml:space="preserve" x="665.0" y="172.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">F  Train staff</text>
<text xml:space="preserve" x="665.0" y="190.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">4 days</text>
<text xml:space="preserve" x="598.0" y="212.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="start">ES 27</text>
<text xml:space="preserve" x="665.0" y="212.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">EF 31</text>
<text xml:space="preserve" x="732.0" y="212.0" font-size="10.5" fill="#9B2C1F" font-weight="700" text-anchor="end">float 0</text>

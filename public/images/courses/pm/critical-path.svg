<text xml:space="preserve" x="542.0" y="64.0" font-size="10.5" fill="#2F5D8A" font-weight="700" text-anchor="end">LF 27</text>
<rect x="400.0" y="300.0" width="150.0" height="70.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.3"/>
<text xml:space="preserve" x="475.0" y="322.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">E  Hire staff</text>
<text xml:space="preserve" x="475.0" y="340.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">8 days</text>
<text xml:space="preserve" x="408.0" y="362.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="start">ES 5</text>

<text xml:space="preserve" x="208.0" y="252.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="start">ES 5</text>
<text xml:space="preserve" x="275.0" y="252.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">EF 11</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="A critical path example with six illustrative tasks. A lease takes 5 days; permits 12, racking order 6 and hiring 8 all follow it; fit-out takes 10 and needs permits and the racking; training takes 4 and needs fit-out and hiring. The forward pass gives a project length of 31 days. The critical path, with zero float, runs through Lease signed, Permits, Fit-out, Train staff. The racking order has 6 days of float and hiring has 14.">
<title>Forward pass, backward pass, float, and the critical path (an illustration).</title>
<defs><marker id="a9B2C1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B2C1F"/></marker><marker id="a5E5A52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E5A52"/></marker></defs>
<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="150.0" width="150.0" height="70.0" rx="8" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.8"/>

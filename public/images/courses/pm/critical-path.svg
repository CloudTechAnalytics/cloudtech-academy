<text xml:space="preserve" x="408.0" y="132.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="start">ES 17</text>
<text xml:space="preserve" x="475.0" y="132.0" font-size="10.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">EF 27</text>
<text xml:space="preserve" x="542.0" y="132.0" font-size="10.5" fill="#9B2C1F" font-weight="700" text-anchor="end">float 0</text>

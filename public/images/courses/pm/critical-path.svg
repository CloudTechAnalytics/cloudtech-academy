<text xml:space="preserve" x="16.0" y="36.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">Project length 31 days.  Critical path: A → B → D → F</text>
<text xml:space="preserve" x="16.0" y="396.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">ES/EF: forward pass.   LS/LF: backward pass.   Float = LS − ES: how long a task can slip without delaying the end.</text>
<text xml:space="preserve" x="16.0" y="416.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Only a delay on a zero-float (red) task delays the whole project.</text>
</g></svg>
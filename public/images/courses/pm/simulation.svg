<text xml:space="preserve" x="536.0" y="94.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">1  draw each task's</text>
<text xml:space="preserve" x="536.0" y="114.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">    duration at random</text>
<text xml:space="preserve" x="536.0" y="134.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">2  schedule the project</text>
<text xml:space="preserve" x="536.0" y="154.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">3  record the end</text>
<text xml:space="preserve" x="536.0" y="174.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">4  repeat thousands</text>
<text xml:space="preserve" x="536.0" y="194.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">    of times</text>
<text xml:space="preserve" x="16.0" y="332.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start">Chance of finishing within the plan's 29 days: about 6%.</text>
<text xml:space="preserve" x="16.0" y="358.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Merge bias: where paths join, the project waits for the slowest. Each path alone may be on time; the chance</text>
<text xml:space="preserve" x="16.0" y="376.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">that all are is lower.</text>
<text xml:space="preserve" x="16.0" y="396.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Commit to a date with a buffer: P80 is the date you have an 80% chance of meeting.</text>

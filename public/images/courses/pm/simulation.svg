<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="A Monte Carlo simulation of a small illustrative schedule, run 20,000 times. Two paths join before the final task, so the project waits for the slower one. The plan, using most likely durations, says 29 days. Across the simulations the finishing times spread to the right of the plan: only about 6% finish within 29 days, the median is 35 days, and P80, the length with an 80 percent chance of being met, is 38 days.">
<title>Thousands of random runs: the plan's date is far from certain, and P80 is later.</title>


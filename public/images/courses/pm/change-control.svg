<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Assessing a change request. Is the affected task on the critical path? If it has float and the change fits within that float, the finish doesn't move: approve, and record the cost. If it's on the critical path, the finish moves by the extra days; then check the deadline and the budget plus contingency. To finish sooner you can crash (spend money to shorten a critical task) or fast-track (overlap tasks planned in sequence). Both only help on the critical path. Every request gets a recorded decision: approve, reject or defer.">
<title>A change on a float task can be absorbed; on the critical path it moves the finish.</title>
<defs><marker id="a9B2C1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B2C1F"/></marker><marker id="a2F6B3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B3F"/></marker><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="16.0" width="300.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#B38A3E" stroke-width="1.6"/>
<text xml:space="preserve" x="166.0" y="40.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="middle">Change request arrives</text>
<text xml:space="preserve" x="166.0" y="58.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">which task? how many days? what cost?</text>
<path d="M318.0,44.0 L350.0,44.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="354.0" y="16.0" width="390.0" height="56.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="549.0" y="40.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="middle">Does that task have float?</text>
<text xml:space="preserve" x="549.0" y="58.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">from the current forecast</text>
<path d="M549,74 L549,92 L194,92 L194,108" fill="none" stroke="#2F6B3F" stroke-width="1.8" marker-end="url(#a2F6B3F)"/>
<text xml:space="preserve" x="360.0" y="86.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">yes: within its float</text>
<path d="M549,74 L549,108" fill="none" stroke="#9B2C1F" stroke-width="1.8" marker-end="url(#a9B2C1F)"/>
<text xml:space="preserve" x="560.0" y="98.0" font-size="11.5" fill="#9B2C1F" font-weight="700" text-anchor="start">no: critical path</text>
<rect x="16.0" y="112.0" width="356.0" height="172.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="138.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Float task: +3 days absorbed</text>
<text xml:space="preserve" x="30.0" y="169.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Supplier</text>
<rect x="112.0" y="157.0" width="64.0" height="18.0" rx="3" fill="#C9A867"/>
<text xml:space="preserve" x="30.0" y="197.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Cold room (+3)</text>
<rect x="176.0" y="185.0" width="112.0" height="18.0" rx="3" fill="#C9A867"/>
<text xml:space="preserve" x="30.0" y="225.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Fit-out</text>
<rect x="176.0" y="213.0" width="128.0" height="18.0" rx="3" fill="#9B2C1F"/>
<line x1="304.0" y1="150.0" x2="304.0" y2="238.0" stroke="#8A6A1F" stroke-width="1.6" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="304.0" y="250.0" font-size="10.5" fill="#8A6A1F" font-weight="700" text-anchor="middle">finish</text>
<text xml:space="preserve" x="30.0" y="272.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">Finish unchanged: approve, record the cost.</text>
<rect x="388.0" y="112.0" width="356.0" height="172.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="402.0" y="138.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Critical task: +3 days moves the finish</text>
<text xml:space="preserve" x="402.0" y="169.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Permits</text>
<rect x="484.0" y="157.0" width="64.0" height="18.0" rx="3" fill="#9B2C1F"/>
<text xml:space="preserve" x="402.0" y="197.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">Fit-out (+3)</text>
<rect x="548.0" y="185.0" width="152.0" height="18.0" rx="3" fill="#9B2C1F"/>
<line x1="676.0" y1="150.0" x2="676.0" y2="238.0" stroke="#8A6A1F" stroke-width="1.6" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="671.0" y="250.0" font-size="10.5" fill="#8A6A1F" font-weight="700" text-anchor="end">finish</text>
<line x1="700.0" y1="150.0" x2="700.0" y2="238.0" stroke="#9B2C1F" stroke-width="2.2"/>
<text xml:space="preserve" x="706.0" y="250.0" font-size="10.5" fill="#9B2C1F" font-weight="700" text-anchor="start">+3 days</text>
<text xml:space="preserve" x="402.0" y="272.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">Finish moves: check deadline and budget.</text>
<text xml:space="preserve" x="16.0" y="312.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">To finish sooner (critical path only)</text>
<rect x="16.0" y="324.0" width="356.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="348.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Crashing</text>
<text xml:space="preserve" x="30.0" y="366.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">spend money to shorten a task: weekend work, more</text>
<text xml:space="preserve" x="30.0" y="382.7" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">crews</text>
<rect x="388.0" y="324.0" width="356.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="402.0" y="348.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Fast-tracking</text>
<text xml:space="preserve" x="402.0" y="366.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">overlap tasks planned in sequence, and accept the</text>
<text xml:space="preserve" x="402.0" y="382.7" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">rework risk</text>
<text xml:space="preserve" x="16.0" y="414.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Decide, don't drift: approve, reject or defer to after opening, with a reason, in the change log.</text>
</g></svg>
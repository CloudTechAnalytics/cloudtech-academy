<rect x="16.0" y="262.0" width="12.0" height="12.0" rx="2" fill="#2F6B3F"/>
<text xml:space="preserve" x="34.0" y="273.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">done</text>
<rect x="86.0" y="262.0" width="12.0" height="12.0" rx="2" fill="#B38A3E"/>
<text xml:space="preserve" x="104.0" y="273.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">still to do</text>
<text xml:space="preserve" x="190.0" y="273.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Nothing can finish before the status date.</text>
<rect x="16.0" y="296.0" width="232.0" height="84.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<circle cx="38.0" cy="324.0" r="8" fill="#2F6B3F"/>
<text xml:space="preserve" x="56.0" y="330.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">Green</text>
<text xml:space="preserve" x="32.0" y="352.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">forecast meets the deadline with</text>
<text xml:space="preserve" x="32.0" y="368.7" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">5+ days spare, and CPI ≥ 0.95</text>
<rect x="264.0" y="296.0" width="232.0" height="84.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<circle cx="286.0" cy="324.0" r="8" fill="#B38A3E"/>
<text xml:space="preserve" x="304.0" y="330.0" font-size="14" fill="#B38A3E" font-weight="700" text-anchor="start">Amber</text>
<text xml:space="preserve" x="280.0" y="352.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">less than 5 days spare, or CPI</text>
<text xml:space="preserve" x="280.0" y="368.7" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">0.90 to 0.95</text>
<rect x="512.0" y="296.0" width="232.0" height="84.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<circle cx="534.0" cy="324.0" r="8" fill="#9B2C1F"/>
<text xml:space="preserve" x="552.0" y="330.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">Red</text>
<text xml:space="preserve" x="528.0" y="352.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">forecast misses the deadline, or</text>
<text xml:space="preserve" x="528.0" y="368.7" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">CPI below 0.90</text>
<text xml:space="preserve" x="16.0" y="410.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Remaining work: to plan if the cause is over; at the rate so far if it's still there.</text>
</g></svg>
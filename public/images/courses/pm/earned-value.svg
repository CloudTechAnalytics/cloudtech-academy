<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Earned value at week 6 of 12, with illustrative numbers, on a project with a budget at completion of 100. Planned value is 40: the work that should be done by now. Earned value is 30: the budget value of the work actually done. Actual cost is 36. Schedule variance is EV minus PV, minus 10. Cost variance is EV minus AC, minus 6. SPI is EV over PV, 0.75. CPI is EV over AC, 0.83. The estimate at completion, BAC over CPI, is 120.">
<title>Planned value, earned value and actual cost at the status date, and what they tell you.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<line x1="56.0" y1="270.0" x2="470.0" y2="270.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="48.0" y="274.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="end">0</text>
<line x1="56.0" y1="183.8" x2="470.0" y2="183.8" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="48.0" y="187.8" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="end">50</text>
<line x1="56.0" y1="97.7" x2="470.0" y2="97.7" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="48.0" y="101.7" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="end">100</text>
<text xml:space="preserve" x="56.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">0</text>
<text xml:space="preserve" x="125.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">2</text>
<text xml:space="preserve" x="194.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">4</text>
<text xml:space="preserve" x="263.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">6</text>
<text xml:space="preserve" x="332.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">8</text>
<text xml:space="preserve" x="401.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">10</text>
<text xml:space="preserve" x="470.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">12</text>
<text xml:space="preserve" x="263.0" y="308.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">week</text>
<line x1="56.0" y1="97.7" x2="470.0" y2="97.7" stroke="#5E5A52" stroke-width="1.4" stroke-dasharray="4 4"/>
<text xml:space="preserve" x="470.0" y="91.7" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="end">BAC 100</text>
<path d="M56.0,270.0 L90.5,263.7 L125.0,254.6 L159.5,242.1 L194.0,225.6 L228.5,205.8 L263.0,183.8 L297.5,161.9 L332.0,142.0 L366.5,125.6 L401.0,113.1 L435.5,104.0 L470.0,97.7" fill="none" stroke="#2F5D8A" stroke-width="2.6"/>
<text xml:space="preserve" x="373.4" y="147.6" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start">planned (PV)</text>
<line x1="263.0" y1="46.0" x2="263.0" y2="270.0" stroke="#8A6A1F" stroke-width="1.6" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="263.0" y="40.0" font-size="11.5" fill="#8A6A1F" font-weight="700" text-anchor="middle">status date</text>
<circle cx="263.0" cy="201.1" r="6" fill="#2F5D8A" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="263.0" cy="218.3" r="6" fill="#2F6B3F" stroke="#FFFFFF" stroke-width="1.5"/>
<circle cx="263.0" cy="208.0" r="6" fill="#9B2C1F" stroke="#FFFFFF" stroke-width="1.5"/>
<text xml:space="preserve" x="275.0" y="205.1" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start">PV 40</text>
<text xml:space="preserve" x="275.0" y="224.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">AC 36</text>
<text xml:space="preserve" x="251.0" y="236.3" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="end">EV 30</text>
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Status at week 6 of 12 (illustration)</text>
<rect x="500.0" y="40.0" width="244.0" height="180.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M501,70 L501,48 Q501,41 508,41 L736,41 Q743,41 743,48 L743,70 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="510.0" y="59.5" font-size="11.0" fill="#5E5A52" font-weight="700" text-anchor="start">Measure</text>
<text xml:space="preserve" x="660.0" y="59.5" font-size="11.0" fill="#5E5A52" font-weight="700" text-anchor="start">Value</text>
<line x1="500.0" y1="70.0" x2="744.0" y2="70.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="510.0" y="89.5" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">SV = EV − PV</text>
<text xml:space="preserve" x="660.0" y="89.5" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">−10</text>
<line x1="500.0" y1="100.0" x2="744.0" y2="100.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="510.0" y="119.5" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">CV = EV − AC</text>
<text xml:space="preserve" x="660.0" y="119.5" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">−6</text>
<line x1="500.0" y1="130.0" x2="744.0" y2="130.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="510.0" y="149.5" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">SPI = EV ÷ PV</text>
<text xml:space="preserve" x="660.0" y="149.5" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">0.75</text>
<line x1="500.0" y1="160.0" x2="744.0" y2="160.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="510.0" y="179.5" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">CPI = EV ÷ AC</text>
<text xml:space="preserve" x="660.0" y="179.5" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">0.83</text>
<line x1="500.0" y1="190.0" x2="744.0" y2="190.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="510.0" y="209.5" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">EAC = BAC ÷ CPI</text>
<text xml:space="preserve" x="660.0" y="209.5" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">120</text>
<text xml:space="preserve" x="500.0" y="238.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">Below 1 or negative: behind schedule,</text>
<text xml:space="preserve" x="500.0" y="255.4" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">over budget.</text>
<text xml:space="preserve" x="16.0" y="332.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">PV: work that should be done by now.   EV: work actually done, at its budget.   AC: money spent.</text>
<text xml:space="preserve" x="16.0" y="356.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Behind (SPI 0.75) and over budget (CPI 0.83): at this rate the project ends near 120, not 100.</text>
<text xml:space="preserve" x="16.0" y="384.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">EV = each task's budget × its percentage complete, added up.</text>
</g></svg>
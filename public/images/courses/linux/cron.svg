<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The five time fields of a cron line, with an example. */5 * * * * runs every 5 minutes. 0 3 * * * runs at 3:00 every day. The fields are minute, hour, day of month, month and day of week, followed by the command.">
<title>Reading a cron line: five time fields, then the command.</title>

<rect width="760" height="300" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="40.0" width="100.0" height="40.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="66.0" y="66.0" font-size="18" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">0</text>
<text xml:space="preserve" x="66.0" y="100.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">minute</text>
<text xml:space="preserve" x="66.0" y="118.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">0–59</text>
<rect x="126.0" y="40.0" width="100.0" height="40.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="176.0" y="66.0" font-size="18" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">3</text>
<text xml:space="preserve" x="176.0" y="100.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">hour</text>
<text xml:space="preserve" x="176.0" y="118.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">0–23</text>
<rect x="236.0" y="40.0" width="100.0" height="40.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="286.0" y="66.0" font-size="18" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">*</text>
<text xml:space="preserve" x="286.0" y="100.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">day of month</text>
<text xml:space="preserve" x="286.0" y="118.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">1–31</text>
<rect x="346.0" y="40.0" width="100.0" height="40.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="396.0" y="66.0" font-size="18" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">*</text>
<text xml:space="preserve" x="396.0" y="100.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">month</text>
<text xml:space="preserve" x="396.0" y="118.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">1–12</text>
<rect x="456.0" y="40.0" width="100.0" height="40.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="506.0" y="66.0" font-size="18" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">*</text>
<text xml:space="preserve" x="506.0" y="100.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">day of week</text>
<text xml:space="preserve" x="506.0" y="118.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">0–6, Sun = 0</text>
<rect x="570.0" y="40.0" width="174.0" height="40.0" rx="6" fill="#F2EFE8"/>
<text xml:space="preserve" x="582.0" y="66.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">/usr/sbin/logrotate …</text>
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">0 3 * * *  → every day at 03:00</text>
<rect x="16.0" y="150.0" width="728.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="176.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">More patterns</text>
<text xml:space="preserve" x="32.0" y="204.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">*/5 * * * *</text>
<text xml:space="preserve" x="220.0" y="204.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">every 5 minutes</text>
<text xml:space="preserve" x="32.0" y="226.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">0 9 * * 1-5</text>
<text xml:space="preserve" x="220.0" y="226.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">09:00, Monday to Friday</text>
<text xml:space="preserve" x="32.0" y="248.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">30 2 1 * *</text>
<text xml:space="preserve" x="220.0" y="248.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">02:30 on the 1st of each month</text>
</g></svg>
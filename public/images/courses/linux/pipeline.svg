<text xml:space="preserve" x="618.0" y="160.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">lines only</text>
<text xml:space="preserve" x="16.0" y="316.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">awk picks a column, sort groups identical lines, uniq -c counts them, sort -rn ranks the counts, head</text>
<text xml:space="preserve" x="16.0" y="334.9" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">keeps the top. Five small tools, one answer: the busiest client addresses.</text>
<text xml:space="preserve" x="16.0" y="384.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Sample lines for illustration; run it on the course's access.log for the real counts.</text>

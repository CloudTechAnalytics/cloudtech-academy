<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="How a pipeline works. awk prints the first field (the client IP) of every log line; sort puts identical IPs next to each other; uniq -c counts each run of identical lines; sort -rn sorts those counts from largest to smallest; head -3 keeps the top three. Each command's output becomes the next one's input.">
<title>A pipeline: each command's output feeds the next.</title>

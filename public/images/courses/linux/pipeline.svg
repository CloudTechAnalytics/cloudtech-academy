<text xml:space="preserve" x="28.0" y="40.0" font-size="13.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">awk '{print $1}' access.log | sort | uniq -c | sort -rn | head -3</text>

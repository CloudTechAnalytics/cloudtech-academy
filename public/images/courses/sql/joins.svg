<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-label="INNER JOIN and LEFT JOIN compared. Three customers and three shipments. Apex has two shipments, Zenith one, Lagoon none. INNER JOIN returns three rows, one per matching shipment, and leaves Lagoon out. LEFT JOIN returns four rows, keeping Lagoon with empty shipment columns.">
<title>INNER JOIN keeps only matches; LEFT JOIN keeps every row of the first table.</title>

<rect width="760" height="570" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="40.0" y="30.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">customers (c)</text>
<rect x="40.0" y="40.0" width="250.0" height="104.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M41,66 L41,48 Q41,41 48,41 L282,41 Q289,41 289,48 L289,66 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="140.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">customer_id</text>
<text xml:space="preserve" x="160.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">company_name</text>
<line x1="40.0" y1="66.0" x2="290.0" y2="66.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="140.0" y="83.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">1</text>
<text xml:space="preserve" x="160.0" y="83.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Apex</text>
<line x1="40.0" y1="92.0" x2="290.0" y2="92.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="140.0" y="109.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">2</text>
<text xml:space="preserve" x="160.0" y="109.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Zenith</text>
<rect x="42.0" y="119.0" width="246.0" height="24.0" rx="3" fill="#F6E3E0"/>
<text xml:space="preserve" x="140.0" y="135.5" font-size="13" fill="#2A2926" font-weight="700" text-anchor="end">3</text>
<text xml:space="preserve" x="160.0" y="135.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Lagoon</text>
<text xml:space="preserve" x="440.0" y="30.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">shipments (s)</text>
<rect x="440.0" y="40.0" width="240.0" height="104.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M441,66 L441,48 Q441,41 448,41 L672,41 Q679,41 679,48 L679,66 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="550.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">shipment_id</text>
<text xml:space="preserve" x="670.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">customer_id</text>
<line x1="440.0" y1="66.0" x2="680.0" y2="66.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="550.0" y="83.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">101</text>
<text xml:space="preserve" x="670.0" y="83.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">1</text>
<line x1="440.0" y1="92.0" x2="680.0" y2="92.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="550.0" y="109.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">102</text>
<text xml:space="preserve" x="670.0" y="109.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">1</text>
<line x1="440.0" y1="118.0" x2="680.0" y2="118.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="550.0" y="135.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">103</text>
<text xml:space="preserve" x="670.0" y="135.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">2</text>
<text xml:space="preserve" x="380.0" y="168.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">ON s.customer_id = c.customer_id</text>
<text xml:space="preserve" x="380.0" y="190.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="middle">Lagoon (3) has no shipments.</text>
<text xml:space="preserve" x="40.0" y="228.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">INNER JOIN: only matches</text>
<rect x="40.0" y="238.0" width="280.0" height="104.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M41,264 L41,246 Q41,239 48,239 L312,239 Q319,239 319,246 L319,264 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="50.0" y="255.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">company_name</text>
<text xml:space="preserve" x="310.0" y="255.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">shipment_id</text>
<line x1="40.0" y1="264.0" x2="320.0" y2="264.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="50.0" y="281.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Apex</text>
<text xml:space="preserve" x="310.0" y="281.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">101</text>
<line x1="40.0" y1="290.0" x2="320.0" y2="290.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="50.0" y="307.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Apex</text>
<text xml:space="preserve" x="310.0" y="307.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">102</text>
<line x1="40.0" y1="316.0" x2="320.0" y2="316.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="50.0" y="333.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Zenith</text>
<text xml:space="preserve" x="310.0" y="333.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">103</text>
<text xml:space="preserve" x="40.0" y="364.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">3 rows. Lagoon is left out; Apex twice.</text>
<text xml:space="preserve" x="440.0" y="228.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">LEFT JOIN: every customer</text>
<rect x="440.0" y="238.0" width="280.0" height="130.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M441,264 L441,246 Q441,239 448,239 L712,239 Q719,239 719,246 L719,264 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="450.0" y="255.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">company_name</text>
<text xml:space="preserve" x="710.0" y="255.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">shipment_id</text>
<line x1="440.0" y1="264.0" x2="720.0" y2="264.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="450.0" y="281.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Apex</text>
<text xml:space="preserve" x="710.0" y="281.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">101</text>
<line x1="440.0" y1="290.0" x2="720.0" y2="290.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="450.0" y="307.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Apex</text>
<text xml:space="preserve" x="710.0" y="307.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">102</text>
<line x1="440.0" y1="316.0" x2="720.0" y2="316.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="450.0" y="333.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Zenith</text>
<text xml:space="preserve" x="710.0" y="333.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">103</text>
<rect x="442.0" y="343.0" width="276.0" height="24.0" rx="3" fill="#F6E3E0"/>
<text xml:space="preserve" x="450.0" y="359.5" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Lagoon</text>
<text xml:space="preserve" x="710.0" y="359.5" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="end">NULL</text>
<text xml:space="preserve" x="440.0" y="390.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">4 rows. Lagoon kept, with no shipment.</text>
<rect x="40.0" y="410.0" width="680.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="56.0" y="436.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">How to read it</text>
<text xml:space="preserve" x="56.0" y="462.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">• Each shipment is matched to the customer with the same customer_id.</text>
<text xml:space="preserve" x="56.0" y="481.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">• A customer with two shipments appears twice: one row per match.</text>
<text xml:space="preserve" x="56.0" y="500.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">• INNER JOIN drops rows with no match. LEFT JOIN keeps every row of the first</text>
<text xml:space="preserve" x="56.0" y="519.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">   table and fills the other table's columns with NULL. Customers who never</text>
<text xml:space="preserve" x="56.0" y="538.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">   shipped: LEFT JOIN, then WHERE s.shipment_id IS NULL.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-label="INNER JOIN and LEFT JOIN compared. Three customers and three shipments. Apex has two shipments, Zenith one, Lagoon none. INNER JOIN returns three rows, one per matching shipment, and leaves Lagoon out. LEFT JOIN returns four rows, keeping Lagoon with empty shipment columns.">
<title>INNER JOIN and LEFT JOIN compared. Three customers and three shipments. Apex has two shipments, Zenith one, Lagoon none. INNER JOIN returns three rows, one per matching shipment, and leaves Lagoon out. LEFT JOIN returns four rows, keeping Lagoon with empty shipment columns.</title>
<rect width="1160" height="560" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- customers -->
  <text x="30" y="38" font-size="15" font-weight="700" fill="#1F1F1F">customers (c)</text>
  <rect x="30" y="52" width="250" height="176" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <path d="M30,62 a10,10 0 0 1 10,-10 h230 a10,10 0 0 1 10,10 v30 h-250 z" fill="#2B2A28"/>
  <text x="46" y="78" font-size="12.5" font-weight="700" fill="#FFFFFF">customer_id</text>
  <text x="150" y="78" font-size="12.5" font-weight="700" fill="#FFFFFF">company_name</text>
  <g font-size="14" fill="#2A2926">
    <text x="86" y="122" text-anchor="end">1</text><text x="150" y="122">Apex</text>
    <line x1="30" x2="280" y1="140" y2="140" stroke="#EDE6D8"/>
    <text x="86" y="168" text-anchor="end">2</text><text x="150" y="168">Zenith</text>
    <line x1="30" x2="280" y1="186" y2="186" stroke="#EDE6D8"/>
    <text x="86" y="214" text-anchor="end">3</text><text x="150" y="214">Lagoon</text>
  </g>
  <!-- shipments -->
  <text x="30" y="282" font-size="15" font-weight="700" fill="#1F1F1F">shipments (s)</text>
  <rect x="30" y="296" width="250" height="176" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <path d="M30,306 a10,10 0 0 1 10,-10 h230 a10,10 0 0 1 10,10 v30 h-250 z" fill="#2B2A28"/>
  <text x="46" y="322" font-size="12.5" font-weight="700" fill="#FFFFFF">shipment_id</text>
  <text x="160" y="322" font-size="12.5" font-weight="700" fill="#FFFFFF">customer_id</text>
  <g font-size="14" fill="#2A2926">
    <text x="46" y="366">101</text><text x="200" y="366" text-anchor="end">1</text>
    <line x1="30" x2="280" y1="384" y2="384" stroke="#EDE6D8"/>
    <text x="46" y="412">102</text><text x="200" y="412" text-anchor="end">1</text>
    <line x1="30" x2="280" y1="430" y2="430" stroke="#EDE6D8"/>
    <text x="46" y="458">103</text><text x="200" y="458" text-anchor="end">2</text>
  </g>
  <text x="30" y="506" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#2A2926">ON s.customer_id = c.customer_id</text>
  <text x="30" y="530" font-size="13" fill="#5E5A52">Lagoon (3) has no shipments.</text>

  <!-- INNER JOIN -->
  <text x="330" y="38" font-size="15" font-weight="700" fill="#1F1F1F">INNER JOIN: only matches</text>
  <rect x="330" y="52" width="380" height="222" rx="10" fill="#FFFFFF" stroke="#B38A3E" stroke-width="1.5"/>
  <path d="M330,62 a10,10 0 0 1 10,-10 h360 a10,10 0 0 1 10,10 v30 h-380 z" fill="#765923"/>
  <text x="346" y="78" font-size="12.5" font-weight="700" fill="#FFFFFF">company_name</text>
  <text x="520" y="78" font-size="12.5" font-weight="700" fill="#FFFFFF">shipment_id</text>
  <g font-size="14" fill="#2A2926">
    <text x="346" y="122">Apex</text><text x="520" y="122">101</text>
    <line x1="330" x2="710" y1="140" y2="140" stroke="#EDE6D8"/>
    <text x="346" y="168">Apex</text><text x="520" y="168">102</text>
    <line x1="330" x2="710" y1="186" y2="186" stroke="#EDE6D8"/>
    <text x="346" y="214">Zenith</text><text x="520" y="214">103</text>
  </g>
  <text x="346" y="256" font-size="13" fill="#5E5A52">3 rows. Lagoon is left out. Apex appears twice.</text>

  <!-- LEFT JOIN -->
  <text x="750" y="38" font-size="15" font-weight="700" fill="#1F1F1F">LEFT JOIN: every customer</text>
  <rect x="750" y="52" width="380" height="268" rx="10" fill="#FFFFFF" stroke="#B38A3E" stroke-width="1.5"/>
  <path d="M750,62 a10,10 0 0 1 10,-10 h360 a10,10 0 0 1 10,10 v30 h-380 z" fill="#765923"/>
  <text x="766" y="78" font-size="12.5" font-weight="700" fill="#FFFFFF">company_name</text>
  <text x="940" y="78" font-size="12.5" font-weight="700" fill="#FFFFFF">shipment_id</text>
  <g font-size="14" fill="#2A2926">
    <text x="766" y="122">Apex</text><text x="940" y="122">101</text>
    <line x1="750" x2="1130" y1="140" y2="140" stroke="#EDE6D8"/>
    <text x="766" y="168">Apex</text><text x="940" y="168">102</text>
    <line x1="750" x2="1130" y1="186" y2="186" stroke="#EDE6D8"/>
    <text x="766" y="214">Zenith</text><text x="940" y="214">103</text>
    <line x1="750" x2="1130" y1="232" y2="232" stroke="#EDE6D8"/>
    <rect x="751" y="233" width="378" height="44" fill="#EFE4CC"/>
    <text x="766" y="260">Lagoon</text><text x="940" y="260" fill="#9B2C1F" font-style="italic">NULL</text>
  </g>
  <text x="766" y="304" font-size="13" fill="#5E5A52">4 rows. Lagoon kept, with no shipment.</text>

  <!-- explanation -->
  <rect x="330" y="350" width="800" height="180" rx="12" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <text x="352" y="384" font-size="14.5" font-weight="700" fill="#1F1F1F">How to read it</text>
  <g font-size="14" fill="#2A2926">
    <text x="352" y="414">• Each shipment is matched to the customer whose customer_id is the same.</text>
    <text x="352" y="442">• A customer with two shipments appears twice: one row per match.</text>
    <text x="352" y="470">• INNER JOIN drops rows with no match. LEFT JOIN keeps every row of the first</text>
    <text x="366" y="492">table and fills the other table's columns with NULL.</text>
    <text x="352" y="520">• To find customers who never shipped: LEFT JOIN, then WHERE s.shipment_id IS NULL.</text>
  </g>
</g>
</svg>

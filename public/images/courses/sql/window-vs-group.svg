<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-label="GROUP BY compared with a window function. GROUP BY mode turns five routes into two rows, one per mode. AVG over a window partitioned by mode keeps all five rows and adds each mode's average as a new column.">
<title>GROUP BY collapses rows; a window function keeps every row and adds the group's figure.</title>

<rect width="760" height="460" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="30.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">routes</text>
<rect x="16.0" y="40.0" width="194.0" height="156.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,66 L17,48 Q17,41 24,41 L202,41 Q209,41 209,48 L209,66 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="26.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">route</text>
<text xml:space="preserve" x="90.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">mode</text>
<text xml:space="preserve" x="200.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">days</text>
<line x1="16.0" y1="66.0" x2="210.0" y2="66.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="83.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">A</text>
<text xml:space="preserve" x="90.0" y="83.5" font-size="13" fill="#2F5D8A" font-weight="400" text-anchor="start">Air</text>
<text xml:space="preserve" x="200.0" y="83.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">1</text>
<line x1="16.0" y1="92.0" x2="210.0" y2="92.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="109.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">B</text>
<text xml:space="preserve" x="90.0" y="109.5" font-size="13" fill="#2F5D8A" font-weight="400" text-anchor="start">Air</text>
<text xml:space="preserve" x="200.0" y="109.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">3</text>
<line x1="16.0" y1="118.0" x2="210.0" y2="118.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="135.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">C</text>
<text xml:space="preserve" x="90.0" y="135.5" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="start">Sea</text>
<text xml:space="preserve" x="200.0" y="135.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">20</text>
<line x1="16.0" y1="144.0" x2="210.0" y2="144.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="161.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">D</text>
<text xml:space="preserve" x="90.0" y="161.5" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="start">Sea</text>
<text xml:space="preserve" x="200.0" y="161.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">30</text>
<line x1="16.0" y1="170.0" x2="210.0" y2="170.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="187.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">E</text>
<text xml:space="preserve" x="90.0" y="187.5" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="start">Sea</text>
<text xml:space="preserve" x="200.0" y="187.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">40</text>
<text xml:space="preserve" x="240.0" y="30.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">GROUP BY: rows collapse</text>
<rect x="240.0" y="40.0" width="170.0" height="78.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M241,66 L241,48 Q241,41 248,41 L402,41 Q409,41 409,48 L409,66 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="250.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">mode</text>
<text xml:space="preserve" x="400.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">avg_days</text>
<line x1="240.0" y1="66.0" x2="410.0" y2="66.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="250.0" y="83.5" font-size="13" fill="#2F5D8A" font-weight="400" text-anchor="start">Air</text>
<text xml:space="preserve" x="400.0" y="83.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">2</text>
<line x1="240.0" y1="92.0" x2="410.0" y2="92.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="250.0" y="109.5" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="start">Sea</text>
<text xml:space="preserve" x="400.0" y="109.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">30</text>
<text xml:space="preserve" x="240.0" y="148.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">5 rows in, 2 rows out.</text>
<text xml:space="preserve" x="240.0" y="166.8" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">The routes are gone.</text>
<text xml:space="preserve" x="456.0" y="30.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Window: every row kept</text>
<rect x="456.0" y="40.0" width="288.0" height="156.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M457,66 L457,48 Q457,41 464,41 L736,41 Q743,41 743,48 L743,66 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="466.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">route</text>
<text xml:space="preserve" x="522.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">mode</text>
<text xml:space="preserve" x="618.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">days</text>
<text xml:space="preserve" x="734.0" y="57.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="end">mode_avg</text>
<line x1="456.0" y1="66.0" x2="744.0" y2="66.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="466.0" y="83.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">A</text>
<text xml:space="preserve" x="522.0" y="83.5" font-size="13" fill="#2F5D8A" font-weight="400" text-anchor="start">Air</text>
<text xml:space="preserve" x="618.0" y="83.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">1</text>
<text xml:space="preserve" x="734.0" y="83.5" font-size="13" fill="#8A6A1F" font-weight="400" text-anchor="end">2</text>
<line x1="456.0" y1="92.0" x2="744.0" y2="92.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="466.0" y="109.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">B</text>
<text xml:space="preserve" x="522.0" y="109.5" font-size="13" fill="#2F5D8A" font-weight="400" text-anchor="start">Air</text>
<text xml:space="preserve" x="618.0" y="109.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">3</text>
<text xml:space="preserve" x="734.0" y="109.5" font-size="13" fill="#8A6A1F" font-weight="400" text-anchor="end">2</text>
<line x1="456.0" y1="118.0" x2="744.0" y2="118.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="466.0" y="135.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">C</text>
<text xml:space="preserve" x="522.0" y="135.5" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="start">Sea</text>
<text xml:space="preserve" x="618.0" y="135.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">20</text>
<text xml:space="preserve" x="734.0" y="135.5" font-size="13" fill="#8A6A1F" font-weight="400" text-anchor="end">30</text>
<line x1="456.0" y1="144.0" x2="744.0" y2="144.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="466.0" y="161.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">D</text>
<text xml:space="preserve" x="522.0" y="161.5" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="start">Sea</text>
<text xml:space="preserve" x="618.0" y="161.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">30</text>
<text xml:space="preserve" x="734.0" y="161.5" font-size="13" fill="#8A6A1F" font-weight="400" text-anchor="end">30</text>
<line x1="456.0" y1="170.0" x2="744.0" y2="170.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="466.0" y="187.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">E</text>
<text xml:space="preserve" x="522.0" y="187.5" font-size="13" fill="#2F6B3F" font-weight="400" text-anchor="start">Sea</text>
<text xml:space="preserve" x="618.0" y="187.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="end">40</text>
<text xml:space="preserve" x="734.0" y="187.5" font-size="13" fill="#8A6A1F" font-weight="400" text-anchor="end">30</text>
<text xml:space="preserve" x="456.0" y="226.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">5 rows in, 5 rows out, with the</text>
<text xml:space="preserve" x="456.0" y="244.8" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">group's figure on each row.</text>
<rect x="16.0" y="280.0" width="400.0" height="60.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="304.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">SELECT mode, AVG(days) AS avg_days</text>
<text xml:space="preserve" x="28.0" y="323.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">FROM routes GROUP BY mode;</text>
<rect x="430.0" y="280.0" width="314.0" height="112.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="442.0" y="304.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">SELECT route, mode, days,</text>
<text xml:space="preserve" x="442.0" y="322.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  AVG(days) OVER</text>
<text xml:space="preserve" x="442.0" y="340.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">    (PARTITION BY mode)</text>
<text xml:space="preserve" x="442.0" y="358.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">    AS mode_avg</text>
<text xml:space="preserve" x="442.0" y="376.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">FROM routes;</text>
<text xml:space="preserve" x="16.0" y="412.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">One row per group: GROUP BY. The detail and the group figure side by side, such as each route's days</text>
<text xml:space="preserve" x="16.0" y="430.9" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">against its mode's average: a window function.</text>
</g></svg>
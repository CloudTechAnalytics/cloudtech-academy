<text xml:space="preserve" x="16.0" y="238.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">smallest first (the default, ASC)</text>
<text xml:space="preserve" x="264.0" y="238.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">largest first</text>
<text xml:space="preserve" x="16.0" y="272.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Two sort columns: the second breaks ties</text>
<rect x="16.0" y="284.0" width="340.0" height="44.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="308.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">ORDER BY status, containers DESC</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Sorting with ORDER BY. Ascending, the default, puts the smallest first; DESC puts the largest first. With two sort columns, the second breaks ties: ordering by status, then by containers descending, sorts the statuses alphabetically and, within each status, the biggest shipment first. Missing values, NULL, go first in SQLite and MySQL in ascending order, and last in PostgreSQL and Oracle; NULLS FIRST or NULLS LAST makes it explicit.">
<title>ORDER BY sorts the result; later columns break ties; NULLs go first or last.</title>


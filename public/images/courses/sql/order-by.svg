<text xml:space="preserve" x="16.0" y="372.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">SQLite, MySQL: first when ascending.   PostgreSQL, Oracle: last.</text>
<text xml:space="preserve" x="16.0" y="394.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Say it explicitly:  ORDER BY delivery_date NULLS LAST</text>

<text xml:space="preserve" x="226.0" y="108.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Query 1</text>
<line x1="212.0" y1="116.0" x2="749.0" y2="116.0" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="236.0" y="140.0" font-size="11.5" fill="#A9A396" font-weight="400" text-anchor="end">1</text>
<text xml:space="preserve" x="248.0" y="140.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">SELECT c.company_name, c.city,</text>
<text xml:space="preserve" x="236.0" y="160.0" font-size="11.5" fill="#A9A396" font-weight="400" text-anchor="end">2</text>
<text xml:space="preserve" x="248.0" y="160.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">       SUM(s.containers) AS containers</text>
<text xml:space="preserve" x="236.0" y="180.0" font-size="11.5" fill="#A9A396" font-weight="400" text-anchor="end">3</text>
<text xml:space="preserve" x="248.0" y="180.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">FROM shipments AS s</text>
<text xml:space="preserve" x="236.0" y="200.0" font-size="11.5" fill="#A9A396" font-weight="400" text-anchor="end">4</text>
<text xml:space="preserve" x="248.0" y="200.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">JOIN customers AS c</text>
<text xml:space="preserve" x="236.0" y="220.0" font-size="11.5" fill="#A9A396" font-weight="400" text-anchor="end">5</text>
<text xml:space="preserve" x="248.0" y="220.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  ON c.customer_id = s.customer_id</text>
<text xml:space="preserve" x="236.0" y="240.0" font-size="11.5" fill="#A9A396" font-weight="400" text-anchor="end">6</text>
<text xml:space="preserve" x="248.0" y="240.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">GROUP BY c.company_name, c.city</text>
<text xml:space="preserve" x="236.0" y="260.0" font-size="11.5" fill="#A9A396" font-weight="400" text-anchor="end">7</text>
<text xml:space="preserve" x="248.0" y="260.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">ORDER BY containers DESC</text>
<text xml:space="preserve" x="236.0" y="280.0" font-size="11.5" fill="#A9A396" font-weight="400" text-anchor="end">8</text>
<text xml:space="preserve" x="248.0" y="280.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">LIMIT 10;</text>

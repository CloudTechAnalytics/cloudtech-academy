<text x="44" y="386" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#1F1F1F" text-anchor="start" xml:space="preserve">▸ sys</text>
<rect x="262" y="112" width="808" height="250" rx="6" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1.5"/>
<rect x="262" y="112" width="150" height="28" rx="6" fill="#F5F1EA" stroke="#D9CFBF" stroke-width="1.5"/>
<text x="276" y="131" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1F1F1F" text-anchor="start" xml:space="preserve">Query 1</text>
<text x="300" y="170" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#1F3F7A" text-anchor="start" xml:space="preserve">SELECT c.company_name, c.city,</text>
<text x="282" y="170" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#6B665C" text-anchor="end" xml:space="preserve">1</text>
<text x="300" y="194" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#1F1F1F" text-anchor="start" xml:space="preserve">       SUM(s.containers) AS containers</text>
<text x="282" y="194" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#6B665C" text-anchor="end" xml:space="preserve">2</text>
<text x="300" y="218" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#1F3F7A" text-anchor="start" xml:space="preserve">FROM shipments AS s</text>
<text x="282" y="218" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#6B665C" text-anchor="end" xml:space="preserve">3</text>
<text x="300" y="242" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#1F3F7A" text-anchor="start" xml:space="preserve">JOIN customers AS c ON c.customer_id = s.customer_id</text>
<text x="282" y="242" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#6B665C" text-anchor="end" xml:space="preserve">4</text>
<text x="300" y="266" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#1F3F7A" text-anchor="start" xml:space="preserve">GROUP BY c.company_name, c.city</text>
<text x="282" y="266" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#6B665C" text-anchor="end" xml:space="preserve">5</text>
<text x="300" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#1F3F7A" text-anchor="start" xml:space="preserve">ORDER BY containers DESC</text>
<text x="282" y="290" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#6B665C" text-anchor="end" xml:space="preserve">6</text>
<text x="300" y="314" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="400" fill="#1F3F7A" text-anchor="start" xml:space="preserve">LIMIT 10;</text>
<text x="282" y="314" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12" font-weight="400" fill="#6B665C" text-anchor="end" xml:space="preserve">7</text>

<text x="44" y="188" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#1F1F1F" text-anchor="start" xml:space="preserve">▾ harbourline</text>
<text x="44" y="210" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#1F1F1F" text-anchor="start" xml:space="preserve">   ▾ Tables</text>

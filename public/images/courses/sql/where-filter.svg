<rect x="306.0" y="92.0" width="148.0" height="112.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="380.0" y="120.0" font-size="16" fill="#2F5D8A" font-weight="700" text-anchor="middle">WHERE</text>

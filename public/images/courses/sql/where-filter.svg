<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="How WHERE filters rows: six shipments go in, WHERE checks each row against the condition, and only the two rows where both parts are true come out.">
<title>WHERE keeps only the rows where the whole condition is true.</title>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="LIMIT and OFFSET. Sort first, then keep the top rows: ORDER BY containers DESC LIMIT 3 returns the three biggest shipments. Without ORDER BY, LIMIT returns arbitrary rows. Ties at the cut-off need a tie-breaker, such as a second sort column. OFFSET skips rows before counting, which is how pages work: with 3 rows per page, page 1 is LIMIT 3, page 2 is LIMIT 3 OFFSET 3, page 3 is LIMIT 3 OFFSET 6.">
<title>Top N is ORDER BY, then LIMIT; OFFSET skips rows to make pages.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">ORDER BY containers DESC LIMIT 3</text>
<rect x="16.0" y="38.0" width="300.0" height="26.0" rx="4" fill="#E5F0E8"/>
<text xml:space="preserve" x="26.0" y="56.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S106</text>
<text xml:space="preserve" x="120.0" y="56.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">9 containers</text>
<text xml:space="preserve" x="260.0" y="56.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">kept</text>
<rect x="16.0" y="68.0" width="300.0" height="26.0" rx="4" fill="#E5F0E8"/>
<text xml:space="preserve" x="26.0" y="86.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S101</text>
<text xml:space="preserve" x="120.0" y="86.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">8 containers</text>
<text xml:space="preserve" x="260.0" y="86.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">kept</text>
<rect x="16.0" y="98.0" width="300.0" height="26.0" rx="4" fill="#E5F0E8"/>
<text xml:space="preserve" x="26.0" y="116.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S104</text>
<text xml:space="preserve" x="120.0" y="116.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">6 containers</text>
<text xml:space="preserve" x="260.0" y="116.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">kept</text>
<rect x="16.0" y="128.0" width="300.0" height="26.0" rx="4" fill="#F2EFE8"/>
<text xml:space="preserve" x="26.0" y="146.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S103</text>
<text xml:space="preserve" x="120.0" y="146.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">5 containers</text>
<text xml:space="preserve" x="260.0" y="146.0" font-size="11.5" fill="#5E5A52" font-weight="700" text-anchor="middle">cut off</text>
<rect x="16.0" y="158.0" width="300.0" height="26.0" rx="4" fill="#F2EFE8"/>
<text xml:space="preserve" x="26.0" y="176.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S102</text>
<text xml:space="preserve" x="120.0" y="176.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">3 containers</text>
<text xml:space="preserve" x="260.0" y="176.0" font-size="11.5" fill="#5E5A52" font-weight="700" text-anchor="middle">cut off</text>
<rect x="16.0" y="188.0" width="300.0" height="26.0" rx="4" fill="#F2EFE8"/>
<text xml:space="preserve" x="26.0" y="206.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S105</text>
<text xml:space="preserve" x="120.0" y="206.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">2 containers</text>
<text xml:space="preserve" x="260.0" y="206.0" font-size="11.5" fill="#5E5A52" font-weight="700" text-anchor="middle">cut off</text>
<text xml:space="preserve" x="16.0" y="232.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">Without ORDER BY, LIMIT 3 gives some 3 rows: not defined.</text>
<text xml:space="preserve" x="380.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Pages of 3 with OFFSET</text>
<rect x="380.0" y="40.0" width="176.0" height="120.0" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.4"/>
<text xml:space="preserve" x="392.0" y="62.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">page 1</text>
<text xml:space="preserve" x="392.0" y="84.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">LIMIT 3 OFFSET 0</text>
<text xml:space="preserve" x="392.0" y="108.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S106  9</text>
<text xml:space="preserve" x="392.0" y="124.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S101  8</text>
<text xml:space="preserve" x="392.0" y="140.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S104  6</text>
<rect x="570.0" y="40.0" width="176.0" height="120.0" rx="8" fill="#FFFFFF" stroke="#B38A3E" stroke-width="1.4"/>
<text xml:space="preserve" x="582.0" y="62.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">page 2</text>
<text xml:space="preserve" x="582.0" y="84.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">LIMIT 3 OFFSET 3</text>
<text xml:space="preserve" x="582.0" y="108.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S103  5</text>
<text xml:space="preserve" x="582.0" y="124.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S102  3</text>
<text xml:space="preserve" x="582.0" y="140.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">S105  2</text>
<text xml:space="preserve" x="380.0" y="186.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">page p:  OFFSET (p − 1) × rows per page</text>
<rect x="16.0" y="262.0" width="728.0" height="84.0" rx="8" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.4"/>
<text xml:space="preserve" x="32.0" y="288.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Ties at the cut-off</text>
<text xml:space="preserve" x="32.0" y="310.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">If several rows share the last kept value, which ones appear isn't defined. Add a tie-breaker: ORDER BY</text>
<text xml:space="preserve" x="32.0" y="328.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">containers DESC, booking_date.</text>
<text xml:space="preserve" x="16.0" y="376.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Top N: always ORDER BY first, then LIMIT.</text>
<text xml:space="preserve" x="16.0" y="400.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Some databases write it differently: TOP 3 in SQL Server, FETCH FIRST 3 ROWS in Oracle.</text>
</g></svg>
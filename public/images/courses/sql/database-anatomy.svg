<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="What a relational database holds and how SQL talks to it. A shipments table has columns, such as shipment_id, status and containers, and rows, one per shipment. shipment_id is the primary key: it identifies each row. customer_id is a foreign key: it points to the primary key of a row in the customers table, which is how tables connect. You send a SQL query to the database; it finds the matching rows and returns a result table.">
<title>Tables hold rows and columns; keys connect tables; a query returns a result table.</title>

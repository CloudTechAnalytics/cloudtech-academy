<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 442" width="760" height="442" role="img" aria-label="How SELECT works. FROM names the table. SELECT picks which columns appear, in the order you list them; SELECT star picks all of them. AS gives a column a new name in the result. A calculated column, containers times 2, is worked out for each row. DISTINCT removes duplicate rows from the result: three different statuses from six rows.">
<title>SELECT picks the columns; AS renames them; DISTINCT removes repeats.</title>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" role="img" aria-label="How GROUP BY works: seven shipments are sorted into groups by status, each group is counted and its containers added up, and the result has one row per group.">
<title>How GROUP BY works: seven shipments are sorted into groups by status, each group is counted and its containers added up, and the result has one row per group.</title>
<rect width="1160" height="470" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <text x="30" y="40" font-size="15" font-weight="700" fill="#1F1F1F">1. The rows</text>
  <rect x="30" y="56" width="300" height="384" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <path d="M30,66 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v32 h-300 z" fill="#2B2A28"/>
  <text x="46" y="83" font-size="13" font-weight="700" fill="#FFFFFF">status</text>
  <text x="300" y="83" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="end">containers</text>
  <g font-size="14" fill="#2A2926">
    <rect x="40" y="108" width="12" height="12" rx="3" fill="#B38A3E"/><text x="60" y="119">Delivered</text><text x="300" y="119" text-anchor="end">8</text>
    <rect x="40" y="154" width="12" height="12" rx="3" fill="#6B8F71"/><text x="60" y="165">In transit</text><text x="300" y="165" text-anchor="end">2</text>
    <rect x="40" y="200" width="12" height="12" rx="3" fill="#B38A3E"/><text x="60" y="211">Delivered</text><text x="300" y="211" text-anchor="end">3</text>
    <rect x="40" y="246" width="12" height="12" rx="3" fill="#9B2C1F"/><text x="60" y="257">Cancelled</text><text x="300" y="257" text-anchor="end">1</text>
    <rect x="40" y="292" width="12" height="12" rx="3" fill="#B38A3E"/><text x="60" y="303">Delivered</text><text x="300" y="303" text-anchor="end">2</text>
    <rect x="40" y="338" width="12" height="12" rx="3" fill="#6B8F71"/><text x="60" y="349">In transit</text><text x="300" y="349" text-anchor="end">4</text>
    <rect x="40" y="384" width="12" height="12" rx="3" fill="#9B2C1F"/><text x="60" y="395">Cancelled</text><text x="300" y="395" text-anchor="end">2</text>
  </g>

  <path d="M340,248 h26" stroke="#B38A3E" stroke-width="2.5"/><path d="M366,240 l10,8 l-10,8 z" fill="#B38A3E"/>

  <text x="392" y="40" font-size="15" font-weight="700" fill="#1F1F1F">2. GROUP BY status</text>
  <rect x="392" y="56" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#B38A3E" stroke-width="1.5"/>
  <text x="408" y="82" font-size="13" font-weight="700" fill="#765923">Delivered</text>
  <g font-size="14" fill="#2A2926"><text x="408" y="112">8</text><text x="408" y="140">3</text><text x="408" y="168">2</text></g>
  <rect x="392" y="208" width="300" height="104" rx="10" fill="#FFFFFF" stroke="#6B8F71" stroke-width="1.5"/>
  <text x="408" y="234" font-size="13" font-weight="700" fill="#3F5F45">In transit</text>
  <g font-size="14" fill="#2A2926"><text x="408" y="264">2</text><text x="408" y="292">4</text></g>
  <rect x="392" y="324" width="300" height="104" rx="10" fill="#FFFFFF" stroke="#9B2C1F" stroke-width="1.5"/>
  <text x="408" y="350" font-size="13" font-weight="700" fill="#9B2C1F">Cancelled</text>
  <g font-size="14" fill="#2A2926"><text x="408" y="380">1</text><text x="408" y="408">2</text></g>
  <g font-size="13" fill="#5E5A52" text-anchor="end">
    <text x="676" y="112">COUNT = 3</text><text x="676" y="134">SUM = 13</text>
    <text x="676" y="264">COUNT = 2</text><text x="676" y="286">SUM = 6</text>
    <text x="676" y="380">COUNT = 2</text><text x="676" y="402">SUM = 3</text>
  </g>

  <path d="M702,248 h26" stroke="#B38A3E" stroke-width="2.5"/><path d="M728,240 l10,8 l-10,8 z" fill="#B38A3E"/>

  <text x="754" y="40" font-size="15" font-weight="700" fill="#1F1F1F">3. One row per group</text>
  <rect x="754" y="160" width="376" height="176" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
  <path d="M754,170 a10,10 0 0 1 10,-10 h356 a10,10 0 0 1 10,10 v32 h-376 z" fill="#2B2A28"/>
  <text x="770" y="187" font-size="13" font-weight="700" fill="#FFFFFF">status</text>
  <text x="1010" y="187" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="end">shipments</text>
  <text x="1114" y="187" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="end">containers</text>
  <g font-size="14" fill="#2A2926">
    <text x="770" y="232">Delivered</text><text x="1010" y="232" text-anchor="end">3</text><text x="1114" y="232" text-anchor="end">13</text>
    <line x1="754" x2="1130" y1="250" y2="250" stroke="#EDE6D8"/>
    <text x="770" y="276">In transit</text><text x="1010" y="276" text-anchor="end">2</text><text x="1114" y="276" text-anchor="end">6</text>
    <line x1="754" x2="1130" y1="294" y2="294" stroke="#EDE6D8"/>
    <text x="770" y="320">Cancelled</text><text x="1010" y="320" text-anchor="end">2</text><text x="1114" y="320" text-anchor="end">3</text>
  </g>
  <text x="754" y="372" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#2A2926">SELECT status, COUNT(*) AS shipments,</text>
  <text x="754" y="392" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#2A2926">       SUM(containers) AS containers</text>
  <text x="754" y="412" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="12.5" fill="#2A2926">FROM shipments GROUP BY status;</text>
</g>
</svg>

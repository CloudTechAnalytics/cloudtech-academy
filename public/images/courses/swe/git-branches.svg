<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Git's basic cycle and branches. Files you edit in the working folder are staged with git add, then recorded with git commit into the history. A branch is a separate line of work: a feature branch leaves main, gets a few small commits, and is merged back into main after review and tests, so main always works.">
<title>The add–commit cycle, and a branch merged back into main.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>

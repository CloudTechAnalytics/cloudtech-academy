<path d="M476.0,70.0 L552.0,70.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="514.0" y="62.0" font-size="11.5" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">git commit</text>
<text xml:space="preserve" x="16.0" y="140.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">git status: what's changed.   git diff: line by line.   git log: the history.</text>
<text xml:space="preserve" x="16.0" y="215.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">main</text>

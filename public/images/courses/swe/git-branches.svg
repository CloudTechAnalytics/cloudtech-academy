<rect x="16.0" y="30.0" width="188.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#5E5A52" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="58.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Working folder</text>
<text xml:space="preserve" x="30.0" y="82.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">files you edit</text>
<rect x="286.0" y="30.0" width="188.0" height="80.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="300.0" y="58.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">Staging area</text>
<text xml:space="preserve" x="300.0" y="82.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">changes chosen for the next</text>
<text xml:space="preserve" x="300.0" y="99.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">commit</text>
<rect x="556.0" y="30.0" width="188.0" height="80.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="570.0" y="58.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">History</text>
<text xml:space="preserve" x="570.0" y="82.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">commits, with messages</text>
<path d="M206.0,70.0 L282.0,70.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>

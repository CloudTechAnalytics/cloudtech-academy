<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="How to read a Python traceback: from the bottom. The last line gives the error type and message, ValueError: could not convert string to float, with the value that failed. The line above shows where it happened, the innermost call, in parse_amount. Above that is the call that led there, in the main loop. Below, the debugging method: read, reproduce, find all, fix the cause, test.">
<title>Read a traceback from the bottom up.</title>

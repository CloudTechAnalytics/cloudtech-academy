<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Validating at the boundary. Each incoming record goes through a validator that returns a list of problems. An empty list means valid, and the record goes on to the calculation. A record with problems is rejected with a clear message, quarantined for review, or fixed automatically only when the fix is certain. It is never silently dropped.">
<title>Validate where data enters: a list of problems per record, and a decision for each.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="13.5" fill="#5E5A52" font-weight="700" text-anchor="start">Incoming records</text>
<text xml:space="preserve" x="438.0" y="28.0" font-size="13.5" fill="#5E5A52" font-weight="700" text-anchor="start">validate(record) → problems</text>
<rect x="16.0" y="40.0" width="380.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="67.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">INV-101</text>
<text xml:space="preserve" x="110.0" y="67.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">quantity 2, price 5000, discount 10</text>
<path d="M398.0,62.0 L432.0,62.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="436.0" y="40.0" width="308.0" height="44.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.3"/>
<text xml:space="preserve" x="450.0" y="67.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">[ ]</text>
<rect x="16.0" y="94.0" width="380.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="121.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">INV-102</text>
<text xml:space="preserve" x="110.0" y="121.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">quantity −1, price 5000</text>
<path d="M398.0,116.0 L432.0,116.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="436.0" y="94.0" width="308.0" height="44.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="450.0" y="121.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">[quantity must be positive]</text>
<rect x="16.0" y="148.0" width="380.0" height="44.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="175.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">INV-103</text>
<text xml:space="preserve" x="110.0" y="175.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">price '₦5,000', discount 35</text>
<path d="M398.0,170.0 L432.0,170.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="436.0" y="148.0" width="308.0" height="44.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="450.0" y="175.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">[price not a number, discount over 20]</text>
<text xml:space="preserve" x="16.0" y="228.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Then decide, for records with problems</text>
<rect x="16.0" y="240.0" width="232.0" height="90.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="266.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Reject</text>
<text xml:space="preserve" x="30.0" y="290.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">with a clear message, when the</text>
<text xml:space="preserve" x="30.0" y="307.4" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">sender can fix it</text>
<rect x="264.0" y="240.0" width="232.0" height="90.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.4"/>
<text xml:space="preserve" x="278.0" y="266.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Quarantine</text>
<text xml:space="preserve" x="278.0" y="290.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">in bulk imports, so good records</text>
<text xml:space="preserve" x="278.0" y="307.4" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">still go through</text>
<rect x="512.0" y="240.0" width="232.0" height="90.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.4"/>
<text xml:space="preserve" x="526.0" y="266.0" font-size="13.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Fix automatically</text>
<text xml:space="preserve" x="526.0" y="290.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">only when the fix is certain:</text>
<text xml:space="preserve" x="526.0" y="307.4" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">'₦5,000' → 500000 kobo</text>
<text xml:space="preserve" x="16.0" y="362.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ Never silently drop a bad record: totals go wrong and nobody knows.</text>
</g></svg>
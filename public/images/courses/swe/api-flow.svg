<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="A request through the invoice API. A client posts JSON to /invoices/total. The API validates it first: a bad request, such as a 25 percent discount, gets a 400 with a message saying what to fix. A valid request, 2 lines at 100,000 kobo with a 10 percent discount, goes to invoice_total and returns 200 with total_kobo 193,500. In tests, Flask's test client sends requests straight to the app, without a server.">
<title>Validate, then calculate: 400 with a clear message for bad input, 200 with the result for good.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker><marker id="a2F6B3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B3F"/></marker><marker id="a9B2C1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B2C1F"/></marker></defs>
<rect width="760" height="420" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="40.0" width="210.0" height="150.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="66.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Client</text>
<rect x="30.0" y="78.0" width="184.0" height="118.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="42.0" y="102.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">POST /invoices/total</text>
<text xml:space="preserve" x="42.0" y="118.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">{"lines": [{</text>
<text xml:space="preserve" x="42.0" y="134.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  "quantity": 2,</text>
<text xml:space="preserve" x="42.0" y="150.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  "unit_price_kobo":</text>
<text xml:space="preserve" x="42.0" y="166.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">     100000}],</text>
<text xml:space="preserve" x="42.0" y="182.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace"> "discount_pct": 10}</text>
<path d="M228.0,115.0 L266.0,115.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="270.0" y="60.0" width="160.0" height="110.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.6"/>
<text xml:space="preserve" x="350.0" y="92.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="middle">Validate</text>
<text xml:space="preserve" x="284.0" y="116.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">JSON? lines? whole</text>
<text xml:space="preserve" x="284.0" y="132.7" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">numbers? discount</text>
<text xml:space="preserve" x="284.0" y="149.3" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">0–20?</text>
<path d="M432,90 L470,60" fill="none" stroke="#2F6B3F" stroke-width="2" marker-end="url(#a2F6B3F)"/>
<path d="M432,140 L470,180" fill="none" stroke="#9B2C1F" stroke-width="2" marker-end="url(#a9B2C1F)"/>
<text xml:space="preserve" x="452.0" y="66.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="end">ok</text>
<text xml:space="preserve" x="452.0" y="178.0" font-size="11.5" fill="#9B2C1F" font-weight="700" text-anchor="end">bad</text>
<rect x="474.0" y="20.0" width="270.0" height="90.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="488.0" y="44.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">invoice_total → 200</text>
<text xml:space="preserve" x="488.0" y="70.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">{"total_kobo": 193500,</text>
<text xml:space="preserve" x="488.0" y="90.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace"> "total_naira": "1,935.00"}</text>
<rect x="474.0" y="140.0" width="270.0" height="90.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.5"/>
<text xml:space="preserve" x="488.0" y="164.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">400, never 500</text>
<text xml:space="preserve" x="488.0" y="188.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">{"error": "discount_pct must be between</text>
<text xml:space="preserve" x="488.0" y="204.7" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">0 and 20, got 25"}</text>
<rect x="16.0" y="256.0" width="440.0" height="130.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,282 L17,264 Q17,257 24,257 L448,257 Q455,257 455,264 L455,282 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="26.0" y="273.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">Status</text>
<text xml:space="preserve" x="106.0" y="273.5" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="start">Means</text>
<line x1="16.0" y1="282.0" x2="456.0" y2="282.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="299.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">200</text>
<text xml:space="preserve" x="106.0" y="299.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">OK</text>
<line x1="16.0" y1="308.0" x2="456.0" y2="308.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="325.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">400</text>
<text xml:space="preserve" x="106.0" y="325.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">the request was invalid; the body says why</text>
<line x1="16.0" y1="334.0" x2="456.0" y2="334.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="351.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">404</text>
<text xml:space="preserve" x="106.0" y="351.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">no such resource</text>
<line x1="16.0" y1="360.0" x2="456.0" y2="360.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="377.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">500</text>
<text xml:space="preserve" x="106.0" y="377.5" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">the server failed: a bug, never bad input</text>
<rect x="488.0" y="256.0" width="256.0" height="130.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.4"/>
<text xml:space="preserve" x="502.0" y="282.0" font-size="13.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Tests, no server</text>
<text xml:space="preserve" x="502.0" y="306.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">client = app.test_client() sends</text>
<text xml:space="preserve" x="502.0" y="323.4" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">requests straight to the app, as</text>
<text xml:space="preserve" x="502.0" y="340.8" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">fast as any other test.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Boundary value testing for late-fee periods, which are whole 30-day periods late, capped at three. A step chart rises from 0 periods to 1 at 30 days, 2 at 60, 3 at 90, and stays at 3. Tests sit just below, exactly at and just above each step, plus the extremes: 0, 29, 30, 31, 60, 90 and 120 days.">
<title>Test just below, at and just above each boundary.</title>

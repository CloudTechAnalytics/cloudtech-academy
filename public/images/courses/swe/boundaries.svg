<text xml:space="preserve" x="665.3" y="118.0" font-size="11" fill="#2A2926" font-weight="400" text-anchor="middle">→ 1</text>
<text xml:space="preserve" x="16.0" y="326.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">29, 30 and 31 catch the classic off-by-one mistake: &gt; 30 where ≥ 30 was meant.</text>
<text xml:space="preserve" x="16.0" y="348.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">@pytest.mark.parametrize turns this table of cases into one short test.</text>
</g></svg>
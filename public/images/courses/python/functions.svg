<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Anatomy of a function. def area(width, height) names the function and its parameters; the indented body works out width times height and returns it. Calling area(4, 3) passes the arguments 4 and 3 in, runs the body, and sends 12 back to where it was called. print shows something on the screen; return hands a value back so other code can use it. Variables created inside a function exist only inside it.">
<title>Define once, call many times: arguments in, a returned value out.</title>
<defs><marker id="a2F5D8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5D8A"/></marker><marker id="a5E5A52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E5A52"/></marker><marker id="a2F6B3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B3F"/></marker><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="440" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="16.0" width="380.0" height="166.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="40.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">def area(width, height):</text>
<text xml:space="preserve" x="28.0" y="64.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">    """Area of a rectangle."""</text>
<text xml:space="preserve" x="28.0" y="88.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">    return width * height</text>
<text xml:space="preserve" x="28.0" y="112.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace"></text>
<text xml:space="preserve" x="28.0" y="136.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">size = area(4, 3)</text>
<text xml:space="preserve" x="28.0" y="160.0" font-size="12.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">print(size)</text>
<path d="M398.0,32.0 L420.0,32.0" fill="none" stroke="#2F5D8A" stroke-width="1.4" marker-end="url(#a2F5D8A)"/>
<text xml:space="preserve" x="426.0" y="36.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start">def: the name and the parameters</text>
<path d="M398.0,56.0 L420.0,56.0" fill="none" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#a5E5A52)"/>
<text xml:space="preserve" x="426.0" y="60.0" font-size="12" fill="#5E5A52" font-weight="700" text-anchor="start">docstring: what it does</text>
<path d="M398.0,80.0 L420.0,80.0" fill="none" stroke="#2F6B3F" stroke-width="1.4" marker-end="url(#a2F6B3F)"/>
<text xml:space="preserve" x="426.0" y="84.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">return: the value sent back</text>
<path d="M398.0,128.0 L420.0,128.0" fill="none" stroke="#8A6A1F" stroke-width="1.4" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="426.0" y="132.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start">call: arguments 4 and 3 go in</text>
<path d="M398.0,152.0 L420.0,152.0" fill="none" stroke="#2F6B3F" stroke-width="1.4" marker-end="url(#a2F6B3F)"/>
<text xml:space="preserve" x="426.0" y="156.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start">prints 12</text>
<text xml:space="preserve" x="16.0" y="222.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">print or return?</text>
<rect x="16.0" y="234.0" width="356.0" height="84.0" rx="10" fill="#FFFFFF" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="258.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">print(…)</text>
<text xml:space="preserve" x="30.0" y="280.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">shows a value on screen; the function gives nothing</text>
<text xml:space="preserve" x="30.0" y="297.4" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">back (None).</text>
<rect x="388.0" y="234.0" width="356.0" height="84.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.3"/>
<text xml:space="preserve" x="402.0" y="258.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">return …</text>
<text xml:space="preserve" x="402.0" y="280.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">hands the value back, so you can store it, test it,</text>
<text xml:space="preserve" x="402.0" y="297.4" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">or use it again.</text>
<text xml:space="preserve" x="16.0" y="348.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Scope: a variable made inside a function is local</text>
<rect x="16.0" y="360.0" width="356.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="384.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">inside area():  width, height are local</text>
<text xml:space="preserve" x="30.0" y="406.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">outside, they don't exist: NameError</text>
<rect x="388.0" y="360.0" width="356.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="402.0" y="384.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">defaults: def greet(name, hi="Hello")</text>
<text xml:space="preserve" x="402.0" y="406.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">greet("Ada", hi="Hi"): keyword argument</text>
</g></svg>
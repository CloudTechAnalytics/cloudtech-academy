<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="How a for loop runs, with a running total on the list [150, 300, 75]. Before the loop, total is 0. Each time round, the loop takes the next price and adds it: 0 plus 150 is 150, then 150 plus 300 is 450, then 450 plus 75 is 525. When the list runs out the loop ends. A while loop repeats while its condition is true: starting at 1 and doubling gives 2, 4, 8, 16, 32, 64, then 128, which is over 100, so it stops. break leaves a loop early; continue skips to the next item.">
<title>A for loop takes each item in turn; a while loop repeats while a condition holds.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="16.0" width="300.0" height="110.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="40.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">total = 0</text>
<text xml:space="preserve" x="28.0" y="62.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">for price in [150, 300, 75]:</text>
<text xml:space="preserve" x="28.0" y="84.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">    total = total + price</text>
<text xml:space="preserve" x="28.0" y="106.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">print(total)</text>
<rect x="340.0" y="16.0" width="340.0" height="120.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M341,46 L341,24 Q341,17 348,17 L672,17 Q679,17 679,24 L679,46 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="350.0" y="35.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">round</text>
<text xml:space="preserve" x="440.0" y="35.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">price</text>
<text xml:space="preserve" x="540.0" y="35.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">total after</text>
<line x1="340.0" y1="46.0" x2="680.0" y2="46.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="350.0" y="65.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">1</text>
<text xml:space="preserve" x="440.0" y="65.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">150</text>
<text xml:space="preserve" x="540.0" y="65.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">150</text>
<line x1="340.0" y1="76.0" x2="680.0" y2="76.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="350.0" y="95.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">2</text>
<text xml:space="preserve" x="440.0" y="95.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">300</text>
<text xml:space="preserve" x="540.0" y="95.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">450</text>
<rect x="342.0" y="107.0" width="336.0" height="28.0" rx="3" fill="#E5F0E8"/>
<text xml:space="preserve" x="350.0" y="125.5" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">3</text>
<text xml:space="preserve" x="440.0" y="125.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">75</text>
<text xml:space="preserve" x="540.0" y="125.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">525</text>
<text xml:space="preserve" x="16.0" y="150.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Loop ends when the list runs out; then print(total) shows 525.</text>
<text xml:space="preserve" x="16.0" y="184.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">while: repeat while the condition is true</text>
<rect x="16.0" y="196.0" width="300.0" height="110.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="220.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">x = 1</text>
<text xml:space="preserve" x="28.0" y="242.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">while x &lt;= 100:</text>
<text xml:space="preserve" x="28.0" y="264.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">    x = x * 2</text>
<text xml:space="preserve" x="28.0" y="286.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">print(x)</text>
<rect x="340.0" y="204.0" width="44.0" height="36.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="362.0" y="227.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">1</text>
<text xml:space="preserve" x="387.0" y="226.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">›</text>
<rect x="390.0" y="204.0" width="44.0" height="36.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="412.0" y="227.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">2</text>
<text xml:space="preserve" x="437.0" y="226.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">›</text>
<rect x="440.0" y="204.0" width="44.0" height="36.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="462.0" y="227.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">4</text>
<text xml:space="preserve" x="487.0" y="226.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">›</text>
<rect x="490.0" y="204.0" width="44.0" height="36.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="512.0" y="227.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">8</text>
<text xml:space="preserve" x="537.0" y="226.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">›</text>
<rect x="540.0" y="204.0" width="44.0" height="36.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="562.0" y="227.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">16</text>
<text xml:space="preserve" x="587.0" y="226.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">›</text>
<rect x="590.0" y="204.0" width="44.0" height="36.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="612.0" y="227.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">32</text>
<text xml:space="preserve" x="637.0" y="226.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">›</text>
<rect x="640.0" y="204.0" width="44.0" height="36.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="662.0" y="227.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">64</text>
<text xml:space="preserve" x="687.0" y="226.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">›</text>
<rect x="690.0" y="204.0" width="44.0" height="36.0" rx="5" fill="#F6E3E0"/>
<text xml:space="preserve" x="712.0" y="227.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">128</text>
<text xml:space="preserve" x="340.0" y="266.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="start">x &lt;= 100 is true for 1 … 64, so it keeps doubling.</text>
<text xml:space="preserve" x="340.0" y="284.0" font-size="11.5" fill="#9B2C1F" font-weight="700" text-anchor="start">128 is not ≤ 100: the loop stops, and print shows 128.</text>
<rect x="16.0" y="314.0" width="172.0" height="70.0" rx="8" fill="#FFFFFF" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="28.0" y="340.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">break</text>
<text xml:space="preserve" x="28.0" y="360.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">leave the loop now</text>
<rect x="200.0" y="314.0" width="172.0" height="70.0" rx="8" fill="#FFFFFF" stroke="#B38A3E" stroke-width="1.3"/>
<text xml:space="preserve" x="212.0" y="340.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">continue</text>
<text xml:space="preserve" x="212.0" y="360.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">skip to the next item</text>
<rect x="384.0" y="314.0" width="172.0" height="70.0" rx="8" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/>
<text xml:space="preserve" x="396.0" y="340.0" font-size="12.5" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">enumerate(items)</text>
<text xml:space="preserve" x="396.0" y="360.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">position and item</text>
<text xml:space="preserve" x="396.0" y="376.7" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">together</text>
<rect x="568.0" y="314.0" width="172.0" height="70.0" rx="8" fill="#FFFFFF" stroke="#5C4F80" stroke-width="1.3"/>
<text xml:space="preserve" x="580.0" y="340.0" font-size="12.5" fill="#5C4F80" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">zip(a, b)</text>
<text xml:space="preserve" x="580.0" y="360.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">two lists side by side</text>
<text xml:space="preserve" x="16.0" y="412.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Careful with while: if the condition never turns false, the loop never ends.</text>
</g></svg>
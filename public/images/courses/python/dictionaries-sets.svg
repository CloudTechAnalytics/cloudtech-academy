<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Dictionaries and sets. A dictionary stores key and value pairs: name maps to Ada, age to 24, city to Kano. You read a value by its key; the get method returns a default if the key is missing. Counting with a dictionary: for the list apple, pear, apple, the count of apple becomes 2 and pear 1. A set keeps only unique values: the list 3, 1, 3, 2, 1 becomes the set 1, 2, 3.">
<title>A dictionary maps keys to values; a set keeps each value once.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>

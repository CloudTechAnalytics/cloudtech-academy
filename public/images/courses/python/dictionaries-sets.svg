<text xml:space="preserve" x="156.0" y="108.0" font-size="14" fill="#5E5A52" font-weight="400" text-anchor="start">→</text>
<rect x="180.0" y="84.0" width="130.0" height="36.0" rx="5" fill="#F3EBD8"/>
<text xml:space="preserve" x="245.0" y="108.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">24</text>

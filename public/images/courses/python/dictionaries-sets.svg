<text xml:space="preserve" x="156.0" y="152.0" font-size="14" fill="#5E5A52" font-weight="400" text-anchor="start">→</text>
<rect x="180.0" y="128.0" width="130.0" height="36.0" rx="5" fill="#F3EBD8"/>
<text xml:space="preserve" x="245.0" y="152.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">"Kano"</text>
<text xml:space="preserve" x="340.0" y="60.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">person["city"]  →  "Kano"</text>
<text xml:space="preserve" x="340.0" y="90.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">person.get("email", "none")  →  "none"</text>
<text xml:space="preserve" x="340.0" y="120.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">get() never crashes on a missing key.</text>
<text xml:space="preserve" x="340.0" y="150.0" font-size="12.5" fill="#9B2C1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">person["email"]  →  KeyError</text>
<text xml:space="preserve" x="16.0" y="196.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Counting with a dictionary</text>

<text xml:space="preserve" x="16.0" y="300.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">counts[x] = counts.get(x, 0) + 1</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Variables are labelled boxes holding values, and every value has a type. A variable named course holds the text Economics, a str; credits holds 4, an int; gpa holds 3.6, a float; enrolled holds True, a bool; and nothing holds None. Converting between types: int of the text 120 gives the number 120; str of 12 gives the text 12; float of the text 2.5 gives 2.5; int of 2.6 drops the decimal part and gives 2. Booleans start with a capital letter.">
<title>A variable is a labelled box; every value has a type, and you can convert between types.</title>

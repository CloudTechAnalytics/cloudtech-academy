<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Lists. A list of five foods, with positions 0 to 4 from the left and minus 5 to minus 1 from the right. The slice foods[1:3] gives beans and yam. append adds an item at the end, insert adds at a chosen position, remove deletes by value, pop removes by position, and sort puts the list in order. A tuple is a list that can't be changed.">
<title>A list's positions, a slice, and the ways to change a list.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="82.0" y="30.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="middle">0</text>
<rect x="16.0" y="38.0" width="132.0" height="50.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="82.0" y="70.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">"rice"</text>
<text xml:space="preserve" x="82.0" y="108.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="middle">-5</text>
<text xml:space="preserve" x="226.0" y="30.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="middle">1</text>
<rect x="160.0" y="38.0" width="132.0" height="50.0" rx="6" fill="#B38A3E"/>
<text xml:space="preserve" x="226.0" y="70.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">"beans"</text>
<text xml:space="preserve" x="226.0" y="108.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="middle">-4</text>
<text xml:space="preserve" x="370.0" y="30.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="middle">2</text>
<rect x="304.0" y="38.0" width="132.0" height="50.0" rx="6" fill="#B38A3E"/>
<text xml:space="preserve" x="370.0" y="70.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">"yam"</text>
<text xml:space="preserve" x="370.0" y="108.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="middle">-3</text>
<text xml:space="preserve" x="514.0" y="30.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="middle">3</text>
<rect x="448.0" y="38.0" width="132.0" height="50.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="514.0" y="70.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">"garri"</text>
<text xml:space="preserve" x="514.0" y="108.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="middle">-2</text>
<text xml:space="preserve" x="658.0" y="30.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="middle">4</text>
<rect x="592.0" y="38.0" width="132.0" height="50.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="658.0" y="70.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">"plantain"</text>
<text xml:space="preserve" x="658.0" y="108.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="middle">-1</text>
<text xml:space="preserve" x="16.0" y="134.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">foods[1:3]  →  ["beans", "yam"]  (positions 1 and 2; stops before 3)</text>
<rect x="16.0" y="166.0" width="232.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="192.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">foods.append("egg")</text>
<text xml:space="preserve" x="30.0" y="214.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">add at the end</text>
<rect x="264.0" y="166.0" width="232.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="278.0" y="192.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">foods.insert(1, "oil")</text>
<text xml:space="preserve" x="278.0" y="214.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">add at position 1</text>
<rect x="512.0" y="166.0" width="232.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="526.0" y="192.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">foods.remove("yam")</text>
<text xml:space="preserve" x="526.0" y="214.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">delete by value</text>
<rect x="16.0" y="240.0" width="232.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="266.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">foods.pop()</text>
<text xml:space="preserve" x="30.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">remove the last (or pop(2))</text>
<rect x="264.0" y="240.0" width="232.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="278.0" y="266.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">foods.sort()</text>
<text xml:space="preserve" x="278.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">put in order, in place</text>
<rect x="512.0" y="240.0" width="232.0" height="62.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="526.0" y="266.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">len(foods)</text>
<text xml:space="preserve" x="526.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">how many items</text>
<rect x="16.0" y="326.0" width="356.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#9B2C1F" stroke-width="1.3"/>
<text xml:space="preserve" x="30.0" y="350.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">Copying: b = a is the same list</text>
<text xml:space="preserve" x="30.0" y="372.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Change b and a changes too. Use b = a.copy().</text>
<rect x="388.0" y="326.0" width="356.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#5C4F80" stroke-width="1.3"/>
<text xml:space="preserve" x="402.0" y="350.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="start">Tuple: (4, 9, 2)</text>
<text xml:space="preserve" x="402.0" y="372.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Like a list that can't be changed.</text>
</g></svg>
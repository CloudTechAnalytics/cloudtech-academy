<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" role="img" aria-label="Google Workspace tools and what students use them for: Docs for writing and group reports with suggesting mode and version history; Sheets for trackers and budgets; Slides for presentations; Forms to collect survey answers, which flow into a Sheet; Calendar for timetable and deadlines; Drive holds everything.">

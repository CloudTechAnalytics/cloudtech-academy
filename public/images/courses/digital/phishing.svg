<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Spotting a phishing message. A fake text claims an account will close in 24 hours, offers a scholarship that needs a fee, and links to a lookalike address; the link's real destination, seen by hovering, is not the school's real site. Warning signs: urgency, too good to be true, odd links, and requests for codes or passwords.">
<title>A fake message, with its warning signs marked.</title>

<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="14.0" width="400.0" height="394.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.6"/>
<rect x="17.0" y="15.0" width="398.0" height="26.0" rx="0" fill="#EFE4CC"/>
<text xml:space="preserve" x="30.0" y="33.0" font-size="12" fill="#5E5A52" font-weight="700" text-anchor="start">SMS · 0809 555 0100</text>
<rect x="30.0" y="56.0" width="372.0" height="92.0" rx="10" fill="#EDEAF5"/>
<text xml:space="preserve" x="42.0" y="80.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">URGENT! Your student portal account</text>
<text xml:space="preserve" x="42.0" y="98.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">will be closed in 24 hours. Click to verify:</text>
<text xml:space="preserve" x="42.0" y="122.0" font-size="12.5" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">unilag-portal.xyz/verify</text>
<rect x="30.0" y="164.0" width="372.0" height="66.0" rx="10" fill="#EDEAF5"/>
<text xml:space="preserve" x="42.0" y="188.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">You won a ₦500,000 scholarship! Pay ₦5,000</text>
<text xml:space="preserve" x="42.0" y="208.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">processing fee to claim.</text>
<rect x="30.0" y="246.0" width="372.0" height="40.0" rx="10" fill="#EDEAF5"/>
<text xml:space="preserve" x="42.0" y="271.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Reply with the code we just sent you.</text>
<rect x="30.0" y="304.0" width="372.0" height="84.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="44.0" y="328.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start">Hover or long-press the link:</text>
<text xml:space="preserve" x="44.0" y="352.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">unilag-portal.xyz/verify</text>
<text xml:space="preserve" x="44.0" y="372.0" font-size="12" fill="#F4A59A" font-weight="700" text-anchor="start">→ not your school's real address</text>
<line x1="416.0" y1="76.0" x2="446.0" y2="76.0" stroke="#9B2C1F" stroke-width="1.5"/>
<circle cx="452.0" cy="76.0" r="5" fill="#9B2C1F"/>
<text xml:space="preserve" x="466.0" y="80.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">Urgency or threats</text>
<text xml:space="preserve" x="466.0" y="98.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">"Closed in 24 hours."</text>
<line x1="416.0" y1="128.0" x2="446.0" y2="128.0" stroke="#5C4F80" stroke-width="1.5"/>
<circle cx="452.0" cy="128.0" r="5" fill="#5C4F80"/>
<text xml:space="preserve" x="466.0" y="132.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="start">Odd link</text>
<text xml:space="preserve" x="466.0" y="150.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">A lookalike address, not the real one.</text>
<line x1="416.0" y1="196.0" x2="446.0" y2="196.0" stroke="#8A6A1F" stroke-width="1.5"/>
<circle cx="452.0" cy="196.0" r="5" fill="#8A6A1F"/>
<text xml:space="preserve" x="466.0" y="200.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="start">Too good to be true</text>
<text xml:space="preserve" x="466.0" y="218.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">A prize that asks you to pay.</text>
<line x1="416.0" y1="266.0" x2="446.0" y2="266.0" stroke="#9B2C1F" stroke-width="1.5"/>
<circle cx="452.0" cy="266.0" r="5" fill="#9B2C1F"/>
<text xml:space="preserve" x="466.0" y="270.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">Asks for a code</text>
<text xml:space="preserve" x="466.0" y="288.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">No real organisation does.</text>
<rect x="446.0" y="318.0" width="298.0" height="78.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="460.0" y="342.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">When in doubt, don't click.</text>
<text xml:space="preserve" x="460.0" y="362.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Go to the website yourself, or use contact</text>
<text xml:space="preserve" x="460.0" y="378.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">details you already trust.</text>
</g></svg>
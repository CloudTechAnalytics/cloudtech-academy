<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Splitting the work in an LLM feature: the model reads messy text, extracts fields and writes replies from retrieved sources; code validates every field, decides rules such as which documents are needed, and escalates by rule. The assistant must never approve, promise payment, reveal other customers' data or answer from memory. The invented example is a WhatsApp assistant for an electricity company handling meter faults.">
<title>The model reads; code decides.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="440" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Invented example: a WhatsApp assistant for meter faults at an electricity company</text>
<rect x="16.0" y="40.0" width="170.0" height="50.0" rx="10" fill="#FFFFFF" stroke="#5E5A52" stroke-width="1.6"/>
<text xml:space="preserve" x="28.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Customer message</text>
<path d="M188.0,65.0 L200.0,65.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="202.0" y="40.0" width="170.0" height="50.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="214.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Model: extract fields</text>
<path d="M374.0,65.0 L386.0,65.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="388.0" y="40.0" width="170.0" height="50.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="400.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Code: validate and</text>
<text xml:space="preserve" x="400.0" y="77.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">decide</text>
<path d="M560.0,65.0 L572.0,65.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="574.0" y="40.0" width="170.0" height="50.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.6"/>
<text xml:space="preserve" x="586.0" y="62.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Reply or hand to a</text>
<text xml:space="preserve" x="586.0" y="77.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">person</text>
<text xml:space="preserve" x="16.0" y="124.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Who does what</text>
<rect x="16.0" y="136.0" width="358.0" height="158.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="162.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start">The model</text>
<text xml:space="preserve" x="30.0" y="188.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• Reads messy text, including Pidgin</text>
<text xml:space="preserve" x="30.0" y="212.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• Extracts fields from the message</text>
<text xml:space="preserve" x="30.0" y="236.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• Writes a clear reply from retrieved text</text>
<text xml:space="preserve" x="30.0" y="260.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• Suggests whether a person is needed</text>
<rect x="386.0" y="136.0" width="358.0" height="158.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.6"/>
<text xml:space="preserve" x="400.0" y="162.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">The code</text>
<text xml:space="preserve" x="400.0" y="188.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• Validates every field; rejects or repairs</text>
<text xml:space="preserve" x="400.0" y="212.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• Looks up which documents are needed</text>
<text xml:space="preserve" x="400.0" y="236.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• Escalates by rule, not by opinion</text>
<text xml:space="preserve" x="400.0" y="260.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">• Fails safe when anything is invalid</text>
<rect x="16.0" y="314.0" width="728.0" height="112.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.6"/>
<text xml:space="preserve" x="30.0" y="340.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">It must never</text>
<text xml:space="preserve" x="30.0" y="366.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">✗  Approve, reject or promise a refund</text>
<text xml:space="preserve" x="390.0" y="366.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">✗  Quote an amount the company will pay</text>
<text xml:space="preserve" x="30.0" y="394.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">✗  Reveal anything about another customer</text>
<text xml:space="preserve" x="390.0" y="394.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">✗  Answer from memory when the policy is silent</text>
</g></svg>
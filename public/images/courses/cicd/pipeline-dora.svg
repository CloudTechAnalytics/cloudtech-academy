<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="A CI/CD pipeline: a commit is pushed, built into an image, tested, scanned for vulnerabilities, deployed to staging, then released to production. Continuous integration covers build and test on every change; continuous delivery means every passing change could be released. Below, the four DORA measures: deployment frequency, lead time for changes, change failure rate and time to restore.">
<title>A CI/CD pipeline, and the four DORA measures of how well it works.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="28.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Every change goes through the same steps</text>
<rect x="16.0" y="40.0" width="106.3" height="86.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="26.0" y="64.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Commit</text>
<text xml:space="preserve" x="26.0" y="86.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">pushed to git</text>
<path d="M124.3,83.0 L138.3,83.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="140.3" y="40.0" width="106.3" height="86.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="150.3" y="64.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Build</text>
<text xml:space="preserve" x="150.3" y="86.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">one image</text>
<path d="M248.7,83.0 L262.7,83.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="264.7" y="40.0" width="106.3" height="86.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="274.7" y="64.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Test</text>
<text xml:space="preserve" x="274.7" y="86.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">automated</text>
<path d="M373.0,83.0 L387.0,83.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="389.0" y="40.0" width="106.3" height="86.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="399.0" y="64.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Scan</text>
<text xml:space="preserve" x="399.0" y="86.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">vulnerabilities</text>
<path d="M497.3,83.0 L511.3,83.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="513.3" y="40.0" width="106.3" height="86.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="523.3" y="64.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Staging</text>
<text xml:space="preserve" x="523.3" y="86.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">deploy and</text>
<text xml:space="preserve" x="523.3" y="102.7" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">check</text>
<path d="M621.7,83.0 L635.7,83.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="637.7" y="40.0" width="106.3" height="86.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="647.7" y="64.0" font-size="13.5" fill="#2A2926" font-weight="700" text-anchor="start">Production</text>
<text xml:space="preserve" x="647.7" y="86.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">release</text>
<path d="M16,140 L360,140" fill="none" stroke="#2F5D8A" stroke-width="2"/>
<text xml:space="preserve" x="188.0" y="158.0" font-size="12.5" fill="#2F5D8A" font-weight="700" text-anchor="middle">CI: on every change</text>
<path d="M376,140 L744,140" fill="none" stroke="#2F6B3F" stroke-width="2"/>
<text xml:space="preserve" x="560.0" y="158.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">CD: any passing change can ship</text>
<rect x="16.0" y="184.0" width="360.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="210.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Deployment frequency</text>
<text xml:space="preserve" x="30.0" y="232.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">how often we release</text>
<text xml:space="preserve" x="362.0" y="210.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="end">more often</text>
<rect x="384.0" y="184.0" width="360.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="398.0" y="210.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Lead time for changes</text>
<text xml:space="preserve" x="398.0" y="232.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">commit to production</text>
<text xml:space="preserve" x="730.0" y="210.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="end">shorter</text>
<rect x="16.0" y="276.0" width="360.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="302.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Change failure rate</text>
<text xml:space="preserve" x="30.0" y="324.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">releases that cause a failure</text>
<text xml:space="preserve" x="362.0" y="302.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="end">lower</text>
<rect x="384.0" y="276.0" width="360.0" height="80.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="398.0" y="302.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Time to restore</text>
<text xml:space="preserve" x="398.0" y="324.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">after a failure</text>
<text xml:space="preserve" x="730.0" y="302.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="end">shorter</text>
<text xml:space="preserve" x="16.0" y="384.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Small, frequent releases are usually more stable, because each one is easier to test, understand and undo.</text>
</g></svg>
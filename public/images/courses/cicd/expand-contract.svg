<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Backwards-compatible database changes in three releases, so any release can be rolled back. Release 1 adds the new column; the app still uses the old one. Release 2 writes and reads the new column. Release 3, once release 2 is stable, removes the old column. At every point the previous app version still works with the database.">
<title>Change the database in steps, so the previous app version always still works.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="340" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="40.0" width="232.0" height="150.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="68.0" font-size="14.5" fill="#2F5D8A" font-weight="700" text-anchor="start">Release 1: expand</text>
<text xml:space="preserve" x="32.0" y="96.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">add the new column; the app</text>
<text xml:space="preserve" x="32.0" y="114.8" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">still uses the old one</text>
<text xml:space="preserve" x="32.0" y="172.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">roll back? safe</text>
<path d="M250.0,115.0 L262.0,115.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="264.0" y="40.0" width="232.0" height="150.0" rx="10" fill="#FBEBD6" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="280.0" y="68.0" font-size="14.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Release 2: migrate</text>
<text xml:space="preserve" x="280.0" y="96.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">the app writes and reads the</text>
<text xml:space="preserve" x="280.0" y="114.8" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">new column</text>
<text xml:space="preserve" x="280.0" y="172.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">roll back? safe</text>
<path d="M498.0,115.0 L510.0,115.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="512.0" y="40.0" width="232.0" height="150.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="528.0" y="68.0" font-size="14.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Release 3: contract</text>
<text xml:space="preserve" x="528.0" y="96.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">remove the old column, once</text>
<text xml:space="preserve" x="528.0" y="114.8" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">release 2 is stable</text>
<text xml:space="preserve" x="528.0" y="172.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">roll back? safe</text>
<rect x="16.0" y="214.0" width="728.0" height="90.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="32.0" y="242.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ All in one release</text>
<text xml:space="preserve" x="32.0" y="266.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Rename the column and change the app together, and rolling back the app breaks it: the old version looks</text>
<text xml:space="preserve" x="32.0" y="284.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">for a column that no longer exists.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="A GitHub Actions job graph. lint and test run in parallel because neither needs the other. build needs both to pass. deploy-staging needs build, and deploy-production needs deploy-staging plus an approval on the production environment. If any job fails, the jobs after it don't run.">
<title>Jobs run in parallel unless needs makes them wait.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="340" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="30.0" y="60.0" width="130.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="95.0" y="96.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">lint</text>
<rect x="30.0" y="180.0" width="130.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="95.0" y="216.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">test</text>
<rect x="230.0" y="120.0" width="130.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="295.0" y="156.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">build</text>
<rect x="430.0" y="120.0" width="140.0" height="60.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="500.0" y="156.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">deploy-staging</text>
<rect x="600.0" y="120.0" width="140.0" height="60.0" rx="8" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="670.0" y="156.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">deploy-production</text>
<path d="M160,90 C200,90 195,140 226,145" fill="none" stroke="#8A6A1F" stroke-width="1.8" marker-end="url(#a8A6A1F)"/>
<path d="M160,210 C200,210 195,160 226,155" fill="none" stroke="#8A6A1F" stroke-width="1.8" marker-end="url(#a8A6A1F)"/>
<path d="M360.0,150.0 L426.0,150.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<path d="M570.0,150.0 L596.0,150.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="596.0" y="196.0" width="148.0" height="40.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="670.0" y="221.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="middle">approval required</text>
<text xml:space="preserve" x="30.0" y="40.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">parallel: no needs</text>
<text xml:space="preserve" x="232.0" y="104.0" font-size="11.5" fill="#8A6A1F" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">needs: [lint, test]</text>
<text xml:space="preserve" x="436.0" y="104.0" font-size="11.5" fill="#8A6A1F" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">needs: build</text>
<text xml:space="preserve" x="16.0" y="286.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">If test fails, build and both deploys never start. Without needs, deploy would run even when the tests</text>
<text xml:space="preserve" x="16.0" y="304.9" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">fail.</text>
</g></svg>
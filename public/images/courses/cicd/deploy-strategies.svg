<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Four deployment strategies, each drawn as ten servers or traffic shares over time. All at once: every instance switches together, so a bad release hits everyone. Rolling: instances switch a few at a time. Blue-green: a full new set starts, traffic switches over, and the old set is kept for an instant switch back. Canary: a small share of traffic goes to the new version first; it's compared with the old version, then promoted or rolled back.">
<title>Deployment strategies: how much traffic a bad release can reach, and how fast you can undo it.</title>

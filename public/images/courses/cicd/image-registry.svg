<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="From Dockerfile to running containers. A Dockerfile is built into an image made of read-only layers: a base operating system, the language runtime, dependencies and the app code. The image is pushed to a registry with a name and tag, then pulled and run as one or more isolated containers on any machine.">
<title>Dockerfile, image layers, registry, containers.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker><marker id="a2F5D8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5D8A"/></marker></defs>
<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="30.0" width="230.0" height="176.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="28.0" y="54.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">FROM node:20.17-slim</text>
<text xml:space="preserve" x="28.0" y="76.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">WORKDIR /app</text>
<text xml:space="preserve" x="28.0" y="98.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">COPY package*.json ./</text>
<text xml:space="preserve" x="28.0" y="120.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">RUN npm ci --omit=dev</text>
<text xml:space="preserve" x="28.0" y="142.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">COPY . .</text>
<text xml:space="preserve" x="28.0" y="164.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">USER node</text>
<text xml:space="preserve" x="28.0" y="186.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">CMD ["node","server.js"]</text>
<text xml:space="preserve" x="16.0" y="22.0" font-size="13" fill="#5E5A52" font-weight="700" text-anchor="start">Dockerfile</text>

<text xml:space="preserve" x="265.0" y="110.0" font-size="11.5" fill="#8A6A1F" font-weight="700" text-anchor="middle">build</text>
<text xml:space="preserve" x="286.0" y="22.0" font-size="13" fill="#5E5A52" font-weight="700" text-anchor="start">Image (read-only layers)</text>
<rect x="286.0" y="34.0" width="190.0" height="38.0" rx="5" fill="#B38A3E"/>
<text xml:space="preserve" x="381.0" y="58.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">app code</text>
<rect x="286.0" y="76.0" width="190.0" height="38.0" rx="5" fill="#C9A867"/>
<text xml:space="preserve" x="381.0" y="100.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="middle">dependencies</text>

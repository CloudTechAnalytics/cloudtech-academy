<text xml:space="preserve" x="453.0" y="268.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="middle">#1</text>
<rect x="516.0" y="216.0" width="106.0" height="80.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="569.0" y="248.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">container</text>
<text xml:space="preserve" x="569.0" y="268.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="middle">#2</text>
<rect x="632.0" y="216.0" width="106.0" height="80.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="685.0" y="248.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">container</text>
<text xml:space="preserve" x="685.0" y="268.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="middle">#3</text>
<text xml:space="preserve" x="16.0" y="236.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">One image, many identical containers: the same on a</text>
<text xml:space="preserve" x="16.0" y="254.8" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">laptop, in testing and in production.</text>
<text xml:space="preserve" x="16.0" y="350.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">An image never changes once built. A new release is a new image with a new tag.</text>
</g></svg>
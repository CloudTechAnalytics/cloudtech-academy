<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="A semantic page outline and a properly labelled field. The page has a header, nav, main and footer. Inside main: one h1, a table with a caption and column headers, and a form. The amount input has a visible label linked by for and id, inputmode decimal for a number pad, and a hint linked with aria-describedby, and the form ends with a real button.">
<title>Semantic elements give the page structure that keyboards and screen readers can use.</title>
<defs><marker id="a2F5D8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5D8A"/></marker></defs>
<rect width="760" height="440" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="16.0" width="330.0" height="404.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<rect x="28.0" y="28.0" width="306.0" height="34.0" rx="5" fill="#E6EEF6"/>
<text xml:space="preserve" x="40.0" y="50.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;header&gt;</text>

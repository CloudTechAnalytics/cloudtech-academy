<rect x="28.0" y="110.0" width="306.0" height="262.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="40.0" y="130.0" font-size="12" fill="#2F6B3F" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;main&gt;</text>
<rect x="40.0" y="140.0" width="282.0" height="30.0" rx="4" fill="#FFFFFF"/>
<text xml:space="preserve" x="50.0" y="160.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;h1&gt; Pay invoice INV-100357</text>
<rect x="40.0" y="178.0" width="282.0" height="74.0" rx="4" fill="#FFFFFF"/>
<text xml:space="preserve" x="50.0" y="196.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;table&gt; + &lt;caption&gt;</text>
<text xml:space="preserve" x="50.0" y="216.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;th scope="col"&gt; headings</text>
<text xml:space="preserve" x="50.0" y="236.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;td&gt; cells</text>
<rect x="40.0" y="260.0" width="282.0" height="102.0" rx="4" fill="#FFFFFF"/>
<text xml:space="preserve" x="50.0" y="280.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;form&gt;</text>
<text xml:space="preserve" x="50.0" y="302.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;label&gt; + &lt;input&gt;</text>
<text xml:space="preserve" x="50.0" y="324.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">hint, linked</text>
<rect x="50.0" y="334.0" width="90.0" height="22.0" rx="4" fill="#B38A3E"/>
<text xml:space="preserve" x="95.0" y="349.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">&lt;button&gt;</text>
<rect x="28.0" y="380.0" width="306.0" height="30.0" rx="5" fill="#E6EEF6"/>
<text xml:space="preserve" x="40.0" y="400.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;footer&gt;</text>
<text xml:space="preserve" x="368.0" y="34.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A field done properly</text>
<rect x="368.0" y="46.0" width="376.0" height="102.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>

<text xml:space="preserve" x="380.0" y="110.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  aria-describedby="amount-hint"&gt;</text>
<text xml:space="preserve" x="380.0" y="130.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">&lt;p id="amount-hint"&gt;Up to the balance&lt;/p&gt;</text>
<rect x="368.0" y="156.0" width="376.0" height="120.0" rx="8" fill="#FFFFFF"/>
<text xml:space="preserve" x="384.0" y="180.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Amount (₦)</text>
<rect x="384.0" y="190.0" width="240.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="396.0" y="214.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">7,500</text>
<text xml:space="preserve" x="384.0" y="248.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Up to the balance</text>
<path d="M630,180 C690,180 690,206 628,208" fill="none" stroke="#2F5D8A" stroke-width="1.4" marker-end="url(#a2F5D8A)" stroke-dasharray="3 3"/>
<text xml:space="preserve" x="690.0" y="176.0" font-size="11" fill="#2F5D8A" font-weight="700" text-anchor="start">for / id</text>
<path d="M520,244 C560,244 560,226 540,226" fill="none" stroke="#2F5D8A" stroke-width="1.4" marker-end="url(#a2F5D8A)" stroke-dasharray="3 3"/>
<text xml:space="preserve" x="566.0" y="252.0" font-size="11" fill="#2F5D8A" font-weight="700" text-anchor="start">aria-describedby</text>
<text xml:space="preserve" x="368.0" y="304.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">✓ one h1, then h2, h3 in order</text>
<text xml:space="preserve" x="368.0" y="326.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">✓ &lt;button&gt;, not a clickable &lt;div&gt;</text>
<text xml:space="preserve" x="368.0" y="348.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">✓ a visible label, not just a placeholder</text>
<text xml:space="preserve" x="368.0" y="370.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Check: keyboard only, 200% zoom, Lighthouse</text>
</g></svg>
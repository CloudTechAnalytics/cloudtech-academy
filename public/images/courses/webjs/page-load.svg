<text xml:space="preserve" x="112.0" y="246.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="start">5  JavaScript updates the page; fetch() calls APIs, no reload</text>
<rect x="16.0" y="276.0" width="232.0" height="100.0" rx="10" fill="#E6EEF6" stroke="#2F5D8A" stroke-width="1.5"/>
<text xml:space="preserve" x="32.0" y="304.0" font-size="15" fill="#2F5D8A" font-weight="700" text-anchor="start">HTML</text>
<text xml:space="preserve" x="32.0" y="326.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">structure and meaning</text>
<text xml:space="preserve" x="32.0" y="348.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">a form with a field labelled</text>
<text xml:space="preserve" x="32.0" y="365.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Amount</text>
<rect x="264.0" y="276.0" width="232.0" height="100.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<text xml:space="preserve" x="280.0" y="304.0" font-size="15" fill="#5C4F80" font-weight="700" text-anchor="start">CSS</text>
<text xml:space="preserve" x="280.0" y="326.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">presentation and layout</text>
<text xml:space="preserve" x="280.0" y="348.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">on phones, stack the summary</text>
<rect x="512.0" y="276.0" width="232.0" height="100.0" rx="10" fill="#F3EBD8" stroke="#8A6A1F" stroke-width="1.5"/>
<text xml:space="preserve" x="528.0" y="304.0" font-size="15" fill="#8A6A1F" font-weight="700" text-anchor="start">JavaScript</text>
<text xml:space="preserve" x="528.0" y="326.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">behaviour</text>
<text xml:space="preserve" x="528.0" y="348.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">update the balance as you type</text>
<text xml:space="preserve" x="16.0" y="404.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Press F12 and choose Console to run JavaScript on any page.</text>

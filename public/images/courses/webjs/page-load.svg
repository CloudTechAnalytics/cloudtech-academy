<text xml:space="preserve" x="380.0" y="84.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">1  GET /pay/INV-100357</text>
<path d="M570.0,124.0 L190.0,124.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="380.0" y="118.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">2  HTML (links to CSS, JS)</text>
<path d="M190.0,158.0 L570.0,158.0" fill="none" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a2F5D8A)"/>
<text xml:space="preserve" x="380.0" y="152.0" font-size="12" fill="#2F5D8A" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">3  GET styles.css, app.js</text>
<path d="M570.0,192.0 L190.0,192.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="380.0" y="186.0" font-size="12" fill="#8A6A1F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">4  CSS and JavaScript</text>
<text xml:space="preserve" x="101.0" y="100.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">builds the DOM</text>
<text xml:space="preserve" x="101.0" y="118.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">applies CSS</text>
<text xml:space="preserve" x="101.0" y="136.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="middle">runs JS</text>

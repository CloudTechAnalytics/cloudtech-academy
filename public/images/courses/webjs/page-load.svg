<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="How a page loads. The browser requests a page; the server returns HTML, which links to CSS and JavaScript files that the browser also fetches. The browser builds the DOM, a tree of the page's elements, applies the CSS and runs the JavaScript, which can change the DOM, react to typing and clicks, and call APIs without reloading. HTML gives structure, CSS presentation, JavaScript behaviour.">
<title>A page load: request, HTML, CSS and JavaScript, then the DOM.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker><marker id="a2F5D8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5D8A"/></marker></defs>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Mobile-first layout. The default CSS is the phone layout: the invoice summary, the table and the payment form stacked in one column. A media query for screens at least 700 pixels wide switches to a two-column grid, with the table on the left and the summary and form on the right.">
<title>Write the phone layout first; a media query adds columns when there's room.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="30.0" width="170.0" height="330.0" rx="18" fill="#FFFFFF" stroke="#2A2926" stroke-width="2"/>
<text xml:space="preserve" x="101.0" y="22.0" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="middle">Phone (default)</text>
<rect x="30.0" y="50.0" width="142.0" height="60.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="101.0" y="85.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">summary</text>
<rect x="30.0" y="120.0" width="142.0" height="110.0" rx="6" fill="#E6EEF6"/>
<text xml:space="preserve" x="101.0" y="180.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">invoice table</text>
<rect x="30.0" y="240.0" width="142.0" height="110.0" rx="6" fill="#E5F0E8"/>
<text xml:space="preserve" x="101.0" y="300.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">payment form</text>
<rect x="200.0" y="30.0" width="262.0" height="231.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="212.0" y="54.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">.page { display: grid; gap: 16px; }</text>
<text xml:space="preserve" x="212.0" y="73.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace"></text>
<text xml:space="preserve" x="212.0" y="92.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">@media (min-width: 700px) {</text>
<text xml:space="preserve" x="212.0" y="111.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  .page {</text>
<text xml:space="preserve" x="212.0" y="130.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">    grid-template-columns: 2fr 1fr;</text>
<text xml:space="preserve" x="212.0" y="149.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">    grid-template-areas:</text>
<text xml:space="preserve" x="212.0" y="168.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">      "table summary"</text>
<text xml:space="preserve" x="212.0" y="187.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">      "table form";</text>
<text xml:space="preserve" x="212.0" y="206.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  }</text>
<text xml:space="preserve" x="212.0" y="225.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">}</text>
<text xml:space="preserve" x="212.0" y="244.0" font-size="10.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">.table { grid-area: table; }  /* … */</text>
<path d="M464.0,190.0 L476.0,190.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="478.0" y="30.0" width="266.0" height="230.0" rx="10" fill="#FFFFFF" stroke="#2A2926" stroke-width="2"/>
<text xml:space="preserve" x="611.0" y="22.0" font-size="12.5" fill="#5E5A52" font-weight="700" text-anchor="middle">Wide screen (700px and up)</text>
<rect x="492.0" y="46.0" width="150.0" height="200.0" rx="6" fill="#E6EEF6"/>
<text xml:space="preserve" x="567.0" y="150.0" font-size="12" fill="#2A2926" font-weight="700" text-anchor="middle">invoice table</text>
<rect x="652.0" y="46.0" width="80.0" height="70.0" rx="6" fill="#F3EBD8"/>
<text xml:space="preserve" x="692.0" y="86.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="middle">summary</text>
<rect x="652.0" y="124.0" width="80.0" height="122.0" rx="6" fill="#E5F0E8"/>
<text xml:space="preserve" x="692.0" y="190.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="middle">form</text>
<rect x="478.0" y="280.0" width="266.0" height="80.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.4"/>
<text xml:space="preserve" x="492.0" y="304.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">tap targets ≥ 44px tall</text>
<text xml:space="preserve" x="492.0" y="324.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">body text ≥ 16px</text>
<text xml:space="preserve" x="492.0" y="344.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">contrast for daylight</text>
<text xml:space="preserve" x="16.0" y="388.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Grid places items in rows and columns; flexbox lines them up in one row or column.</text>
</g></svg>
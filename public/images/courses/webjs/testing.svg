<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="What to test, and with what. Most of the page's logic lives in plain functions such as invoiceTotal, balanceAfter and validatePayment; these get many fast unit tests with Vitest or Jest, no page needed. Event handlers only read and write the page, so a few browser tests with Playwright check whole pages: layout, keyboard use and accessible errors.">
<title>Many fast tests of plain functions; a few tests of whole pages in a browser.</title>

<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<polygon points="200,40 290,40 340,140 150,140" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.5"/>
<polygon points="150,148 340,148 400,290 90,290" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="245.0" y="92.0" font-size="12.5" fill="#5C4F80" font-weight="700" text-anchor="middle">few</text>
<text xml:space="preserve" x="245.0" y="112.0" font-size="13" fill="#5C4F80" font-weight="700" text-anchor="middle">page tests</text>
<text xml:space="preserve" x="245.0" y="214.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="middle">many</text>
<text xml:space="preserve" x="245.0" y="236.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="middle">function tests</text>
<rect x="430.0" y="40.0" width="314.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#5C4F80" stroke-width="1.4"/>
<text xml:space="preserve" x="446.0" y="66.0" font-size="13.5" fill="#5C4F80" font-weight="700" text-anchor="start">Playwright or Cypress</text>
<text xml:space="preserve" x="446.0" y="90.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">a real browser: layout, keyboard use, errors</text>
<text xml:space="preserve" x="446.0" y="107.4" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">announced. Slower; keep them few.</text>
<rect x="430.0" y="160.0" width="314.0" height="140.0" rx="10" fill="#FFFFFF" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="446.0" y="186.0" font-size="13.5" fill="#2F6B3F" font-weight="700" text-anchor="start">Vitest or Jest</text>
<rect x="446.0" y="198.0" width="282.0" height="60.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="458.0" y="222.0" font-size="11" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">expect(balanceAfter(1000000, "2500")</text>
<text xml:space="preserve" x="458.0" y="241.0" font-size="11" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  .remainingKobo).toBe(750000)</text>
<text xml:space="preserve" x="446.0" y="284.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">*.test.js files, run on every change.</text>
<text xml:space="preserve" x="16.0" y="334.0" font-size="12.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Keeping logic out of event handlers (lesson 6) is what makes it testable without a page.</text>
<text xml:space="preserve" x="16.0" y="358.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">A test is still just a named check: call, compare, report.</text>
</g></svg>
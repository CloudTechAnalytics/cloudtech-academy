<rect x="16.0" y="142.0" width="160.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="26.0" y="160.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">INV-3</text>
<text xml:space="preserve" x="26.0" y="176.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">80,000 / paid 0</text>
<path d="M178.0,163.0 L202.0,163.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="206.0" y="142.0" width="160.0" height="42.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.3"/>
<text xml:space="preserve" x="216.0" y="168.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">INV-3: owes</text>
<path d="M368.0,163.0 L392.0,163.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="396.0" y="142.0" width="160.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.3"/>
<text xml:space="preserve" x="476.0" y="169.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">80,000</text>
<rect x="16.0" y="192.0" width="160.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="26.0" y="210.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">INV-4</text>
<text xml:space="preserve" x="26.0" y="226.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start">30,000 / paid 30,000</text>
<text xml:space="preserve" x="190.0" y="218.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">✗ dropped: fully paid</text>
<path d="M558,113 C575,113 575,134 590,134" fill="none" stroke="#8A6A1F" stroke-width="1.8" marker-end="url(#a8A6A1F)"/>
<path d="M558,163 C575,163 575,144 590,144" fill="none" stroke="#8A6A1F" stroke-width="1.8" marker-end="url(#a8A6A1F)"/>
<rect x="592.0" y="104.0" width="152.0" height="70.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="668.0" y="130.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">180,000 kobo</text>
<text xml:space="preserve" x="668.0" y="156.0" font-size="16" fill="#8A6A1F" font-weight="700" text-anchor="middle">₦1,800.00</text>
<text xml:space="preserve" x="16.0" y="378.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">filter keeps items, map transforms each, reduce combines them into one value.</text>
<text xml:space="preserve" x="16.0" y="402.0" font-size="11.5" fill="#8A6A1F" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">new Intl.NumberFormat("en-NG", { style: "currency", currency: "NGN" }).format(kobo / 100)</text>
<text xml:space="preserve" x="16.0" y="428.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Example invoices, for illustration.</text>
</g></svg>
<text xml:space="preserve" x="302.0" y="151.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">60%</text>
<rect x="356.0" y="126.0" width="92.0" height="38.0" rx="5" fill="#F2EFE8"/>
<text xml:space="preserve" x="402.0" y="151.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">–</text>
<rect x="456.0" y="126.0" width="92.0" height="38.0" rx="5" fill="#F2EFE8"/>
<text xml:space="preserve" x="502.0" y="151.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">–</text>
<text xml:space="preserve" x="16.0" y="198.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">2025-Q4</text>
<text xml:space="preserve" x="100.0" y="198.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">n=110</text>
<rect x="156" y="170" width="92" height="38" rx="5" fill="#2F6B3F" fill-opacity="0.90"/>
<text xml:space="preserve" x="202.0" y="195.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">100%</text>
<rect x="256.0" y="170.0" width="92.0" height="38.0" rx="5" fill="#F2EFE8"/>
<text xml:space="preserve" x="302.0" y="195.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">–</text>
<rect x="356.0" y="170.0" width="92.0" height="38.0" rx="5" fill="#F2EFE8"/>
<text xml:space="preserve" x="402.0" y="195.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">–</text>
<rect x="456.0" y="170.0" width="92.0" height="38.0" rx="5" fill="#F2EFE8"/>
<text xml:space="preserve" x="502.0" y="195.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="middle">–</text>
<text xml:space="preserve" x="570.0" y="70.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Read across: how a cohort</text>
<text xml:space="preserve" x="570.0" y="90.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">decays or holds.</text>
<text xml:space="preserve" x="570.0" y="130.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Read down a column: is each</text>
<text xml:space="preserve" x="570.0" y="150.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">new cohort retaining better?</text>
<text xml:space="preserve" x="16.0" y="240.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Building it</text>
<rect x="16.0" y="254.0" width="172.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="278.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start">1  Cohort</text>
<text xml:space="preserve" x="28.0" y="298.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">MIN(booking quarter) per</text>
<text xml:space="preserve" x="28.0" y="314.7" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">customer</text>
<rect x="200.0" y="254.0" width="172.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="212.0" y="278.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start">2  Activity</text>
<text xml:space="preserve" x="212.0" y="298.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">one row per customer per</text>
<text xml:space="preserve" x="212.0" y="314.7" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">quarter (DISTINCT)</text>
<rect x="384.0" y="254.0" width="172.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="396.0" y="278.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start">3  Index</text>
<text xml:space="preserve" x="396.0" y="298.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">quarters since the</text>
<text xml:space="preserve" x="396.0" y="314.7" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">cohort quarter</text>
<rect x="568.0" y="254.0" width="172.0" height="76.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="580.0" y="278.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="start">4  Divide</text>
<text xml:space="preserve" x="580.0" y="298.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">active ÷ cohort size</text>
<rect x="16.0" y="350.0" width="728.0" height="60.0" rx="8" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="374.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">Two traps to say out loud</text>
<text xml:space="preserve" x="30.0" y="396.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Count a customer once per quarter. Blank cells aren't zero: those quarters haven't happened yet.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-label="Window frames. A running total uses the frame from the first row to the current row; a moving average uses a fixed number of rows around the current one. For monthly values 10, 20, 30, 40, a running total is 10, 30, 60, 100; a three-month moving average of the last three rows is 10, 15, 20, 30. A default-frame trap: with ORDER BY and no frame, rows that tie are treated together, so a running total jumps by all tied rows at once; spelling out ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW avoids it.">
<title>A frame is the set of rows a window function sees for each row.</title>

<rect width="760" height="440" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="40.0" width="82.0" height="34.0" rx="5" fill="#F3EBD8"/>
<text xml:space="preserve" x="57.0" y="63.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">10</text>
<text xml:space="preserve" x="57.0" y="32.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">m1</text>
<rect x="106.0" y="40.0" width="82.0" height="34.0" rx="5" fill="#F3EBD8"/>
<text xml:space="preserve" x="147.0" y="63.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">20</text>
<text xml:space="preserve" x="147.0" y="32.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">m2</text>
<rect x="196.0" y="40.0" width="82.0" height="34.0" rx="5" fill="#F3EBD8"/>
<text xml:space="preserve" x="237.0" y="63.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">30</text>
<text xml:space="preserve" x="237.0" y="32.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">m3</text>
<rect x="286.0" y="40.0" width="82.0" height="34.0" rx="5" fill="#F3EBD8"/>
<text xml:space="preserve" x="327.0" y="63.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">40</text>
<text xml:space="preserve" x="327.0" y="32.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="middle">m4</text>
<text xml:space="preserve" x="16.0" y="106.0" font-size="12.5" fill="#2F5D8A" font-weight="700" text-anchor="start">running total</text>
<text xml:space="preserve" x="16.0" y="124.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</text>
<rect x="16.0" y="134.0" width="82.0" height="34.0" rx="5" fill="#E6EEF6"/>
<text xml:space="preserve" x="57.0" y="157.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">10</text>
<rect x="106.0" y="134.0" width="82.0" height="34.0" rx="5" fill="#E6EEF6"/>
<text xml:space="preserve" x="147.0" y="157.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">30</text>
<rect x="196.0" y="134.0" width="82.0" height="34.0" rx="5" fill="#E6EEF6"/>
<text xml:space="preserve" x="237.0" y="157.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">60</text>
<rect x="286.0" y="134.0" width="82.0" height="34.0" rx="5" fill="#E6EEF6"/>
<text xml:space="preserve" x="327.0" y="157.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">100</text>
<text xml:space="preserve" x="16.0" y="200.0" font-size="12.5" fill="#2F6B3F" font-weight="700" text-anchor="start">3-row moving average</text>
<text xml:space="preserve" x="16.0" y="218.0" font-size="10.5" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">ROWS BETWEEN 2 PRECEDING AND CURRENT ROW</text>
<rect x="16.0" y="228.0" width="82.0" height="34.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="57.0" y="251.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">10</text>
<rect x="106.0" y="228.0" width="82.0" height="34.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="147.0" y="251.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">15</text>
<rect x="196.0" y="228.0" width="82.0" height="34.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="237.0" y="251.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">20</text>
<rect x="286.0" y="228.0" width="82.0" height="34.0" rx="5" fill="#E5F0E8"/>
<text xml:space="preserve" x="327.0" y="251.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">30</text>
<rect x="188.0" y="36.0" width="186.0" height="42.0" rx="0" fill="none"/>
<rect x="103" y="36" width="268" height="42" fill="none" stroke="#2F6B3F" stroke-width="2" rx="6" stroke-dasharray="5 3"/>
<text xml:space="preserve" x="392.0" y="112.0" font-size="11" fill="#2F6B3F" font-weight="700" text-anchor="start">the frame for m4's moving average</text>
<rect x="392.0" y="130.0" width="352.0" height="138.0" rx="8" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="406.0" y="156.0" font-size="13.5" fill="#9B2C1F" font-weight="700" text-anchor="start">Default-frame trap</text>
<text xml:space="preserve" x="406.0" y="178.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">With ORDER BY and no frame, rows that tie are peers:</text>
<text xml:space="preserve" x="406.0" y="194.7" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">they all enter the frame together, so a running total</text>
<text xml:space="preserve" x="406.0" y="211.3" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start">jumps by the whole tie at once.</text>
<text xml:space="preserve" x="406.0" y="246.0" font-size="11.5" fill="#8A6A1F" font-weight="700" text-anchor="start">Fix: spell out ROWS BETWEEN …</text>
<text xml:space="preserve" x="16.0" y="308.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">LAG and LEAD</text>
<rect x="16.0" y="322.0" width="232.0" height="72.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="30.0" y="346.0" font-size="12.5" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">LAG(x)</text>
<text xml:space="preserve" x="30.0" y="366.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">the previous row's value</text>
<text xml:space="preserve" x="30.0" y="384.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">growth = x − LAG(x)</text>
<rect x="264.0" y="322.0" width="232.0" height="72.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="278.0" y="346.0" font-size="12.5" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">LEAD(x)</text>
<text xml:space="preserve" x="278.0" y="366.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">the next row's value</text>
<text xml:space="preserve" x="278.0" y="384.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">look ahead</text>
<rect x="512.0" y="322.0" width="232.0" height="72.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="526.0" y="346.0" font-size="12.5" fill="#2F5D8A" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">x / SUM(x) OVER ()</text>
<text xml:space="preserve" x="526.0" y="366.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">share of the total</text>
<text xml:space="preserve" x="526.0" y="384.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">no frame needed</text>
<text xml:space="preserve" x="16.0" y="424.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">The first LAG is NULL: there's no previous row.</text>
</g></svg>
<text xml:space="preserve" x="270.0" y="150.0" font-size="11.5" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">SUM(CASE WHEN mode = 'Sea' THEN 1 ELSE 0 END) AS sea,</text>
<text xml:space="preserve" x="16.0" y="192.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Like for like</text>
<rect x="16.0" y="206.0" width="356.0" height="100.0" rx="8" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="230.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ Full 2025 vs part of 2026</text>
<rect x="30.0" y="244.0" width="250.0" height="14.0" rx="3" fill="#9B2C1F"/>
<text xml:space="preserve" x="290.0" y="256.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">12 months</text>
<rect x="30.0" y="266.0" width="130.0" height="14.0" rx="3" fill="#C99087"/>
<text xml:space="preserve" x="170.0" y="278.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">5 months</text>
<text xml:space="preserve" x="30.0" y="296.0" font-size="11.5" fill="#9B2C1F" font-weight="700" text-anchor="start">2026 looks like a collapse</text>
<rect x="388.0" y="206.0" width="356.0" height="100.0" rx="8" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="402.0" y="230.0" font-size="13" fill="#2F6B3F" font-weight="700" text-anchor="start">✓ Jan–May vs Jan–May</text>
<rect x="402.0" y="244.0" width="130.0" height="14.0" rx="3" fill="#2F6B3F"/>
<text xml:space="preserve" x="542.0" y="256.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">2025 YTD</text>
<rect x="402.0" y="266.0" width="150.0" height="14.0" rx="3" fill="#6FA37E"/>
<text xml:space="preserve" x="562.0" y="278.0" font-size="11" fill="#5E5A52" font-weight="400" text-anchor="start">2026 YTD</text>
<text xml:space="preserve" x="402.0" y="296.0" font-size="11.5" fill="#2F6B3F" font-weight="700" text-anchor="start">the comparison is fair</text>
<text xml:space="preserve" x="16.0" y="336.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Growth = (this − before) ÷ before</text>
<text xml:space="preserve" x="16.0" y="358.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Guard against ÷ 0: NULLIF(before, 0). Say which periods you compared.</text>
<text xml:space="preserve" x="16.0" y="396.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Zero is a result; NULL is "no data": decide which one you mean.</text>
</g></svg>
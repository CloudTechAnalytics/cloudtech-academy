<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Pivoting with conditional aggregation, and like-for-like comparisons. A long table has one row per shipment with a mode. SUM of CASE WHEN mode equals Sea THEN 1 ELSE 0 turns each mode into its own column, giving one row per year with columns sea, air and road. For a fair period comparison, compare the same part of each year, January to August of 2025 against January to August of 2026, not a full year against a part year. Growth is the change divided by the earlier value, guarded against dividing by zero.">
<title>CASE inside SUM turns rows into columns; compare like with like.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>

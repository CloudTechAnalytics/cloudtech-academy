<text xml:space="preserve" x="336.0" y="108.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">0</text>
<text xml:space="preserve" x="406.0" y="108.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">0</text>

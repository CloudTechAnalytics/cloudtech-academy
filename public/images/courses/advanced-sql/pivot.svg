<text xml:space="preserve" x="94.0" y="134.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Sea</text>
<rect x="16.0" y="142.0" width="160.0" height="26.0" rx="0" fill="#FBF8F2"/>
<text xml:space="preserve" x="24.0" y="160.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">2026</text>
<text xml:space="preserve" x="94.0" y="160.0" font-size="11.5" fill="#2A2926" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">Road</text>

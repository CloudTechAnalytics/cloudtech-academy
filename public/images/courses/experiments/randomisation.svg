<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Self-selection versus randomisation. When users choose a feature, the choosers are more engaged, so they differ before the feature does anything: any difference in outcome mixes the feature's effect with who chose it. When a coin decides, the two groups are alike in engagement and everything else, so a difference in outcome is caused by the feature.">

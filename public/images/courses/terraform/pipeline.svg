<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="A Terraform pipeline for pull requests. On every pull request: format and validate the code, produce a plan, run policy checks on the plan JSON, and post the plan for review. Only after approval and merge does the pipeline apply the same plan. Blocking policy violations stop the merge unless someone records an override.">
<title>Plan and check on every pull request; apply only after review and merge.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker></defs>
<rect width="760" height="380" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="30.0" font-size="14" fill="#2F5D8A" font-weight="700" text-anchor="start">On every pull request</text>
<rect x="16.0" y="44.0" width="165.5" height="96.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="70.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">fmt, validate</text>
<text xml:space="preserve" x="28.0" y="94.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">tidy and check</text>
<path d="M184.5,92.0 L200.5,92.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="203.5" y="44.0" width="165.5" height="96.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="215.5" y="70.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">plan</text>
<text xml:space="preserve" x="215.5" y="94.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">saved as plan.out</text>
<path d="M372.0,92.0 L388.0,92.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="391.0" y="44.0" width="165.5" height="96.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.5"/>
<text xml:space="preserve" x="403.0" y="70.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">policy checks</text>
<text xml:space="preserve" x="403.0" y="94.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">on the plan JSON</text>
<path d="M559.5,92.0 L575.5,92.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="578.5" y="44.0" width="165.5" height="96.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="590.5" y="70.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">post for review</text>
<text xml:space="preserve" x="590.5" y="94.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">plan and violations on</text>
<text xml:space="preserve" x="590.5" y="111.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">the PR</text>
<text xml:space="preserve" x="16.0" y="196.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="start">After approval and merge</text>
<rect x="16.0" y="210.0" width="199.0" height="90.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.5"/>
<text xml:space="preserve" x="28.0" y="236.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">apply</text>
<text xml:space="preserve" x="28.0" y="260.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">the reviewed plan, from the</text>
<text xml:space="preserve" x="28.0" y="277.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">pipeline</text>
<path d="M218.0,255.0 L234.0,255.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="237.0" y="210.0" width="199.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="249.0" y="236.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">record</text>
<text xml:space="preserve" x="249.0" y="260.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">state updated; who and why</text>
<text xml:space="preserve" x="249.0" y="277.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">in git</text>
<rect x="460.0" y="210.0" width="284.0" height="90.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="474.0" y="236.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">A blocking violation (destroying a</text>
<text xml:space="preserve" x="474.0" y="254.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">database, SSH from 0.0.0.0/0) stops the</text>
<text xml:space="preserve" x="474.0" y="272.2" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">merge unless an override is recorded.</text>
<text xml:space="preserve" x="16.0" y="344.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">Pin provider and module versions, so the same code gives the same plan next month.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Renaming a resource. Without a moved block, Terraform sees aws_db_instance.prod gone and aws_db_instance.main new, so it plans to destroy the production database and create an empty one. With a moved block from prod to main, Terraform updates the state and the plan has no changes.">
<title>A rename without a moved block destroys and recreates; with one, nothing changes.</title>

<rect width="760" height="340" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="16.0" width="358.0" height="300.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="32.0" y="44.0" font-size="15" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ Rename only</text>
<rect x="32.0" y="60.0" width="326.0" height="82.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="44.0" y="84.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">resource "aws_db_instance" "main" {</text>
<text xml:space="preserve" x="44.0" y="104.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  # was "prod"</text>
<text xml:space="preserve" x="44.0" y="124.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">}</text>
<text xml:space="preserve" x="32.0" y="172.0" font-size="12.5" fill="#9B2C1F" font-weight="400" text-anchor="start">Terraform's plan:</text>
<text xml:space="preserve" x="32.0" y="194.0" font-size="12.5" fill="#9B2C1F" font-weight="400" text-anchor="start">- destroy aws_db_instance.prod</text>
<text xml:space="preserve" x="32.0" y="216.0" font-size="12.5" fill="#9B2C1F" font-weight="400" text-anchor="start">+ create  aws_db_instance.main</text>
<text xml:space="preserve" x="32.0" y="260.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">The production database deleted, and a new empty</text>
<text xml:space="preserve" x="32.0" y="278.1" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">one created.</text>
<rect x="386.0" y="16.0" width="358.0" height="300.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="402.0" y="44.0" font-size="15" fill="#2F6B3F" font-weight="700" text-anchor="start">✓ Rename with a moved block</text>
<rect x="402.0" y="60.0" width="326.0" height="102.0" rx="8" fill="#2A2926" stroke="#2A2926" stroke-width="1"/>
<text xml:space="preserve" x="414.0" y="84.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">moved {</text>
<text xml:space="preserve" x="414.0" y="104.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  from = aws_db_instance.prod</text>
<text xml:space="preserve" x="414.0" y="124.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">  to   = aws_db_instance.main</text>
<text xml:space="preserve" x="414.0" y="144.0" font-size="12" fill="#F3EBD8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', Consolas, monospace">}</text>
<text xml:space="preserve" x="402.0" y="192.0" font-size="12.5" fill="#2F6B3F" font-weight="400" text-anchor="start">Terraform's plan:</text>
<text xml:space="preserve" x="402.0" y="214.0" font-size="12.5" fill="#2F6B3F" font-weight="400" text-anchor="start">No changes. State updated.</text>
<text xml:space="preserve" x="402.0" y="260.0" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">Same database, new name in the code. Add</text>
<text xml:space="preserve" x="402.0" y="278.1" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">prevent_destroy too.</text>
</g></svg>
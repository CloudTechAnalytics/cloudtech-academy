<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="ClickOps versus infrastructure as code. With ClickOps, a person changes the cloud directly in the console: no record, no review, environments drift apart. With infrastructure as code, a change is written in a .tf file, reviewed in a pull request with its plan, applied by Terraform, and recorded in git and the state file.">
<title>ClickOps changes the cloud directly; infrastructure as code goes through files, review and a plan.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker><marker id="a9B2C1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9B2C1F"/></marker></defs>
<rect width="760" height="400" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="16.0" width="728.0" height="120.0" rx="10" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="32.0" y="44.0" font-size="15" fill="#9B2C1F" font-weight="700" text-anchor="start">✗ ClickOps</text>
<rect x="32.0" y="60.0" width="150.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="107.0" y="94.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">Engineer</text>
<path d="M184.0,88.0 L252.0,88.0" fill="none" stroke="#9B2C1F" stroke-width="2" marker-end="url(#a9B2C1F)"/>
<text xml:space="preserve" x="218.0" y="80.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="middle">clicks</text>
<rect x="256.0" y="60.0" width="150.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="331.0" y="94.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">Cloud</text>
<text xml:space="preserve" x="430.0" y="74.0" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">No record of who changed what or why. No</text>
<text xml:space="preserve" x="430.0" y="92.1" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">review. Staging and production drift apart.</text>
<text xml:space="preserve" x="430.0" y="110.2" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">Rebuilding depends on memory.</text>
<rect x="16.0" y="156.0" width="728.0" height="200.0" rx="10" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="32.0" y="184.0" font-size="15" fill="#2F6B3F" font-weight="700" text-anchor="start">✓ Infrastructure as code</text>
<rect x="32.0" y="200.0" width="157.5" height="100.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="44.0" y="226.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Edit .tf</text>
<text xml:space="preserve" x="44.0" y="250.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">the change, in text</text>
<path d="M192.5,250.0 L208.5,250.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="211.5" y="200.0" width="157.5" height="100.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="223.5" y="226.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Pull request</text>
<text xml:space="preserve" x="223.5" y="250.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">reviewed, with the</text>
<text xml:space="preserve" x="223.5" y="267.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">plan attached</text>
<path d="M372.0,250.0 L388.0,250.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="391.0" y="200.0" width="157.5" height="100.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="403.0" y="226.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">terraform apply</text>
<text xml:space="preserve" x="403.0" y="250.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">Terraform makes it so</text>
<path d="M551.5,250.0 L567.5,250.0" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<rect x="570.5" y="200.0" width="157.5" height="100.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<text xml:space="preserve" x="582.5" y="226.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Recorded</text>
<text xml:space="preserve" x="582.5" y="250.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">git history and the</text>
<text xml:space="preserve" x="582.5" y="267.4" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">state file</text>
<text xml:space="preserve" x="16.0" y="384.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">The same files rebuild any environment, and every change has an author, a reason and a review.</text>
</g></svg>
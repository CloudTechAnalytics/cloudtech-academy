<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="The agent loop. The model reads the conversation and the tool definitions and either asks for a tool call or gives a final answer. If it asks for a tool, your code checks and runs the tool, adds the result to the conversation, and sends it back to the model. The loop ends with a final answer, or when a guard stops it: a step limit, repeated failing calls or a timeout, in which case the request goes to a person. Every step is written to a trace.">
<title>The agent loop: the model asks, your code runs the tool, and guards stop runaway loops.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker><marker id="a2F5D8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5D8A"/></marker><marker id="a2F6B3F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6B3F"/></marker><marker id="a5E5A52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E5A52"/></marker></defs>
<rect width="760" height="430" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="16.0" y="60.0" width="220.0" height="120.0" rx="10" fill="#F3EBD8" stroke="#B38A3E" stroke-width="1.6"/>
<text xml:space="preserve" x="126.0" y="96.0" font-size="17" fill="#2A2926" font-weight="700" text-anchor="middle">Model</text>
<text xml:space="preserve" x="32.0" y="124.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">reads the conversation and</text>
<text xml:space="preserve" x="32.0" y="142.1" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">tool definitions; asks for a</text>
<text xml:space="preserve" x="32.0" y="160.2" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">tool or answers</text>
<rect x="396.0" y="60.0" width="220.0" height="120.0" rx="10" fill="#FFFFFF" stroke="#2F5D8A" stroke-width="1.6"/>
<text xml:space="preserve" x="506.0" y="96.0" font-size="17" fill="#2A2926" font-weight="700" text-anchor="middle">Your code</text>
<text xml:space="preserve" x="412.0" y="124.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">checks the call, runs the</text>
<text xml:space="preserve" x="412.0" y="142.1" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">tool, returns the result</text>
<path d="M236,96 C300,70 330,70 392,96" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="314.0" y="64.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="middle">tool call</text>
<path d="M396,150 C330,176 300,176 240,150" fill="none" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a2F5D8A)"/>
<text xml:space="preserve" x="318.0" y="192.0" font-size="13" fill="#2F5D8A" font-weight="700" text-anchor="middle">tool result</text>
<path d="M126,182 L126,240" fill="none" stroke="#2F6B3F" stroke-width="2" marker-end="url(#a2F6B3F)"/>
<rect x="36.0" y="244.0" width="180.0" height="50.0" rx="8" fill="#E5F0E8" stroke="#2F6B3F" stroke-width="1.4"/>
<text xml:space="preserve" x="126.0" y="274.0" font-size="14" fill="#2F6B3F" font-weight="700" text-anchor="middle">final answer</text>
<rect x="640.0" y="30.0" width="104.0" height="180.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="692.0" y="54.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="middle">Trace</text>
<text xml:space="preserve" x="656.0" y="80.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">· step</text>
<text xml:space="preserve" x="656.0" y="100.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">· tool</text>
<text xml:space="preserve" x="656.0" y="120.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">· args</text>
<text xml:space="preserve" x="656.0" y="140.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">· result</text>
<text xml:space="preserve" x="656.0" y="160.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">· tokens</text>
<text xml:space="preserve" x="656.0" y="180.0" font-size="12" fill="#5E5A52" font-weight="400" text-anchor="start">· seconds</text>
<path d="M618,120 L636,120" fill="none" stroke="#5E5A52" stroke-width="1.4" marker-end="url(#a5E5A52)" stroke-dasharray="3 3"/>
<rect x="250.0" y="230.0" width="494.0" height="170.0" rx="10" fill="#FFFFFF" stroke="#9B2C1F" stroke-width="1.4"/>
<text xml:space="preserve" x="266.0" y="256.0" font-size="14" fill="#9B2C1F" font-weight="700" text-anchor="start">Guards that stop the loop</text>
<text xml:space="preserve" x="266.0" y="286.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Maximum steps</text>
<text xml:space="preserve" x="450.0" y="286.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">a stuck agent stops</text>
<text xml:space="preserve" x="266.0" y="312.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Repeated-call detection</text>
<text xml:space="preserve" x="450.0" y="312.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">the same failing call twice</text>
<text xml:space="preserve" x="266.0" y="338.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Timeouts and retries</text>
<text xml:space="preserve" x="450.0" y="338.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">a broken tool can't block the run</text>
<text xml:space="preserve" x="266.0" y="364.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Fallback</text>
<text xml:space="preserve" x="450.0" y="364.0" font-size="13" fill="#5E5A52" font-weight="400" text-anchor="start">a person takes over and the customer is told</text>
<text xml:space="preserve" x="16.0" y="30.0" font-size="14" fill="#8A6A1F" font-weight="700" text-anchor="start">The model never runs anything itself: your code does.</text>
</g></svg>
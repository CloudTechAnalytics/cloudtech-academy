<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="The four most common variants of Harbourline's clearance process, shown as sequences of activity chips with their case counts: 148 cases with inspection, 118 with no inspection, 78 with a customs review, and 50 with a correction loop before declaring and an inspection.">

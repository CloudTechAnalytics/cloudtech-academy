<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="A fishbone diagram for the problem: documents incomplete on arrival. Six bones: People (customers don't know what's needed), Process (documents checked only on arrival; no checklist), Policy (some goods need NAFDAC or SONCAP permits; rules change), Materials (permits most often missing), Systems (documents sent by email, versions mixed up), Measurement (nobody tracks incompleteness by customer).">
<title>Fishbone diagram: candidate causes of incomplete documents, in six categories.</title>

<rect width="760" height="470" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<line x1="30.0" y1="220.0" x2="600.0" y2="220.0" stroke="#2A2926" stroke-width="2.4"/>
<polygon points="600,186 744,186 744,254 600,254" fill="#F6E3E0" stroke="#9B2C1F" stroke-width="1.6"/>
<text xml:space="preserve" x="672.0" y="212.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="middle">Documents</text>
<text xml:space="preserve" x="672.0" y="228.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="middle">incomplete</text>
<text xml:space="preserve" x="672.0" y="244.0" font-size="13" fill="#9B2C1F" font-weight="700" text-anchor="middle">on arrival</text>
<line x1="120.0" y1="54.0" x2="190.0" y2="220.0" stroke="#2A2926" stroke-width="1.6"/>
<rect x="80.0" y="26.0" width="63.7" height="24.0" rx="6" fill="#8A6A1F"/>
<text xml:space="preserve" x="90.0" y="42.7" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start">People</text>
<text xml:space="preserve" x="156.0" y="92.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Customers don't know</text>
<text xml:space="preserve" x="156.0" y="107.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">what's needed</text>
<line x1="300.0" y1="54.0" x2="370.0" y2="220.0" stroke="#2A2926" stroke-width="1.6"/>
<rect x="260.0" y="26.0" width="71.0" height="24.0" rx="6" fill="#8A6A1F"/>
<text xml:space="preserve" x="270.0" y="42.7" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start">Process</text>
<text xml:space="preserve" x="336.0" y="92.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Checked only on arrival;</text>
<text xml:space="preserve" x="336.0" y="107.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">no checklist</text>
<line x1="480.0" y1="54.0" x2="550.0" y2="220.0" stroke="#2A2926" stroke-width="1.6"/>
<rect x="440.0" y="26.0" width="63.7" height="24.0" rx="6" fill="#8A6A1F"/>
<text xml:space="preserve" x="450.0" y="42.7" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start">Policy</text>
<text xml:space="preserve" x="516.0" y="92.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">NAFDAC / SONCAP permits;</text>
<text xml:space="preserve" x="516.0" y="107.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">rules change</text>
<line x1="120.0" y1="386.0" x2="190.0" y2="220.0" stroke="#2A2926" stroke-width="1.6"/>
<rect x="80.0" y="406.0" width="85.5" height="24.0" rx="6" fill="#8A6A1F"/>
<text xml:space="preserve" x="90.0" y="422.7" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start">Materials</text>
<text xml:space="preserve" x="174.0" y="304.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Permits most often</text>
<text xml:space="preserve" x="174.0" y="319.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">missing</text>
<line x1="300.0" y1="386.0" x2="370.0" y2="220.0" stroke="#2A2926" stroke-width="1.6"/>
<rect x="260.0" y="406.0" width="71.0" height="24.0" rx="6" fill="#8A6A1F"/>
<text xml:space="preserve" x="270.0" y="422.7" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start">Systems</text>
<text xml:space="preserve" x="354.0" y="304.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Sent by email; versions</text>
<text xml:space="preserve" x="354.0" y="319.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">get mixed up</text>
<line x1="480.0" y1="386.0" x2="550.0" y2="220.0" stroke="#2A2926" stroke-width="1.6"/>
<rect x="440.0" y="406.0" width="100.1" height="24.0" rx="6" fill="#8A6A1F"/>
<text xml:space="preserve" x="450.0" y="422.7" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="start">Measurement</text>
<text xml:space="preserve" x="534.0" y="304.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">Nobody tracks it</text>
<text xml:space="preserve" x="534.0" y="319.0" font-size="12" fill="#2A2926" font-weight="400" text-anchor="start">by customer</text>
<text xml:space="preserve" x="16.0" y="458.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="start">The fishbone lists candidate causes. Five whys and the data then test which ones matter.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="A BPMN model of Harbourline's clearance process. The Harbourline pool has lanes for Documentation, Customs broker, Terminal and Haulage. It starts when the vessel arrives; documents are checked; a gateway asks whether they are complete. If not, Harbourline requests corrected documents from the customer by message flow, waits for them, re-checks and loops back. If complete, the broker submits the declaration to Customs, waits for the duty assessment and payment confirmation, then a gateway on the customs channel leads to no inspection, document review or physical inspection. The terminal releases the container and haulage delivers it, ending the process.">
<title>Harbourline's clearance process in BPMN, with the correction loop and the customs channel gateway.</title>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" role="img" aria-label="Checking fairness and explaining the model. Compare performance by group: calibration, ranking within the group, and the share the policy would call. Watch for groups unseen in training, such as a newly launched city. Permutation importance shuffles one feature at a time to see how much the score drops. A location feature can stand in for something sensitive, so ask what the decision does. Write a model card: purpose, data, performance, limits, review date.">
<title>Check each group, explain the model, write a model card.</title>

<rect width="760" height="436" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<text xml:space="preserve" x="16.0" y="26.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Check performance by group, not just overall</text>
<rect x="16.0" y="38.0" width="728.0" height="112.0" rx="8" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.5"/>
<path d="M17,66 L17,46 Q17,39 24,39 L736,39 Q743,39 743,46 L743,66 Z" fill="#EFE4CC"/>
<text xml:space="preserve" x="26.0" y="56.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="start">Group</text>
<text xml:space="preserve" x="346.0" y="56.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="end">Actual</text>
<text xml:space="preserve" x="476.0" y="56.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="end">Predicted</text>
<text xml:space="preserve" x="596.0" y="56.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="end">AUC</text>
<text xml:space="preserve" x="734.0" y="56.5" font-size="12.0" fill="#5E5A52" font-weight="700" text-anchor="end">Called</text>
<line x1="16.0" y1="66.0" x2="744.0" y2="66.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="84.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">North clinic</text>
<text xml:space="preserve" x="346.0" y="84.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">11%</text>
<text xml:space="preserve" x="476.0" y="84.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">12%</text>
<text xml:space="preserve" x="596.0" y="84.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">0.71</text>
<text xml:space="preserve" x="734.0" y="84.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">22%</text>
<line x1="16.0" y1="94.0" x2="744.0" y2="94.0" stroke="#EDE6D8" stroke-width="1"/>
<text xml:space="preserve" x="26.0" y="112.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="start">South clinic</text>
<text xml:space="preserve" x="346.0" y="112.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">15%</text>
<text xml:space="preserve" x="476.0" y="112.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">14%</text>
<text xml:space="preserve" x="596.0" y="112.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">0.69</text>
<text xml:space="preserve" x="734.0" y="112.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">31%</text>
<rect x="18.0" y="123.0" width="724.0" height="26.0" rx="3" fill="#F6E3E0"/>
<text xml:space="preserve" x="26.0" y="140.5" font-size="12.5" fill="#2A2926" font-weight="700" text-anchor="start">New clinic (unseen)</text>
<text xml:space="preserve" x="346.0" y="140.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">18%</text>
<text xml:space="preserve" x="476.0" y="140.5" font-size="12.5" fill="#9B2C1F" font-weight="400" text-anchor="end">9%</text>
<text xml:space="preserve" x="596.0" y="140.5" font-size="12.5" fill="#9B2C1F" font-weight="400" text-anchor="end">0.58</text>
<text xml:space="preserve" x="734.0" y="140.5" font-size="12.5" fill="#2A2926" font-weight="400" text-anchor="end">10%</text>
<text xml:space="preserve" x="16.0" y="174.0" font-size="12" fill="#9B2C1F" font-weight="700" text-anchor="start">A group the model has never seen is treated as if it had no group effect: often badly wrong.</text>
<text xml:space="preserve" x="16.0" y="208.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">Explain it</text>
<rect x="16.0" y="222.0" width="358.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="30.0" y="246.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Permutation importance</text>
<text xml:space="preserve" x="30.0" y="268.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Shuffle one feature at a time in validation</text>
<text xml:space="preserve" x="30.0" y="286.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">data. A big score drop = the model relies on it.</text>
<rect x="386.0" y="222.0" width="358.0" height="92.0" rx="10" fill="#FFFFFF" stroke="#CFC4B2" stroke-width="1.4"/>
<text xml:space="preserve" x="400.0" y="246.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">Location can be a proxy</text>
<text xml:space="preserve" x="400.0" y="268.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Fine for a phone call, maybe not for a deposit.</text>
<text xml:space="preserve" x="400.0" y="286.0" font-size="11.5" fill="#5E5A52" font-weight="400" text-anchor="start">Ask what the decision does to people.</text>
<text xml:space="preserve" x="16.0" y="344.0" font-size="14" fill="#2A2926" font-weight="700" text-anchor="start">A model card, one page</text>
<rect x="16.0" y="358.0" width="136.0" height="60.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.3"/>
<text xml:space="preserve" x="26.0" y="382.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">What it's for</text>
<rect x="164.0" y="358.0" width="136.0" height="60.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.3"/>
<text xml:space="preserve" x="174.0" y="382.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">Its data</text>
<rect x="312.0" y="358.0" width="136.0" height="60.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.3"/>
<text xml:space="preserve" x="322.0" y="382.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">Performance,</text>
<text xml:space="preserve" x="322.0" y="396.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">overall and by</text>
<text xml:space="preserve" x="322.0" y="410.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">group</text>
<rect x="460.0" y="358.0" width="136.0" height="60.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.3"/>
<text xml:space="preserve" x="470.0" y="382.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">Its limits</text>
<rect x="608.0" y="358.0" width="136.0" height="60.0" rx="10" fill="#EEEAF5" stroke="#5C4F80" stroke-width="1.3"/>
<text xml:space="preserve" x="618.0" y="382.0" font-size="11.5" fill="#2A2926" font-weight="700" text-anchor="start">When to review</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The depot's ordering timeline. The order is placed today and arrives in two weeks, so the forecast that matters covers weeks 3 and 4 from now: the period the order must last. Weeks 1 and 2 are already covered by stock and earlier orders.">
<title>The forecast that matters covers weeks 3 and 4: the period the order must last.</title>
<defs><marker id="a8A6A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A6A1F"/></marker><marker id="a2F5D8A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5D8A"/></marker></defs>
<rect width="760" height="300" fill="#FBF8F2"/>
<g font-family="Inter, 'Segoe UI', Arial, sans-serif">
<rect x="42.0" y="104.0" width="166.0" height="52.0" rx="6" fill="#EFE8DA"/>
<text xml:space="preserve" x="125.0" y="135.0" font-size="14" fill="#5E5A52" font-weight="700" text-anchor="middle">week 1</text>
<rect x="212.0" y="104.0" width="166.0" height="52.0" rx="6" fill="#EFE8DA"/>
<text xml:space="preserve" x="295.0" y="135.0" font-size="14" fill="#5E5A52" font-weight="700" text-anchor="middle">week 2</text>
<rect x="382.0" y="104.0" width="166.0" height="52.0" rx="6" fill="#B38A3E"/>
<text xml:space="preserve" x="465.0" y="135.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">week 3</text>
<rect x="552.0" y="104.0" width="166.0" height="52.0" rx="6" fill="#B38A3E"/>
<text xml:space="preserve" x="635.0" y="135.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle">week 4</text>
<line x1="40.0" y1="80.0" x2="40.0" y2="180.0" stroke="#2A2926" stroke-width="2.4"/>
<text xml:space="preserve" x="40.0" y="70.0" font-size="13" fill="#2A2926" font-weight="700" text-anchor="start">today: place the order</text>
<path d="M40,194 L380.0,194" fill="none" stroke="#2F5D8A" stroke-width="2" marker-end="url(#a2F5D8A)"/>
<text xml:space="preserve" x="210.0" y="214.0" font-size="12.5" fill="#2F5D8A" font-weight="700" text-anchor="middle">delivery takes two weeks</text>
<path d="M384.0,90 L720,90" fill="none" stroke="#8A6A1F" stroke-width="2" marker-end="url(#a8A6A1F)"/>
<text xml:space="preserve" x="550.0" y="80.0" font-size="13" fill="#8A6A1F" font-weight="700" text-anchor="middle">forecast this period</text>
<text xml:space="preserve" x="210.0" y="90.0" font-size="12.5" fill="#5E5A52" font-weight="400" text-anchor="middle">already covered by stock</text>
<text xml:space="preserve" x="16.0" y="268.0" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">Horizon: 15 to 28 days ahead. Granularity: units per product per week. And running out usually costs more</text>
<text xml:space="preserve" x="16.0" y="286.9" font-size="13" fill="#2A2926" font-weight="400" text-anchor="start">than overstock.</text>
</g></svg>
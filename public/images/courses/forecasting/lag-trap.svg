<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="The lag trap. The forecast is made today for days 15 to 28. A feature such as yesterday's sales is unknown for those days at the time of forecasting, so using it in testing produces a forecast that can't be made in real life. A lag of 28 days or more is known in advance and is allowed.">
